<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>சித்த மருத்துவ குறிப்புகள்</title>
<style>
  :root{
    --bg:#faf7f2; --card:#ffffff; --ink:#2b2b2b; --muted:#7a7268;
    --accent:#8a5a2b; --accent-soft:#f3e7d6; --hi:#ffe08a; --line:#e7ddcf;
    --topic:#5a7d3a; --topic-soft:#e8f0dc;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1b1815; --card:#26221e; --ink:#ece5da; --muted:#a89e90;
      --accent:#e0a86a; --accent-soft:#3a3128; --hi:#8a6d1f; --line:#3a332b;
      --topic:#a9c882; --topic-soft:#2e3826;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1b1815; --card:#26221e; --ink:#ece5da; --muted:#a89e90;
    --accent:#e0a86a; --accent-soft:#3a3128; --hi:#8a6d1f; --line:#3a332b;
    --topic:#a9c882; --topic-soft:#2e3826;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Noto Sans Tamil","Latha","Nirmala UI",system-ui,-apple-system,sans-serif;
    line-height:1.6; -webkit-text-size-adjust:100%;
  }
  header{
    position:sticky; top:0; z-index:5; background:var(--bg);
    padding:14px 16px 10px; border-bottom:1px solid var(--line);
  }
  h1{font-size:1.12rem; margin:0 0 8px; color:var(--accent); font-weight:700}
  .searchwrap{position:relative}
  #q{
    width:100%; padding:13px 42px 13px 14px; font-size:1.05rem;
    border:2px solid var(--line); border-radius:12px; background:var(--card);
    color:var(--ink); outline:none;
  }
  #q:focus{border-color:var(--accent)}
  #clear{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    border:none; background:transparent; color:var(--muted); font-size:1.4rem;
    cursor:pointer; padding:4px 8px; line-height:1; display:none;
  }
  .bar{display:flex; align-items:center; gap:10px; margin-top:9px}
  .count{font-size:.8rem; color:var(--muted); flex:1}
  .btn{
    border:1.5px solid var(--accent); color:var(--accent); background:transparent;
    padding:6px 14px; border-radius:20px; font-size:.85rem; font-weight:600;
    cursor:pointer; font-family:inherit;
  }
  .btn.active{background:var(--accent); color:#fff}
  main{padding:8px 12px 44px; max-width:860px; margin:0 auto}

  .tip{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; margin:10px 0;
  }
  .tip .meta{font-size:.72rem; color:var(--topic); background:var(--topic-soft);
    display:inline-block; padding:1px 9px; border-radius:20px; margin-bottom:6px;}
  .tip .num{
    display:inline-block; font-size:.72rem; font-weight:700; color:var(--accent);
    background:var(--accent-soft); padding:1px 8px; border-radius:20px;
    margin-bottom:6px; margin-left:6px;
  }
  .tip .body{font-size:1.02rem}
  mark{background:var(--hi); color:inherit; border-radius:3px; padding:0 1px}

  /* View All accordion */
  .topic{border:1px solid var(--line); border-radius:12px; margin:10px 0; overflow:hidden; background:var(--card)}
  .topic-head{
    display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer;
    background:var(--topic-soft);
  }
  .topic-head .tno{font-size:.72rem; font-weight:700; color:var(--topic);
    background:var(--card); padding:1px 8px; border-radius:20px; white-space:nowrap}
  .topic-head .tname{font-weight:600; flex:1; color:var(--ink)}
  .topic-head .arrow{color:var(--topic); transition:transform .2s; font-size:.9rem}
  .topic.open .arrow{transform:rotate(90deg)}
  .topic-body{display:none; padding:4px 14px 10px}
  .topic.open .topic-body{display:block}
  .topic-body .row{padding:8px 0; border-top:1px dashed var(--line); font-size:1rem}
  .topic-body .row:first-child{border-top:none}
  .topic-body .row .tipno{font-size:.7rem; color:var(--accent); font-weight:700; margin-right:6px}

  .empty{text-align:center; color:var(--muted); padding:40px 20px}
  .hint{font-size:.9rem; color:var(--muted); text-align:center; padding:26px 16px}
  .hint b{color:var(--ink)}
  .loading{text-align:center; color:var(--muted); padding:50px 20px}
  footer{text-align:center; font-size:.72rem; color:var(--muted); padding:18px}
</style>
</head>
<body>
<header>
  <h1>சித்த மருத்துவ குறிப்புகள்</h1>
  <div class="searchwrap">
    <input id="q" type="text" inputmode="text" autocomplete="off"
           placeholder="வார்த்தையை தட்டச்சு செய்யவும் (எ.கா. வயிறு, தலைவலி, சளி)">
    <button id="clear" aria-label="அழி">&times;</button>
  </div>
  <div class="bar">
    <span class="count" id="count"></span>
    <button class="btn" id="viewAll">அனைத்தும் காண்க</button>
  </div>
</header>
<main id="results"><div class="loading">ஏற்றுகிறது…</div></main>
<footer>உள்ளூர் தேடல் · இணைய இணைப்பு தேவையில்லை<br>
<span style="opacity:.8">இது பாரம்பரிய தகவல் மட்டுமே. தீவிர பிரச்சனைகளுக்கு மருத்துவரை அணுகவும்.</span></footer>

<script>
let TIPS=[];   // {n, t, topicNo, topicName}
let TOPICS=[]; // {no, name, tips:[...]}
let NORM=[];
let mode='search';

/* Tamil normalization: ignore spaces, treat confusable letters as same */
function normalize(s){
  if(!s) return "";
  try{ s=s.normalize("NFC"); }catch(e){}
  s=s.replace(/[\s‌‍]/g,"");
  s=s.replace(/[.,:;!?'"()\-–—\[\]{}\/\\|]/g,"");
  const groups=[["ர","ற"],["ல","ள","ழ"],["ந","ன","ண"],["ச","ஸ","ஜ","ஷ"]];
  for(const g of groups){const rep=g[0];for(let i=1;i<g.length;i++)s=s.split(g[i]).join(rep);}
  return s;
}
function escapeHtml(str){return str.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

function highlight(original, queryNorm){
  if(!queryNorm) return escapeHtml(original);
  const chars=Array.from(original);
  let norm="",pos=[];
  for(let i=0;i<chars.length;i++){const n=normalize(chars[i]);for(let j=0;j<n.length;j++){norm+=n[j];pos.push(i);}}
  const marks=new Array(chars.length).fill(false);
  let from=0,idx;
  while((idx=norm.indexOf(queryNorm,from))!==-1){
    const a=pos[idx],b=pos[idx+queryNorm.length-1];
    for(let c=a;c<=b;c++)marks[c]=true;
    from=idx+queryNorm.length;
  }
  let out="",open=false;
  for(let i=0;i<chars.length;i++){
    if(marks[i]&&!open){out+="<mark>";open=true;}
    if(!marks[i]&&open){out+="</mark>";open=false;}
    out+=escapeHtml(chars[i]);
  }
  if(open)out+="</mark>";
  return out;
}

const q=document.getElementById("q");
const clearBtn=document.getElementById("clear");
const results=document.getElementById("results");
const countEl=document.getElementById("count");
const viewAllBtn=document.getElementById("viewAll");

/* Load and parse sidha_tips.txt */
fetch('sidha_tips.txt')
  .then(r=>{ if(!r.ok) throw new Error('load'); return r.text(); })
  .then(txt=>{ parseData(txt); NORM=TIPS.map(t=>normalize(t.t)); search(); })
  .catch(e=>{ results.innerHTML='<div class="empty">தரவு ஏற்ற முடியவில்லை.<br>sidha_tips.txt கோப்பு app உடன் இருக்க வேண்டும்.</div>'; });

function parseData(txt){
  const lines=txt.split(/\r?\n/);
  let curTopicNo="", curTopicName="", curTopic=null;
  for(const raw of lines){
    const line=raw.trim();
    if(!line) continue;
    let m;
    if((m=line.match(/^top_(\S+)\s+([\s\S]*)$/))){
      curTopicNo=m[1]; curTopicName=m[2].trim();
      curTopic={no:curTopicNo,name:curTopicName,tips:[]};
      TOPICS.push(curTopic);
    } else if((m=line.match(/^tip_(\d+)\s+([\s\S]*)$/))){
      const tip={n:parseInt(m[1]),t:m[2].trim(),topicNo:curTopicNo,topicName:curTopicName};
      TIPS.push(tip);
      if(curTopic) curTopic.tips.push(tip);
    }
  }
}

/* SEARCH mode */
function renderSearch(list, qn){
  if(list.length===0){ results.innerHTML='<div class="empty">பொருத்தமான குறிப்பு இல்லை.<br>வேறு வார்த்தையை முயற்சிக்கவும்.</div>'; return; }
  const frag=[];
  for(const t of list){
    frag.push(
      '<div class="tip">'+
        '<span class="meta">தலைப்பு '+escapeHtml(t.topicNo)+' · '+escapeHtml(t.topicName)+'</span>'+
        '<span class="num">குறிப்பு '+t.n+'</span>'+
        '<div class="body">'+highlight(t.t,qn)+'</div>'+
      '</div>'
    );
  }
  results.innerHTML=frag.join("");
}

function search(){
  mode='search';
  viewAllBtn.classList.remove('active');
  const raw=q.value;
  clearBtn.style.display=raw?"block":"none";
  const qn=normalize(raw);
  if(!qn){
    countEl.textContent=TIPS.length+" குறிப்புகள்";
    results.innerHTML='<div class="hint">மேலே ஒரு வார்த்தையை தட்டச்சு செய்யவும்,<br>அல்லது <b>அனைத்தும் காண்க</b> ஐ அழுத்தவும்.<br><br>'+
      'பகுதி வார்த்தை · இடைவெளி · எழுத்து வேறுபாடு (ர/ற, ல/ள/ழ, ந/ன/ண, ச/ஸ/ஜ/ஷ) அனைத்தும் கண்டறியும்.</div>';
    return;
  }
  const matched=[];
  for(let i=0;i<TIPS.length;i++){ if(NORM[i].indexOf(qn)!==-1) matched.push(TIPS[i]); }
  countEl.textContent=matched.length+" குறிப்பு"+(matched.length===1?"":"கள்")+" கிடைத்தது";
  renderSearch(matched,qn);
}

/* VIEW ALL mode */
function renderViewAll(){
  mode='viewall';
  viewAllBtn.classList.add('active');
  countEl.textContent=TOPICS.length+" தலைப்புகள்";
  const frag=[];
  for(const tp of TOPICS){
    const rows=tp.tips.map(t=>
      '<div class="row"><span class="tipno">'+t.n+'.</span>'+escapeHtml(t.t)+'</div>'
    ).join("");
    frag.push(
      '<div class="topic">'+
        '<div class="topic-head" onclick="this.parentNode.classList.toggle(\'open\')">'+
          '<span class="tno">தலைப்பு '+escapeHtml(tp.no)+'</span>'+
          '<span class="tname">'+escapeHtml(tp.name)+'</span>'+
          '<span class="arrow">&#9656;</span>'+
        '</div>'+
        '<div class="topic-body">'+rows+'</div>'+
      '</div>'
    );
  }
  results.innerHTML=frag.join("");
}

let timer=null;
q.addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(search,90);});
clearBtn.addEventListener("click",()=>{q.value="";q.focus();search();});
viewAllBtn.addEventListener("click",()=>{ if(mode==='viewall'){ search(); } else { q.value=""; clearBtn.style.display="none"; renderViewAll(); } });
</script>
</body>
</html>
