const TIPS = [{"n":1,"t":"உடல் முகம் அழகு பெற"},{"n":1,"t":"மேனி நிறம் பொன்னிறமாக மஞ்சள் கரிசலாங்கண்ணி பொடி 5 கிராம் அளவு ஒரு வருடம் தொடர்ந்து சாப்பிட்டு வரலாம்"},{"n":2,"t":"தேகம் பொன்னிறமாக ஆவாரம் பூ தொடர்ந்து சாப்பிடலாம்"},{"n":3,"t":"முகம் பளபளக்க நாட்டு வாழைப்பழம் நன்றாக பழுத்தது ஆலிவ் ஆயில் சேர்த்து பிசைந்து முகத்தில் தடவி ஒரு மணி நேரம் கழித்து முகம் கழுவி வரலாம்"},{"n":4,"t":"முகச்சுருக்கம் மறைய முட்டைக்கோஸ் சாறை முகத்தில் தடவி வரலாம்"},{"n":5,"t":"உடல் மினுமினுப்பாக இரவில் படுக்க போகும் முன் தேன, குங்குமப்பூ, மஞ்சள் சேர்த்து அரைத்து சாப்பிட்டு வரலாம்"},{"n":6,"t":"உடல் நிறம் பளபளக்க அவரி இலையை சுத்தம் செய்து நன்கு உலர்த்தி தூளாக்கி தினமும் 5 கிராம் காலை உணவிற்குப்பின் சாப்பிட்டு வரலாம்"},{"n":7,"t":"உடல் வனப்பு உண்டாக முருங்கை பிசின் பொடி செய்து அரை ஸ்பூன் பாலில் சாப்பிட்டு வர வேண்டும்"},{"n":8,"t":"முக வசீகரம் சந்தன கட்டை எலுமிச்சை சாறில் உரைத்து பூசலாம்"},{"n":9,"t":"முகம் பிரகாசம் அடைய காணாவாழை, மாவிலை சம அளவு எடுத்து காய்ச்சி வடிகட்டி அதை முகத்தில் தடவி காயவைத்து அரை மணி நேரம் கழித்து கழுவவும்"},{"n":10,"t":"மேனி பளபளப்பு பெற ஆரஞ்சு பழத்தை தொடர்ந்து சாப்பிட்டு வரலாம்"},{"n":11,"t":"தோல் வழவழப்பாக மருதாணி இலையை அரைத்து கருப்பு தோல் மீது தேய்த்து வந்தால் கருப்பு மாறும்"},{"n":12,"t":"உடல் சிலப்பாக மாற வெள்ளரிக்காய் மஞ்சள் வேப்பம்பூ சேர்த்து அரைத்து உடலில் பூசி குளித்து வர குணமாகும்"},{"n":13,"t":"உடல் பொலிவு பெற கோரைக்கிழங்கு பொடி தேனில் சாப்பிட்டு வர உடம்பு பொலிவு உண்டாகும்"},{"n":14,"t":"முகம் அழகாக கூட அருகம்புல்லை நீர் விட்டு அரைத்து வடித்து பின் வெள்ளம் சேர்த்து பருகிவர உடல் அழகும் முக அழகும் கூடும்"},{"n":2,"t":"சிறந்த ஆரோக்கியம் பெறுவதற்கு"},{"n":15,"t":"குளுக்கோஸ் நேரடியாக உடலுக்கு கிடைக்க தினசரி இரண்டு பேரிச்சம்பழம் சாப்பிட்டு பால் சாப்பிடலாம்"},{"n":16,"t":"ஆயுள் பெருக இஞ்சி துண்டு தேனில் ஊறவைத்து 48 நாட்கள் சாப்பிட பித்தம் தணிந்து ஆயுள் பெருகும்"},{"n":17,"t":"நிறைவான ஆரோக்கியம் பெற உடல் உறுப்புகளை முழுமையான கட்டுப்பாட்டில் வைக்கும் தர்மம் ஆசனா என்பதால் ஆரோக்கியம் பெறலாம்"},{"n":3,"t":"இன்பம் கிடைப்பதற்கு"},{"n":18,"t":"காமப் பெருக்கி அத்திப்பழம் சாப்பிட காம பெருக்கியாக செயல்படும்"},{"n":19,"t":"இல்லற வாழ்வில் திருத்து இல்லாமல் இருந்தால் ஆலமரத்தின் கொழுந்து இலைகளை அரைத்து ஐந்து கிராம் அளவு சாப்பிட்டு ஒரு டம்ளர் பால் சாப்பிட்டு வந்தால் மகிழ்ச்சியாக வாழலாம்"},{"n":20,"t":"காமம் வெறுக்க முள்ளங்கி விதை பொடி செய்து சாப்பிடலாம்"},{"n":21,"t":"உடலுறவில் நிறைவாக இன்பம் கிடைக்க பாலும் தேனும் கலந்து சாப்பிடலாம்"},{"n":4,"t":"குழந்தைகளுக்கு சிறப்பு ஆலோசனை"},{"n":22,"t":"குழந்தைகளுக்கு ஆறிலிருந்து 12 மாதம் வரை தாய்ப்பாலுடன் ஆட்டுப்பால் பழச்சாறு பசும்பால் கொடுக்க வேண்டும்"},{"n":23,"t":"போலியோ சொட்டு மருந்து தயாரித்த இடத்திலிருந்து குழந்தையின் வாயில் விழும் வரை எட்டு டிகிரி செல்சியஸ் குளிர்ந்த நிலையில் இருந்தால்தான் பயன் தரும்"},{"n":24,"t":"குழந்தைகளுக்கு தாழ்வு மனப்பான்மை உருவாகாமல் இருக்க குழந்தைகளை ஒப்பிடுவதை தவிர்க்க வேண்டும்"},{"n":25,"t":"குறை மாத குழந்தை குறை மாதத்தில் பிறக்கும் குழந்தைகளை வாழை மட்டையில் வைத்து வளர்க்கும் முறை வழக்கத்தில் இருந்தது"},{"n":26,"t":"பசும் பாலை விட சக்தி வாய்ந்தது குழந்தைகளுக்கு தேங்காயை சிறிய கீற்றுகளாக நறுக்கி கடித்து சாப்பிட கொடுக்கலாம்"},{"n":27,"t":"அக்கி குணமாக ஆழம் விழுதை சாம்பலாக்கி நல்லெண்ணெயில் குழைத்து தடவி வந்தால் குணமாகும்"},{"n":28,"t":"வயிறு பெருத்து உடல் சிறியதாக உள்ள குழந்தைகளுக்கு கோரைக்கிழங்கை தோல் நீக்கி சூப் வைத்து கொடுக்கவும்"},{"n":29,"t":"எலும்பும் தோலுமான குழந்தைகள் நல்வளர்ச்சி உண்டாக பூசணிக்காயை துருவி பிழிந்து பிட்டவியலாக்கு சர்க்கரை உடன் சாப்பிட்டு வரவும்"},{"n":30,"t":"குழந்தைகளுக்கு ஏற்படும் தொடர் இருமலுக்கு சிறிது பெருங்காயத்தை வெந்நீரில் கரைத்து தெளிந்த நீரை கொடுத்து வர குறையும்"},{"n":31,"t":"வயிற்றுப்புண் ஆற குழந்தைகளுக்கு அம்மன் பச்சரிசி சுண்டைக்காய் அளவு கொடுத்து வரலாம்"},{"n":32,"t":"குழந்தைகளுக்கு ஜீரண டானிக் சதகுப்பை விதையை கொதிக்க வைத்து சர்க்கரை சேர்த்து வடிகட்டி கொடுக்கலாம்"},{"n":33,"t":"காய்ச்சல் குணமாக நிலவேம்பு சுக்கு திப்பிலி சீந்தில் பொடி சிதைத்து கசாயம் செய்து பத்து மில்லி லிட்டர் குழந்தைகளுக்கு கொடுக்கலாம்"},{"n":34,"t":"கக்குவான் இருமல் தீர துளசி பூங்கொத்த, திப்பிலி, வசம்பு பொடி, சர்க்கரை கலந்து ஒரு சிட்டிகை பொடி தேனில் கலந்து சாப்பிட கக்குவான் இருமல் தீரும்"},{"n":5,"t":"பெண்கள் கருப்பை - சுகப்பிரசவம்"},{"n":35,"t":"கருப்பை பலமடைய சதகுப்பை கருஞ்சீரகம் மர மஞ்சள் சம அளவு அரைத்து பனைவெல்லம் சேர்த்து 5 கிராம் காலை மாலை சாப்பிட்டு வர பலன் அடையலாம்"},{"n":36,"t":"கருவுற்ற தாய்மார்கள் சாப்பிட சிறந்த பழம் மாம்பழம்"},{"n":37,"t":"சுகப்பிரசவம் ஆக ஆப்பிள் பழம் தேன் ரோஜா இதழ் குங்குமப்பூ ஏலக்காய் அரைத்து இரண்டு கிராம் அளவி சாப்பிடலாம்"},{"n":38,"t":"கர்ப்பாயாச கோளாறு நீங்க சிறு குறிஞ்சா இலை களா இலை அரைத்து வெறும் வயிற்றில் குடிக்கவும்"},{"n":39,"t":"கருச்சிதைவு ஏற்படாமல் தடுக்க அசோகப் பட்டை மாதுளை வேர் மாதுளை தோல் பொடி செய்து மூணு சிட்டிகை மூன்று வேளை சாப்பிடலாம்"},{"n":40,"t":"கருப்பை குறைபாடுகள் நீங்க பருத்தி இலை சாறை தேனுடன் கலந்து சாப்பிடலாம்"},{"n":41,"t":"குழந்தையின்மை நீங்க பெண்கள் வேப்பம்பூடன் மிளகு சேர்த்து பவுடராகி சாப்பிட்டு வரலாம்"},{"n":42,"t":"கர்பப்பை புழு நீங்க மாதவிடாய் முதல் மூன்று நாட்கள் வெள்ளறுகு சமூலத்தை அரைத்து இரண்டு கிராம் அளவு சாப்பிடலாம்"},{"n":43,"t":"குழந்தை சிவப்பாக பிறக்க கர்ப்பிணி பெண்கள் வெற்றிலை பாக்குடன் குங்குமப்பூவை சேர்த்து சாப்பிடலாம்"},{"n":44,"t":"பிள்ளை பேரு உண்டாக மாதுளை வேர்பட்டை, விதை பொடி 3 கிராம் காலை மாலை வெந்நீரில் சாப்பிட்டு வரவும்"},{"n":45,"t":"கர்பப்பை நோய்கள் தீர கொடிவேலி வேர்பட்டை அரைத்து பாலில் காலை மாலை 21 நாட்கள் சாப்பிடலாம்"},{"n":46,"t":"பெரும்பாடு தீர , கர்பப்பை பலப்பட வெட்சிபூவை அரைத்து அருகம்புல் சாறு கலந்து குடிக்க பெரும்பாடு தீரும், கர்பப்பை பலப்படும்"},{"n":6,"t":"பெண்கள் / பெரும்பாடு - உதிர சிக்கல்"},{"n":47,"t":"மாதவிடாய் ஒழுங்காக -. புதினா இலையின் சாறு எடுத்து அதனுடன் தேன் கலந்து குடிக்கலாம்."},{"n":48,"t":"மாதவிடாய் வயிற்றுவலி தீர :- அத்திப்பழம் தேனில் ஊற வைத்து சாப்பிட பெரும்பாடு குறையும்."},{"n":49,"t":"பெரும்பாடு தீர :- ஆவாரம்பட்டையை பொடியாக்கி கஷாயம் செய்து சாப்பிட்டு வரவும்."},{"n":50,"t":"உதிர சிக்கல் தீர :- ஈஸ்வரமூலி அரைத்து காய்ச்சி குடிக்கலாம். ்"},{"n":51,"t":"மாதவிலக்கு தாராளமாக :- இலந்தைப்பூ, வெற்றிலை சுண்ணாம்பு சேர்த்து சாப்பிடலாம்."},{"n":52,"t":"வெள்ளை தீர :- அவுரிவேர், பெருநெருஞ்சில் இலை சேர்த்து அரைத்து மோரில் குடிக்கலாம்."},{"n":53,"t":"வெள்ளைபோக்கு நிற்க :- கானாவாரை சமூலம், கீழாநெல்லி இலையுடன் அரைத்து தயிரில் குடிக்கலாம்"},{"n":54,"t":"வெள்ளைப்படுதல் குணமாக :- தினமும் அன்னாசிபழம் சாப்பிட வேண்டும்."},{"n":55,"t":"உடற்சோர்வு நீங்கி பலம் பெற :- கோதுமை கஞ்சி மாதவிடாய் காலங்களில் சாப்பிடவும்."},{"n":56,"t":"மாதவிடாய் வயிற்றுவவி தீர. :- அத்திபழம் தேனில் ஊற வைத்து சாப்பிடலாம்."},{"n":7,"t":"வெட்டை சூடு தணிவதற்கு"},{"n":57,"t":"வெட்டை சூடு தணிய :- எலுமிச்சை இலையை மோரில் ஊற வைத்து அந்த மோரை உணவில் பயன்படுத்தலாம்."},{"n":58,"t":"வெட்டை சூடூ தீர :- சந்தனக்கட்டையை பசும்பாலில் உரைத்து சாப்பிட்டு வரவும்."},{"n":59,"t":"மூலச்சூடு தணிய :- ரோஜாப்பூவை ஊறவைத்து கசக்கி பிழிந்து சர்பத், சர்க்கரை .சேர்த்து குடித்து வரலாம்."},{"n":60,"t":"வெள்ளை வெட்டை சூடூ தீர :- ஓரிதழ் தாமரை இலை மென்று சாப்பிட்டு பால் குடித்து வரலாம்."},{"n":8,"t":"பெண்களுக்கு இடுப்பு வலி ."},{"n":61,"t":"இடுப்பு வவி குணமாக :- வெள்ளைப்பூண்டு, கருப்பட்டி சேர்த்து சாப்பிட்டு வரலாம்."},{"n":62,"t":"பெண்கள் இடுப்பில் புண் குணமாக :- கடுக்காயை கல்லில் உரசி தடவி வந்தால் குணமாகும்."},{"n":63,"t":"விலாவலவி தீர :- துளசி இலை, இஞ்சி. தாமரை வேர் அரைத்து கொதிக்க வைத்து பற்றிட விலாவலி தீரும்."},{"n":64,"t":"இடுப்பு வலி தீர :- விழுதி இலை: சாறு நல்லெண்ணை கலந்து 5 மி.லி. 3நாள்கள் சாப்பிட இடுப்பு வலி தீரும்."},{"n":9,"t":"பெண்கள் கருத்தடை குடும்ப கட்டுப்பாடு"},{"n":65,"t":"கற்பத்தடை ஏற்பட :- உடலுறவிற்கு பின் எள் சாப்பிடலாம்."},{"n":66,"t":"கர்பத்தடைக்கு :- அன்னாச்சி பழம், கருஞ்சீரகம் வெல்லம் கலந்த கலவை சாப்பிடலாம்."},{"n":10,"t":"பெண் மலடு"},{"n":67,"t":"பெண் மலடு :- நீங்க அசோக பட்டை, மாதுளை வேர்ப்பட்டை, மாதுளம் பழ தோல் பொடி செய்து 2 சிட்டிகை 120 நாட்கள் சாப்பிடலாம்."},{"n":68,"t":"கர்ப்பபை நோய் தீர :- அசோகப்பட்டை, மலைவேம்பு இலை, நாயுறுவிவேர் அரசங்கொழுந்து சமஅளவு பொடி கால்கிராம் காலை மாலை சாப்பிட்டு வர கர்ப்பப்பை நோய் நீங்கி குழந்தை பேரு உண்டாகும்"},{"n":11,"t":"ஆண்மை குறைவ சரியாக"},{"n":69,"t":"ஆண் மலடு நீங்க :- அரச விதைத் தூள் மலட்டினை நீக்கும்,"},{"n":70,"t":"ஆண்மை குறைவு நீங்க : மாதுளம் பழம் இரவு தினந்தோறும் சாப்பிட்டு வரலாம்."},{"n":71,"t":"இழந்த இளமையை பெற':- அமுக்கிராபொடி கசகசா, பாதாம் பருப்பு, சாரப்பருப்பு சேர்த்து சாப்பிட்டு, வரலாம்."},{"n":72,"t":"ஆண்மை பெற :- சுரைக்காய் விதைகளை கருப்பட்டி அல்லது சர்க்கரை சேர்த்து 10 கிராம் உண்டு வரலாம்."},{"n":12,"t":"ஆண்மை வீரியம் பெற"},{"n":73,"t":"தாது வலுப்பெற :- தேங்காய் துவையலில் கசகசா சேர்த்தரைத்து உணவுடன் சாப்பிட்டு வரலாம்."},{"n":74,"t":"ஆண்மை பெருக :- அத்திப்பழம் முறையாக 41 நாட்கள் தொடர்ந்து சாப்பிட்டு வர குணமாகும்."},{"n":75,"t":"தாதுகட்ட :- துளசிவிதை பொடி தாம்பூலத்துடன் சாப்பிடவும்."},{"n":13,"t":"ஆண்குறியில் புண்கள் குணமாக ."},{"n":76,"t":"ஆண்குறி வீக்கம் குணமாக : - பசும்பாலில் கருஞ்சீரகத்தை அரைத்து தடவவும்."},{"n":77,"t":"விரைவீக்கம் குணமாக :- இலுப்பைப் பூவை தினமும் கட்டவும்."},{"n":78,"t":"அரையாப்பு கட்டி தீர :- வல்லாரை இலை விளக்கெண்ணையில் வதக்கி கட்டவும்."},{"n":14,"t":"சரும நோய் குணமாக"},{"n":79,"t":"அக்கூல் பகுதி :- தினமும் குறைந்தது. இருமுறையாவது தண்ணீர் விட்டு நன்கு கழுவி ஈரம் இல்லாமல் துணி கொண்டு துடைக்க வேண்டும்."},{"n":80,"t":"சீலைபேன் ஒழிய :- நாய் துளசி இலையுடன் வசம்பு சேர்த்து அரைத்து உடல் ஓழுவதும் பூசிக் குளிக்கலாம்"},{"n":81,"t":"படர் தாமரை தீர :- சந்தனகட்டையை எலுமிச்சைச் சாற்றில் உரைத்து தடவ வேண்டும்."},{"n":82,"t":"படர் தாமரை குணமடைய :- பூவரசு காயின் சாற்றை தடவவும்."},{"n":83,"t":"நமைச்சல் சிரங்கு தீர :- துளசி இலையை அரைத்து பூசி குளிக்க வேண்டும்."},{"n":84,"t":"தேமல் சரியாக :- கமலா ஆரஞ்சு தோலை வெயிலில் உலர்த்தி பொடி செய்து தினமும் உடம்பிற்கு தேய்த்து குளித்து வரலாம்."},{"n":85,"t":"சருமநோய் :- மஞ்சள், வேப்பிலையை அரைத்து பூச குணமாகும்."},{"n":86,"t":"தேமல் படை குணமாக :- நாயுருவி இலை சாறை தடவி வரலாம்."},{"n":87,"t":"செரியாமை, தோல் நோய்கள் தீர :- நன்னாரி வேர் கசாயம் சாப்பிட்டு வரலாம்."},{"n":88,"t":"உடல் நாற்றம் நீங்க :- பற்பாடகம் இலையை பாலில் அரைத்து பூசி குளிக்கலாம்."},{"n":89,"t":"தோல்வவி நீங்க :- மாதுளம், அன்னாச்சி, திராட்சை, எலுமிச்சை, நெல்லிக்கனி சாப்பிடலாம்."},{"n":90,"t":"தேமல் குணமாக :- வெள்ளை பூண்டை, வெற்றிலை சேர்த்து மசிய அரைத்து தினமும் தோலில் தேய்த்து குளித்து வரலாம்."},{"n":91,"t":"சொறி, சிரங்கு குணமாக :- அறுகம்புல் தைலம் தேய்த்து குளித்து வரலாம்."},{"n":92,"t":"வேர் குரு :- சாதம் வடித்த கஞ்சியை தடவி சிறிது நேரம் கழித்து குளிக்கலாம்."},{"n":93,"t":"புண், சிரங்கு தீர :- நுனா இலையை. அரைத்து பற்றுப்போட புண், சிரங்கு. தீரும்."},{"n":94,"t":"கரும்படை :- ஜாதிக்காய் அரைத்து தடவலாம்."},{"n":95,"t":"சிரட்டை தைலம் :- தோல் வியாதிக்கு அருமையான மருந்து."},{"n":96,"t":"உடல் வீக்கம், தோல் நோய் குணமாக :- - தக்காளிக்காய். சாப்பிடலாம்."},{"n":97,"t":"சொறி, சிரங்கு படைதீர :- நில ஆவரை கியாழத்தை தடவி வரலாம்."},{"n":98,"t":"சொறி, சிரங்கு தீர :- கொன்றைவேர் கஷாயம் குடித்து வரலாம்."},{"n":99,"t":"சொறி சிரங்கு, படை ஆற :- நிலாவரை கஷாயம் தடவிவர ஆறும்"},{"n":100,"t":"கரப்பான் கிரந்தி குணமாக :- ஆடாதொடை இலை, சங்கன் இலை கஷாயம் செய்து சாப்பிடலாம்."},{"n":15,"t":"காய்ச்சல் குணமாக"},{"n":101,"t":"காய்ச்சல் தீர :- வேப்பிலையை. வறுத்து சூடோடு தலைக்கு வைத்து தூங்கவும். நிம்மதியான தூக்கமும் வரும்."},{"n":102,"t":"மலேரியா காய்ச்சல் குணமாக :- மிளகு, சீரகம் சேர்த்து சாப்பிட்டு வரவும் 103.பித்த காய்ச்சல் தீர :- சீதேவி செங்கழுநீர் சமூலமாக குடிநீர் செய்து சாப்பிடலாம்."},{"n":104,"t":"எப்படிப்பட்ட காய்ச்சலும் தீர :- கோரைக்கிழங்கு கஷாயம் குடித்தால் நல்லது."},{"n":105,"t":"கடுங்காயச்சல் குணமாக :- கோரைகிழங்கை கழுவி சுத்தம் செய்து நீர்விட்டு காய்ச்சி குடிக்கலாம். 106.எலும்புக் காய்ச்சல் தீர :- நெல்லிக்காய் லேகியம் சிறு உருண்டை காலை, மாலை சாப்பிட்டு வரத் தணியும்."},{"n":107,"t":"காய்ச்சல் சரியாக, :- நார்த்தங்காய் செடி இலைகளை கஷாயம் செய்து குடிக்கலாம்."},{"n":108,"t":"சுரம் நீங்க :- வெங்காய சாறு அரை அவுன்ஸ் காலை மாலை குடிக்க சுரம் நீங்கும். 109.அம்மை காய்ச்சல் தீர :- அகத்தி மரப்பட்டை கஷாயம் குடிக்க அம்மை காய்ச்சல் தீரும்."},{"n":110,"t":"சளி காய்ச்சல் தீர :- ஓமவல்லி இலை காம்பு காயம் குடிக்க சளி காய்ச்சல் தீரும்."},{"n":111,"t":"சளிக் காய்ச்சல் குணமாக :- ஆடாதோடா இலை கஷாயம் தேன் கலந்து குடிக்க சளிகாய்ச்சல் குணமாகும்."},{"n":112,"t":"தாகசுரம் நீங்க :- கோரைகிழங்கு, சந்தனம், வெட்டிவேர்,பற்பாடகம், பிரமட்டை கஷாயம் குடிக்கலாம்."},{"n":113,"t":"சன்னி ஒழுப்பு : -. சங்கிலை வேப்பிலை சமஅளவு கஷாயம் செய்து குடிக்க இழுப்பு வராமல் தடுக்கலாம்."},{"n":114,"t":"வாத காய்ச்சல் குணமாக :- அவுரி இலை, சீரகம், மிளகு சேர்த்து அரைத்து தண்ணீரில் காய்ச்சி குடிக்கலாம்."},{"n":115,"t":"சுர வேகத்தில் காணும் உள்ளங்கால், கை எரிச்சல்: தீர :- இன்புறா இலை சாறு தடவலாம்."},{"n":116,"t":"இருமல், சளிகாய்ச்சல் :- ஓமவல்லி இலை காம்பு கஷாயம் செய்து குடிக்கலாம்."},{"n":117,"t":"இடைவிடாத காய்ச்சல் தீர : - பீச்சங்கு இலை சாறு 10மி.லி. சாப்பிட்டு வரலாம்."},{"n":118,"t":"தாகம் மிகுந்த சுரம் தீர :- கானாவாழை சமூலத்துடன் மிளகு, சீரகம், கஷாயம் செய்து குடிக்கலாம்."},{"n":119,"t":"சீதளக்காய்ச்சல் குணமாக :- தூதுவளை, கண்டங்கத்திரி, பற்பாடகம், விஷ்ணுகிரந்தி கஷாயம் காய்ச்சி 10மி.லி. 3 வேளை குடித்து வரலாம்."},{"n":120,"t":"நச்சு காய்ச்சல் போக :- பற்பாடகம், நிலவேம்பு, சுக்கு, சீரகம், அதிமதுரம் கஷாயம் குடிக்கலாம்."},{"n":121,"t":"டைபாய்டூ தீர :- புன்னைப்பூவை உலர்த்தி பொடி 1 சிட்டிகை _ காலை, மாலை கொடுக்கலாம்."},{"n":122,"t":"குளிர் காய்ச்சல் தீர :- முருங்கைபட்டை அவித்து சாறு எடுத்து ரசமாக்கி சாப்பிடலாம்."},{"n":123,"t":"பித்த சுரம் தீர :- விளாமர இலை கஷாயம் சாப்பிடலாம்."},{"n":16,"t":"சளி - இருமல் - ஆஸ்துமா குணமாக"},{"n":124,"t":"கபம் உடைந்து வெளியேற - கலவை கீரை வாரம் இருமுறை உண்டு வரலாம். 125.எலும்புருக்கி நோய் குணமாக :- புறால் இலையை பொடித்து அரிசி மாவுடன் கலந்து அடை செய்து சாப்பிட குணமாகும்."},{"n":126,"t":"கபரோகம் தீர :- சங்கிலை தூதுவளை இலை பசும்பாலில் அரைத்து சாப்பிட்டு வரவும்."},{"n":127,"t":"கிராணி. குன்மம், கபநோய்கள் தீர :- அழிஞ்சல் இலையை அரைத்து 1 கிராம் காலை, மாலை கொடுக்கலாம்."},{"n":128,"t":"கபம் குணமாக :- கருந்துளசி இலை சாறு பிழிந்து, இரண்டு வேளை 3 நாட்கள் சாப்பிட்டு வரலாம்."},{"n":129,"t":"கபம் நீங்க - சுண்டைக்காய் சமைத்து உண்ண வேண்டும்."},{"n":130,"t":"கபம் வெளியாக :- சிறுகுறிஞ்சா வேர் பொடி வெந்நீரில் கலந்து சாப்பிட வேண்டும்."},{"n":131,"t":"சகல பிணி சரோகமும் தீர - விழுதி இலை சாறு நல்லெண்ணை கலந்து காய்ச்சி தலை முழுகலாம்."},{"n":132,"t":"ஜலதோஷம் நீங்க :- துளசி ரசம், இஞ்சி ரசம் கலந்து பருகலாம்."},{"n":133,"t":"ஆஸ்துமா தீர :- நொச்சி இலை, மிளகு, லவங்கம் பூண்டு மென்று விழுங்கலாம். 134.சளி தீர:- நத்தை சூரி இலை சாறை 15 மி.லி. காலை, மாலை சாப்பிடலாம். 135.சளியை அகற்ற :- துளசியை அவித்து சாறு பிழிந்து குடிக்கலாம். 136.மார்பு சளி தீர :- பொடுதலை, இஞ்சி, புதினா, கொத்தமல்லி, கறிவேப்பிலை துவையல் சுடுகோறு. நெய்யில் உண்ணலாம். 137.சளி சுரம் தீர :- முசுமுசுக்கை இலை தோசை மாவுடன் அரைத்து தோசை சாப்பிடலாம். 138.இருமல் :- ஆடாதோடா இலை சாறு தேன் கலந்து சாப்பிடலாம். 139.காசம் :- ஆடாதொடை. இலை கஷாயம் செய்து தேன் கலந்து சாப்பிடலாம்."},{"n":140,"t":"இளைப்பு, இருமல் குணமாக :- விஷ்ணுகிரந்தி பொடியை வெந்நீரில் கலந்து குடிக்கலாம்."},{"n":141,"t":"காசம் இறைப்பு நீங்க:- கரிசலாங்கண்ணி, அரிசி, திப்பிலி பொடி செய்து தேனில் கலந்து சாப்பிடலாம். 142.இருமல் குணமாக :- வெந்தயக்கீரை சமைத்து சாப்பிட்டு வரலாம். 143.வரட்டூ இருமல் :- மிளகுடன் பொரிகடலை சேர்த்து பொடியாக்கி ஒவ்வொரு ஸ்பூன் 3வேளை உண்ணலாம். 144.சளி தேக்கம் நீங்க :- வல்லாரை பொடி தூதுவளை பொடி பாலில் கலந்து குடித்து வரலாம்."},{"n":145,"t":"காசநோய் :- தினமும் அரிநெல்லிக்காய் சாப்பிடவும். 146.நெஞ்சு சளி :- தேங்காய் எண்ணெயில் கற்பூரம் சேர்த்து சுட வைத்து நெஞ்சில் தடவலாம்."},{"n":147,"t":"காசநோய் குணமாக :- பசுந்தயிர் உணவில் சேர்க்கவும். 148.இருமல் :- முற்றிய வெண்டைக்காயைச் சூப் செய்து குடிக்கலாம். 149.மார்பு சளி :- இஞ்சி சீனி சேர்த்து செய்த இஞ்சி முரப்பா சாப்பிடலாம். 150.ஆஸ்துமா, மார்புச்சளி தீர :- சுண்டைக்காய் உப்பு நீரில் ஊற வைத்து காய வைத்து வறுத்து சாப்பிடலாம்."},{"n":151,"t":"ஆஸ்துமா தீர :- சிறுகுறிஞ்சாவேர் பொடி, திரிகடுகு பொடி வெந்நீரில் சாப்பிடலாம். 152.இருமல் தீர :- கண்டங்கத்திரி வேர், ஆடாதொடை வேர், திப்பிலி கஷாயம் செய்து 50 மி.லி. குடிக்கலாம்."},{"n":153,"t":"கபம் தொந்தரவிற்கும், ஆஸ்துமா மூச்சு திணறலுக்கும் - தூதுவளை பழத்தூளை புகை பிடிக்கக் குறையும். 154.ஆஸ்துமா குணமாக :- வில்வ இலை பொடி தினமும் ஒரு ஸ்பூன் சாப்பிட்டு வர குணம் பெறலாம். 155.நீர் கோவை, சளி காய்ச்சல் தீர :- அறுகீரை நெய் சேர்த்து உண்டு வரலாம்."},{"n":156,"t":"இதய நோய் குணமாக :- மருதம்பட்டை செம்பருத்தி பூ கஷாயம் 48 நாட்கள் சாப்பிட்டு வரலாம்."},{"n":157,"t":"நுரையீரல், சளி இருமல் தீர :- பிரமதண்டு இலை பொடி, விதை பொடி தேனில் கலந்து சாப்பிடலாம்."},{"n":158,"t":"ஆஸ்துமா, இரப்பிருமல், நுரையீரல் :- பிரமத்தண்டு சமூல சாம்பல் 3 அரிசி எடை தேனில் சாப்பிடலாம். 159.இருமல் குணமாக :- மாதுளம்பூ பொடியுடன் பனங்கற்கண்டு சேர்த்து காலை, மாலை 1தேக்கரண்டி சாப்பிட்டு வரலாம். 160.கக்குவான் இருமல் வேகம் குறைய :- சோடா உப்பை தண்ணீரில் கலந்து குடிக்க குறையும்."},{"n":161,"t":"இருமல் :- இஞ்சி சாறு, மாதுளம் பழ சாறு தேன் கலந்து குடிக்கலாம். 162.இரைப்பு குணமாக. :- இஞ்சி, வெள்ளருக்கு பூ, மிளகு சேர்த்து கஷாயம் செய்து குடிக்கலாம். 163.இரைப்பு தீர :- இஞ்சி சாறு, மாதுளம் பழச்சாறு தேன் கலந்து குடிக்கலாம்."},{"n":164,"t":"மார்பு வவி. :- இஞ்சி சாறு, எலுமிச்சை சாறு, தேன் கலந்து சாப்பிட வலி நிற்கும்."},{"n":165,"t":"ஜலதோஷம் நீங்க :- துளசி சாறு, இஞ்சி சம அளவு கலந்து குடிக்கலாம்."},{"n":166,"t":"தலைவலி ஜலதோஷம் இருமல் நீங்க : - முள்ளங்கி சாறு சாப்பிடலாம்."},{"n":167,"t":"ஜலதோஷம் தீர : 1 மாதுளம் பழம் சாப்பிடலாம்."},{"n":168,"t":"ஆஸ்துமா குணமாக :- வில்வ இலையுடன் மிளகு சேர்த்து மென்று தின்று சுடுநீர் பருகி வர நீங்கும். 169.இருமல் குணமாக :- சீரகத்தை பொன் வறுவலாக வறுத்து பொடி செய்து கல்கண்டு சேர்த்துச். சாப்பிடலாம்."},{"n":170,"t":"நெஞ்சு கமறல் நீங்க :- அதிமதுரத்தை ஒரு சிறு துண்டை வாயில் போட்டுக் கொள்ளலாம்."},{"n":171,"t":"வரட்டு இருமல் :- மிளகுடன் பொரிகடலை சேர்த்து பொடியாக்கி ஒவ்வொரு ஸ்பூன் 3 வேளை உண்ணலாம்."},{"n":172,"t":"கபம் நீங்க :- சுண்டைக்காய் சமைத்து உண்ண கபம் நீங்கும்."},{"n":173,"t":"சளியில் காணும் இரத்தத்திற்கு :- நொச்சி பூவை உலர்த்தி பொடி செய்து சப்பிட்டு வர குணமாகும்."},{"n":17,"t":"அடிபட்ட காயம் குணமாக"},{"n":174,"t":"சிராய்ப்பு காயங்களுக்கு :- இலவம் பிசினை பொடி செய்து காயங்கள் மீது தடவிவர குணமாகும்."},{"n":175,"t":"எல்லாவித புண் புரைகளும் தீர :- உதிரமா இலையை அரைத்து பற்றிடலாம்."},{"n":176,"t":"வெட்டுக்காயம் குணமாக :- இலந்தை மரத்தின் இலையை மைய அரைத்து காயத்தின் மீது போட்டு வரலாம்."},{"n":177,"t":"வெட்டுக்காயம் சீக்கிரம் ஆற :- புங்கன் இலையை அரைத்து வெட்டு காயத்தின் மீது கட்டலாம்."},{"n":178,"t":"அடிபட்ட காயம் சீழ் பிடிக்காமல் ஆற :- மிளகாய் வத்தல் அரைத்து கட்டவும்."},{"n":179,"t":"காயம் குணமாக :- அரிவாள்மனை பூண்டு இலை, குப்பை மேனி இலை, பூண்டு, மிளகு சேர்த்து அரைத்து கட்டலாம்."},{"n":180,"t":"வெட்டுக்காய புண் செப்டிக் ஆகாமல் தடுக்க :- குப்பை மேனி இலை அரைத்து போட்டால் செப்டிக் ஆகாது."},{"n":181,"t":"இரணங்கள் ஆற :- பெருங்காயத்துட வேப்பிலையை மைய அரைத்து காயத்தின் மீது தடவி வர குணமாகும்."},{"n":182,"t":"நாள்பட்ட புண் ஆற :- புளியமரத்தின் சொற சொறத்த பட்டையை பொடி செய்து பாலுடன் கலந்து தடவிவர புண் ஆறும். 183.சாதாரண புண்கள் காயங்களுக்கு :- கடுக்காய் பொடி சிறிதளவு எடுத்து தேங்காய் எண்ணெய்யுடன் சேர்த்து போடலாம். 184.புண்களை கழுவ :- புன்னை மரப்பட்டையை கஷாயம் செய்து கழுவலாம்."},{"n":185,"t":"வெட்டுக்காயம் ஆற :- வசம்புத்தூளை காயத்தின் மீது தூவலாம். 186.ரணங்களை கழுவ சதை வளர்ந்து ஆற : ரோஜா பூவை கஷாயம் செய்யலாம்."},{"n":187,"t":"புரையோடிய புண், காயம் ஆற : அத்திபால் தடவலாம். 188.புண் :- சர்க்கரை வியாதி உள்ளவர்களுக்கு கால்களில் சிறிய புண் ஏற்பட்டால் உடனடியாக கவனித்து விட வேண்டும்."},{"n":18,"t":"ஆறாத புண்கள் விரைவில் ஆறுவதற்கு 189.ஆறாத புண்களை ஆற்ற :- சாணாக்கீரை சாப்பிடலாம்."},{"n":190,"t":"மறைவிடங்களில் உள்ள புண்கள் ஆற :- விராலி இலையை நரம்புகள் நீக்கிவிட்டு வதக்கி வீக்கத்தின் மீது வேப்பெண்ணை தடவி கட்டி வரலாம்."},{"n":191,"t":"சிராய்ப்பு புண் :- நம் எச்சிலுக்கு மருத்துவ குணம் வண்டு. 192.சதை வளரும் புண் :- ஊமத்தை இலைசாறு சமஅளவு தேங்காய் எண்ணை, மயில் துத்தம் சிறிது காய்ச்சி பூசலாம்."},{"n":193,"t":"எல்லாவித புண் புரைகளும் குணமாக :- உதிரமர இலையை அரைத்து பற்றிடலாம்."},{"n":19,"t":"உடம்புக்குண் உள்ள பகுதி புண்கள் ஆறுவதற்கு"},{"n":194,"t":"உள்ரணம் தீர :- கொட்டை கரந்தை உலர்த்தி பொடி செய்து கற்கண்டு சேர்த்து சாப்பிடலாம். 195.உள்ரணம் குணமாக :- கொத்தமல்லி உணவில் அடிக்கடி பயன்படுத்தி வர குணமாகும். 196.அக உறுப்புகள் சீராக :- சீரகநீரை குடிநீராக எப்போதும் பயன் படுத்தவும்."},{"n":197,"t":"அகஉறுப்புகள் பலமடைய :- கிராம்பு பொடியை அரைகிராம் தேனில் குழைத்து காலை, மாலை சாப்பிடலாம். 198.உள்ரணம் :- தென்னம்பூவை மென்று தின்னலாம்"},{"n":199,"t":"உள் உறுப்புகளை வன்மைப்படூத்த :- கொன்றை பூ பொடி செய்து சாப்பிட்டு வர உள் உறுப்புகளை வன்மைப்படுத்தும். 200.கழுத்து வவி குணமாக :- அமுக்கிராங் கிழங்கை தெளிந்த சுண்ணாம்பு நீரில் குழைத்து கொதிக்க வைத்து கழுத்தில் பற்றுப் போடலாம்."},{"n":201,"t":"சன்னி பிடரி வலி, வாதநோய் கட்டுப்பட -வேப்பெண்ணையில் தலைமுழுகி வர குணமாகும். 202.பொன்னுக்கு வீங்கி குணமாக :- கன்னம், கழுத்தில் ஏற்படும் வீக்க நோய் வசம்பு, பலாமஞ்சள் சேர்த்து அரைத்து போடவும். 203.கண்டமாலை வீக்கம் கரைய :- கொள்ளுகாய் வேளை செடி வேர், மஞ்சள் சேர்த்து பாலில் அரைத்து பூசி வரவும்."},{"n":204,"t":"நரம் இசிவு சிரங்கு, கண்டமாலை தீர :- உத்தாமணி இலையை. வேப்பெண்ணையில் வதக்கி ஒத்தடம் கொடுக்கலாம்."},{"n":205,"t":"கண்டமாலை புண் தீர :- மாவிலங்கபட்டை கஷாயம் காலை, மாலை. சாப்பிடவும்."},{"n":206,"t":"தண்டுவடவலி குணமாக :- வாத நாராயணன் இலை 5கிராம் தேன் சேர்த்து சாப்பிட்டு வர குணமாகும்."},{"n":207,"t":"முதுகு, தோள்பட்டை, புட்டாவலி :- வாதநாராயணன் இலைகளை விளக்கெண்ணையில் வதக்கி ஒத்தடம் கொடுக்க குணமாகும்."},{"n":20,"t":"இருதயம் பலம் பெறுவதற்கு"},{"n":208,"t":"இதய படபடப்பு குறைய :- மாசிக்காயை பால் விட்டு உரசி காலை மாலை இரு வேளை அரைகிராம் நாவில் சுவைக்கலாம். எச்சரிக்கை அதிகமானால் மயக்கம் வரும்."},{"n":209,"t":"இதயம் படபடப்பு நீங்க :- தினசரி 1 பேரிக்காய் சாப்பிட சரியாகும்."},{"n":210,"t":"இதய நோய் சாந்தமாக :- துளசி இலை சாறு, தேன் வெந்நீரில் கலந்து 48 நாட்கள் சாப்பிட்டு வரவும்."},{"n":211,"t":"இதயத்தில் குத்தும் வலி குணமாக :- கருந்துளசி இலை, செம்பருத்தி பூ கஷாயம் 10 நாட்கள் சாப்பிடவும்."},{"n":212,"t":"இதயம் பலம் பெற :- தினசரி ஆரஞ்சுப்பழம் சாப்பிட்டு வரலாம்."},{"n":213,"t":"இருதயம் வலுவாக :- அத்தி பழத்தை. காய வைத்து பொடியாக்கி 1கரண்டி சாப்பிட்டு வரலாம்."},{"n":214,"t":"இதய நடூக்கம் :- திருநீற்று பச்சிலை முகர்வதால் சாந்தமாகும்."},{"n":215,"t":"இதயத்திற்கு பலம் கிடைக்க : மாதுளை சாறுடன்' தேன் கலந்து சாப்பிடவும். ஜீரண சக்தியையும் அதிகரிக்கும்."},{"n":216,"t":"நெஞ்சுவலி :- இலந்தைபழம் சாப்பிடலாம்."},{"n":217,"t":"மார்பு துடிப்பு, இதயவலி தீர:- சந்தனதூள் கஷாயம் செய்து குடிக்கலாம்."},{"n":218,"t":"இதய பலவீனம் தீர :- செம்பரத்தை பூ உலர்த்தி பொடி, மருதம் பட்டை தூள் சம அளவு பாலில் சலந்து பருகலாம்."},{"n":219,"t":"மாரடைப்பு:- தான்றிக்காய் பொடி 2 சிட்டிகை தேனில் கலந்து நாக்கில் தடவலாம்."},{"n":220,"t":"நெஞ்சுவலி பெற :- இஞ்சி துண்டு தேனில் ஊறவைத்து 48 நாட்கள் சாப்பிட்டு வரலாம்."},{"n":221,"t":"இதயவலி குணமாக :- துளசி விதை 100 கிராம், பன்னீர் 125 கிராம், சர்க்கரை 25 கிராம் ஒன்றாகக் கலக்கி 2 வேளை சாப்பிடவும்."},{"n":222,"t":"இதயநோய் குணமாக :- மருதம்பட்டை செம்பருத்தி பூ கஷாயம் 48 நாட்கள் சாப்பிட்டு வரலாம்."},{"n":223,"t":"மார்பு வலி :- இஞ்சி சாறு, எலுமிச்சை சாறு, தேன் கலந்து சாப்பிட வலி நிற்கும்."},{"n":224,"t":"சீரற்ற இதயதுடிப்பு சரியாக :- கருஞ்துளசி இலை, மருதம்பட்டை கஷாயம் சாப்பிடலாம்."},{"n":225,"t":"இதயநோய் உள்ளவர்கள் :- டீ குடிக்கலாம், காபி தவிர்த்தல் நலம்."},{"n":27,"t":"வயிற்றுப்போக்கு, பேதி, இரத்த பேதி சரியாக"},{"n":226,"t":"கழிச்சல் குணமாக :- மாங்கொட்டை பருப்பு, மாதுளம்பூ, ஓமம் சேர்த்து பொடி செய்து மோரில் சாப்பிட குணமாகும். 227.சுகபேதியாக :- நுனாவேரை கஷாயமாக்கி குடிக்கவும்."},{"n":228,"t":"சீதபேதி குணமாக :- புளியங்கொட்டை தோல், மாதுளம் பழத்தோல் சமஅளவு இடித்து தூள் செய்து பசும்பாலில் சாப்பிட குணமாகும்."},{"n":229,"t":"பேதி குணமாக :- அவரை இலை சாறை தயிருடன்: சாப்பிட பேதி நிற்கும்."},{"n":230,"t":"தொடர் வயிற்றுப் போக்கு :- பப்பாளிப்பழம் சாப்பிட குணமாகும்"},{"n":231,"t":"காலரா குணமாக :- மாங்கொட்டை பருப்பை பொடிசெய்து பசும்பாலில் கலந்து கொடுக்கவும்."},{"n":232,"t":"பேதி நிற்க - கொய்யா வேரை கொதிக்க வைத்து காலையில் குடிக்கலாம்."},{"n":233,"t":"சீதபேதி அஜீரணம் உள்ளவர்கள் : ஆளி விரைகளை அரைத்து சாப்பிடலாம்."},{"n":234,"t":"ரத்தபேதி தீர: - இலந்தைபட்டை கஷாயம் செய்து குடிக்கலாம்."},{"n":235,"t":"மலத்துடன் இரத்தம் வருவதை தடுக்க :- மாதுளம் பூ இடித்து தேன் கலந்து சாப்பிட்டு வரலாம்."},{"n":236,"t":"சீதபேதி குணமாக :- நுங்கை தோல் உரிக்காமல் சாப்பிட்டு வரலாம்."},{"n":237,"t":"மேகம், வயிற்றுப்போக்கு தீர :- நீர்முள்ளி விதையை பொடிசெய்து 1கிராம் பாலில் கலந்து சாப்பிட்டு வரலாம்."},{"n":238,"t":"வயிற்றுப்போக்கு குணமாக:- மாதுளம் பழத்தை வேக வைத்து சாறு எடுத்து தேனுடன் கலந்து உண்ண எல்லா வகை வயிற்றுப்போக்கும் தீரும்."},{"n":239,"t":"குமட்டல், வயிற்றுபோக்கு தீர :- எலுமிச்சம்பழ சாறில் சீரகம் ஊறவைத்து காய வைத்து சுவைத்து மென்று சாப்பிடலாம்."},{"n":240,"t":"பேதி :- வேப்பிலை வசம்பு கஷாயம் குடிக்கலாம்:"},{"n":241,"t":"உஷ்ணேபேதி குணமாக :- உலர்ந்த மாம்பூ, சீரகத்தை சேர்த்து தூள் செய்து சர்க்கரை சேர்த்து சாப்பிட வேண்டும்."},{"n":242,"t":"சீதபேதி, இரத்தபேதி குணமாக :- அசோகு பூ, மாம்பருப்பு சம அளவு பொடி செய்து 3சிட்டிகை பாலில் உட்கொள்ளலாம்."},{"n":243,"t":"வாந்தி, பேதி அடங்க :- கொய்யா இலை காய்ச்சி அரை மணிக்கு ஒரு மடக்கு வீதம் குடிக்கலாம்."},{"n":244,"t":"இரத்த பேதி நிற்க :- இலந்தை பட்டை கசாயம் செய்து குடிக்கலாம். 245:- இரத்த கழிச்சல் தீர :- கட்டுகொடி இலை சாறை சர்க்கரை கலந்து கொடுக்கலாம்."},{"n":246,"t":"இரத்த போக்கு நிற்க :- நெய்யுடன், செம்பருத்தி, பூவை சேர்த்து வதக்கி சாப்பிட்டு வர உடனே நிற்கும்."},{"n":247,"t":"இரத்த வாந்தி சரியாக :- ஆடாதொடை இலை சாறு தேன் கலந்து சாப்பிட சரியாகும்."},{"n":248,"t":"இரத்தம் தூய்மையாகி மேகரோக கிருமிகள் நீங்க :- கருஞ்செம்பை இலைசாறு 10 மி.லி. சாப்பிட்டு வரலாம்."},{"n":22,"t":"நுரையீரல் குணமாக"},{"n":249,"t":"ஈரல் வலி :- ஆரஞ்சுப்பழம் தினந்தோறும் சாப்பிட்டு வர குணமாகும்."},{"n":250,"t":"நுரையீரல், கபம் தீர :- துத்திபூ பொடி சர்க்கரை கலந்து பாலில் சாப்பிடவும்."},{"n":251,"t":"ஈரல் வியாதி :- கரிசலாங்கண்ணி கீரை தொடாந்து சாப்பிடவும்."},{"n":252,"t":"ஈரல் வீக்கம் குணமாக :- நொச்சி இலையை மைய அரைத்து உள்ளுக்கு 10மி.லி. குடிக்க குணமாகும்."},{"n":253,"t":"நுரையீரல் வலி :- ஆடாதோடா இலைசாறு தேன் கலந்து சாப்பிடலாம்."},{"n":254,"t":"நுரையீரல் பலப்பட :- தேனில் ஊறவைத்த நெல்லிக்காய் தினசரி ஒன்று சாப்பிட்டு வர நுரையீரல், இருதயம் பலம் பெறும்."},{"n":255,"t":"நுரையீரல். புற்று-நோய் வராமல் தடூக்க :- முசுமுசுக்கை இலையை பொடியாக்கி மாதம் இரண்டு தடவை சாப்பிடலாம்."},{"n":256,"t":"நுரையீரல் புண் ஆற :- மருதம்பட்டை ஆடாதொடை பொடி வெள்ளாட்டு பாலில் கலந்து குடித்து வரலாம். 257.நுரையீரல், சளி இருமல் தீர :- பிரதமண்டு இலைபொடி, விதை பொடி தேனில் கலந்து சாப்பிடலாம்."},{"n":258,"t":"ஆஸ்துமா. இரப்பிருமல், நுரையீரல் - பிரமதண்டு சமூல சாம்பல் 3 அரிசி எடை தேனில் சாப்பிடலாம்."},{"n":259,"t":"நுரையீரல், சளி அடைப்பு தீர :- இஞ்சி, வெள்ளெருக்கும்பூ, மிளகு சேர்த்து கஷாயம் சாப்பிட்டு வர தீரும்."},{"n":260,"t":"நுரையீரல் வலுவடைய :- சுண்டை வற்றல் உணவில் அடிக்கடி சேர்க்க நுரையீரல் வலுவடையும்."},{"n":22,"t":"திக்கி பேசுதல் சரியாக"},{"n":261,"t":"வாய் திக்குதல் :- வில்வ இலையை தினமும் காலையில் மென்று தின்று வர குணமாகும்."},{"n":262,"t":"பேசும் திறன் அதிகரிக்க :- தாமரை இதழ் தினமும் ஒன்று சாப்பிட்டு வரலாம். (குறிப்பு: வசம்பை சுட்ட பிறகு தான் பொடி பண்ணனும்)"},{"n":263,"t":"திக்கி பேசுதல் குணமாக :- வசம்புபொடி அருகம்புல் சாறில் கலந்து குடித்துவர திக்கிபேசுதல் சரியாகும்."},{"n":264,"t":"திக்கி பேசுதல் சரியாக :- இலந்தை இலை சாறு சாப்பிட்டு வர திக்கி பேசுதல் குணமாகும்."},{"n":23,"t":"வாத நோய்கள் குணமாக"},{"n":265,"t":"பாரிசு வாதம் :- நன்னாரிவேர் 20கிராம் போட்டு சுண்ட காய்ச்சி வடிகட்டி. சாப்பிட்டு வரக் குணமாகும்."},{"n":266,"t":"வாதவலி தீர :- ஊமத்தை இலை நல்லெண்ணையில் வதக்கி கட்டலாம். . 267.வாதநோய் தீர :- கட்டுக்கொடி இலை, சுக்கு, மிளகு சேர்த்து காய்ச்சி கொடுக்க வேண்டும்."},{"n":268,"t":"பக்கவாதம் தீர :- சங்கிலை வேர் பட்டை அரைத்து வெந்நீரில் குடிக்க வேண்டும்."},{"n":269,"t":"குடல் வாதம் :- பொருமலுக்கு சொன்ன மருந்தை சாப்பிட்டு வர தீரும். 270.முடக்குவாதம் தீர :- பாதாளமூலி முள் நீக்கி விளக்கெண்ணையில் வாட்டி. கட்டலாம். ஒத்தடமும் கொடுக்கலாம். ."},{"n":271,"t":"வாதமூட்டு வலி குணமாக :- வெங்காய சாறை கடுகெண்ணையில் கலந்து வலி உள்ள இடத்தில் தடவவும்."},{"n":272,"t":"சன்னி, பிடரி, இசிவு, வாதநோய்கள் - தீர வட வேப்பெண்ணையில் தலை முழுகி வர நோய்கள் தீரும்."},{"n":273,"t":"வாதநோய் குணமாக :- குப்பைமேனி இலைசாறு எடுத்து தினசரி 1அவுன்ஸ் சாப்பிட்டு வர குணமாகும்."},{"n":274,"t":"கீழ்வாதம் தீர :- முருங்க பட்டை கடுகு சேர்த்து அரைத்து பற்றிடலாம்."},{"n":275,"t":"வாதநோய், வாதவீக்கம் தீர :- மிளகாய் பூண்டு விதை கஷாயம் செய்து 2வேளை குடிக்கவும். 276.வாதபிடிப்பு வீக்கம் தீர :- முடக்கத்தான் இலை விளக்கெண்ணையில் வதக்கி கட்டி வரவும். |"},{"n":277,"t":"வாதவலி, வாதநோய் குணமாக :- கட்டுக்கொடி வேர் சிறிதளவும், 1துண்டு சுக்கு 4மிளகுடன் காய்ச்சிகொடுக்கலாம்."},{"n":278,"t":"வலிப்பு நோய் தடுக்க :- தினசரி ஆட்டுப்பால் சாப்பிட்டு வரவும். 279.முடக்குவாதம் நீங்க :- மாவிலங்க இலை கஷாயம் சமஅளவு தேங்காய் பாலில் 3வேளை குடிக்கவும்."},{"n":280,"t":"வாதம், பிடிப்பு குணமாக '- முடக்கத்தான் இலைகளை நறுக்கி அரிசிமாவுடன் கலந்து அடை செய்து சாப்பிடலாம்."},{"n":281,"t":"கீழ்வாத வீக்கம் குறைய :- சக்தி சாரணை சாற்றுடன் நல்லெண்ணை கலந்து காய்ச்சி தடவி வரலாம்."},{"n":282,"t":"வாதவீக்கம், கீழ்வாயு தீர :- சங்கிலை, வேம்பு,குப்பைமேனி, நாயுருவி, நொச்சி அவித்து வேது பிடிக்கலாம்."},{"n":283,"t":"வாதத்தால் ஏற்படும் உடல்வலி தீர :- நொச்சி இலையை கொதிக்கும் நீரில் போட்டு கொதிக்க வைத்து அந்த நீரில் குளிக்கலாம்."},{"n":284,"t":"வாதவலி :- ஊமத்தை இலை நல்லெண்ணையில் வதக்கிகட்டலாம்."},{"n":285,"t":"மூலம் :- நாயுருவி விதைபொடி துத்தி கீரையுடன் சேர்த்து சமைத்து உண்ணலாம்."},{"n":286,"t":"வாதவீக்கம், குடைச்சல் வலி தீர - வாதநாராயணன் இலை சாறு அவுன்ஸ் குடித்து வரலாம்."},{"n":287,"t":"வாதம் :- நன்னாரி வேர் கஷாயம் செய்து சாப்பிடலாம்."},{"n":24,"t":"மலச்சிக்கல் சரியாக"},{"n":298,"t":"மலச்சிக்கல் தீர :- அகத்திகீரை வாரம் ஒரு நாள் சமைத்து உண்ண வேண்டும்."},{"n":289,"t":"மலச்சிக்கல் நீங்கி மூலம் கட்டுப்பட :- பப்பாளி பழம் தினந்தோறும் சாப்பிட்டு வர குணமாகும்."},{"n":290,"t":"மலச்சிக்கல் குணமாக :- பார்லி அரிசி 20 கிராம், புளிய இலை 40 கிராம் காய்ச்சி கசாயம் ஆக்கி குடித்து வரலாம்."},{"n":291,"t":"மலச்சிக்கல் நீங்க :- முளைக்கீரை சாப்பிட்டு வரலாம்."},{"n":292,"t":"அடிக்கடி மலம் கழிக்கும் உணர்ச்சி நீங்க :- மாதுளம் பூ சாறு 15 மி.லி. கற்கண்டு சேர்த்து 3 வேளை சாப்பிடவும்."},{"n":293,"t":"தேங்கியுள்ள மலத்தை வெளிப்படுத்த :- சாறுவேளை செடி பொடி சுக்குத்தூள் கலந்து சாப்பிடலாம்."},{"n":294,"t":"மலச்சிக்கல் தீர:- இரவில் மாம்பழம் சாப்பிடலாம்."},{"n":295,"t":"மலக்கட்டு தீர :- முள்ளங்கி இலை சாறு 5 மி.லி. 3 வேளை சாப்பிட்டு வரலாம்."},{"n":296,"t":"மல சிக்கலுடன் குளியலால் வரும் காய்ச்சல், தலைவலி, சளி பிடிப்பது :- வெந்நீர் ஒத்தடம் வயிற்றில் கொடுத்து மலம் கழிக்க தீரும்"},{"n":297,"t":"மல சிக்கலை போக்க :- நார்த்தங்காய் ஊறுகாய் சாப்பிடவும். ஜீரண சக்தியும் பெருகும்."},{"n":298,"t":"மலம் கழித்தல் கிராணி : பாதாளமூலி சதையை சிறுதுண்டுகளாக்கி மிளகுத்தூள் சேர்த்து சாப்பிட தீரும்."},{"n":299,"t":"இறுகி போன மலம் இளக :- 10மி.லி. விளக்கெண்ணையில் 3துளி எருக்கு இலைசாறு விட்டு சாப்பிடலாம்."},{"n":300,"t":"மலக்கட்டூ நஞ்சு நீங்க :- மகழவித்து பருப்பை பொடி செய்து 5கிராம் பாலில் சாப்பிட்டு வர மலக்கட்டு நஞ்சு நீங்கும்."},{"n":25,"t":"மூலம், வெளிமூலம், உள்மூலம், பௌத்திரம்"},{"n":301,"t":"உள்மூலம் :- காட்டு துளசியின் விதைகளை காய வைத்து இடித்து தூள் செய்து அரை ஸ்பூன் பாலுடன் சேர்த்து குடிக்கவும்."},{"n":302,"t":"பவுத்திரத்தின் தொந்தரவு நீங்க :- பூண்டு, எலுமிச்சைசாறு, உப்பு சேர்த்து ஊறவைத்து பூடை மென்று தின்று வரலாம். 303.மூலம் குணமாக :- புங்கம்பட்டையை கஷாயமாக்கி குடிக்கலாம்."},{"n":304,"t":"இரவில் அதிகநேரம் கண் விழித்திருத்தலைத் தவிர்த்தல்: - சூடு, மூலம் வராமல் தடுக்கலாம்."},{"n":305,"t":"வாதநோய், மூலநோய், இருமல் உள்ளவர்கள் தவிர்க்க வண்டியவை :- பலாப்பழம்."},{"n":306,"t":"மூலப்புண் :- மஞ்சள். பொடி கலந்து சுடுநீரில் ஆசனவாய் படும்படி அமர்ந்திருந்து வர புண் ஆறும் மூலவலி குறையும்."},{"n":307,"t":"பவிந்திரம் தீர :- குப்பைமேனி சமூலம் பொடி 2 சிட்டிகை நெய்யில் காலை, மாலை சாப்பிட்டு வரலாம்."},{"n":308,"t":"மூலத்தில் நெளியும் பூச்சிகள் ஒழிய :- கஞ்சாங்கோரை இலையை விளக்கெண்ணையில் வதக்கி இளஞ்சூட்டில் ஆசனவாயில் கட்டி வரலாம்."},{"n":309,"t":"மூலம் தீர :- நாயுருவி விதை பொடி துத்தி கீரையுடன் சமைத்து உண்ண வேண்டும்."},{"n":310,"t":"மூலநோய் குணமாக :- பப்பாளிபழம், மாம்பழம் இரண்டையும் தேனில் ஊறவைத்து சாப்பிட்டால் குணமாகும்."},{"n":311,"t":"மூலநோய் நீங்க :- துத்தியில் பொரியல் செய்து சோற்றுடன்"},{"n":120,"t":"நாட்கள் சாப்பிட்டு வரவும். (மாமிசம், புளி, காரம் சேர்க்க கூடாது)."},{"n":312,"t":"ஆசனம் வெளித்தள்ளல் தீர :- பழம்பாசி இலையைப் பொடித்த பாலில் வேகவைத்து வடிகட்டி சிறிதளவு கொடுக்க குணமாகும்."},{"n":313,"t":"வெளிமூலம். தீர :- கொய்யா வேர் கஷாயம் வைத்து மூலத்தை கழுவி வரலாம்."},{"n":314,"t":"உள் மூலம் பவுத்திரம் தீர :- பொடுதலை உளுந்தம்பருப்புடன் நெய்யில் வறுத்து துவையலாக்கி பகலுணவில் சாப்பிடலாம்."},{"n":315,"t":"மூலக்கடுப்பு தீர :- சுண்டைக்காய் சமைத்து சாப்பிடலாம்."},{"n":316,"t":"மூலக்கடுப்பு, எரிச்சல் தீர :- கட்டுகொடி இலை 2மென்று தின்று வரலாம்"},{"n":317,"t":"மூலச்சூடு தணிய :- ரோஜா பூவை சாறு எடுத்து சர்க்கரை சேர்த்து குடித்து வரலாம்."},{"n":318,"t":"மூலம், இரத்தப்போக்கு நிற்க :- குப்பைமேனி இலை 1கைப்பிடி 1கரண்டி சீரகம் சேர்த்து அரைத்து பசும்பாலில் கலந்து 1 வேளை சாப்பிடவும்."},{"n":319,"t":"இரத்த மூலம் குணமாக :- அருகம்புல் 30 கிராம் அரைத்து பாலில் கலந்து பருகி வரலாம்."},{"n":320,"t":"இரத்த மூலம் தீர :- துத்தி இலையை விளக்கெண்ணையில் வதக்கி இளம் சூட்டில் கட்டி வரலாம்."},{"n":321,"t":"மூல ரணம் தீர :- இளம் தென்னங்காய் மட்டையை இடித்து பிழிந்து நீரை குடித்துவர மூல ரணம் தீரும்."},{"n":26,"t":"நரம்பு தளர்ச்சி குணமாக."},{"n":322,"t":"நரம்பு தளர்ச்சி :- சேப்பங்கிழங்கை புளியுடன் சேர்த்து சமைத்து உண்டு வர பலவீனம் மாறும். ஆண்மை பெருகும். 323.நரம்பு சிலந்தி :- சீரா செங்கழுநீர் இலையை அரைத்துக் கட்ட குணமாகும்."},{"n":324,"t":"நரம்பு தளர்ச்சி நீங்க :- அத்திபழம். தினந்தோறும். 5 சாப்பிட்டு வரதீரும்."},{"n":325,"t":"நரம்பு வலி. :- துளசி விதைகளை தூள் செய்து சாப்பிட்டு வந்தால் குணமாகும்."},{"n":326,"t":"மூளை, நரம்பு சம்பந்தமான நோய் குணமாக :- நாயுருவி வேர், கரிசலாங்கண்ணி ஆகியவை பயன்படுத்தலாம்."},{"n":327,"t":"நரம்பு இழுப்பு :- ஆடாதொடை வேர், கண்டங்கத்திரி வேர் பொடி செய்து தேனில் கலந்து சாப்பிடலாம்."},{"n":328,"t":"நரம்பு தசை வலுப்பெற :- கோபுரம் தாங்கி செடி வேர்பொடி கற்கண்டு சேர்த்து காலை மாலை நெய்யில் சாப்பிட்டு வரலாம்."},{"n":329,"t":"நரம்பு கோளாறு நீங்க :- வெள்ளறுகு சமூலம், மிளகு, சுக்கு, சீரகம் கஷாயம் 50 மி.லி. காலை, மாலை குடிக்கலாம். 330.நரம்பு சிலந்தி குணமாக :- வேப்பம்பூ, வேப்ப விதை அரைத்து கட்டலாம்."},{"n":331,"t":"நரம்பு சுறுசுறுப்படைய :- இலந்தை வேர் கஷாயம் தொடர்ந்து 48 நாட்கள் குடித்து வரலாம். 332.நரம்பு தளர்ச்சி குணமாக :- மாதுளம் பழச்சாறு, தேன் கலந்து தொடர்ந்து 41 நாட்கள் உட்கொள்ள நரம்பு தளர்ச்சி சரியாகும்."},{"n":27,"t":"காலில் சேற்றுப்புண் - பித்த வெடிப்பு குணமாக 333.கைகால் வெடிப்புக்கு :- கண்டங்கத்திரி இலையுடன் தேங்காய் எண்ணெய் ஊற்றி சாறு பிழிந்து தடவினால் வலி இராது. 334.கால் பித்த வெடிப்பிற்கு -- அரசமரத்து பாலை தடவலாம். 335.பித்த வெடிப்பு :- நல்ல சுண்ணாம்பு, விளக்கெண்ணை கலந்து குழப்பி பித்த வெடிப்பு கண்ட இடத்தில் தடவிவந்தால் விரைவில் குணமாகும். 336.சேற்றுப்புண் குணமாகும் :- காய்ச்சிய வேப்ப எண்ணெய் தடவ குணமாகும்."},{"n":337,"t":"பித்த வெடிப்பிற்கு : வேப்பெண்ணெய், மஞ்சள் சேர்த்து போடலாம். 338.பித்த வெடிப்பு குணமாக :- மாமரத்து, பிசினை தடவவும்."},{"n":28,"t":"பல்வலி, பல் கூச்சம், பல் ஆரணி சரியாக 339.பல் உறுதியாக - மாவிலையை பொடி சப்த பற்களைத் துலக்கி வந்தால் உறுதி பெறும். 340.பல் நோய் :- மகிழம்இலை கஷாயம் செய்து வாய் கொப்பளித்து வர எதுவும் அணுகாது."},{"n":341,"t":"பல்வலி நிவாரணம் பெற :- கோவைப்பழம் சாப்பிடலாம்."},{"n":342,"t":"பல்வலி, ஈறுவீக்கம், பல்லில் ரத்தகசிவு, பல் சொத்தை வராமல் இருக்க :- செவ்வாழைப்பழத்தை இரவு சாப்பிட்டு வரலாம். 343.பல் ஆடுதல் :- மகிழ மரக்காயை மென்று - அடக்கி வைத்திருந்து துப்ப சரியாகி உறுதிப்படும்."},{"n":344,"t":"பல்வலி நீங்க :- ஒரு துண்டு சுக்கை வாயில் போட்டு கொள்ளலாம்."},{"n":345,"t":"பற்கள் மற்றும் எலும்புகள் உறுதி பெற :- ஒருநாள் விட்டு ஒருநாள் அதிகாலை வெறும் வயிற்றில் மாதுளம்பழம் சாப்பிட்டு வரலாம்."},{"n":346,"t":"பல்லரணை :- கற்கண்டு அடிக்கடி பயன்படுத்தி வர குணமாகும்."},{"n":347,"t":"பல் உறுதியாக :- குறைந்த பட்சம் பத்து முறையாவது பற்களால் நன்றாக மென்று சாப்பிட வேண்டும்."},{"n":348,"t":"பற்கள் உறுதியாக :- பிரஷ் கொண்டு பல் துலக்குபவர்கள் வாய் கொப்பளிக்கும் போது கட்டாயம் ஈறுகளை அழுத்திக் கொடுத்து வர உறுதியாகும்."},{"n":349,"t":"பல்வில் சீழ் வடிதல் :- பிரமதண்டு இலை எரித்து சாம்பல் வைத்து பல் தேய்த்து வர பல்ஆட்டம், பல்சொத்தை,பல்கரை,பல் சீழ் வடிதல் தீரும்."},{"n":350,"t":"பல்வலி, பல் அரணை தீர :- கண்டங்கத்திரி பழத்தை நெருப்பில் இட்டு வாயில் புகை பிடிக்க குணமாகும்."},{"n":351,"t":"பல் கூச்சம், ஈறுவிக்கம் தீர :- புளியங்கொட்டை தோல், கருவேலம் பட்டை, தூள் உப்பு கலந்து பல் துலக்கலாம்."},{"n":352,"t":"பல் முளைக்கும் போது ஏற்படும் பேதி நிற்க :- பேய்மிரட்டி இலை சாற்றை 5துளி வெந்நீரில் குழந்தைகளுக்கு கொடுக்கலாம். 353.பல் உறுதியாக :- காலை, இரவு இருவேளை கட்டாயம் பல் துலக்க வேண்டும், சாப்பிட்ட பின் பல்துலக்கி விடுவது மிக நன்று."},{"n":354,"t":"ஈறு பலமடைய :-. மாசிக்காயை தூளாக்கி நீரில் காய்ச்சி வாய் கொப்பளிக்கலாம்."},{"n":22,"t":"வயிற்றுப் பூச்சிகள் நீங்குவதற்கு"},{"n":355,"t":"திமிர்பூச்சி தீர :- சுண்டைக்காய் சமைத்து சாப்பிட்டு வரவும்."},{"n":356,"t":"மலப்புழு நீங்க :- விழுதி இலை, மிளகு, பூண்டு, சீரகம், விளக்கெண்ணையில் தாளித்து ரசம் வைத்து சாப்பிடவும்."},{"n":357,"t":"மார்புச்சளி, நுண்புழு விலக :- மணலிக்கீரையை பருப்புடன் சேர்த்து கடைந்து உணவுடன் சாப்பிட்டு வரலாம்."},{"n":358,"t":"குடல் பூச்சி :-. மாங்கொட்டை : பருப்பை காய வைத்து _- பொடியாக்கி ஒரு சிட்டிகை தேனில் குழைத்து 1 நாள் 2வேளைக்கு கொடுக்க பூச்சி அகலும்."},{"n":359,"t":"மலப்புழுக்கள் வெளியேற :- பிரமத்தண்டு வேர் பொடி வெந்நீரில் குடிக்கவும்"},{"n":360,"t":"குடல் புழுக்கள். :- மாதுளம்பழம் படுக்கைக்குச் செல்லும் முன் சாப்பிட புழுக்கள் அழியும்."},{"n":361,"t":"குடல் புழுக்கள் அழிய :- மாதுளம்பழம் சாப்பிட்லாம்."},{"n":362,"t":"வயிற்றுப் பூச்சி அழிய :- வெங்காய பூவை அடிக்கடி உணவுடன் பயன்படுத்தி வரலாம். 363.வயிற்று பூச்சிகள்:- பப்பாளி பாலை விளக்கெண்ணையில் குடிக்க நீங்கும்."},{"n":364,"t":"வயிற்றுப்பூச்சிகள் ஒழிய :- அன்னாசிபழம் தினம் சாப்பிடலாம்."},{"n":365,"t":"வயிற்றுப் புழுக்கள் வெளியேற :- எருக்கம் இலைச்சாறு 3துளியை 10துளி தேன் கலந்து கொடுக்கலாம் (குழந்தைகளுக்கு கூடாது."},{"n":366,"t":"குடல் பூச்சி தீர :- வேலிபருத்தி வேர் பொடி 4சிட்டிகை பாலில் குழந்தைகளுக்கு கொடுக்கலாம்."},{"n":367,"t":"நுண்புழுக்கள் அழிய :- மணலிக்கீரையை உண்டு வரலாம். 368.நாக்கு பூச்சி நீங்க :- குப்பைமேனி வேர் பொடி. கஷாயம் செய்து குடிக்கலாம்."},{"n":369,"t":"மலக்குடல் கிருமிகள் தீர :- சுண்டைவற்றல், கறிவேம்பு, மிளகு, சீரகம், வெந்தயம் வறுத்து. பொடி செய்து உணவில் கலந்து சாப்பிட்டு .வரலாம்."},{"n":370,"t":"மலக்கிருமிகள் நீங்க :- ஆடுதின்னாபாளை விதை பொடி செய்து விளக்கெண்ணையில் கலந்து கொடுக்கலாம்."},{"n":371,"t":"தட்டை புழுக்கள் ஒழிய :- தைவேளை விதையை நெய்விட்டு"},{"n":3,"t":"நாட்கள் சாப்பிட்டு நான்காம் நாள் விளக்கெண்ணெய் குடிக்கலாம்."},{"n":30,"t":"உடலில் தேங்கியுள்ள மருந்துபவர் - விஷம் நீங்க :"},{"n":372,"t":"உடலில் உள்ள நஞ்சு குடலில் சிக்கியிருக்கும் முடி வெளியேற:- வாழைத்தண்டு பொரியல் வைத்து சாப்பிடலாம்."},{"n":373,"t":"மலக்கட்டு, நஞ்சு தீர :- மகிழவித்து பருப்பை பொடி செய்து 5கிராம் பாலில் சாப்பிட்டு வரவும்."},{"n":374,"t":"உடல் நஞ்சு அகல :- கருங்குருவை அரிசி சமைத்து சாப்பிடவும்."},{"n":375,"t":"உடம்பில் சேர்ந்துள்ள மருந்து நஞ்சுக்களை நீக்க :- ஒரு பிடி அருகம்புல்,10 மிளகு,2கிராம் சீரகம் சேர்த்து பசும்பாலில் சாப்பிடவும். 31.. கல்லீரல் - மண்ணீரல் நோய்கள் குணமாக"},{"n":376,"t":"கல்லீரல், மண்ணீரல் வீக்கம் குணமாக :- கொள்ளுகாய், வேளை செடி வேர், மிளகு கஷாயம் சாப்பிட்டு வரவும்."},{"n":377,"t":"கல்லீரல் வீக்கம் குறைய :- மருதம்பட்டை, கரிசலாங்கண்ணி தூள் 1கிராம் தேனில் கலந்து சாப்பிடவும். 378, கல்லீரல், மண்ணீரல், நுரையீரல் வீக்கம் குறைய :- நொச்சி இலைச்சாறு பசுங்கோமியத்துடன் சாப்பிட்டு வர வீக்கம் குறையும்."},{"n":379,"t":"கல்லீரல், மண்ணீரல் உரம் பெற :- சீந்தில் கொடி சாப்பிடலாம்."},{"n":380,"t":"கெட்டுபோய் இருக்கும் ஈரலை குணப்படுத்த : - ஈரல் கெட்டு போனவர்கள் கரிசலாங்கண்ணி கீரையை தொடர்ந்து சாப்பிட்டு வர தீரும்."},{"n":381,"t":"பித்தப்பை நோய் :- வேப்பம்பூவுடன் மிளகு, சீரகம் சேர்த்து உண்டு வர குணமாகும்."},{"n":382,"t":"கல்லீரல் வலி குணமாக :- கரிசலாங்கண்ணி, கீழாநெல்லி சேர்த்து 45நாட்கள் சாப்பிட்டு வர குணமாகும். 383.கல்லீரல் பலப்பட :- தினசரி ஒரு கொய்யாப்பழம் சாப்பிடலாம்."},{"n":384,"t":"இதயம். சிறுநீரகம், மண்ணீரல் :- சாறுவேளை இலையை கீரை போல் சமைத்து உண்ணலாம்."},{"n":385,"t":"கல்லீரல் நோய் தீர :- கரிசாலை இலை, வேப்பிலை, துளசி, கீழாநெல்லி வெறும் வயிற்றில் மென்று தின்று வரலாம்."},{"n":386,"t":"கல்லீரல் நன்கு இயங்க :- வேப்பம் பூவை ஊறவைத்து வடிகட்டி சாப்பிட்டு வர கல்லீரல் நன்கு இயங்கும்."},{"n":387,"t":"கல்லீரல் வீக்கம் குறைய :- சித்திர மூல வேர் பட்டை பொடி | வாழப்பழத்துடன் சாப்பிட்டு வர கல்லீரல் வீக்கம் குறையும்."},{"n":388,"t":"குடல் புண். நீரழிவு நோய் குணமாக :- வில்வஇலை பொடி அரை ஸ்பூன் 50மி.லி. தண்ணீரில் சாப்பிட்டு வரலாம்."},{"n":389,"t":"குடலை சுத்தப்படூத்த :- வில்வபழம் சதை பகுதியை சர்க்கரை சேர்த்து சாப்பிடவும். கசடு தங்காமல் சுத்தம் செய்ய சிறந்தது."},{"n":390,"t":"குடல் வெப்பம் நீங்கி குடற்புண் ஆற :- எழுத்தாணி பூண்டு இலைகளை நன்கு அரைத்து தாராளமாக மலம் போகும்வரை கொடுக்க குணம் பெறலாம்."},{"n":391,"t":"சுவாச குழாய் அலர்ஜி, குடல்புண் குணமாக :- குங்குமப் - பூவுடன் சமஅளவு தேன் கலந்து 3 நாட்கள் தினசரி 2 வேளை உட்கொள்ளலாம்."},{"n":392,"t":"குடல் வாதம் குணமாக :- புரசப்பட்டையை நீரில் காய்ச்சி சிறுவர்களுக்கு கொடுத்து வந்தால் சரியாகும். 393.குடல் வாதம் மேககிரந்தி தீர :- வெள்ளறுகு சமூலம், சுக்கு, மிளகு, சீரகம் கஷாயம் 50 மி.லி. காலை, மாலை குடித்து வரலாம்."},{"n":394,"t":"குடல் புண் குணமாகவும், வயிற்றுப்புழுக்கள் அழியவும் :- அகத்தி கீரை நல்ல உணவு."},{"n":395,"t":"வயிற்றுக் கோளாறு :-. புதினா துவையல் நல்ல மருந்து. 396.அல்சர் குணமாக :- தினமும் ஒரு டம்ளர் திராட்சை பழச்சாறு குடித்து வரலாம்"},{"n":397,"t":"வயிற்றுவவி, வயிற்று பொருமல், அஜீரணம் குணமாக :- ஏலக்காய் பொடி தேனில் ஒரு நாளைக்கு மூன்று வேளை சாப்பிட்டு வரலாம்."},{"n":398,"t":"வாய்ப்புண் மற்றும் வயிற்றுப்புண் - மணத்தக்காளி கீரை அடிக்கடி சாப்பிட்டு வந்தால் குணமாகும்."},{"n":399,"t":"இரைப்பை வலுவடைய :- காரை இலை வேகவைத்து சாப்பிடலாம்."},{"n":400,"t":"குடல் வலிமை பெற :- வில்வமர பூக்களை புளிசேர்க்காமல் ரசம் வைத்து சாப்பிட்டு - வரலாம்."},{"n":401,"t":"குடல் வெப்பம் நீங்கி புண் ஆற :- எழுத்தாணி பூண்டு இலை அரைத்து மலம் போகும் அளவு கொடுக்கலாம்."},{"n":32,"t":"மாரடைப்பு. வராமல் தடுக்க"},{"n":402,"t":"இரத்தக்குழாய்களில் அடைப்பு நீங்க :- தினம் ஒரு கப் தயிர் சாப்பிட வேண்டும்."},{"n":403,"t":"நெஞ்சுவலி. :- திடீர் என ஏற்பட்டால் கஸ்தூரியை ஒரு வெற்றிலையில் வைத்து மென்று சாப்பிட்டால் வலி குறையும்."},{"n":404,"t":"இதயபலவீனம் குணமாக :- தூதுவளை காய் மோரில் ஊற வைத்து வறுத்து சாப்பிட்டு வரலாம்."},{"n":33,"t":"தலைவலிகுணமாக"},{"n":405,"t":"மண்டை குடைச்சல்தீர :- தழுதாழை இலை சாறு மூக்கில் உறிஞ்சி வர தீரும்."},{"n":406,"t":"தலைவலிகுணமாக :- அகத்தி இலைசாறு எடுத்து நெற்றியில் தடவாலம்."},{"n":407,"t":"ஒற்றை தலைவவி குணமாக :- எட்டி மரக்கொழுந்து, மிளகு, பூண்டு இவைகளை நல்லெண்னையில் போட்டு கொதிக்க வைத்து தலைக்கு குளித்து வரலாம்."},{"n":408,"t":"தலைவவி நீங்க :- குங்குமப்பூவை தாய்ப்பால் விட்டு அரைத்து நெற்றியில் பற்று போடலாம்."},{"n":409,"t":"எவ்வித தலைவலியும் தீர :- மிளகாய்வற்றல், மிளகு, நல்லெண்ளணையில் காய்ச்சி வாரம் 1நாள் தலை முழுகி வரலாம்"},{"n":410,"t":"மண்டை குடைச்சல் தீர :- வில்வ இலை பொடி அரைக்கரண்டி தேனில் சாப்பிடலாம்."},{"n":411,"t":"தலைசுற்றல், இரத்த கொதிப்பு தீர:- நெல்லி வற்றல், பச்சை பயறு கஷாயம் காலை, மாலை சாப்பிடலாம்."},{"n":412,"t":"தலைவலி குணமாக :- சுக்கை அரைத்து பற்றிடலாம்"},{"n":413,"t":"தலைவலி, சுரம் தீர: காக்கிரட்டான் வேர் கஷாயம் சாப்பிடலாம்."},{"n":414,"t":"மண்டை கொதிப்பு :- கோபுரம் தாங்கி இலைசாறு நல்லெண்ணையில் காய்ச்சி தலை முழுகி வரலாம்."},{"n":415,"t":"மண்டை குடைச்சல் நீங்க :- தழுதாழை இலை சாறு மூக்கில் உறிஞ்சிவர நீங்கும்."},{"n":34,"t":"தீப்புண் குணமாக"},{"n":416,"t":"தீப்புண்:- வேப்பம்பட்டையை இடித்து கஷாயமாக்கி காய்ச்சி தடவலாம்."},{"n":417,"t":"வடூ :- வேப்பம் பட்டையை இடித்து கஷாயமாக காய்ச்சி அதை தீ புண் வடு மீது தடவி வர வடு மறையும்."},{"n":418,"t":"தீக்காயம்:- வாழைப்பட்டை சாறு பிழியலாம்."},{"n":35,"t":"கண் சம்பந்தமான நோய்களுக்கு"},{"n":419,"t":"கண்கள் ஒளி :- நேந்திரமூலி, அதிமதுரம் தூள் செய்து உட்கொண்டு வந்தால் ஒளி பெறும்."},{"n":420,"t":"கண் எரிச்சல் :- அதிமதுரம், கடுக்காய், திப்பிலி, மிளகு சேர்த்து பொடிசெய்து தேன் கலந்த சுடுநீரில் சாப்பிட குணமாகும்."},{"n":421,"t":"நீர் கோளை :- உடற்சூட்டினால் வரும். இதற்கு கொத்த மல்லி இலையை சுத்தம் செய்து அரைத்து, சிறு உருண்டை சாப்பிட பிரச்சனை தீரும்."},{"n":422,"t":"கண் நோய்:- குங்குமப்பூவை தாய்ப்பாலில் குழைத்து கண் மீது பற்று இட குணமாகும்."},{"n":423,"t":"கண்வலி, கண்சிவப்பு, அரிப்பு :- வில்வம் தளிரை வதக்கி இளம் சூட்டுடன் கண்களின் மீது ஒத்தடம் கொடுக்கலாம்."},{"n":424,"t":"கண்கள் குளிர்ச்சி :- அரைக்கீரை வாரம் 2 முறை உணவில் சேர்த்து வரலாம்."},{"n":425,"t":"கண்வலி, கண்சிவப்பு :- புளியம்பூவை அரைத்து கண்ணைச் சுற்றி பற்றிட குணமாகும்."},{"n":426,"t":"கண்பார்வை தெளிவு :- பொன்னாங்கண்ணி இலையை காலையில் மென்று தின்று பால் பருகி வரலாம்."},{"n":427,"t":"கண் நோய் தீர :- முருங்கைகீரை சாப்பிட்டு வரலாம்."},{"n":428,"t":"கண் கூர்மை :- தான்றிக்காய் தோலை உறித்து பொடி செய்து கால்கரண்டி தேனில் குழைத்து காலையில் மட்டும் சாப்பிட்டு வர குணமாகும்."},{"n":429,"t":"கண்ணில் சதை வளருவதை தடூக்க :- பிரமதன்டு இலைச்சாறு பால் 1துளி கண்ணில் விடுவது பலன் தரும்."},{"n":430,"t":"கண் ஒளி பெருக :- தான்றிக்காய் பொடி கால் ஸ்பூன் தேனில் கலந்து காலையில் சாப்பிட்டு வரலாம்."},{"n":431,"t":"கண் பிரகாசமடைய :- பற்பாடகம் இலையை பாலில் அரைத்து பூசி குளித்து வரலாம். உடல் நாற்றம் நீங்கும்."},{"n":432,"t":"கண்களுக்கு குளிர்ச்சி தீர :- வெண்டைக்காய் உணவுடன் அடிக்கடி சேர்த்து வரலாம். மூளை பலமடையும்."},{"n":433,"t":"கண் வலி வராமல் தடுக்க :- எள் செடியின் பூவை பறித்து பற்களில் படாமல் விழுங்கி விட வேண்டும்."},{"n":434,"t":"கண் எரிச்சல் நீங்க :- தினமும் அரைக்கீரை சாப்பிட்டு வரலாம். உடல் குளிர்ச்சியடையும்."},{"n":435,"t":"கண் புரை குணமாக :- கீழா நெல்லி இலை வேரை மட்டும் நீக்கி தண்டை மட்டும் எடுத்து விளக்கெண்ணையில் கலந்து கண்ணில் விட்டு வரலாம்."},{"n":436,"t":"குழந்தைகளுக்கு கண் சூடூ தணிய :- நெல்லிக்காய் சாறு பிழிந்து, எடுத்து உள்ளுக்குள் கொடுத்து வர குணமாகும்."},{"n":437,"t":"கண் குளிர்ச்சி பெற :- சுரக்காய் பச்சடி செய்து சாப்பிட்டால் குளிர்ச்சியடையும். மஞ்சள் காமாலை நோய் குணமாகும்."},{"n":438,"t":"குழந்தைகளுக்கு ஏற்படூம் கண் நோய்கள் குணமாக :- காய்ந்த மஞ்சளை பொடியாக்கி தேங்காய் எண்ணெயில் காய்ச்சி தலைக்கு தேய்த்து வர குணமாகும்."},{"n":439,"t":"ஆரம்ப கட்டத்திலுள்ள பொறை குணமாக :- தங்களுடைய சிறுநீரால் கண்களைக் கழுவி. வரலாம்."},{"n":440,"t":"கண் பாதுகாப்பு :- ஒரு துணியை மஞ்சள் கலக்கிய நீரில் நனைத்து நிழலில் உலர்த்தி கண்களை துடைத்து வந்தால் கிருமிகள் கண்களை தாக்குவதை தடுக்கலாம்."},{"n":441,"t":"மாலைக்கண் நோய் குணமாக : - மூக்கிரட்டை இலை, பொன்னாங்கன்னி இலை, கீழாநெல்லி பொடி சமஅளவு கலந்து சாப்பிட்டு வர மாலைக்கண் நோய் குணமாகும்."},{"n":442,"t":"கண் பிரகாசிக்க :- பற்பாடகம் இலை பாலில் அரைத்து குளித்து வரலாம்."},{"n":443,"t":"கண்வலி, சிகப்பு தீர :- வில்வ இலை தளிரை வதக்கி இளஞ்சுட்டில் ஒத்தடம் கொடுக்கலாம்."},{"n":444,"t":"பார்வை மங்கல் குணமாக :- மூக்கிரட்டை வேர் பொடி காலை, மாலை 1சிட்டிகை தேனில் சாப்பிட்டு வரலாம்."},{"n":445,"t":"எண்ணெய் தேய்த்து குளிக்கும் போது :- பச்சை தண்ணீர் சேர்க்காமல் ஒரே சூடான தண்ணீரில் தான் குளிக்க வேண்டும்."},{"n":446,"t":"கண்பார்வை தெளிவு, ஆண்மை பெருக்கம் உண்டாக :- பாதாம் பருப்பு வறுத்து அடிக்கடி உண்டு வரலாம்."},{"n":447,"t":"கண்ணில் சதை வளர்வது தடூக்க :- அருகம்புல் சாறு தாய்பாலில் கலந்து கண்ணில்விட சதை வளர்வது நிற்கும்."},{"n":36,"t":"இரத்தம் சுத்தம் செய்ய - ரத்தம் பெருக"},{"n":448,"t":"ரத்தம் சுத்தமின்மை:- இதனால் உடல் அசதி, காய்ச்சல், வயிற்றுப் பொருமல், சுவாசக் கோளாறுகள் உருவாகலாம்."},{"n":449,"t":"புதிய இரத்தம் உருவாக :- பீட்ரூட் கிழங்கு சாப்பிடவும்"},{"n":450,"t":"இரத்த கொதிப்பு :- அகத்திக் கீரையை வாரம் இரண்டு முறை சாப்பிட்டு வர குணமாகும்."},{"n":451,"t":"இரத்தத்தை சுத்தப்படுத்த :- இஞ்சி சாறுடன் தேன் கலந்து சாப்பிடலாம்."},{"n":452,"t":"இரத்தம் விருத்தியாக : - செம்பருத்தி பூவை வெறும் வயிற்றில் சாப்பிட்டு வர வெட்டை சூடு தீர்ந்து விருத்தியாகும்."},{"n":453,"t":"இரத்த குழாய் அடைப்பு நீங்க :- தினம் ஒரு கப் தயிர் சாப்பிட்டு வர அடைப்பு நீங்கும்."},{"n":454,"t":"இரத்தத்தில் உள்ள கிருமிகளை ஒழிக்க: அடிக்கடி விளாம்பழம் சாப்பிட்டு வரலாம்."},{"n":455,"t":"இரத்தம் தூய்மையாகி கரப்பான் நீங்க :- கரும்செம்பை இலை சாறு 10மி.லி. சாப்பிட்டு வரலாம்."},{"n":456,"t":"இரத்தம் சுத்தமடைய :- திராட்சை பழம் சுரத்தை தணித்து மலச்சிக்கலைப்போக்கி இரத்தம் சுத்தமாகும்."},{"n":457,"t":"இரத்தம் சுத்தமாகி உடல் வலுப்பெற :- ஏழைகளின் ஆப்பிள் என்று சொல்லப்படும் தக்காளி பழம் உண்டு வரலாம். வாதநோய் உள்ளவர்கள் தவிர்த்தல் வேண்டும்."},{"n":458,"t":"மலத்துடன் இரத்தம் வருவது நிற்க :- மாதுளம்பூ இடித்து தேன் கலந்து சாப்பிட்டு வரலாம்."},{"n":459,"t":"இரத்தம் உறைதல் குணமாக :- நெல்லிக்காய் தொடர்ந்து சாப்பிட்டு வரலாம்."},{"n":460,"t":"ரத்தத்தை சுத்தம் செய்து சுறுசுறுப்பாக:- இலந்தைப் பழம் சாப்பிடலாம். பசியை தூண்டும்."},{"n":461,"t":"இரத்த ஒட்டம் சீராக, நரை திரை விலக :- ஓரிதழ் தாமரை தாது கல்லேகியத்துடன் சேர்த்து சாப்பிட்டுவர 6மாதத்தில் சீராகும்."},{"n":462,"t":"ரத்த கொதிப்பு குணமாக :- கொதிக்க வைத்து ஆறிய நீரில் சீரக பொடி 12மணி நேரம் ஊறவைத்து குடிக்கலாம்."},{"n":463,"t":"இரத்த அழுத்தம் சீர்பட :- ஒரு டம்ளர் மோரில் எலுமிச்சம் பழச்சாறு பிழிந்து சாப்பிடலாம்."},{"n":464,"t":"இரத்தத்திலுள்ள பித்தம் குறைய :- ஆரமரகுச்சியைத் துண்டுகளாக்கி காய்ச்சி வடிகட்டி தேன் கலந்து குடிக்கலாம்."},{"n":465,"t":"ரத்தப்போக்கு நின்று விரைவில் குணமாக :- வாழைப்பழத் தோலை கண்ணாடி குத்திய இடத்தில் வைத்து கட்டலாம்."},{"n":466,"t":"இரத்தம் விருத்தி ஆக :- நாவல்பழம் தினமும் சாப்பிடலாம்."},{"n":467,"t":"சுளுக்கு நிவர்த்தியாக :- மஞ்சள், உப்பு, சுண்ணாம்பு இம்மூன்றையும் வெந்நீர் விட்டு அரைத்து அந்த விழுதை சூடு செய்து சுளுக்கின் மீது பற்றுபோட சுளுக்கு நிவர்த்தியாகும்."},{"n":468,"t":"இரத்தம் விருத்தியாக :- முருங்கைக்கீரையை துவரம்பருப்புடன் சமைத்து ஒரு கோழிமுட்டை உடைத்துவிட்டு. கிளறி நெய் சேர்த்து 41நாட்கள் சாப்பிட்டு வர இரத்தம் விருத்தியாகும்."},{"n":37,"t":"சுளுக்கு - அடிபட்ட வீக்கம் சரியாக"},{"n":469,"t":"சுளுக்கு நீங்க :- புளி, உப்பு கரைத்து கொதிக்கவைத்து பின் இறக்கி ஆறியவுடன் பற்றுப்போட வீக்கம், ரத்தகட்டு குணமாகும்."},{"n":470,"t":"சுளுக்கு தீர:- தழுதாழை இலையை. விளக்கெண்ணையில் வதக்கி ஒத்தடம் கொடுக்க வேண்டும்."},{"n":471,"t":"அடிபட்ட வீக்கம் :- பிரண்டைசாறு, உப்பு, புளி சேர்த்து காய்ச்சிய தைலத்தை தடவி வந்தால் பூரண குணம் கிடைக்கும்."},{"n":472,"t":"அனைத்து வீக்கமும் குணமாக :- மாவிலங்க இலையை அரைத்து பற்றுப் போடலாம்."},{"n":473,"t":"வீக்கம் குறைய :- பூவரசு இலைகளை அரைத்து வதக்கி கட்டவும்."},{"n":474,"t":"கல் போன்ற வீக்கம் :- தாருணி செடியை அரைத்து பற்று போடலாம்."},{"n":475,"t":"சதைபிழற்சி, அடிபட்ட வீக்கம் தீர :- பிரண்டை சாறில் புளி, உப்பு கலந்து காய்ச்சி பற்று போடவும்."},{"n":476,"t":"கல் போன்ற வீக்கம் கரைய :- நத்தைசூரி இலையை அரைத்து பற்று போடவும்."},{"n":477,"t":"வீக்கம், பாண்டு ராஜபிளவை முகப்பரு :- கொள்ளுக்காய், வேளைசெடி வேரை அரைத்து மோரில் கலக்கி குடித்து வரலாம்."},{"n":478,"t":"நரம்பு இசிவு, சிரங்கு குணமாக :- உத்தாமணி இலையை வேப்ப எண்ணையில் வதக்கி ஒத்தடம் கொடுக்க குணமாகும்."},{"n":38,"t":"நீர் ஏரிச்சல், நீர் கடுப்பு குணமாக"},{"n":479,"t":"நீரடைப்பு சரியாக :- கோவை கஷாயம் குடித்து வரலாம்."},{"n":480,"t":"நீர் கட்டை உடைக்க :- சிறுபூளை வேரை சிதைத்து கஷாயம் செய்து 2வேளை குடிக்கலாம்."},{"n":481,"t":"தக்காளி சூஸ் சாப்பிடும் போது விதைகளை தவிர்த்தல்: சிறுநீரகக் கோளாறு வராது."},{"n":482,"t":"நீர்தாரை எரிச்சல் தீர :- பூசணி சாறு, செம்பருத்தி பூவுடன் சாப்பிட்டு வரவும்."},{"n":483,"t":"மூத்திரக்கடுப்பு தீர :- அன்னாச்சிப்பழச்சாறு சாப்பிடவும்."},{"n":484,"t":"எரிச்சல் குணமாக :- மாதுளம் பழ தோலை வறுத்து கருக்கி பொடியாக்கி விளக்கெண்ணையில் கலந்து தடவலாம்."},{"n":485,"t":"துர்நீர் கழிய :- நீர்முள்ளி விதை, நெருஞ்சில் விதை, வெள்ளரி விதை சிதைத்து கசாயம் பனங்கற்கண்டு சேர்த்து குடிக்கலாம்."},{"n":486,"t":"நீர்கடுப்பு, நீர் சுருக்கு குணமாக :- நன்னாரி வேர் 5 கிராம் அரைத்து பசும்பாலில் சாப்பிட்டு வரலாம்."},{"n":487,"t":"சிறுநீர் பெருக :- கருஞ்செம்பை இலைசாறு 10மி.லி. குடித்து வரலாம்."},{"n":488,"t":"சிறுநீர் தடைநீங்க :- சங்கிலை வேர் பட்டை சாறு 20மி.லி வெள்ளாட்டு பாலில் கலந்து குடித்து வரலாம்."},{"n":489,"t":"நீர்கோவை காய்ச்சல் தீர :- சந்தனதூள் கஷாயம் செய்து குடிக்கலாம்."},{"n":490,"t":"பித்தநீர் நீங்க :- சீதேவி செங்கழுநீர் சமூலம் குடிநீராக்கி சாப்பிடலாம்."},{"n":491,"t":"ஈரல் வீக்கம், நீர்கட்டு தீர :- செம்பரத்தை பூ, எலுமிச்சை பழ சாறு விட்டு அரைத்து பனங்சர்க்கரை பாகில் கொதிக்க வைத்து சாப்பிட்டு வரலாம்."},{"n":492,"t":"நீர்தாரை குற்றங்கள் :- முள்ளங்கி சாறு 30மி.லி. காலை, மாலை சாப்பிடவும்."},{"n":493,"t":"வீக்கம், நீர்கட்டு :- மூக்கிரட்டை வேர், அருகம்புல், மிளகு, கீழாநெல்லி கஷாயம் 2வேளை சாப்பிடலாம்."},{"n":494,"t":"நீர் சுருக்கு சரியாக : பனங்கற்கண்டு, பசும்பால் சாப்பிட்டு வரலாம்."},{"n":495,"t":"தேவையில்லாத கெட்ட நீர் சிறுநீர் வழியாக வெளியேற :- தினமும் பப்பாளிக்காயைச் சாப்பிட்டு வரலாம்."},{"n":496,"t":"நீரழிவு நோய் கட்டுப்பட :- வாழைப்பூ வேகவைத்து அல்லது பொரியல் செய்து சாப்பிட்டு வரலாம். அஜீரணம் அகலும்."},{"n":497,"t":"நீர்க்கடுப்பு குணமாக :- புளியங்கொட்டை தோல் எடுத்து நன்கு உலர்த்தி பொடி செய்து அரை கரண்டி பசும்பாலில் குடித்து வரலாம்."},{"n":498,"t":"சிறுநீர் கோளாறு நீங்க :- மூலாம்பழம் சாப்பிட்டு வரலாம்."},{"n":499,"t":"சிறுநீர் சம்பந்தப்பட்ட நோய்கள் அகல :- கல்யாணப் பூசணிக்காய் சமைத்துச் சாப்பிட்டு வர குணமாகும்."},{"n":500,"t":"நீர் நன்றாக பிரிய :- வெள்ளரிக்காய் அதிகம் சாப்பிட்டு வந்தால் சிறுநீர் அடைப்பு தானாக விலகும். நீர் பிரியும்."},{"n":501,"t":"நீரழிவு அலர்ஜி குணமாக :- சிறியாநங்கை சாப்பிடலாம்."},{"n":502,"t":"சிறுநீரில் உள்ள கற்களை அகற்ற :- மாதுளம்பழத்தின் விதைகளை சாப்பிடலாம்."},{"n":503,"t":"அதிமூத்திரம் தீர :- இளம் தென்னங்காய் மட்டையை இடித்து பிழிந்த நீரை 100. மி.லி. குடித்து வரலாம்."},{"n":504,"t":"அதிமூத்திரம், நீர்த்தடை வாதம் வீக்கம் தீர :- முள்ளங்கி சமைத்து உண்ணலாம்."},{"n":505,"t":"வாதநீர் வெளியேறி குத்தல் வலி போக :- விழுதி இலை, மிளகு,பூண்டு, சீரகம் விளக்கெண்ணையில் தாளித்து ரசம் வைத்து சாப்பிடலாம்."},{"n":506,"t":"மிகுதியாக சிறுநீர் கழித்தல் :- முருங்கை பிசினை பொடி செய்து அரை கரண்டி பாலில் சாப்பிடலாம்."},{"n":507,"t":"அதிமூத்திரம் குறைய :- கசகசா பொடி அரை கரண்டி காலை மாலை உணவுக்கு முன் சாப்பிடலாம்."},{"n":508,"t":"சிறுநீரக வியாதி :- சுரக்காய் சாறு, எலுமிச்சம்பழச்சாறு கலந்து அருந்தலாம்."},{"n":509,"t":"இரவில் உறக்கத்தில் நீர் பிரிதல் பிரச்சனை தீர :- பாலுடன் அஸ்வகந்த லேகியத்தை காலை மாலை என இரு வேளை சிறு எட்டு உருண்டை சாப்பிட்டு வரலாம்."},{"n":510,"t":"சிறுநீருடன் குருதி போக்கு சரியாக :- அம்மான் பச்சரிசி இலை அரைத்து பசும்பாலில் சாப்பிடலாம்."},{"n":511,"t":"சிறுநீருடன் இரத்தம் கலந்து போதல் சரியாக :- ஆவாரம் பட்டையை பொடியாக்கி கஷாயம் செய்து சாப்பிடலாம்."},{"n":512,"t":"மூத்திர கடுப்பு :- அன்னாசி பழச்சாறு சாப்பிடலாம்."},{"n":513,"t":"சொட்டு மூத்திரம் தீர :- பூசணி சாறு செம்பருத்தி பூவுடன் சாப்பிட்டு வரவும்."},{"n":514,"t":"சிறுநீரக கற்கள் கரைய :- சிறுபூளை சமூலம் கஷாயம் 50மி. காலை, மாலை குடிக்கவும்."},{"n":515,"t":"சிறுநீரகம் பலமாக :- ரோஜாப்பூ, கற்கண்டு தேன் கலந்து வெய்யிலில் வைத்து 1 கிராம் சாப்பிடவும்."},{"n":516,"t":"நீரழிவு அலர்ஜி குணமாக :- சிறியாநங்கை சாப்பிட குணமாகும்."},{"n":517,"t":"வெள்ளை நீர் எரிச்சல் தீர :- விளாமரபிசின் 1சிட்டிகை பொடி வெண்ணெய் கலந்து சாப்பிட்டு வர வெள்ளை நீர் எரிச்சல் தீரும்."},{"n":39,"t":"புற்றுநோய் குணமாக"},{"n":518,"t":"புற்றுநோய் குணமாக :- வெண்பூசணி சாறு 100மி.லி.வீதம் தினமும் சாப்பிட்டு வந்தால் குணமாகும்."},{"n":519,"t":"புற்றுநோய் :- தூதுவளை இலை நித்ய கல்யாணி, சித்திர மூல வேர்பட்டை, மரவள்ளி இலை சோம்பு, மிளகு, சுக்கு, கொத்தமல்லி கஷாயம் காலை மாலை 50மி.லி. சாப்பிட்டு வர குணமாகும்."},{"n":40,"t":"செருப்புகடி குணமாக"},{"n":520,"t":"செருப்புகடி காயம் ஆற :- பச்சை மூங்கில் குச்சியை சிறு, துண்டாக வெட்டி நீர் விட்டு மைய அரைத்து தடவ குணமாகும்."},{"n":41,"t":"நரை மூடி சரியாக"},{"n":521,"t":"இளவயது நரை மாற :- கரிசாலை இலை பூக்காத கொட்டை இலை சமஅளவு பொடி தேனில் அரைகரண்டி சாப்பிட்டு வரவும்."},{"n":522,"t":"இளம் நரை மறைய :- நெல்லிக்காய், நெல்லிக்காய் ஊறுகாய், நெல்லி வற்றல் சாப்பிட்டு வரலாம்."},{"n":523,"t":"இளநரை தீர, உடல் பலம் பெற :- கொட்டை கரந்தை உலர்த்தி பொடி செய்து கற்கண்டு சேர்த்து சாப்பிடலாம்."},{"n":524,"t":"நரை திரை மாற :- மூக்கிறட்டை மூலிகை பாலில் அரைத்து சாப்பிட்டு வரலாம்."},{"n":525,"t":"முடி கருப்பாக கற்றாளை சாறு, நெல்லிக்காய் சாறு தேங்காய் எண்ணையில் காய்ச்சி தடவி வரலாம்."},{"n":526,"t":"நரை குணமாக :- முளைகீரை வாரம் 1 நாள் தொடர்ந்து சாப்பிட குணமாகும்."},{"n":527,"t":"முடி நரைக்காமல் நீண்டு வளர : எலுமிச்சை பழசாறு, கரிசலாங்கண்ணி சாறு, பால் நல்லெண்ணையில் கலந்து காய்ச்சி தலைமுடிக்கு 6மாதம் தடவ பலன் கிடைக்கும்."},{"n":528,"t":"நரைமுடி கருமையாக :- கையாந்த கரை சாறு பசுநெய், தயிர் கலந்து சாப்பிட்டு வர நரை முடி கருமையாகும்."},{"n":42,"t":"தலைமுடி நன்கு வளர - கருப்பாக வளர"},{"n":529,"t":"முடி உதிர்வது நிற்க :- நீல ஆவாரை கியாழத்தை தலை முடியில் தேய்க்கலாம்."},{"n":530,"t":"முடி அடர்த்தியாகவும் நீண்டும் வளர : - சடாமஞ்சளை நல்லெண்ணையில் காய்ச்சி வாரம் 1 முறை தலைக்கு தேய்த்து குளித்து வரவும்."},{"n":531,"t":"முடி நன்றாக வளர :- காரட், எலுமிச்சம் பழச்சாறு கலந்து தேங்காய் எண்ணெயில் காய்ச்சி தேய்த்து வரலாம்."},{"n":532,"t":"செம்பட்டை முடி நிறம் மாற - மரிக்கொழுந்து இலையையும், நிலாவரை இலையையும் சமஅளவு எடுத்து மைய அரைத்து தலைக்கு, தடவி வந்தால் சில நாட்களில் நிறம் மாறும்."},{"n":533,"t":"முடி நன்கு வளர : செம்பரத்தை பூவை நல்லெண்ணெயில் காய்ச்சி தடவ முடி நன்கு வளரும்."},{"n":534,"t":"தலைமுடி உதிர்வதை தடுக்க :- கோபுரம் தாங்கி இலைசாறு நல்லெண்ணையில் காய்ச்சி தலை முழுகினால் தலைமுடி உதிராது."},{"n":535,"t":"இளநரை கருப்பாக :- நெல்லிக்காய் அடிக்கடி உணவில் சேர்த்து வந்தால் இளநரை கருமை நிறத்திற்கு மாறும். நெல்லிக்காய், வற்றல், ஊறுகாய் சாப்பிடலாம்."},{"n":536,"t":"முடி கருமையாக, முடி உதிர்வது நிற்க :- காய்ந்த நெல்லிக்காயை பவுடராக்கி தேங்காய் எண்ணெய்யுடன் கலந்து கொதிக்க வைத்து வடிகட்டி தேய்த்து வரலாம்."},{"n":43,"t":"ஜீரண சக்தி பெருக - அஜீரணம் சரியாக"},{"n":537,"t":"அஜீரணம் சரியாக :- துளசி ரசம் 10. மி.லியுடன் சிறிதளவு கரி உப்பு கலந்து சுடு தண்ணீரில் சாப்பிட்டு வரலாம்."},{"n":538,"t":"ஜீரண சக்தி பெருக :- வல்லாரை பொடி, சோம்பு பொடி அரை கரண்டி சேர்த்து சாப்பிட்டுவர ஜீரணம் இலகுவாக ஆகும். அஜீரணம் ஏற்படாது."},{"n":44,"t":"சர்க்கரை நோய் குணமாக"},{"n":539,"t":"சர்க்கரை கட்டுப்பட :- பாகற்காய் சாப்பிட்டு வந்தாலும் சிறுகுறிஞ்சான் இலை பொடி சாப்பிட்டாலும் கட்டுப்படும்."},{"n":540,"t":"சர்க்கரை வியாதிக்கரர்கள் :- மஞ்சளையும், அம்லா பவுடரும் பாலில் பருகிவர மிகுந்த பலன் அளிக்கும்."},{"n":541,"t":"சர்க்கரை வியாதி உள்ளவர்கள் :- கால்களுக்கு இறுக்கமான செருப்பு அணிதல் கூடாது."},{"n":542,"t":"சர்க்கரை நோயளிகளுக்கு :- நாவல்பழம், பாவக்காய், அவரைபிஞ்சு இவைகளை அடிக்கடி உணவுடன் சேர்த்துக்கொள்வது நன்று."},{"n":543,"t":"சர்க்கரை நோய் தீர :- அத்திபால் வெண்ணெய் கலந்து சாப்பிட வேண்டும்."},{"n":544,"t":"சர்க்கரை வியாதி குணமாக :- தினசரி 5 ஆவாரம்பூ மென்று சாப்பிட்டு வரலாம்."},{"n":545,"t":"சர்க்கரை நோய் கட்டுப்பட :- கோவைப்பழம் தினசரி 1 சாப்பிடவும்."},{"n":546,"t":"சர்க்கரை வியாதி தீர :-- கொன்றை பூ அரைத்து மோரில் சாப்பிட்டு வரவும்."},{"n":547,"t":"சர்க்கரை நோயினால் ஏற்படும் எரிச்சல் குணமாக :-மாவிலங்க இலையை அரைத்து உள்ளங்கால், கைகளில் பற்றுப் போடலாம்."},{"n":548,"t":"சீறுநீர் சர்க்கரை :- பாகல் இலை சாறு 50மி.லி. வாரம் 1 நாள் சாப்பிட்டு வர குறையும்."},{"n":549,"t":"உப்பு சத்து சரியாக :- கரிசலாங்கண்ணி பொடி, வேப்பிலை பொடி, துளசி பொடி, கீழாநெல்லி பொடி கலந்து 1ஸ்பூன் காலை, மாலை சாப்பிடவும்."},{"n":45,"t":"மூளை பலம் பெற-மூளை காய்ச்சல்-மூளை கோளாறு சரியாக"},{"n":550,"t":"ஹிஸ்டிரியா நோய் :- முருங்கை கீரையை இடித்து பொடியாக்கி காலை, மாலை பசும்பாலில் சாப்பிட்டு வர குணமாகும்."},{"n":551,"t":"பைத்தியம் தீர :- கறிவேப்பிலை, சீரகம், மஞ்சள் சேர்த்து அரைத்து 1 கிராம் அளவு வெறும் வயிற்றில் 48 நாட்கள் சாப்பிட குணமாகும்."},{"n":552,"t":"பித்தத்தினால் ஏற்படும் பைத்தியம் குணமாக :- கருவேப்பிலை துவையல் அல்லது கருவேப்பிலை பொடி தொடர்ந்து 48 நாட்கள் சாப்பிட்டு வரலாம். பித்தம் தணியும்."},{"n":553,"t":"மனக்கோளாறுகள் வராமல் தடுக்க :- குறைந்தது ஆண்டுக்கு 2தடவை கைகளில் மருதாணி இட வேண்டும். கைகால்களில் மருதாணி இடுவதினால் மனக்கோளாறு வராமல் தடுக்கலாம்."},{"n":554,"t":"பித்து பிடித்து அலைபவர்களுக்கு :- மனநோய் உள்ளவர்களுக்கு தாமரை பூவை நீர்விட்டு காய்ச்சி தினசரி 3வேளை என தொடர்ந்து 41நாட்கள் குடித்து வர குணமாகும்."},{"n":555,"t":"மூளை பலம் பெற :- வல்லாரை இலைபொடி காலை, மாலை நெய்யில் சாப்பிடலாம்."},{"n":556,"t":"சித்தபிரமை தீர :- பிரமிய வழுக்கை இலைசாறு நெய் கலந்து காய்ச்சி காலை, மாலை 1கரண்டி சாப்பிடலாம்."},{"n":557,"t":"மூளை பலவீனக் குறைவு சரியாக :- கல்தாமரை இலை சூரணம் சாப்பிட்டு வரலாம்."},{"n":558,"t":"மூளை பலம் பெற :- பீர்க்கங்காய் வேர் கஷாயம் சாப்பிட்டு வரலாம்."},{"n":559,"t":"மூளையில் புண் இருந்தால் குணமாக. :- தினசரி 2சில் தேங்காய் தொடர்ந்து திண்பதால் புண் ஆறிவிடும்."},{"n":560,"t":"மூளை சுறுசுறுப்பாக :- வல்லாரை சாறில் ஊறவைத்து உலர்த்திய திப்பிலி சாப்பிடலாம்."},{"n":561,"t":"தலையுண் ஆற :- வேப்பம்பூ, இலை சேர்த்து அரைத்து தலையில் தேய்த்து 30நிமிஷம் கழித்து குளிக்க குணமாகும்."},{"n":562,"t":"மூளை நரம்பு சம்பந்தமான நோய் குணமாக :- நாயுறுவி வேர், கரிசலாங்கண்ணி வேர் ஆகியவை நரம்பு சம்பந்தமான நோய் நீங்கும்."},{"n":563,"t":"தலையில் அடிபட்ட காயம் குணமாக :- காஞ்சர மஞ்சள், நல்லெண்ணை அல்லது தேங்காய் எண்ணையில் காய்ச்சி தலைக்கு தடவிவர உள்காயம் குணமாகும்."},{"n":564,"t":"மூளை சிறப்பாக செயல்பட :- இலந்தைபழம் மிக்ஸியில் அரைத்து கருப்பட்டி சேர்த்து பருகி வர மூளை பதட்டத்தை நீக்கும். இயற்கை தூக்கம் தருகிறது."},{"n":565,"t":"பைத்தியம் சரியாக :- தூதுவளை காய் தயிரில் உப்பு போட்டு ஊறவைத்து பின் காயவைத்து வறுத்து சாப்பிட பைத்தியம் சரியாகும்."},{"n":46,"t":"கல்லடைப்பு நீங்க"},{"n":566,"t":"சதையடைப்பு நீங்க : நெருஞ்சில் விதையை பாலி அவித்து உலர்த்தி பொடி செய்து இளநீரில் சாப்பிட்டு வரவும்."},{"n":567,"t":"கல்லடைப்பு நீங்க :- மாவிலங்க பட்டை கஷாயம் காலை, மாலை சாப்பிடவும்."},{"n":568,"t":"சதையடைப்பு நீங்க :- முதிர்ந்த மருதானி வேர்பட்டை கஷாயம் சாப்பிட்டு வரவும்."},{"n":569,"t":"சிறுநீரகக் கற்கள் கரைய :- சிறு பூளை சமூலம் 1லிட்டர் நீரிலிட்டு காய்ச்சி கால் லிட்டர் ஆனவுடன் காலை மாலை சாப்பிட்டு வர கற்கள் கரையும்."},{"n":570,"t":"சிறுநீரக கற்கள் கரைய :- வாழைத்தண்டை சமைத்து உண்ணலாம்."},{"n":47,"t":"ஞாபக சக்தி பெருக - புத்தி கூர்மை உண்டாக"},{"n":571,"t":"புத்திக் கூர்மை :- தன்வயம் ஆக்கிக் கொள்வதால் அதிகமாகும்."},{"n":572,"t":"புத்திக் கூர்மை உண்டாக :- கோரை கிழங்கு பொடி தேனில் சாப்பிட்டு வரலாம்."},{"n":573,"t":"நினைவாற்றல் பெருக :- வல்லாரை மூலிகை சாப்பிட்டு வரலாம்."},{"n":574,"t":"அறிவு தெளிவு உண்டாக :- தூதுவளை இலையை நெய்யில் வதக்கி துவையலாக சாப்பிட வேண்டும்."},{"n":575,"t":"ஞாபசக்தி பெருக :- வல்லாரை 150கிராம், வசம்பு 15 கிராம் பவுடராக்கி தேனில் கலந்து சாப்பிடலாம்."},{"n":576,"t":"ஞாபசக்தியை பெருக்க :- வல்லாரை குடிநீர் குடிக்கலாம்."},{"n":577,"t":"ஞாபகசக்தி :- பெருவிரலும், ஆள்காட்டி விரலும் இணைத்து வைத்திருக்கும் சின் முத்திரையால் (ஒரு மணி நேரம்) மன ஓர்மை, ஞாபகசக்தி பெருகும்."},{"n":578,"t":"ஞாபக சக்தி, எலும்பு உறுதி, பற்கள் உறுதிபட :- மாதுளம் பழம் அடிக்கடி சாப்பிட்டு வரலாம்."},{"n":48,"t":"மூட்டு வலி குணமாக"},{"n":579,"t":"மூட்டுவலி, சதைவீக்கம், நரம்பு பிசகு :- நொச்சி சாற்றை பூசி குணம் பெறலாம்."},{"n":580,"t":"மூட்டுவலி தீர :- நொச்சி இலைசாறு, மிளகு தூள், நெய் சேர்த்து சாப்பிடலாம்."},{"n":581,"t":"மூட்டுவலி, இடுப்பு வீக்கம் தீர :- நொச்சி இலை, உத்தாமணி இலையை வதக்கி ஒத்தடம் கொடுக்கலாம்."},{"n":582,"t":"வாதவலி, மூட்டுவலி தீர :- ஊமத்தை இலையை நல்லெண்ணையில் வதக்கி கட்டலாம்."},{"n":583,"t":"மூட்டு வீக்கம் குறைய :- சுக்கை நன்றாக அரைத்து கொதிக்க வைத்து பூசி வரலாம்."},{"n":584,"t":"மூட்டுபிடிப்பு, மூட்டுவலி குணமாக :- சரக்கொன்றை மரவிதையை கரைத்து பற்றுபோட குணமாகும்."},{"n":585,"t":"மூட்டு, இடுப்பு, வாதவலிக்கு ஒத்தடம் :- முருங்கை இலை, விளக்கெண்ணையில் வதக்கி கொடுக்கலாம்."},{"n":586,"t":"இடுப்பு மற்றும் மூட்டுவவி குணமாக :- கோதுமையை பொன்னிறமாக வறுத்து அரைத்து சலித்து தேன் கலந்து சாப்பிட்டு வரலாம்."},{"n":587,"t":"மூட்டுவிலி :- நொச்சி இலைசாறு மிளகு நெய் சேர்த்து சாப்பிட தீரும்."},{"n":588,"t":"மூட்டுவிலி :- வேப்ப எண்ணை, விளக்கெண்ணை, தேங்காய் எண்ணை கலந்து சூடாக்கி தேய்க்க குணமாகும்."},{"n":49,"t":"ரத்த பெருக்கு நிற்க"},{"n":589,"t":"இரத்தம் ர :- காட்டாமணக்கு பாலை துணியில் நனைத்து இரத்தம் கசியும் புண்மீது கட்ட இரத்தம் நிற்கும்."},{"n":590,"t":"இரத்த பெருக்கு நிற்க :- அருகம்புல் அரிவாள் மூக்கு பச்சனை சேர்த்து அரைத்து வெட்டு காயத்தின் மீது பூசி கட்ட இரத்தம் பெருக்கு நிற்கும்."},{"n":591,"t":"இரத்தம் உறைந்து நிற்க :- காயம் ஏற்பட்டு இரத்தபெருக்கு நிற்க நெல்லிக்காய் பொடி பூச இரத்தம் உறைந்து நிற்கும்."},{"n":50,"t":"முரகப்பழு குணமாக"},{"n":592,"t":"முடிகள் அகல :- வேப்பங்கொழுந்து, குப்பைமேனி இலை, விரலி மஞ்சள் அரைத்து பூசி உலரவிட்டு கழுவவும்."},{"n":593,"t":"பரு :- சுத்தமான புனுகை தடவி வர மறையும்."},{"n":594,"t":"மருவு கரப்பான் பிளவை தீர :- எழுத்தாணி பூண்டு வேர் பாலில் அரைத்து காலை மாலை குடிக்கலாம்."},{"n":595,"t":"பாலுண்ணி நீங்க :- சுண்ணாம்பு, நவச்சாரம் இரண்டையும் குழப்பி தடவினால் குணமாகும்."},{"n":596,"t":"தழும்புகள், முகப்பரு நீங்க :- அவரை இலை சாறு தினமும் காலையில் முகத்தில் தடவி வந்தால் குணமாகும்."},{"n":597,"t":"பவுடர் :- கெமிக்கல் கலந்துள்ள முகப்பவுடர் பயன்படுத்துவதை தவிர்த்து மூலிகை முகப்பவுடர்களைப் பயன்படுத்தலாம்."},{"n":598,"t":"முகத்தில் வரும் சிறுகட்டிகள் குணமாக. :- சந்தனம் முகத்தில் அடிக்கடி பூசி காயவிட்டு முகம் கழுவ குணமாகும்."},{"n":599,"t":"முகப்பரு குணமாக :- சிறுதேள் கொடுக்கு இலையை அரைத்துப் பற்றுப் போடலாம்."},{"n":600,"t":"தழும்புகள், கரும்புள்ளி, முகப்பரு நீங்க :- அவரை இலை சாறு தினமும் முகத்தில் பூசி காயவிட்டு குளித்து வரலாம். முகம் பளபளக்கும்."},{"n":601,"t":"முகப்பரு, படர்தாமரை நீங்க :- சந்தனக்கட்டையை எலுமிச்சம் பழச்சாற்றில் உரைத்து தடவலாம்."},{"n":602,"t":"பாலுண்ணி சரியாக :- வேப்பிலை, பெருங்காயம், திருநீற்று பச்சை அரைத்து பாலுண்ணி மீது பூசி வர பாலுண்ணி குணமாகும்."},{"n":603,"t":"முகப்பரு :- மஞ்சள்தூள், சோற்றுக் கற்றாழை சேர்த்து அரைத்து பூச பரு மறையும்."},{"n":51,"t":"பித்தம் நோய்கள் குணமாக :-"},{"n":604,"t":"பித்தம் தெளிந்து ஆயுள் பெருக :- இஞ்சி துண்டு தேனில் ஊறவைத்து 48நாட்கள் சாப்பிட வேண்டும்."},{"n":605,"t":"பித்தமயக்கம் தீர - இஞ்சி சாறு, வெங்காய சாறு தேன் கலந்து குடிக்கலாம்,"},{"n":606,"t":"தாகம், பித்தம் குறைய :- நல்ல பழுத்த மாம்பழத்தை சாறு பிழிந்து அந்த சாறை அடுப்பில் லேசாக சூடேற்றி பின் ஆறவைத்து சாப்பிட்டால் குறையும்."},{"n":607,"t":"பித்தத்தை தணிக்க - எலுமிச்சை சாதம் வாரத்தில் மூன்று நாள் காலையில் சாப்பிடலாம்."},{"n":608,"t":"பித்தநீர் மலத்துடன் வெளியேற - ரோஜாபூ கஷாயம் பால் சர்க்கரை கூட்டி சாப்பிடலாம்."},{"n":609,"t":"பித்தபாண்டு தீர - பொன்னாவிரை வேர், சுக்கு, மிளகு, சீரகம் கஷாயம் குடிக்கவும்."},{"n":610,"t":"பித்த கிறுகிறுப்புக்கு :- கருவேப்பிலை துவையல் அல்லது விளக்கெண்ணைய் கலந்து காய்ச்சி ஆறவைத்து அந்த தைலத்தை கரும்படையில் தடவலாம்."},{"n":611,"t":"பித்தத்தை குறைக்க - விளாம்பழம் கிடைக்கும் காலங்களில் தினசரி ஒன்று சாப்பிட்டு வரலாம்."},{"n":612,"t":"பித்தக்கோளாறுகள் அகல :- அகத்திகீரை சாப்பிட்டு வரலாம்."},{"n":613,"t":"பித்தம் நீங்கி உடல்பலம் பெருக - பனங்கிழங்கு சாப்பிடலாம்."},{"n":614,"t":"உடல் உஷ்ணத்தை தணிக்க :- கமலா பழம் சாப்பிடலாம்"},{"n":615,"t":"பித்தம் நீங்கி உல்பலம் பெருக - பனங்கிழங்கு சாப்பிடலாம்"},{"n":616,"t":"கல்லடைப்பு - நத்தைசூரி விதையை வறுத்து பொடித்து காய்ச்சி கற்கண்டு சேர்த்து சாப்பிட்டுவர தீரும்."},{"n":617,"t":"பித்த சூடு தணிய - எலுமிச்சை இலையை மோரில் ஊற வைத்து அந்த மோரை உணவில் பயன்படுத்தலாம்."},{"n":618,"t":"பித்தம் குறைய :- அரசமரத்தின் குச்சியை சிறுகுண்டுகளாக வெட்டி சட்டியில் போட்டு காய்ச்சி ஆறவைத்து அந்த நீரில் தேன் கலந்து குடித்தால் ரத்தத்தில் உள்ள பித்தம் குறையும்."},{"n":619,"t":"பித்த நீர் நீங்க :- சீதேவி செங்கழுநீர் கஷாயம் சாப்பிட பித்தநீர் நீங்கும்."},{"n":620,"t":"பித்தநீர் வெளியேற :- ரோஜாபூ கஷாயம் பால் சர்க்கரை கூட்டி சாப்பிட பித்தநீர் மலத்துடன் வெளியேறும்."},{"n":621,"t":"பித்த பாண்டு தீர - பொன்னாவரை வேர், சுக்கு, மிளகு, கஷாயம் குடிக்க பித்தபாண்டு தீரும்."},{"n":52,"t":"மஞ்சன் காமாலை குணமாக"},{"n":622,"t":"காமாலை கல்லீரல் குறைபாடு நீங்க :- பாகற்காய் வற்றல் வறுத்து உண்ணலாம்."},{"n":623,"t":"காமாலை தீர :- மூக்கிரட்டை வேர், அருகம்புல், கீழாநெல்லி, மிளகு கஷாயம் 2வேளை சாப்பிட்டு வரலாம்."},{"n":624,"t":"காமாலை. பாண்டு தீர :- நன்னாரி வேர்பொடி தேனில் கலந்து சாப்பிடலாம்."},{"n":625,"t":"மஞ்சள் காமாலை குணமாக :- தும்பை இலைகளை அரைத்து தலையில் பற்று போட்டு மோரில் கலந்து 3நாட்கள் சாப்பிட குணமாகும்."},{"n":626,"t":"இரத்தம் தூய்மையாக :- அருகம்புல் சாறு, கீழாநெல்லி சேர்த்து அரைத்து குடிக்க மஞ்சள் காமாலை குணமாகும். இரத்தம் தூய்மையாகும்."},{"n":627,"t":"மஞ்சள் காமலை :- வாழை தண்டு பொடி தேன் கலந்து சாப்பிட்டு வர மஞ்சள் காமாலை குணமாகும்."},{"n":628,"t":"மஞ்சள் காமாலை :- மலச்சிக்கல் இல்லாமல் வைத்துக் கொண்டு காரட், பீட்ரூட், அவரைக்காய், வாழைத்தண்டு தினமும் ஏதாவது ஒன்றை சாப்பிட்டு வந்தால் நோய் அணுகாது."},{"n":629,"t":"மஞ்சள் காமாலை குணமாக :- வாழைப்பழ தோல் மீது சுண்ணாம்பு தடவி இரவு முழுவதும் பனியில் வைத்து காலையில் சாப்பிடலாம்."},{"n":630,"t":"மஞ்சள் காமாலை தீர :- வில்வ இலை பொடி கரிசலாங்கன்னி பொடி 1ஸ்பூன் 2வேளை சாப்பிட மஞ்சள் காமாலை தீரும்."},{"n":53,"t":"கட்டிகள் கரைய - குணமாக"},{"n":631,"t":"அரையாப்பு கட்டி குணமாக :- வல்லாரை இலையை விளக்கெண்ணையில் வதக்கி கட்டி வர குணமாகும்."},{"n":632,"t":"ஓடு வாயு கட்டிகள் ஆற :- செம்பை இலையை ஆமணக்கு எண்ணெய்யில் வதக்கி கட்டலாம்."},{"n":633,"t":"கட்டிகள் குணமாக :- சப்பாத்திகள்ளி பூக்கள் இலையை நசுக்கி கட்டியின் மீது கட்டு போட உடைந்து விடும்."},{"n":634,"t":"புண், பிளவை, கட்டி, படை :- தரா இலையை மை போல் அரைத்து இவைகளுக்கு தடவி வர விரைவில் குணம் கிடைக்கும்."},{"n":635,"t":"நரம்பு சிலந்தி குணமாக :- வேப்பம்பூ, வேப்பவிதை அரைத்து கட்டலாம்."},{"n":636,"t":"வீக்கம் கரைய - சத்திசரணை இலை சாறு நல்லெண்ணையில் கலந்து காய்ச்சலாம்."},{"n":637,"t":"கட்டி உடைய :- சிவனார் வேம்பு இலையை அரைத்து பற்று போட உடையும் அல்லது அமுங்கும்."},{"n":638,"t":"கட்டிகள் கரைய :- காட்டாமணக்கு இலை. விளக்கெண்ணையில் வதக்கி கட்டலாம்."},{"n":639,"t":"வீக்கம் :- ஓமத்தை நீர் விட்டு அரைத்துக் களி போல் கிளறி இளஞ்சூட்டில் வீக்கம், வலியுள்ள இடங்களில் பற்றுப்போட குணமாகும்."},{"n":640,"t":"கட்டி கரைய :- திருநீற்றுப்பச்சிலை அரைத்து பூசலாம்."},{"n":641,"t":"நெறிகட்டிகள் தீர :- தழுதாழை இலைசாறு ஆலிவ் எண்ணையில் வதக்கி கட்டலாம்."},{"n":642,"t":"கட்டிகள் வராது தடுக்க :- சிலந்தி நாயகம் இலைசாறு பாலுடன் கலந்து வெறும் வயிற்றில் சாப்பிட்டு வரலாம்."},{"n":643,"t":"சிலந்தி புண் :- நாயுருவி செடியை சுத்தம் செய்து இடித்து பிழிந்து துணியில் வைத்து கட்ட புண் ஆறும்."},{"n":644,"t":"வீக்கம் ஆற :- அமுக்கிரா பொடி பாலில் கலந்து பூசலாம்."},{"n":645,"t":"கட்டிகள் :- அந்திமந்தார இலையின் மீது ஆலிவ் எண்ணெய் தடவி அனலில் சூடு கட்ட குணமாகும்."},{"n":646,"t":"அரையாப்பு கட்டி, சிலந்தி :- தென்னம்பூ வாயிலிட்டு மென்று தின்னவும்."},{"n":647,"t":"அடிப்பட்டு வீக்கம், காயங்களுக்கு :- நத்தை சூரி இலையை வதக்கி கட்டினால் குணமாகும்."},{"n":54,"t":"பாத எரிச்சல் - கை கால் எரிச்சல் குணமாக"},{"n":648,"t":"விரல்களில் உள்ள வலி குணமாக :- விரல்கள் அனைத்தையும் தினமும் ஐந்து நிமிடம் நீட்டி மடக்கும் பயிற்சியை செய்யவும்."},{"n":649,"t":"சர்க்கரை நோயினால் ஏற்படும் எரிச்சல் குணமாக :- மாவிலங்க இலையை அரைத்து உள்ளங்கால் உள்ளங்கைகளில் பற்றுப் போடலாம்."},{"n":650,"t":"உள்ளங்கை, கால் வியர்வை நிற்க :- இலந்தை மர இலைகளை எடுத்து நசுக்கி சாறு எடுத்து உள்ளங்கை, கால்களில் தடவலாம்."},{"n":651,"t":"கால் அரிப்பு நீங்க :- பெரியவர்களுக்கு காலில் அரிப்பினால் புண்ணாகிவிடும். இலுப்பை பூவை கஷாயம் செய்து புண்ணில் தடவ குணமாகும்."},{"n":652,"t":"ஊள்ளங்கால் எரிச்சல் குணமாக :- பாகல் இலை சாறை தடவலாம்."},{"n":653,"t":"கால் அரிப்பு நீங்க :- இலுப்பை பூ கஷாயத்தை புண்களின் மீது தடவிவர குணமாகும்."},{"n":654,"t":"கால் எரிச்சல் குணமாக :- சுரைக்காய் சதையை வைத்து கட்டலாம்."},{"n":655,"t":"கைகால் எரிச்சல் :- வாழைப்பூவை பருப்புடன் சமைத்து சாப்பிடலாம்."},{"n":55,"t":"படுக்கை புண் அற"},{"n":656,"t":"உல் குறைவு ஏற்பட்டு படுக்கையில் உள்ளவர்களுக்கு:- உடல் நலம் குன்றியவர்கள் தோல் நிறம் மாறியிருக்கும். மீண்டும் நிறம் பெற அத்திபழம் சாப்பிட வேண்டும். இழந்த இயற்கை நிறத்தை பெறலாம்."},{"n":657,"t":"படுக்கைபுண் - கானாவாழை இலை மைய அரைத்து பூசலாம்."},{"n":658,"t":"படுக்கை புண் குணமாக - குப்பைமேனி இலையை விளக்கெண்ணெய் விட்டு வதக்கி புண் மீது வைத்துக் கட்டி வர வேண்டும்."},{"n":56,"t":"நகச்சுற்று குணமாக - நகம் முளைக்க"},{"n":659,"t":"நகசுற்று குணமாக :- கொழுந்து வெற்றிலை, சுண்ணாம்பு சேர்த்து அரைத்து கட்ட நகச்சுற்று குணமாகும்."},{"n":660,"t":"சொத்தை நகம் சரியாக :- நொச்சி இலை 50கிராம், மருதாணி இலை 50கிராம், எருக்கம்பூ 2சேர்த்து அரைத்து கட்டினால் சரியாகி விடும்."},{"n":661,"t":"நகச்சுற்று வேதனைக்கு :- சிலந்தி நாயகம் இலையை அரைத்து கட்டிவர இரத்தம், சீழ் வெளியேறி குணமாகும்."},{"n":662,"t":"நல்ல நகம் முளைக்க :- மருதோன்றி இலை அரைத்து சொத்தை நகங்களுக்கு கட்டி வர நல்ல நகம் முளைக்கும்."},{"n":663,"t":"நகச்சொத்தை :- படிகாரத்தைப் பொரித்து நீர்விட்டுக் கெட்டியாகக் குழைத்து நகச்சொத்தையின் மீது வைத்துக் கட்ட குணமாகும்."},{"n":664,"t":"நகச்சுத்தி குணமாக :- கற்றாழை சோற்றையும், மஞ்சள் தூளையும் அரைத்து விளக்கெண்ணெய் விட்டு சூடுபடுத்தி நகத்தின் மீது பூசலாம்."},{"n":57,"t":"மூக்கடைப்பு - மூக்கில் நீர் - மூச்சு வாங்குதல் குணமாக"},{"n":665,"t":"இழுப்பு தீர :- காக்கிரட்டான் விதை நெய்யில் வறுத்து பொடி செய்து 5அரிசி எடை குழந்தைகளுக்கு கொடுக்கலாம்."},{"n":666,"t":"நீர்கோவை தீர :- கறிவேப்பிலை பொடி சர்க்கரை சேர்த்து காலை, மாலை 1கரண்டி சாப்பிட்டு வரலாம்."},{"n":667,"t":"மேல்சுவாசம், இருமல் தீர :- திருநீற்று பச்சிலை சாறு தேன் கலந்து குடித்து வரவும்."},{"n":668,"t":"இரைப்பிருமல் தீர :- நீர்முள்ளி விதை பொடி 1கிராம் பாலில் கலந்து சாப்பிட்டு வரவும்."},{"n":669,"t":"தும்மல் நிற்க :- தூதுவளை பொடியுடன் மிளகு பொடி கலந்து தேனில் அல்லது பாலில் சாப்பிட குணமாகும்."},{"n":670,"t":"மூச்சு வாங்கும் தொந்தரவு தீர :- தூதுவளை மாமருந்தாகும்."},{"n":671,"t":"சுவாசக் கோளாறுகள் நீங்க :- தினந்தோறும் பிராணயாமம் செய்து வரலாம்."},{"n":672,"t":"இளைப்பு தீர :- விளாமர கொழுந்து அரைத்து பாலில் - 1கிராம் சாப்பிடலாம்."},{"n":673,"t":"மூச்சிறைப்பு, வீக்கம், சிறுநீரகம் சம்பந்தப்பட்ட பிரச்சனை சுளுக்கு தீர்வு :- ஆரஞ்சு நிற ஒளி தீர்வு கொடுக்கும்."},{"n":674,"t":"இரைப்பு குணமாக :- தூதுவளை இலை, வேர், பூ, காய் கொதிக்க வைத்து கஷாயம் செய்து பாலில் சாப்பிட்டு வரவும்."},{"n":675,"t":"மாந்த இழுப்பு குணமாக :- மூக்கிரட்டை வேர் மிளகு, உத்தாமணி சாறு, விளக்கெண்ணையில் காய்ச்சி குழந்தைகளுக்கு 2 மி.லி. கொடுக்கலாம்."},{"n":676,"t":"மூச்சு வாங்கும் தொந்தரவு தீர :- தூதுவளை நல்ல மருந்து."},{"n":677,"t":"மூச்சு வாங்குதல், காது அடைத்தல், காதுமந்தம் விலக :- தூதுவளை உண்பதால் குணமாகும்."},{"n":678,"t":"மூக்கில் உள்ள புண் ஆற :- மஞ்சளை சுட்டு கரியாக்கி அதனுடன் வேப்பஎண்ணெய் கலந்து மைய அரைத்து தடவலாம்."},{"n":679,"t":"மூக்கு சம்பந்தமான நோய் குணமாக :- நாயுருவி செடி விதைகளை பொடி செய்து உட்கொள்ளலாம்."},{"n":680,"t":"மூச்சு திணறல் :- ஆடாதொடை இலைசாறு தேன்கலந்து சாப்பிடலாம்."},{"n":681,"t":"மூக்கில் நீர்வடிதல் குணமாக :- தழுதாழை இலைசாறு மூக்கில் உறிஞ்ச குணமாகும்."},{"n":682,"t":"சுவாச ஊறுப்பு துப்புறவாக :- முசுமுசுக்கை வேர், ஆடாதொடை வேர் பொடி, திப்பிலி, சுக்கு, மிளகு பொடியாக்கி வெற்றிலையுடன் உட்கொண்டு பால் அருந்தலாம்."},{"n":683,"t":"சுவாசநோய் அலர்ஜி :- குங்குமப்பூவுடன் சமஅளவு தேன் கலந்து 3நாட்கள் தினசரி 2வேளை உட்கொள்ளலாம்."},{"n":684,"t":"நீர்கோவை தீர :- இஞ்சி சாறு, பால், நல்லெண்ணைய் சமஅளவு கலந்து காய்ச்சி வாரம் 1முறை தேய்த்து குளித்து வரலாம்."},{"n":685,"t":"தொடர் தும்மல் நீங்க :- அகத்தி கீசை சாறு, அகத்தி பூ சாறு இரண்டையும் தேனில் கலந்து சாப்பிட்டு வரலாம்."},{"n":686,"t":"மூக்கடைப்பு நீங்க :- புதிய ரோஜா. மலரை முகரலாம்."},{"n":687,"t":"மூக்கடைப்பு, சளி குணமாக - கடுக்காய் பொடி, நெல்லிக்காய் பொடி கலந்து தேனில் சாப்பிடலாம்."},{"n":688,"t":"சளி, இருமல் வரவிடாமல் தடுக்க :- மழைக்காலங்களில் முசுமுசுக்கை இலையைச் சாப்பிட்டு வரலாம்."},{"n":689,"t":"மூச்சு திணறல் குணமாக :- வன்னி மரப்பட்டையை தூளாக்கி காய்ச்சி வடிகட்டி 3 வேளை குடித்து வரலாம். (அளவுடன் மட்டும்)."},{"n":690,"t":"தைராய்டு பிரச்சனைகளுக்கு :- கடல் பாசிகளை அடிக்கடி உணவில் சேர்த்து வர சரியாகி விடும்."},{"n":691,"t":"இரத்தம் வருவது நிற்க :- மாதுளம் பழச்சாறு, அருகம்புல் சாறு சமஅளவு கலந்து 30 மி.லி. மூன்று வேளை சாப்பிடலாம்."},{"n":692,"t":"மூக்கில் நீர்வடிதல் குணமாக :- வேப்பஇலை, ஓமம் சேர்த்து அரைத்து நெற்றி மற்றும் பிடரியில் பூசிக் கொள்ளலாம்."},{"n":693,"t":"சுவாச உறுப்புகளில் சளி தக்கம் நீங்க - வல்லாரை பொடி, தூதுவளை பொடி பாலில் குடித்து வர நீங்கும்."},{"n":694,"t":"இரைப்பிருமல் தீர :- மருதம்பட்டை, சித்திரத்தை, திப்பிலி, சுக்கு, கஷாயம் 48நாட்கள் குடித்து வர தீரும்."},{"n":58,"t":"இளமை சுறுசுறுப்புடன் வாழ்வதற்கு"},{"n":695,"t":"உடல் உஷ்ணத்தை தணிக்க :- தினமும் ஆட்டுப்பால் சாப்பிட்டு வர உடல் குளிர்ச்சி பெறும்."},{"n":696,"t":"முதுமை அடைவதை தடுத்து, உடல் பலம் பெற :- தினம் அதிகாலை ஒரு நெல்லிக்கனி நெல்லிக்கனி சாப்பிட்டால் உடல் பலம் பெறும்."},{"n":697,"t":"உல் பலவீனம் நீங்க :- பப்பாளிப்பழம் சிறந்த மருந்து."},{"n":698,"t":"உடம்பு சுறுசுறுப்பாக இருக்க :- சுக்கு பொடி மதியம் உண்டு வரலாம்."},{"n":699,"t":"சுறுசுறுப்பு :- வல்லாரை இலைபொடி காலை மாலை நெய்யில் சாப்பிட்டு வரலாம்."},{"n":59,"t":"தாய்ப்பால் பெருக"},{"n":700,"t":"பால் அதிகம் சுக்க - பால் பெருக்கி இலையை அரைத்து உணவுடன் சாப்பிட்டு வரலாம். ["},{"n":701,"t":"தாய்ப்பால் பெருக - முருங்கைகீரை பொரியல் செய்து சாப்பிட்டு வர தாய்ப்பால் பெருகும்."},{"n":702,"t":"தாய்ப்பால் சுரக்க - இளம்பிஞ்சு நூல்கோலை சமைத்து சாப்பிட பால் நன்றாக சுரக்கும்."},{"n":703,"t":"பால் சுரக்க :- காட்டாமணக்கு இலையை வதக்கி மார்பில் கட்டிவர பால் சுரக்கும்."},{"n":704,"t":"குழந்தை பிறப்பதற்கு முன்னும், பிறந்த பின்னும் :- பேரீச்சம் பழம் சாப்பிட்டு வந்தால் தாய்ப்பால் அதிகமாக சுரக்கும், குழந்தையும் நன்கு வளரும்."},{"n":705,"t":"பால் அதிகம் சுரக்க :- பாகற்காயின் இலையை அரைத்து பெண்களின் மார்பகங்களில் பற்றுப் போடலாம்."},{"n":706,"t":"தாய்ப்பால் கட்டிக் கொண்டு வலித்தல் தீர - ஊமத்தை இலை நல்லெண்ணையில் வதக்கி ஒத்தடம் கொடுக்கலாம்."},{"n":707,"t":"தாய்ப்பால் பெருக - சீரகத்தை வறுத்து பொடியாக்கி சமஅளவு வெல்லம் சேர்த்து சாப்பிட்டு வர தாய்பால் பெருகும்."},{"n":60,"t":"வாந்தி நிறுத்த"},{"n":708,"t":"இரத்த வாந்தி, உட்சுரம் நீங்க :- தென்னம்பூ வாயிலிட்டு மென்று தின்னலாம், ."},{"n":709,"t":"கர்ப்ப காலத்தில் வாந்தி மட்டுபட :- லவங்க பொடியை நீரில் கலந்து அரைமணி நேரம் ஊறவைத்து வடிகட்டி அருந்தினால் வாந்தி மட்டுபடும்."},{"n":710,"t":"பித்த வாந்திக்கு :- களாக்காயை சாப்பிடலாம்."},{"n":711,"t":"வாந்தி:- இஞ்சிச்சாறுடன் சமஅளவு வெங்காயச்சாறு கலந்து பருகி வரலாம்."},{"n":712,"t":"வாந்தி நிற்க :- துளசிசாறு, கல்கண்டு சேர்த்து சாப்பிடலாம்."},{"n":713,"t":"குமட்டல் :- கசப்பான் மருந்து உட்கொண்டவுடன் வெற்றிலை காம்பை வாயிலிட்டு சுவைத்தால் குணமாகும்."},{"n":714,"t":"குமட்டல் நீங்க - எலுமிச்சை சாறில் ஊறிய சீரகத்தை உலர்த்தி பொடித்து வைத்துக் கொள்ளலாம்."},{"n":715,"t":"பித்த வாந்தி குணமாக :- நார்த்தங்காய் இலையை உணவோடு சேர்த்து சாப்பிட்டு வரலாம்."},{"n":716,"t":"குமட்டல் சரியாக :- இஞ்சி சாறு, வெங்காய சாறு தேன் கலந்து கொடுக்கலாம்."},{"n":717,"t":"வாந்தி, பித்தக் கோளாறுகள் நீங்க :- நார்த்தங்காய் இலையை உணவோடு சேர்த்து சாப்பிட்டு வரலாம்."},{"n":718,"t":"குமட்டல் நீங்க :- வெற்றிலைக் காம்பை வாயில் அதக்கினால் நீங்கும்."},{"n":67,"t":"தாய்ப்பால் சுரப்பு நிற்க"},{"n":719,"t":"பால் சுரப்பு நிற்க - தேங்காய் பூவை வதக்கி மார்பில் கட்டவும்."},{"n":720,"t":"தாய்ப்பால் சுரப்பு நிற்க - மல்லிகை பூவை மார்பகத்தில் வைத்து கட்ட பால் சுரப்பது 3நாளில் நிறுத்தி விடும்."},{"n":721,"t":"தாய்ப்பால் வற்ற :- துவரம்பருப்பை ஊறவைத்து பன்னீர் விட்டு அரைத்து 3நாட்கள் பற்றுப் போடலாம்."},{"n":62,"t":"வாயு கோளாறு குணமாக"},{"n":722,"t":"அண்டவாயுக்கள் தீர :- ஊமத்த இலையை நல்லெண்ணையில் வதக்கி கட்ட வேண்டும்."},{"n":723,"t":"வாயு தொல்லை நீங்க :- வாதநாராயணன் இலையை காய வைத்து இடித்து தூளாக்கி ஐந்து கிராம் தூலை சுடுநீரில் வெறும் வயிற்றில் காலையில் சாப்பிட்டு வரலாம்."},{"n":724,"t":"வாயு தொல்லை நீங்க :- வெள்ளைப்பூடை பசும்பாலில் வேக வைத்து சாப்பிடலாம்."},{"n":725,"t":"வாயு நோய்கள் :- மூக்கிரட்டை இலை துவையல் வாரம் 2முறை சாப்பிட்டு வரலாம்."},{"n":726,"t":"வாயு அகல :- முடக்கத்தான் இனில் அவித்து சாறு எடுத்து ரசமாக்கி வாரம் 1நாள் உணவோடு சாப்பிடவும்."},{"n":727,"t":"குடல் வாயு தீரு :- கொய்யா, கொழுந்து இலையைமென்று தின்னலாம்."},{"n":728,"t":"வயிற்று உப்புசம் நீங்க :- சாதம் வடிக்கும் நீரில் சிறிது மஞ்சள் தூளையும், சிறிது பனங்கல்கண்டும் சேர்த்து சூட்டோடு சாப்பிட்டு வர வயிற்று உப்புசம் நீங்கும்."},{"n":729,"t":"வாயு தொந்தரவு :- ஆரஞ்சுபழ தோல்களை தண்ணீரில் கொதிக்க வைத்து கஷாயம் குடித்தால் குறையும்."},{"n":730,"t":"வயிற்று வாயு :- திருநீற்றுப்பச்சிலை சாறு தேன் கலந்து கொடுக்க தீரும்."},{"n":731,"t":"வாயு பிடிப்பு குணமாக :- வாதமொடங்கி மரத்தின் கொழுந்துகளை சுத்தம் செய்து சாப்பிட்டு வரலாம்."},{"n":732,"t":"குடல் வாயு தீர :- கொய்யா கொழுந்து இலை மென்று தின்ன தீரும்."},{"n":733,"t":"வாயு நோய்கள் வராமல் தடுக்க :- மூக்கிரட்டை இலை துவையல் வாரம் 2முறை சாப்பிட்டு வர குணமாகும்."},{"n":734,"t":"வாயு தொல்லை நீங்க : - காலையில் அருகம்புல் சாறு இரவில் குப்பைமேனி இலை சாறு குடிக்க வாயு தொல்லை நீங்கும்."},{"n":735,"t":"அண்டவாயு தீர :- முற்றிய தேங்காய் திருகி விளக்கெண்ணையில் வதக்கி இளஞ்சூட்டில் இரவில் கட்டலாம்."},{"n":63,"t":"விக்கல் தீர"},{"n":736,"t":"விக்கல் குணமாக :- நெல்லிக்காய் இடித்து சாறு பிழிந்து, தேன் சேர்த்து சாப்பிட்டால் தீரும்."},{"n":737,"t":"விக்கல் குணமாக :- விரலிமஞ்சள் ஒரு துண்டை சுட்டு கரியாக்கி உண்ணலாம்."},{"n":738,"t":"விக்கல் தீர :- முற்றிய மாவிலையை பொடியாக்கி தணலில் போட்டு சுவாசிக்கவும்."},{"n":739,"t":"விக்கல் தீர: :- திப்பில், சீரகம் பொடி தேனுடன் கலந்து சாப்பிட விக்கல் தீரும்."},{"n":64,"t":"உள்நாக்கு வளர்ச்சி - வாய் ரணம் குணமாக"},{"n":740,"t":"சதை வளர்ச்சி குணமாக :- திப்பிலி, தேவதாரு, மஞ்சள், இந்துப்பு, நாயுருவி விதை இவைகளை நல்லெண்ணெயில் காய்ச்சி வடிகட்டி மூக்கில் விட்டு வரலாம்."},{"n":741,"t":"வாய், நாக்கு, தொண்டை ரணம் தீர :- பப்பாளி பாலை தடவி வரலாம்."},{"n":742,"t":"நாக்குப்புண் குணமாக :- நெல்லிவேர் பட்டையை பொடி செய்து தேனில் கலந்து தடவலாம்."},{"n":743,"t":"உள் நாக்கு சதை :- உப்பு, பழம் புளி அரைத்து தடவலாம்."},{"n":744,"t":"உதட்டில் வெடிப்பு குணமாக :- அத்திக்காயை அடிக்கடி உண்ண வேண்டும். வாய்ப்புண்ணும் குணமாகும்."},{"n":745,"t":"வாய் ரணம், உதடு, நாக்கு ரணத்திற்கு :- ஆலம்பாலை தடவலாம்."},{"n":746,"t":"சாதாரண புண்கள், காயங்களுக்கு :- கடுக்காய் பொடி சிறிதளவு எடுத்து தேங்காய் எண்ணெய்யுடன் சேர்த்து போடலாம்."},{"n":747,"t":"உதட்டு வெடிப்பு - கரும்பு தோகையை எரித்து சாம்பலாக்கி வெண்ணெய்யுடன் கலந்து உதட்டு வெடிப்புக்குப் போட்டால் குணமாகும்."},{"n":748,"t":"உள்நாக்கு சதை வளர்வதைத் தடுக்க :- பழம்புளி அரைத்து உள்நாக்கில் தடவிவர உள்நாக்கு சதை வளராது."},{"n":64,"t":"வாய் நாற்றம் சரியாக"},{"n":749,"t":"துர்நாற்றம் தீர :- நெல்லி முள்ளி, தான்றிக்காய், கடுக்காய், இம்மூன்றையும் குடிநீரில் ஊறவைத்து வாய் கொப்பளித்து வரலாம்."},{"n":750,"t":"வாய் துர்நாற்றத்தை போக்க :- தினமும் கோதுமை புல்லை மென்று துப்பிவிட நாற்றம் நீங்கும்."},{"n":751,"t":"வாய் நாற்றம் தீர :- கொட்டை பாக்குடன் கிராம்பு சேர்த்து பொடித்த பொடியை சாப்பாட்டிற்கு பின் வாயில் அதக்கி வைத்து துப்பலாம்."},{"n":752,"t":"வெப்ப நோய் :- பாதாளமூலி பழசாறில் செய்த மணப்பாகு சாப்பிட்டு வர தீரும்."},{"n":66,"t":"தொண்டை கரகரப்பு - நாக்குபுண் குணமாக"},{"n":753,"t":"தொண்டை புண், ஈறுகளில் ரத்தம் வடிதல் சரியாக :-இலந்தை தளிரை கொதிக்க வைத்து உப்பு இட்டு வாய் கொப்பளித்து வரலாம்."},{"n":754,"t":"குரல் கம்மல் தீர :- மாந்தளிர் பொடி 1கிராம் கஷாயம் செய்து குடிக்கலாம்."},{"n":755,"t":"நாக்குபுண் குணமாக :- கோடக இலையை கஷாயமாக்கி வாய் கொப்பளிக்க நாக்கு ரணம், வாய், உதடு ரணம் 1வாரத்தில் குணமாகும்."},{"n":756,"t":"குரல் மாற்றத்தை சரி செய்ய :- கடுக்காய் தோல் சிறுதுண்டு எடுத்து வாயில் போட்டு அதக்கிக் கொள்ளவும். ஊறிய உமிழ் நீரை முழுங்கி விடவும்."},{"n":757,"t":"இருமல், தொண்டைவலி குணமாக :- மிளகு, திப்பிலி, சுக்கு சமஅளவு பொடி 2கிராம் தேனில் கலந்து 3வேளை சாப்பிடலாம்."},{"n":758,"t":"தொண்டை புண் குணமாக :- வேப்பம்பூவை கொதிநீரில் போட்டு அதன் ஆவியை தொண்டையில் படும்படி செய்தால் புண் ஆறும்."},{"n":759,"t":"சுவாசகுழாய் அலர்ஜி குணமாக :- குங்குமபூவுடன் சமஅளவு தேன் கலந்து 3நாட்கள் தினசரி 2 வேளை உட்கொள்ள குணமாகும்."},{"n":760,"t":"தொண்டை கரகரப்பு குணமாக :- சுக்கு, பால், மிளகு, திப்பிலி, ஏலரிசி
