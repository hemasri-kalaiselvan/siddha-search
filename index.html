 வறுத்து பொடி செய்து தேனில் கலந்து சாப்பிடலாம்."},{"n":761,"t":"தொண்டைக்கட்டு, கமறல் குணமாக :- மாஇலை, பச்சையிலையை நெருப்பில் போட்டு புகையை வாய் திறந்து பிடிக்கவும்."},{"n":762,"t":"தொண்டை ரணம் தீர :- மாதுளம்பூ உலர்த்தி பட்டை காய்ச்சி வாய் கொப்பளிக்கலாம்."},{"n":763,"t":"தொண்டைப்புண் - கிராம்பை தணலில் வதக்கி வாயிலிட்டு சுவைக்கலாம்."},{"n":764,"t":"தொண்டைவலி குணமாக - விளக்கெண்ணையும் சுண்ணாம்பும் கலந்து சூடு செய்து பொறுக்கும் பதத்தில் தடவவும்."},{"n":765,"t":"வரட்டு இருமல் குணமாக :- எலுமிச்சை சாறு தேன் கலந்து பருகலாம்."},{"n":766,"t":"இருமல் உடனே நிற்க :- முற்றிய வெண்டைக்காயைச் சூப் செய்து குடித்து வந்தால் குணமாகும்."},{"n":767,"t":"தொண்டை கமறல் தீர :- மா இலை, பச்சை இலை நெருப்பில் போட்டு வரும் புகையை வாய் திறந்து பிடிக்க தொண்டைக்கட்டு குணமாகும்."},{"n":768,"t":"தொண்டை வலி குணமாக :- உப்புநீரை வாயில் வைத்து: தொண்டை வரை படும்படி வாய் கொப்பளித்து வரலாம்."},{"n":769,"t":"தொண்டை கரகரப்பு, இருமல், மூலம், நரம்பு தளர்ச்சி தீர :- அதிமதுரப் பொடியை 2கிராம் தேனில் குழைத்துச் சாப்பிட்டு வர தீரும்."},{"n":770,"t":"தோண்டைவீக்கம் நீங்க - கொத்தமல்லி இலை சரக்கொன்றை இலை புளி சேர்த்து காய்ச்சி வாய் கொப்பளிக்க தொண்டை வீக்கம் நீங்கும்."},{"n":771,"t":"குரல் வளம் பெருக :- வாதுமை பருப்பு, ஏலம், சுக்கு, கற்கண்டு, அதிமதுரம், குங்குமப்பூ, உலர் திராட்சை, ஜாதிக்காய், ஜாதிபத்ரி கிராம்பு சேர்த்து தொடர்ந்து சாப்பிட்டு வர குரல் இனிமையாகும்."},{"n":67,"t":"தலைபாரம் குணமாக"},{"n":772,"t":"தலைபாரம் - வேப்பம் பிண்ணாக்கை சுட்டு மூக்கில் உறிஞ்சலாம்."},{"n":773,"t":"தலைபாரம் நீரேற்றம் தீர - தும்பை பூவை நல்லெண்ணையில் காய்ச்சி தலை முழுகலாம்."},{"n":774,"t":"தலைபாரம் குணமாக விரலி மஞ்சளில் விளக்கெண்ணைய் கலந்த திரிவிளக்கில் காட்டினால் புகை வரும். இந்த புகையை இழுக்க வேண்டும்."},{"n":775,"t":"தலைபிடிப்பு தீர - கொடிவேலி வேர்பட்டை அரைத்து பாலில் 21நாட்கள் குடிக்கலாம்."},{"n":776,"t":"நீர்கொவை தீர - நல்ல வேளை சமூலத்தை இடித்து பிழிந்து சக்கையை தலையில் வைத்து கட்ட நீர்கோவை தீரும்."},{"n":777,"t":"மூக்கடைப்பு, தலைபாரம் தீர - சுண்டைவேர், தும்பைவேர் இலுப்பை பிண்ணாக்கு பொடியாக்கி சேர்த்து துணியில் கட்ட நுகர மூக்கடைப்பு தலைபாரம் தீரும்."},{"n":778,"t":"தலைபாரம் நீர்வடிதல் குணமாக :- சிறுதேட் கொடுக்கு இலைசாறு நல்லெண்ணை சமஅளவு கலந்து காய்ச்சி உடல் தலைக்கு தேய்த்து குளிக்க குணமாகும்."},{"n":68,"t":"உடம்பு நமச்சல் - அரிப்பு நீங்க"},{"n":779,"t":"உடம்பு நமச்சல். தடிப்பு நீங்க :- வேப்பமரப்பட்டை இடித்து தூளாக்கி அந்த தூளை உடம்பில் பூசி அரைமணி நேரம் கழித்து குளிக்கலாம்."},{"n":780,"t":"உடல் நமைச்சல் அகல - ஆராம்பூ, பாசிப்பயறு கலந்து உடம்பில் பூசி குளித்து வரலாம்."},{"n":781,"t":"தோல் தடிப்பு :- தும்பை இலைச்சாறு சளி, சளிக்காய்ச்சல் நீக்குவதோடு சொறி, சிரங்கு, தோல் தடிப்பு நீக்கவல்லது."},{"n":782,"t":"அரிப்பு மாற :- மாதுளம்பழ சாறை புழுவெட்டு உள்ள இடத்தில் தேய்க்கவும்."},{"n":783,"t":"அரிப்பு, சிறுபுண்கள் ஆற :- கீழாநெல்லி இலைகளை அரைத்து உடம்பில் தேய்த்து குளிக்கலாம்."},{"n":784,"t":"உடல் அரிப்பு நீங்க :- வண்ணி மரத்தின் இலையை பசும் பால் விட்டு அரைத்து தினசரி 1அவுன்ஸ் சாப்பிட்டு வரலாம்."},{"n":785,"t":"ஊறல் :- ஆடாதொடை இலை, சங்கன் இலை கஷாயம் செய்து குடிக்கலாம்."},{"n":786,"t":"தேக எரிச்சல் :- கட்டிகொடி இலை, வேப்பங்கொழுந்து அரைத்து சாப்பிட்டு வரவும்"},{"n":787,"t":"நமைச்சல் சிரங்கு தீர :- துளசி இலையை அரைத்து பூசி வர குணமாகும்."},{"n":788,"t":"உடலில் எரிச்சல் குணமாக :- இலந்தை மரத்தின் பூவை சுத்தம் செய்து மைபோல் அரைத்து உடல் முழுவதும் பூசிக்கொள்ள எரிச்சல் தணியும்."},{"n":789,"t":"தோல் அரிப்பு குணமாக :- வெள்ளறுகு இலைகளை பொடி செய்து 5கிராம் வீதம் பாலில் சாப்பிட்டு வர அரிப்பு மறைந்து குணமாகும்."},{"n":790,"t":"ஊறல் அரிப்பு குணமாக :- சரக்கொன்றை இலையை அரைத்து பற்றுபோட ஊறல் அரிப்பு போன்ற நோய்கள், தடவ குணமாகும். மேனியும் அழகு பெறும்."},{"n":791,"t":"உடல் நமச்சல் தீர - மருதோன்றி இலை, மிளகு, பூண்டு, மஞ்சள் அரைத்து வெறும் வயிற்றில் சாப்பிட உடல் நமச்சல் தீரும்."},{"n":792,"t":"அரிப்பு நீங்க :- கொன்றைவேர் பட்டை வில்வஓடு அரைத்து பொடி செய்து பாலில் குடிக்க அரிப்பு நீங்கும்."},{"n":69,"t":"ஜன்னி - வலிப்பு - காக்கா வலிப்பு குணமாக"},{"n":793,"t":"காக்காய் வலிப்பு குணமாக :- வெள்ளை வெங்காயத்தை துணியில் கட்டி சாறு பிழிந்து இரண்டு காதுகளிலும் ஊற்றினால் குணமாகும்."},{"n":794,"t":"வலிப்பு நோய் குணமாக :- சடாமஞ்சிலை கொதிநீரில் ஊற வைத்து 1மணி நேரம் கழித்து வடிகட்டி காலை மட்டும் பருகி வரலாம்."},{"n":795,"t":"காக்காவலிப்பு, மிகுபித்தம் தீர :- பிரமியவழுக்கை இலை சாறு நெய் கலந்து காய்ச்சி காலை மாலை 1கரண்டி குடிக்கலாம்."},{"n":796,"t":"காக்காவலிப்பு தீர :- முருங்கைபட்டை அவித்து சாறு எடுத்து ரசமாக்கி சாப்பிட்டு வரலாம்."},{"n":797,"t":"சன்னி பிடரி இசவு வாத நோய்கள் தீர :- வேப்பஎண்ணை தலைமுழுகி வர தீரும்."},{"n":798,"t":"சன்னி இழுப்பு வராமல் தடுக்க :- சங்கிலை, வேப்பிலை சமஅளவு கஷாயம் குடிக்க குணமாகும்."},{"n":70,"t":"கால் ஆணி - யானைக்கால் வியாதி குணமாக"},{"n":799,"t":"யானைக்கால் வியாதி :- வல்லாரை இலையை விளக்கெண்ணையில் வதக்கி கட்டி வரலாம்."},{"n":800,"t":"கண்ணாடி குத்திய காயம் :- கண்ணாடி குத்தி எவ்வளவு சிறிய கண்ணாடி துண்டும் காலில் இருந்தால் ஓமத்தை வெல்லத்துடன் அரைத்து கட்ட எவ்வளவு சிறிய கண்ணாடி துண்டாக இருந்தாலும் வெளியேறி விடும்."},{"n":801,"t":"கால் ஆணி போக :- மருதாணி, மஞ்சள் சேர்த்து அரைத்து இரவு கால் ஆணி மீது கட்டலாம்."},{"n":802,"t":"கால் ஆணி குணமாக :- வெள்ளை அரகு அரைத்து வைத்து கட்டவும்."},{"n":803,"t":"கால் ஆணி வலி தீர :- மஞ்சள், வசம்பு சிறிதளவு கற்பூரம், மருதோன்றி இலை அரைத்து கட்டி வரலாம்."},{"n":804,"t":"கால் ஆணி :- சித்திரப்பாலாடை கீரையின் பாலை தடவலாம்."},{"n":805,"t":"குதிகாலில் வலி :- தவிடையும் உப்பையும் வறுத்து ஒத்தடம் இடலாம்."},{"n":806,"t":"யானைக்கால் வியாதி :- வல்லாரை இலை பொடி காலை மாலை நெய்யில் சாப்பிட்டு வரலாம்."},{"n":807,"t":"யானைக்கால் வீக்கம் :- காக்கிராட்டான் விதை தூள், இந்துப்பு, சுக்கு தூள் கலந்து 3கிராம் சாப்பிட்டு வர வீக்கம் குறையும்."},{"n":808,"t":"யானைக்கால் நோய் குணமாக :- வல்லாரை கீரை தொடர்ந்து சாப்பிடலாம்."},{"n":809,"t":"யானைக்கால் நோய் :- பசுவின் சிறுநீரும், மஞ்சள் தூள், வெல்லம் கலந்து சாப்பிட்டு வந்தால் நோய் வராது தடுக்கலாம். வந்த நோயும் குணமாகும்."},{"n":810,"t":"முள் வெளியேற - எலிக்காதிலை இலையை அரைத்து முள் குத்திய இடத்தில் வைத்து கட்ட முள் ஒடிந்து உள்ளே இருந்து வெளிவந்து விடும்."},{"n":811,"t":"முள் வெளியேற :- கள்ளிப்பால் அல்லது எருக்கன் பால் முள் குத்திய இடத்தில் ஓரிரு சொட்டு தடவ முள் எவ்வளவு சிறியதாக இருந்தாலும் வெளியேறி விடும்."},{"n":812,"t":"கண்ணாடி துண்டினால் காயம் ஏற்பட்டால் :- வாழைபழத் தோலை அந்த காயத்தின் மீது வைத்து கட்டுங்கள், ரத்த போக்கு நின்று காயம் விரைவில் ஆறும்."},{"n":813,"t":"யானை கால் வீக்கம் குறைய :- காக்கிரட்டான் இலையை விளக்கெண்ணையில் வதக்கி கட்ட வீக்கம் குறையும்."},{"n":77,"t":"கை, கால், விரல் வலி குணமாக"},{"n":814,"t":"கை, கால் அசதி சரியாக :- சீந்தில் கொடி இலைகளை பாலுடன் கலந்து சாப்பிடலாம்."},{"n":815,"t":"உடல் அசதி, கை கால் வலி நீங்க :- முருங்கை ஈர்க்கு ரசம் சாப்பிடலாம்."},{"n":816,"t":"கை, கால் இடுக்குகளில் நெரிகட்டிய சுரம் தீர :- மிளகாய் பூண்டு இலை கஷாயம் 3வேளை குடித்து வரவும்."},{"n":817,"t":"கை கால் வீக்கம் குணமாக :- சுண்டங்கத்திரி இலையை தண்ணீர் விட்டு அரைத்து பற்று போட்டால் வீக்கம் வற்றும்."},{"n":818,"t":"உள்ளங்கை, கால் வியர்வை நிற்க :- இலந்தை மர இலைகளை எடுத்து நசுக்கி சாறு எடுத்து உள்ளங்கை, கால்களில் தடவிவர வியர்ப்பது நின்று விடும்."},{"n":819,"t":"குத்தல் தீர :- சீந்தில்கொடி, உலர்த்தி பொடி செய்து கால்கிராம் அளவு பாலில் சாப்பிட்டு வர விரல்களில் சுருக்சுருக்கென்று குத்தல் தீரும்."},{"n":820,"t":"கை கால் எரிச்சல் நீங்க :- வாழைபூவை பருப்புடன் சமைத்து சாப்பிட கைகால் எரிச்சல் நீங்கும்."},{"n":821,"t":"நெறிகட்டிய சுரம் தீர :- மிளகாய் பூண்டு கஷாயம் 3 வேளை குடித்து வர கைகால் இடுக்குகளில் நெறிகட்டிய சுரம் தீரும்."},{"n":822,"t":"உள்ளங்கை எரிச்சல் தீர :- மருதோன்றி இலை சோற்று கற்றாளையுடன் அரைத்து பற்றுபோட குணமாகும்."},{"n":72,"t":"சுகமான தூக்கம் வர."},{"n":823,"t":"சுகமான, எளிதாக தூக்கம் வர :- கசகசா, கற்கண்டு சாப்பிட்டு வர தூக்கம் நன்றாக வரும்."},{"n":824,"t":"இரவில் தூக்கம் சீக்கிரம் வர :- தர்ப்பை புல், தலையணை கீழ் வைக்க பலன் கிடைக்கும். தீயகனவுகள் ஏதும் வராது."},{"n":825,"t":"ஊக்கம் :- சிந்தனையை சுருக்கி, செயல்களை அதிகமாக்கி, பேச்சைக் குறைக்க ஓய்வும், உறக்கமும் தானாகவே வரும்."},{"n":826,"t":"சுகமான நித்திரை வர :- சீரகத்தை வறுத்து பொடி செய்து வாழைப்பழத்துடன் சாப்பிடலாம்."},{"n":827,"t":"நல்ல தூக்கம் வர :- மருதோன்றி பூ 2 இரவு சாப்பிடலாம்."},{"n":828,"t":"தூக்கம் :- சப்போட்டா பழம் தினமும் பகல் பொழுதில் உண்டு வர இரவில் நன்றாக தூக்கம் வரும்."},{"n":829,"t":"தலைவலி. தூக்கமின்மை தீர :- திருநீற்றுபச்சியை முகர்வதினால் தலைவலி தூக்கமின்னை சாந்தமாகும்."},{"n":73,"t":"தோல் வழுவழுப்பு பெறுவகற்கு"},{"n":830,"t":"முகம் பளபளக்க :- அவரி இலையை உலர்த்தி தூளாக்கி தினமும் 5கிராம் காலை உணவிற்குப் பின் சாப்பிட்டு வரலாம்."},{"n":831,"t":"முகம் வழுவழுப்பாக இருக்க :- கசகசாவை எருமை தயிரில் அரைத்து தினந்தோறும் இரவு படுக்கப் போகுமுன் முகத்தில் தடவி வரவும்."},{"n":832,"t":"உடல் பளபளப்பாகி கருப்பு நிறம் மாற :- மருதாணி இலையை அரைத்து உடல் மீது தேய்த்து வரலாம்."},{"n":74,"t":"வழுக்கை தலையில் முடி வளர"},{"n":833,"t":"புழுவெட்டு உள்ள இடத்தில் முடி முளைக்க :- மாதுளம் பழ சாற்றை தடவ அரிப்பு மாறும்."},{"n":834,"t":"புழுவெட்டு நீங்கி முடி வளர :- ஆற்றுத் தும்மட்டியை நறுக்கி தேய்த்து வரலாம்."},{"n":835,"t":"முடி உதிர்ந்த பகுதியில் முடி முளைக்க :- பிஞ்சு ஊமத்தன் காயை அரைத்து பூசினால் முடி முளைக்கும்."},{"n":836,"t":"வழுக்கை :- வெங்காயம், செம்பருத்தி பூவுடன் சேர்த்து அரைத்து தடவி வர நல்ல பலன் கிடைக்கும்."},{"n":837,"t":"சொட்டை உள்ள இடத்தில் முடி வளர :- நேர்வளங்கொட்டையை உடைத்து பருப்பை எடுத்து பசுநீர் விட்டு மைய அரைத்து தடவ முடி வளரும்."},{"n":838,"t":"வழுக்கையில் முடி வளர :- கீழாநெல்லி வேரை சுத்தம்செய்து சிறிய துண்டாக நறுக்கி தேங்காய் எண்ணையில் போட்டு காய்ச்சி தலைக்கு தடவி வந்தால் வழுக்கை மறையும் முடி வளரும்."},{"n":839,"t":"சொட்டையில் முடி வளர :- பூசனி கொடியின் கொழுந்து இலைகளை கசக்கிய சாறு தலையில் தடவிவர முடி வளரும்."},{"n":840,"t":"முடி வளர :- முடி உதிர்ந்த இடத்தில் எலுமிச்சம்பழ விதை, மிளகு சேர்த்து அரைத்து தேய்த்து வர முடி வளரும்."},{"n":75,"t":"விஷக்கடி குணமாக"},{"n":841,"t":"விஷகடி, சொறி. தீர :- ஆடு தின்னாபாளை இலைபொடி வெந்நீரில் குடிக்கலாம்."},{"n":842,"t":"பாம்பு நஞ்சு :- ஆடு தின்னாபாளை வேரை அரைத்து கொடுக்கலாம்."},{"n":843,"t":"பாம்புகடி, தேள்கடி :- ஈஸ்வரமூலி இலையை கசக்கி கடிவாயில் தேய்க்கலாம்."},{"n":844,"t":"பாம்பு கடித்தவர்களுக்கு :- எருக்க இலை அரைத்து 1கிராம் அளவு கொடுக்கலாம்."},{"n":845,"t":"நாய்கடி விஷம் :- ஊமத்தை இலை அரைத்து நல்லெண்ணையில் வதக்கி கட்டலாம்."},{"n":846,"t":"பாம்பு நஞ்சு முறிய :- பீச்சங்கு இலை சாறு 100மி.லி. குடிக்கலாம்."},{"n":847,"t":"தேள் விஷம் இறங்க :- நாயுறுவி இலையை கசக்கி தேய்க்கலாம்."},{"n":848,"t":"பாம்பு தீண்டியவர்களுக்கு :- தும்பை இலைசாறு கொடுக்க பேதியாகும். 3நாள் தூங்காமல் உப்புசப்பில்லாமல் சாப்பிட வேண்டும்."},{"n":849,"t":"விஷகடிகள் முறிய :- பாதாளமூலி வேரை பொடிசெய்து 5கிராம் சாப்பிடலாம்."},{"n":850,"t":"விஷகடி தீர :- மாவிலங்கபட்டை கஷாயம் காலை, மாலை சாப்பிட்டு வரலாம்."},{"n":851,"t":"நஞ்சுகடி தீர :- உத்தாமணி என்ற வேலிபருத்தி வேரை பாலில் அரைத்து குடிக்கலாம்."},{"n":852,"t":"எந்த விஷகடியானாலும் :- பூண்டு அரைத்து கடிவாயில் கட்டலாம்."},{"n":853,"t":"எலிகடி விஷம் முறிய :- விளாமரத்தின் பூக்களை சுத்தம் செய்து 1டம்ளர் நீரில் கொதிக்க வைத்து வடிகட்டி சாப்பிட வேண்டும்."},{"n":854,"t":"வண்டு பூச்சி கடிக்கு :- வெள்ளைப்பூடை அரைத்து கடிவாயில் கட்ட விஷம் முறியும்."},{"n":855,"t":"விஷக்கடிக்கு :- கடிவாயில் வெங்காயம் நறுக்கித் தேய்க்க வலி குறையும்."},{"n":856,"t":"பூரான் கடி விஷம் முறிய :- தும்பை இலை சாறு பூசலாம்."},{"n":857,"t":"வெறிநாய் கடி குணமாக :- நாயுருவி வேரை அரைத்து கோலி குண்டு அளவு உருட்டி 15 நாட்கள் சாப்பிடலாம். 858.விஷம் :- எரிக்கன் பாலை நாய்கடி வாயில் வைக்க விஷம் ஏறாது."},{"n":859,"t":"நாட்பட்ட விஷகடிக்கு :- வெற்றிலையும், மிளகும் சேர்த்து அரைத்து 2கிராம் உட்கொள்ள விஷத்தன்மை மாறும்."},{"n":860,"t":"தேனி கொட்டினால் :- பழைய புளி, சுண்ணாம்பு சேர்த்து பிசைந்து அதை கொட்டு வாயில் அழுத்தி ஒட்ட வைத்து விட்டால் கடுப்பு நின்று விடும்."},{"n":861,"t":"உடம்பில் விஷம் உள்ளதா என அறிய :- ஆடுதிண்டா பாளை வேரை வாயில் போட்டு மெல்ல செய்தால் அதன் சுவை கசந்தால் விஷம் இல்லை எனலாம்."},{"n":862,"t":"பாம்புகடி விஷம் இறங்க :- எருக்கஞ்செடியின் பிஞ்சு இலைகளை 2 அல்லது 3 இலைகளை மென்று தின்றால் விஷம் இறங்கும்."},{"n":863,"t":"பாம்பு, பூரான் கடி - அவுரி வேர், அருகம்புல், மிளகு சேர்த்து அரைத்து கொடுக்கலாம்."},{"n":864,"t":"விஷகடி குணமாக - பூண்டு அரைத்து கட்டி விஷம் இறங்கும்."},{"n":865,"t":"சிலந்தி கடி :- கற்றாழை வைத்து கட்டினால் குணமாகும்."},{"n":866,"t":"கம்பளி பூச்சி கடிக்கு :- வெற்றிலை கடிவாயில் வைத்து அழுத்தி தேய்க்க குணம் பெறலாம்."},{"n":867,"t":"தேள் கடிக்கு :- நாயுருவி வேரை பச்சையாக மென்று சாறை விழுங்கினால் விஷம் நீங்கும்."},{"n":868,"t":"தேள் கொட்டிய வலி குறைய - கடிவாயில் பாச விதைகளை எருக்கம்பால் ஊற்றி மைய்ய அரைத்து போட வலி குறையும்."},{"n":869,"t":"விஷம் முறிய :- விளாம்பழத்தை ஓட்டுடன் அரைத்து காலையில் மூன்று நாட்கள் சாப்பிட குணமாகும்."},{"n":870,"t":"பாம்பு கடி விஷம் :- கரிசலாங்கண்ணி இலையை இடித்து சாறுபிழிந்து ஒரு அவுன்ஸ் மோரில் கலந்து குடித்தால் உள்பட விஷம் இறங்கும்."},{"n":871,"t":"பாம்பு கடி விஷம் முறிய - ஆடு தீண்டா பாளை வேர் எடுத்து கஷாயம் செய்து குடிக்கலாம்."},{"n":872,"t":"பூரான் கடி விஷம் நீங்க :- குப்பை மேனி, உப்பு, மஞ்சள் சேர்த்து அரைத்து பற்று போட குணமாகும்."},{"n":873,"t":"வெறிநாய் கடி குணமாக :- நாயுருவி வேரை அரைத்து போதிய அளவில் உருட்டி 15நாட்கள் சாப்பிடவும்."},{"n":874,"t":"பூரான் கடி :- குப்பைமேனி, உப்பு, மஞ்சள் சேர்த்து அரைத்து போடலாம்."},{"n":875,"t":"தேள், பாம்பு விஷம் :- தும்பை இலைசாறு உட்கொள்ளலாம்."},{"n":876,"t":"தேள் கடி விஷம் :- நாயுருவி வேரை பச்சையாக மென்று சாறை உட்கொள்ளலாம்."},{"n":877,"t":"விஷகடிகள் முறிய :- பாதாளமூலி வேரை பொடிசெய்து 2கிராம் சாப்பிட விஷகடிகள் முறியும்."},{"n":878,"t":"விஷகடி தீர :- மாவிலங்கபட்டை கஷாயம் காலை, மாலை சாப்பிட்டு வர விஷகடி தீரும்."},{"n":879,"t":"நஞ்சுகடி விஷம் முறிய :- பொன்னாவரைவேர் கஷாயம் குடிக்க நஞ்சுகடி விஷம் முறியும்."},{"n":76,"t":"பசி எடுக்க"},{"n":880,"t":"பசி உண்டாக :- பிரண்டையை நெய்விட்டு வதக்கி துவையல் செய்து சாப்பிட்டு வரலாம். மூலநோய் வராமல் தடுக்கலாம். இரத்த கழிசல் தீரும். உடல் வலிமை பெறும்."},{"n":881,"t":"பசி :- பிரண்டைத்துவையல் பசியைத்தூண்டும்."},{"n":882,"t":"பசியின்மை :- விளாமர கொழுந்து அரைத்து 1கிராம் பாலில் கலந்து சாப்பிடலாம்."},{"n":883,"t":"பசி மந்தம், மயக்கம் தீர :- முன்னைக்கீரையை, பருப்புடன் சேர்த்து சமைத்து சாப்பிடலாம்."},{"n":884,"t":"சுவையின்மை, பசியின்மை நீங்க :- ஆதொண்டை இலையை நெய்யில் வதக்கி துவையலாக்கி உணவுடன் உட்கொள்ளலாம்."},{"n":885,"t":"வாதம். பசியின்மை தீர :- நாய் வேளை விதை (கடுகு) துவையல் செய்து சாப்பிடலாம்."},{"n":886,"t":"பசியை தூண்டி தாதுக்களின் தன்மையைத் துவளச்செய்ய :- முள்ளிக்கீரை சாப்பிடலாம்."},{"n":887,"t":"மசக்கை நீங்கி பசி உண்டாக :- மந்தாரை இலையை உலர்த்தி பொடி 2 சிட்டிகை தேனுடன் சாப்பிடலாம்."},{"n":888,"t":"கோழை நீக்கி பசி உண்டாக :- கல்யாண முருங்கை இலை சாறு 10 துளி, 10 துளி வெந்நீர் கலந்து குழந்தைகளுக்கு கொடுக்கலாம்."},{"n":889,"t":"பசி இராமல் 1வாரம் ஆகாரம் இல்லாமல் இருக்க :- நாயுறுவி விதையை சோறு போல் சமைத்து உண்ணலாம்"},{"n":79,"t":"பேன், பொடுகு ஒழிய"},{"n":890,"t":"மண்டை கரப்பான் சொறி தீர :- பப்பாளி பாலை படிகாரத்துடன் தடவவும்."},{"n":891,"t":"பேன் ஒழிய :- கஞ்சாங்கோரை இலையை உலர்த்தி பொடியாக்கி கஷாயம் செய்து குடிக்கலாம்."},{"n":892,"t":"பேன் ஒழிய :- மலைவேம்பு இலையை அரைத்து தலையில் பூசலாம்."},{"n":893,"t":"பேன், ஈர் ஒழிய :- சீத்தாப்பழ விதைகளை காய வைத்து பொடியாக்கி சீயக்காயில் கலந்து தேய்த்து குளித்து வரலாம். கூந்தலும் மிருதுவாகும்."},{"n":894,"t":"அரளிப்பூ :- தலையில் வைத்துக் கொண்டால் பேன் ஒழியும்."},{"n":895,"t":"சீலைபேன் ஒழிய :- நாய் துளசி இலை கதிர்களுடன் வசம்பு சேர்த்து அரைத்து உடல் முழுவதும் பூசி குளிக்க சீலைபேன் ஒழியும்."},{"n":896,"t":"பொடுகு, தோல் நோய் தீர :- பொடுதலை சமூலம் சாறு நல்லெண்ணையில் காய்ச்சி வாரம் 1முறை தலைமுழுகி வர தீரும்."},{"n":78,"t":"எச்சில் புண் குணமாக"},{"n":897,"t":"எச்சில் தழும்பு குணமாக :- வெள்ளைப்பூடை நசுக்கி தொடர்ந்து தேய்க்கலாம்."},{"n":898,"t":"எச்சில் தழும்பு :- எட்டிபருப்பை அரைத்து தடவலாம்."},{"n":899,"t":"எச்சில் புண் குணமாக :- வெள்ளைப்பூண்டு சாறு, வெற்றிலை சாறு கலந்து தடவி வரலாம்."},{"n":79,"t":"அலர்ஜி - தலை சுற்றல் - அடி தள்ளுதல் சரியாக"},{"n":900,"t":"அடிதள்ளுதல் குணமாக :- கரிசலாங்கண்ணி இலை, பழம் புளி சேர்த்து அரைத்து 2கிராம் அளவு 10நாட்கள் சாப்பிடலாம்."},{"n":901,"t":"அலர்ஜி குணமாக :- வேப்பங்கொழுந்து துளசி இலை சேர்த்து தினமும் காலையில் சுண்டைக்காய் அளவு சப்பிட்டு வரலாம்."},{"n":902,"t":"சுவையின்மை. மயக்கம் தீர - புளியாரை கீரை உணவுடன் சேர்த்து வர மூலவாயு பித்தம் தீரும்."},{"n":903,"t":"தலைசுற்றல் குணமாக :- தலை சுற்றல் எவ்வளவு கடுமையாக இருந்தாலும் ஒரு அவுன்ஸ் நெல்லிக்காய் சாறு குடிக்கலாம்."},{"n":904,"t":"தலைசுற்றல் :- மாதுளம்பழ சாறுடன் தேன் கலந்து சாப்பிடலாம்."},{"n":905,"t":"தலைச்சுற்றல், கிறுகிறுப்பு குணமாக :- கொத்தமல்லி விதையை கொதிநீரில் ஊறவைத்து காலையில் குடித்து வரலாம்."},{"n":906,"t":"தலைச்சுற்றல் நீங்க :- கீழாநெல்லி தைலத்தை பூசி குளித்து வந்தால் தலைச்சுற்றல் நிற்கும்."},{"n":907,"t":"தலைசுற்றல், இரத்த கொதிப்பு தீர :- நெல்லிவற்றல் பச்சைபயறு கஷாயம் காலை, மாலை சாப்பிட தீரும்."},{"n":908,"t":"தலைசுற்றல் சரியாக :- இஞ்சி சாறு தேன் கலந்து குடிக்க தீரும்."},{"n":909,"t":"மூச்சு வாங்குதல் :- தூதுவளை உண்பதால் மூச்சு வாங்குதல் காது அடைத்தல், காது மந்தம் விலகும்."},{"n":80,"t":"நோய் எதிர்பு சக்தி பெருக"},{"n":910,"t":"நோய் எதிர்ப்பு சக்தி :- அருகம்புல் சாறை காலை வெறும் வயிற்றில் கால் அவுன்ஸ் சாப்பிட்டு வரலாம்."},{"n":911,"t":"எந்த நோயும் அணுகாமல் இருக்க :- அருகம்புல் சாறு 10மி.லி. அளவு வெறும் வயிற்றில் குடித்து வரலாம்."},{"n":912,"t":"உடல் நலன் - தினசரி 2பேரீச்சம்பழம் சாப்பிட்டு பால் சாப்பிட்டு வர குளுக்கோஸ் நேரடியாக கிடைக்கும்."},{"n":913,"t":"உடம்பு பற்றிய எவ்வித நோயும் படிப்படியாக குணமாக:- நத்தைசூரி வேர் 10கி. இடித்து காய்ச்சி 3 வேளை குடித்து வரவும்."},{"n":913,"t":"கட்டுப்படாத நோய்கள் தீர :- வேம்பின் பஞ்சக சூரணம் கால் கிராம் வெண்ணைய் பாலில் 48நாட்கள் சாப்பிடலாம்."},{"n":915,"t":"மருந்து :- விளாம்பழம், நெல்லிக்காய் தினமும் தொடர்ந்து சாப்பிட மருந்து, மாத்திரை ஊசி அவசியம் ஏதும் இல்லை."},{"n":916,"t":"அனைத்து நோய்களும் குணமாக :- சிறுசின்னி இலை, பொன்னாங்கன்னி, செருப்படை, வில்வஇலைசாறு சமஅளவு நல்லெண்ணை, விளக்கெண்ணை, தேங்காய் எண்ணை சமஅளவு சேர்த்து காய்ச்சி வடிகட்டி 1ஸ்பூன் குடித்து வர குணமாகும்."},{"n":917,"t":"நோய் எதிர்ப்பு சக்தி அதிகரிக்க - துளசி வேர் பொடி தொடர்ந்து சாப்பிட்டு வர நோய் எதிர்ப்பு சக்தி அதிகரிக்கும்."},{"n":918,"t":"நோய் எதிர்ப்பு சக்தி :- இஞ்சி துண்டு தேனில் ஊறவைத்து"},{"n":48,"t":"நாட்கள் உண்டு வர நோய் எதிர்ப்பு சக்தி அதிகரிக்கும்."},{"n":81,"t":"உடல் வலி - எரிச்சல், உடல் அரிப்பு - குடைச்சல் தீர"},{"n":919,"t":"உடல் அரிப்பு குணமாக :- வன்னி மரத்தின் இலையை பசும்பால் விட்டு, அரைத்து தினசரி 1அவுன்ஸ் சாப்பிட்டு வந்தால் தீரும்."},{"n":920,"t":"குத்தல், குடைச்சல் நீங்க :- தைவேளை சமூலம் இடித்து பிழிந்து சக்கையை தலையில் கட்டி வைக்கவும்."},{"n":921,"t":"உடல்வலி தீர :- வாதநாராயணன் இலையை போட்டு கொதிக்க வைத்து நீரில் குளிக்கலாம்."},{"n":922,"t":"உடல் குளிர்ச்சி பற :- உசிலை இலையை சீயக்காய்க்கு பதிலாக பயன்படுத்தலாம்."},{"n":923,"t":"குடைச்சல் வலி :- ஆடாதொடைவேர், கண்டங்கந்திரி வேர் பொடி செய்து தேனில் சாப்பிடலாம்."},{"n":924,"t":"உடம்பு எரிச்சல் நமைச்சல் குணமாக :- கீழாநெல்லி அம்மான் பச்சரிசி இலை சமஅளவு அரைத்து தயிரில் சாப்பிடலாம்."},{"n":925,"t":"உடல் எரிச்சல் சரியாக :- ஆவாரம் வேர், இலை, பட்டை, பூ, காய் அனைத்தையும் காய வைத்து பொடியாக்கி சாப்பிடவும்."},{"n":926,"t":"உடல் எரிச்சல் குணமாக :- கீழாநெல்லி செடியை சுத்தம் செய்து இளநீர் விட்டு அரைத்து உடல்மீது பூசி குளித்து வரலாம்."},{"n":927,"t":"உடல் தளர்ச்சி நீங்க :- கணு நீக்கிய அருகம்புல். அரைத்து வெண்ணை கலந்து 48நாட்கள் சாப்பிடலாம்."},{"n":928,"t":"உடல்வலி குணமாக :- வில்வஇலையும், அருகம்புல்லும் இடித்து சாறு எடுத்து காலை, மாலை 1அவுன்ஸ் சாப்பிட்டு வர உடல்வலி குணமாகும்."},{"n":929,"t":"அலுப்பு தீர :- மிளகை நெய்யில் வறுத்து தூள் செய்து வெல்லம், நெய், சேர்த்து லேகியம் போல் கிளறி 5கிராம் அளவு சாப்பிட்டு வரலாம்."},{"n":930,"t":"உல் வெப்பம் தனிந்து குளிர்ச்சி உண்டாக :- மாதுளம் பழம் பிழிந்து கற்கண்டு சேர்த்து பருகி வரலாம்."},{"n":931,"t":"உல் வலி அசதி தீர :- முருங்கை ஈர்க்கு கஷாயம் சாப்பிடவும்."},{"n":932,"t":"ஆசனவாய், நுரையீரல் பலமாக :- ரோஜாப்பூ தேன் கற்கண்டு தேன் கலந்து வெய்யிலில் வைத்து 1கிராம் அளவு சாப்பிடவும்."},{"n":933,"t":"தேகக்காந்தல் தீர :- முசுமுசுக்கைச் சாறுடன் சமஅளவு நல்லெண்ணைய் கலந்து காய்ச்சி வாரம் 1முறை தலை முழுக குணமாகும்."},{"n":934,"t":"வெப்ப நோய் தீர :- பாதாளமூலி பழ சாறில் செய்த மணப்பாகு சாப்பிட்டுவர வெப்ப நோய் தீரும்."},{"n":82,"t":"சோகை -இரத்த சோகை குணமாக"},{"n":935,"t":"சோகை தீர :- ஈஸ்வர மூலி வேரை பொடி செய்து தேனில் கலந்து கொடுக்கலாம்."},{"n":936,"t":"பாண்டு, சோகை தீர :- மஞ்சள் கரிசாலை, மிளகு 2சேர்த்து அரைத்து சாப்பிட்டு வரவும்."},{"n":937,"t":"சோகை தீர :- சோயா பீன்ஸ் தினசரி உணவுடன் சாப்பிடலாம்."},{"n":938,"t":"இரத்த சோகை தீர :- கரிசாலை இலை, வேப்பிலை, துளசி இலை, கீழாநெல்லி வெறும் வயிற்றில் மென்று தின்று வரலாம்."},{"n":939,"t":"இரத்த சோகை - பீர்க்கன்காய் வேர் கஷாயம் சாப்பிட்டு வர தீரும்."},{"n":940,"t":"இரத்தச் சோகை அகல :- தினசரி கொய்யாப்பழம் சாப்பிட்டு வரலாம்."},{"n":83,"t":"உடல் சக்தி பெறுவதற்கு"},{"n":941,"t":"உடல் சக்தி பெற :- இரவு உணவாக வாழைப்பழம் 2 தேங்காய் 1முடி சாப்பிட்டு வரலாம்."},{"n":942,"t":"உடலுக்கு பலம் கூட :- ஆவாரம்பூ பாலில் கலந்து சாப்பிடவும்."},{"n":943,"t":"உடல் பலம் பெற :- கொன்றை வேர் கட்டை கஷாயம் குடித்து வரலாம்."},{"n":944,"t":"உடல் பலவீனம் நீங்க - பப்பாளிப்பழம் தொடர்ந்து சாப்பிடவும்."},{"n":945,"t":"உடல் சத்துக்களை பெருக்கி உடல் வனப்பு உண்டாக :- அறுகீரை நெய் சேர்த்து உண்டு வரலாம்."},{"n":946,"t":"தேகபலம் கூட :- மிளகரணை வேர்பட்டை கஷாயம் 2வேளை சாப்பிட்டு வரவும்."},{"n":947,"t":"உடல் பொலிவு பெற :- வாகைப்பிசினை வறுத்து பொடியாக்கி காலை மாலை பசும்பாலில் சாப்பிடலாம்."},{"n":948,"t":"உடல் வலிமை வற - அத்திப்பழம் தொடர்ந்து சாப்பிட்டு வரலாம்."},{"n":949,"t":"உடல் பலம் பற :- தூதுவளை இலையை நெய்யில் வதக்கி துவையலாக சாப்பிடலாம்."},{"n":950,"t":"தேகம் பலப்பட :- அம்மான் பச்சரிசி இலை, தூதுவளை இலையுடன் சேர்த்து உண்ணலாம்."},{"n":84,"t":"எண்கள் சிறப்பு பகுதி."},{"n":951,"t":"மார்பகம் வளர்ச்சி - எழுத்தாணி பூண்டு வேர் பாலில் அரைத்து காலை மாலை குடிக்கலாம்."},{"n":952,"t":"கர்ப்பிணி பெண்களுக்கு :- எச்சரிக்கை கருஞ்சீரகம், அன்னாசிபழம், வெல்லம் இவைகளை சாப்பிடக் கூடாது. தவிர்க்க வேண்டும். சாப்பிட்டால் கருச்சிதைவு ஏற்படும்."},{"n":953,"t":"கர்ப்பிணி பெண்கள் :- தினசரி 2நெல்லிக்காய் சாப்பிட்டு வர சிறந்தது. வயிற்றில் உள்ள குழந்தைகளுக்கும் சிறந்த டானிக்காக பயன்படுகிறது."},{"n":954,"t":"பெண்களுக்கு மார்பகம் தளர்ந்து விட்டால் சரியாக்க :- மார்பில் விளக்கெண்ணையை தடவி, உலர்ந்த மாதுளம் விதைகளை பொடிசெய்து அதன்மீது வைத்து கட்டிவர வேண்டும். 21தினங்கள் செய்தால் மார்பகங்கள் கட்டுப்பெறும். கவர்ச்சியான தோற்றம் தரும். 955, கர்ப்பிணிகளுக்கு கை, கால் வீக்கம் குறைய :- நெல்லிக்காய், முருங்கைக்காய், முள்ளங்கி. இவைகளை உணவில் தாராளமாக சேர்த்து வந்தால் வீக்கம் குறையும்."},{"n":956,"t":"முலைக்காம்பு வெடிப்பு :- வேப்பிலையையும், மஞ்சளையும் அரைத்து வெண்ணையில் குழைத்து தடவலாம்."},{"n":957,"t":"உடற்சோர்வு நீங்கி பலம் பெற :- கோதுமை கஞ்சி மாதவிடாய் காலங்களில் சாப்பிடலாம்."},{"n":958,"t":"ஸ்தனங்கள் வருத்து விம்ம :- முத்தெருக்கஞ்செடி சமூலத்தை பாலில் அரைத்து சாப்பிட்டு வரலாம்."},{"n":959,"t":"பிரசவமான பெண்கள் நச்சு நீரை வெளியேற்ற :- 15கிராம் மஞ்சள் தூள், 150மி.லி. நீரை ஊற்றி பாதியாக சுண்டக்காய்ச்சி சாப்பிட்டு வர குணமாகும்."},{"n":960,"t":"கர்ப்பகால வாந்திக்கு :- லவங்க பொடியை நீரில் கலந்து அரைமணிநேரம் ஊறவைத்து வடிகட்டி பருகினால் வாந்திநிற்கும்."},{"n":961,"t":"மார்பு காம்புபுண் :- கானாவாழை இலை அரைத்து பூச குணமாகும்."},{"n":962,"t":"கர்ப்பிணிகள் சாப்பிட சிறந்தது :- தினசரி ஒரு மாம்பழம்சாப்பிட பிறக்கும் குழந்தை நல்ல ஊட்டத்துடன் இருக்கும். உடல் பலவீனம், கை, கால் நடுக்கம், மயக்கம் முதலிய தொல்லைகள் வராது."},{"n":963,"t":"மசக்கை நீங்க பசி உண்டாக :- மந்தாரை இலையை உலர்த்தி பொடி 2சிட்டிகை தேனுடன் சாப்பிட மசக்கை நீங்கி பசி உண்டாகும்."},{"n":964,"t":"கருப்பை இறக்கம் குணமாக :- பழம்புளி, மஞ்சள் கரிசலாங்கன்னி அரைத்து 1கிராம் காலை, மாலை 21நாட்கள் சாப்பிட்டு. வர கருப்பை இறக்கும் குணமாகும்."},{"n":965,"t":"கர்ப்பாசய அழுக்குகள் வெளியேற :- சங்கிலை,வேப்பிலை அரைத்து காய்ச்சி ஆறியநீர் பிரசவ நாளிலிருந்து குடித்து வர வெளியேறும்."},{"n":966,"t":"சிறுநீர் நன்றாக பிரிய :- கருவுற்ற பெண்கள் இளநீரில் பனங்கற்கண்டு கலந்து குடிக்க சிறுநீர் நன்றாக பிரியும்."},{"n":967,"t":"சுகப்பிரசவம் ஆக :- ஆடுதின்னாபாளை வேர் 2கிராம் பொடி வெந்நீரில் குடிக்க மகப்பேறு வேதனை குறைந்து சுகப்பிரசவம் ஆகும்."},{"n":85,"t":"மேகநோய் - மேகபுண் குணமாக"},{"n":968,"t":"மேகபுண் குணமாக :- ஆலமரப்பட்டை வேர், மொட்டு, கொழுந்து பழம் விழுது சேர்த்து கஷாயம் செய்து குடிக்கலாம்."},{"n":969,"t":"இரத்த கெடுதலால் ஏற்படும் மேகநோய் தீர - பீச்சங்கு இலைச்சாறு 10மி. குடித்து வரலாம்."},{"n":970,"t":"மதுமேகம் தீர :- கோவைக்காய் 2தினமும் தின்று வரவும்."},{"n":971,"t":"மேகநோய் தீர - கஞ்சாங்கோரை இலை அரைத்து அரை கிராம் அளவு காலை, மாலை கொடுக்க குணமாகும்."},{"n":972,"t":"மேகரோகம் குணமாக :- ஆலம்பட்டையை பட்டுபோல் பொடி செய்து வெந்நீரில் கொதிக்க வைத்து கருப்பட்டி சேர்த்து சாப்பிட்டு வரலாம்."},{"n":973,"t":"மேகரணம், குஷ்டம், சிரங்கு குணமாக :- பிரமதண்டு இலை சாறை வெறும் வயிற்றில் குடிக்கலாம்."},{"n":974,"t":"மேகவெப்பம் தீர :- சீந்தில்பொடி இலை நெற்பொரி கஷாயம் செய்து சாப்பிடவும்."},{"n":975,"t":"பிரமேகம் குணமாக - ஆவாரம்பூ, வேர், பட்டை, இலை, காய் அனைத்தையும் காய வைத்து பொடியாக்கி சாப்பிடவும்."},{"n":976,"t":"மேகநோய் வெள்ளை தீர :- தென்னம்பூ மென்று தின்னவும்."},{"n":977,"t":"மேகவெட்டை, மூலச்சூடு தீர - நன்னாரி வேர் 5கிராம் அரைத்து பாலில் சாப்பிட்டு வரலாம்."},{"n":978,"t":"மதுமேக ரணங்கள் தீர :- புங்கமரப்பூவை உலர்த்தி நெய்யில் வறுத்து பொடி செய்து 1சிட்டிகை தேனில் கலந்து சாப்பிடவும்."},{"n":979,"t":"மதுமேகம் குணமாக :- வெந்தயப்பொடியை 1தேக்கரண்டி காலை, மாலை இருவேளை சாப்பிட்டு வரலாம்."},{"n":980,"t":"விதை வீக்கம் சரியாக :- மல்லிகைப்பூ வைத்து கட்டி வரலாம்."},{"n":981,"t":"மேகம், வாயு தீர :- வாத நாராயணன் இலைபொடி 2கிராம் வெந்நீரில் சாப்பிட்டு வரலாம்."},{"n":982,"t":"மேகரணம் தீர - புன்னை இலையை ஊறவைத்து நீரில் குளிக்கவும்."},{"n":983,"t":"பிரமேகம் நீங்க :- வாழை கிழங்கை அரைத்து துணிகட்டி சுட்டு சாம்பலாக்கி அந்த சாம்பலை தேத்தான் கொட்டை பொடி வெல்லம் சேர்த்து சாப்பிடலாம்."},{"n":984,"t":"மேகநோய் குணமாக - மாந்தளிர் உலர்த்தி பொடி செய்து தேனுடன் கலந்து உட்கொண்டால் குணமாகும்."},{"n":985,"t":"கிரந்தி மேகமொட்டை தீர :- பிரமிய வழுக்கை செடியை அரைத்து, 1கிராம் பாலில் சாப்பிடலாம்."},{"n":986,"t":"மேகரணம் தீர :- கொன்றைவேர் கஷாயம் குடித்து வரலாம்."},{"n":987,"t":"வெண்மேகம் தீர :- விழுதி இலைசாறு நல்லெண்ணையில் காய்ச்சி தொடர்ந்து 2துளி சாப்பிட்டு வரவும்."},{"n":988,"t":"மதுமேகம் தடுக்க :- கோவை காய்கள் 2ஐ தினமும் பச்சையாக சாப்பிட்டு வரலாம்."},{"n":989,"t":"மதுமேகம் குணமாக :- மஞ்சள்பொடி, நெல்லிக்காய் நீரில் காய்ச்சி காலை, மாலை சாப்பிடவும்."},{"n":990,"t":"மதுமேகம், அதிமூத்திரம் கட்டுப்பட :- நாவல்கொட்டை சூரணம் 2கிராம் நீரில் கலந்து காலை, மாலை குடித்து வரலாம்."},{"n":86,"t":"தொழுநோய்-தொற்றுகநொய்"},{"n":991,"t":"தொற்றுநோய் வராமல் தடுக்க :- செவ்வாழைப் பழத்தை தேனில் அரைமணிநேரம் ஊறவைத்து சாப்பிட்டு வரலாம். உடல் ஆரோக்கியம் பாதுகாக்கப்படும்."},{"n":992,"t":"தொழுநோய் :- 50வருஷ வேப்பம்பட்டை பூவரம்பட்டை பொடி கலந்து 2கிராம் சர்க்கரை சேர்த்து காலை மாலை சாப்பிடலாம்."},{"n":993,"t":"தொற்று நோய் :- தினசரி இரவு ஒரு செவ்வாழைப்பழம் சாப்பிட்டு வரலாம்."},{"n":994,"t":"தொழுநோய் குணமாக :- கடுக்காய் வேர், பட்டைவேர் பூ உலர்த்தி இடித்து சலித்து காலை, மாலை அரை கரண்டி பசும்பாலில் கலந்து உண்டு வரவும்."},{"n":995,"t":"தொழுநோய் :- சிவனார் வேம்பு செடி வேருடன் உலர்த்தி பொடி செய்து கற்கண்டு பாலில் சாப்பிடலாம்."},{"n":87,"t":"உடல் சதை பிடிக்க"},{"n":996,"t":"உடலின் எடை அதிகரிக்க :- தினம் இரவில் பால் சாப்பிடும் முன் ஒரு ஸ்பூன் தேன் கலந்து குடித்துவர விரைவில் எடை கூடும்."},{"n":997,"t":"உடல் பருமனாக :- பூசணிக்காய் சமைத்து தொடர்ந்து 3மாதம் சாப்பிட்டு வரலாம்."},{"n":998,"t":"மெலிந்த உடல் பெருக்கமடைய - கடலை, நேந்திரம் வாழைப்பழம், பசும்பால் தினமும் சாப்பிட்டுவர பயன் கிட்டும்."},{"n":999,"t":"உடல் பூரிக்க :- நிலவாகை சமூலம் நிழலில் உலர்த்திபொடி செய்து 2கிராம் அளவு பசுநெய்யில் சாப்பிட்டு வரலாம்."},{"n":1000,"t":"இளைத்த உடம்பு பெருக்க :- பூசணி தொடர்ந்து 3 மாதம் சாப்பிடவும்."},{"n":1001,"t":"உடல் இளைத்தவர்களுக்கு :- உடல் இளைத்துமெல்லியதாக இருப்பவர்களுக்கு இரும்பு சத்து அவசியம். அவர்கள் பேரீச்சம்பழத்தை சாப்பிட்டு வர உடல் பலம் பெறும்."},{"n":1002,"t":"ஒல்லியாக உள்ளவர்களுக்கு :- கால்ஷியம் தேவை காலையில் முருங்கை வேர் பொடி சாப்பிட வேண்டும். இரவில் கேழ்வரகு கஞ்சி சாப்பிட வேண்டும்."},{"n":88,"t":"வாய்புண் குணமாக"},{"n":1003,"t":"வாய்புண் குணமாக :- தேங்காய் பாலுடன் தேன் கலந்து குடிக்கலாம்."},{"n":1004,"t":"நாக்கில் புண் ஆற :- அகத்தி இலையை அலசி சுத்தம் செய்து குழுநீரில் போட்டு அவித்து அந்த ரசத்தை 3வேளை சாப்பிடலாம்."},{"n":1005,"t":"வாய்புண், வயிற்றுபுண் நீங்க :- மணத்தக்காளி கீரையை அடிக்கடி சமைத்து சாப்பிடலாம்"},{"n":1006,"t":"வாய்ப்புண் ஆற :- காட்டாமணக்கு பாலை வாயில் கொப்பளிக்கலாம்."},{"n":1007,"t":"வாய் உள்ரணம் குணமாக :- தேங்காய்ப் பால் தினமும் கொப்பளித்து குடித்து வரலாம்."},{"n":1008,"t":"வாய் வேக்காடு தீர :- திருநீற்றுப்பச்சிலை மெல்லுவதால் குணமாகும்."},{"n":1009,"t":"தொண்டைக்கட்டு, தொண்டை கமறல் குணமாக :- மாஇலை, பச்சை இலை நெருப்பில் போட்டு வரும் புகையை வாய் திறந்து பிடிக்க குணமாகும்."},{"n":1010,"t":"வாய், நாக்கு புண்ணிற்கு :- பப்பாளிப்பாலை தடவலாம்."},{"n":1011,"t":"வாய்ப்புண் - ரோஜா இதழ்களை அப்படியே சாப்பிட்டால் குணமாகும்."},{"n":1012,"t":"வாய் கசப்பு :- முருங்கை பூவை பருப்புடன் சமைத்து உண்ணலாம்."},{"n":1013,"t":"வாய்ப்புண், பல்வலி தீர :- கொள்ளுக்காய் வேளை வேரை கஷாயம் செய்து வாய் கொப்பளிக்கலாம்."},{"n":1014,"t":"வாய்ப்புண் தீர: ரோஜா பூ கஷாயம் செய்து கொப்பளிக்க தீரும்."},{"n":1015,"t":"நாக்கு புண் குணமாக :- நெல்லி வேர்பட்டை பொடி செய்து தேனில் கலந்து தடவ நாக்கு புண் குணமாகும்."},{"n":89,"t":"எலும்பு வலு பெறுவதற்கு"},{"n":1016,"t":"எலும்பு வலுப்பெற :- கோபுரம் தாங்கி செடி வேரை நிழலில் உலர்த்தி பொடி கற்கண்டு சேர்த்து காலை, மாலை நெய்யில் சாப்பிட வேண்டும்."},{"n":1017,"t":"எலும்பு மஜ்ஜை பிரச்சனைகள் தீர :- வைலட் எனும் அடர்ந்த நீலநிற ஒளி தீர்வு கொடுக்கும்."},{"n":1018,"t":"நரம்பு கோளாறு நீங்க :- வெள்ளறுகு சமூலம், மிளகு, சுக்கு, சீரகம் கஷாயம் 50மி.லி. காலை, மாலை குடிக்கலாம்."},{"n":90,"t":"குஷ்டம் - குஷ்டரோகம் குணமாக"},{"n":1019,"t":"வெண்குஷ்டம் தீர :- சந்தனத்தை எலுமிச்சஞ்சாற்றில் உரைத்து தடவ வேண்டும்."},{"n":1020,"t":"வெண்குஷ்டம், சோகை தீர :- ஈஸ்வர மூலி வேரை தேனில் அரைத்து 1கிராம் உள்ளுக்கு சாப்பிட்டு வரலாம்."},{"n":1021,"t":"குஷ்டம் தீர :- நன்னாரி வேர் பொடி வெண்ணையில் சாய்பிடவும்."},{"n":1022,"t":"குஷ்டம குணமாக :- வேப்பமரத்தின் பிசினை எடுத்து அதை தண்ணீருடன் கலந்து குடித்து வரலாம்."},{"n":1023,"t":"குஷ்டரோகம் குணமாக :- சுத்தி இலையை தின்றால் குஷ்ட ரோகம், உட்சூடு, கை கால்களுக்கு உண்டாகிற கருமேகம் நீங்கும்."},{"n":1024,"t":"குஷ்டரோகம் மட்டுப்பட :- கோணிக்கிழங்கை காய வைத்து இடித்து தூள் செய்து பசும்பாலுடன் சாப்பிடவும்."},{"n":1025,"t":"ஆரம்ப கட்ட குஷ்டம் குணமாக :- வேர் சூரணம் நன்னாரியில் செய்து வெண்ணெய்யில் கலந்து காலை, மாலை சாப்பிட்டு வரலாம்."},{"n":1026,"t":"கிருமி ரணம், குட்டரோக புண்கள் தீர :- புன்னை எண்ணையை பூசி வரவும்."},{"n":97,"t":"உடல் பருமன் குறைக்க - எடை குறைய"},{"n":1027,"t":"உடல் மெலிவு பெற :- பப்பாளிக்காயைச் சமைத்து உண்ணலாம்."},{"n":1028,"t":"ஊளை சதையைக் குறைக்க :- அடிக்கடி சோம்பு நீர் பருகலாம்."},{"n":1029,"t":"உடல் எடை குறைய :- அமுக்கிராவேர் பெருஞ்சீரகம் பாலில் காய்ச்சி குடித்து வரலாம்."},{"n":1030,"t":"தேவையற்ற கொழுப்பு குறைய :- பூண்டு, வெங்காயம் - அதிகம் உணவில் சேர்த்து வரலாம்."},{"n":1031,"t":"சதை போடுவதைத் தடுக்க :- வாழைத்தண்டு சாறு, அருகம்புல் சாறு இவைகள் எதை ஒன்றை தொடர்ந்து சாப்பிட்டு வரலாம்."},{"n":1032,"t":"தேகம் :- சுரைக்காய் சமைத்து உண்டுவர தேகத்தைக் கரைத்து சமநிலைப்படுத்தும்."},{"n":1033,"t":"தொப்பை குறைய :- சுரக்காய் வாரம் 2தடவை சாப்பிட்டு வரலாம்."},{"n":1034,"t":"பருத்த உடல் மெலிய :- மந்தாரை வேரை நீர்விட்டு பாதியாக காய்ச்சி தொடர்ந்து அருந்தி வரவும். 1035.உடல் வலிமை பெற :- அருகம்புல் சாறு தேன் கலந்து சாப்பிட்டு வர ஊழை சதை குறையும் உடல் வலிமை பெறும்."},{"n":1036,"t":"எடை கூடாமல் தடுக்க :- தேநீரில் எலுமிச்சம்பழசாறு கலந்து காலையில் குடித்து வர எடை கூடாமல் தடுக்கும்."},{"n":92,"t":"கெட்ட நீர் வெளியேற 1037.மிகு வியர்வை குணமாக :- காக்கிரட்டான் இலைசாறு, இஞ்சி சாறு கலந்து குடிக்கலாம்."},{"n":1038,"t":"துர்நீர் கழிய :- நீர்முள்ளிவிதை நெருஞ்சில், வெள்ளரிவிதை சிதைத்து கஷாயம் பணங்கற்கண்டு சேர்த்து குடிக்க துர்நீர் கழியும்."},{"n":1039,"t":"வாதநீர் வெளியேறி குத்தல் வலி குணமாக :- விழுதி இலை, பூண்டு, மிளகு, சீரகம் விளக்கெண்ணையில் தாளித்து ரசம் சாப்பிட தீரும்."},{"n":93,"t":"வயிற்றுக் கடுப்பு குணமாக"},{"n":1040,"t":"வயிற்றுக்கடுப்பு குணமாக :- காலையில் எழுந்ததும் வெந்தயத்தை வாயில் போட்டு தயிரைக் குடிக்க நீங்கும்."},{"n":1041,"t":"வயிற்றுக்கடுப்பு :- மாதுளம் பூவை கஷாயம் செய்து குடிக்க குணமாகும்."},{"n":1042,"t":"வயிற்றுக்கடுப்பு நீங்க :- அரச இலை கொழுந்தை மோருடன் அரைத்து மோருடன் கலந்து குடிப்பதன் மூலம் குணமாகும்."},{"n":1043,"t":"வயிற்றுக்கடுப்பு, மூலரணம் தீர :- இளம் தென்னங்காய் மட்டையை இடித்து பிழிந்து நீரை குடித்து வரலாம்."},{"n":1044,"t":"இரத்தக்கடுப்பு குணமாக :- விளாம்பிசினுடன் அதே அளவு வெள்ளைப்பூண்டு சேர்த்து அரைத்து தயிரில் கலந்து குடிக்க இரத்தக்கடுப்பு குணமாகும்."},{"n":1045,"t":"வயிற்றுகடுப்பு குணமாக :- தொட்டால் சுறுங்கி இலை சாறு தயிரில் கலந்து குடிக்க வயிற்று கடுப்பு குணமாகும்."},{"n":94,"t":"வயிற்று புண் குணமாக"},{"n":1046,"t":"வயிற்று வலி, பித்தவெடிப்பு :- மருதம் இலை அரைத்து 1கிராம் காலையில் சாப்பிட்டு வர தீரும்."},{"n":1047,"t":"இரத்த பேதி, வயிற்றுகடுப்பு :- மாந்தளிர் மாதுளை இலை அரைத்து 1கிராம் மோரில் குடிக்க தீரும்."},{"n":1048,"t":"வயிற்று கோளாறு :- புதினா துவையல் நல்லது."},{"n":1049,"t":"வயிற்றுப்புண் குணமாக :- அம்மான் பச்சரிசி இலை, துவரம் பருப்புடன் சேர்த்து சமைத்து பகல் சாதத்துடன் 7நாட்கள் சாப்பிட்டு வர நலமாகும்."},{"n":1050,"t":"அல்சர் நோய் குணமாக :- குடல் வெந்து ஓட்டை விழுவது தான் அல்சர் ஆகும். அல்சர் கண்டவர்கள் தினமும் ஒரு டம்ளர் திராட்சை பழச்சாறு குடித்து வர அல்சர் குணமாகும்."},{"n":1051,"t":"இரத்த வாந்தி, வயிற்று வலி :- வெங்காயம் உப்பை தொட்டு தின்ன தீரும்."},{"n":1052,"t":"வயிற்று கடுப்பு. வரும்மாடு :- மாமரவேர் பட்டை சிதைத்து கஷாயம் 3வேளை சாப்பிட்டு வர நீங்கும். 1053.குடல் புண் ஆற :- வில்வபழம் பொடி செய்து கால்கிராம் சாப்பிட்டு வரலாம்."},{"n":1054,"t":"வயிற்று உப்புசம் குணமாக :- சீரகம், கருஞ்சீரகம் இரண்டையும் பொடிசெய்து கருவேப்பிலை, வெங்காயம், வெள்ளைப்பூண்டு, கிராம்பு சேர்த்து தயிருடன் கலந்து பருகலாம்."},{"n":1055,"t":"வயிற்று வலிக்கு :- கசகசாவுடன் கருப்பட்டி மற்று 4கிராம்பு பொடி செய்து மூன்று வேளை சாப்பிட குணம் கிடைக்கும்."},{"n":1056,"t":"வயிற்று வலி தீர :- மாதுளம் பழத்தின் தோலை நெருப்பில்சுட்டு கரியாக்கி அந்த தூளை கோதுமை கஞ்சியுடன் கலந்து சாப்பிட்டு வரலாம்."},{"n":1057,"t":"வயிற்றுப் பொறுமல் குணமாக :- வெற்றிலை, ஓமம் இடித்து பிழிந்து தேன் சேர்த்து. பருகலாம்."},{"n":1058,"t":"வயிற்று நோய் குணமாக :- சீரகத்தை வறுத்து பொடி செய்து மோரில் சாப்பிட குணமாகும்."},{"n":1059,"t":"வயிற்றுபண், தொண்டைபுண் குணமாக :- தேங்காய்பால் கொப்பளித்து குடித்து வரலாம்."},{"n":1060,"t":"வயிற்று புண் தீர :- புளியம்பட்டை தூள் உப்பு சேர்த்து கஷாயம் குடிக்க வயிற்றுபுண் தீரும்."},{"n":1061,"t":"வயிற்றுவலி தீர :- கொன்றைபூ கஷாயம் குடிக்க குணமாகும்."},{"n":95,"t":"அம்மை தழும்பு மறைய"},{"n":1062,"t":"அம்மை நோய்க்கு :- சில துளசி இதழ்களுடன் சிறிய குங்குமப்பூ சேர்த்து அரைத்து கொடுக்க அம்மை நோய் குணமாகும்."},{"n":1063,"t":"அம்மை காய்ச்சல் :- அகத்தி மரப்பட்டை வேர்பட்டை கஷாயம் குடிக்கலாம்."},{"n":1064,"t":"அம்மை நோய் வராமல் தடுக்க :- 10கிராம் வெந்தயம், மிளகு 5 தட்டி பொடி செய்து தண்ணீர்விட்டு காய்ச்சி காலை, மாலை 3நாட்கள் தொடர்ந்து சாப்பிட்டால் அம்மை நோய் பரவும் காலத்தில் தடுத்துக் கொள்ளலாம்."},{"n":1065,"t":"அம்மைத் தழும்பு மாற :- கருவேப்பிலை 1பிடி, கசகசா 1 கரண்டி, கஸ்தூரி மஞ்சள் 1துண்டு சேர்த்து முகத்தில் பூசி காயவிட்டு குளித்து வந்தால் தழும்பு மறைந்து விடும்."},{"n":96,"t":"தாதுபலம் பெற"},{"n":1066,"t":"தாது பலப்பட :- 10கிராம் வில்வவேர்பட்டையை 1கிராம் சீரகத்துடன் அரைத்து பாலில் சாப்பிட்டு வரவும்."},{"n":1067,"t":"தாது இழப்பு தீர .:- சாதிக்காய் பொடி, பிரண்டை, உப்பு, நெய்யில் சேர்த்து சாப்பிடவும்."},{"n":1068,"t":"தாது விருத்தியாக :- முருங்கை இலை பொரியல் நெய்யுடன் 48நாட்கள் சாப்பிடவும்."},{"n":1069,"t":"புத்தி கூர்மை, தாதுவிருத்தி உடற்பொலிவு உண்டாக :- கோரைக்கிழங்கு சூரணம் 1கிராம் காலை,மாலை தேனில் சாப்பிடவும்,"},{"n":1070,"t":"தாது பெருக :- வாழைப்பூவை பருப்புடன் சமைத்து சாப்பிடலாம்."},{"n":1071,"t":"ஆண்மை பெருக :- திப்பிலி பொடியை நெய்யுடன் சாப்பிடவும்."},{"n":1072,"t":"ஆண்மை பெருக :- பேரீச்சம்பழத்தை ஆட்டுபாலில் ஊற வைத்து மறுநாள் காலையில் ஏலக்காய் சேர்த்து சாப்பிட ஆண்மை பெருகும்."},{"n":1073,"t":"தாதுமிடுப்பு ஊண்டாக :- வெடிக்காத தென்னம்பாளை பிஞ்சு பசும்பாலில் அரைத்து 2கிராம் தொடர்ந்து 48நாட்கள் சாப்பிட தாதுமிடுப்பு உண்டாகும்."},{"n":1074,"t":"தாதுகட்ட :- நெருஞ்சில் விதையை பாலில் அவித்து உலர்த்தி பொடி செய்து காலை மாலை சாப்பிட்டு வர தாது கட்டும்."},{"n":1075,"t":"தாதுபலம் உண்டாக :- முருங்கைபிசினை பொடிசெய்து அரை கரண்டி பாலில் காலை, மாலை சாப்பிட தாதுபலம் உண்டாகும்."},{"n":1076,"t":"தடைபட்ட மாதவிடாய் :- வேலிபருத்தி வாதநாராயணன் பொடி சாப்பிட சரியாகும்."},{"n":97,"t":"காது வலி குணமாக"},{"n":1077,"t":"காதுவலி குணமாக :- மணத்தக்காளி கீரையும், துளசியின் இலையையும் சமஅளவு எடுத்து இடித்துச் சாறு எடுத்து மூன்று துளிகள் காதில் விடலாம்."},{"n":1078,"t":"காது அடைப்பு, கட்டி :- தூதுவளை சாறு இரண்டு சொட்டு காதில் விட்டால் குணமாகும்."},{"n":1079,"t":"காதில் ஈ புகுந்தால் வெளியேற :- குப்பைமேனி சாறும், சிறுபிள்ளைகளின் சிறுநீரும் கலந்து சில சொட்டுகள் விட்டால் வெளியேறி விடும்."},{"n":1080,"t":"காதுவலி :- எலுமிச்சம்பழ சாறு 4துளி காதில் விடலாம்."},{"n":1081,"t":"சீழ் வருதல் நிற்க - தைவேளை இலைசாறு 1துளி விடலாம்."},{"n":1082,"t":"காது மந்தம் :- திருநீற்றுப் பச்சிலையை வாட்டிப் பிழிந்த சாறு இரண்டொரு துளி காதில் விட குணமாகும். 1083.காது குத்தல் நிற்க :- பெருங்காயத்தைப் பொறித்து தேங்காய் எண்ணெய்யில் சிறிது நேரம் ஊறவைத்து அதில் இருதுளிகள் காதில் விடலாம்."},{"n":1084,"t":"காதடைப்பு தீர :- சிறுதேட் கொடுக்கு இலைசாறு நல்லெண்ணையில் சமஅளவு கலந்து காய்ச்சி காதில் 2சொட்டு விட தீரும்."},{"n":1085,"t":"காது செவிடு சரியாக :- கொன்றைவேர்பட்டை, முருங்கை வேர்பட்டையும் அரைத்து துணியில் பிழிந்து சாறு 2செட்டு காதில் விட காது செவிடு சரியாகும்."},{"n":1086,"t":"காதில் கிருமி ஒழிய :- ஆமணக்கு பூ சாறு, வசம்பு, மணத்தக்காளி இலைசாறு, வெள்ளைபூண்டு ஏதாவது ஒரு சாறு காதில் விட கிருமி ஒழியும்."},{"n":98,"t":"வயிறு சம்பந்தமான அனைத்து நோய்களுக்கும் தீர்வுகள்"},{"n":1087,"t":"புதினா துவையல் வயிற்றுக் கோளாறுகளுக்கு நல்ல மருந்து."},{"n":1088,"t":"சுத்தமான புனுகை பருவின் மீது தடவி வர மறையும்."},{"n":1089,"t":"சீரகத்தை பொன் வறுவலாக வறுத்து பொடி செய்து சூரணமாக பனைவெல்லம் சேர்த்து சாப்பிட நன்கு பசி எடுக்கும்."},{"n":1090,"t":"மலச்சிக்கல் குணமாக சுரக்கொன்னை மர பூவை தேனில் ஊற வைத்து சாப்பிட்டு பால் சாப்பிட மலச்சிக்கல் வராது."},{"n":1091,"t":"குடல் வலிமை வெற வில்வமர பூக்களை புளி சேர்க்காமல் ரசம் வைத்து சாப்பிட்டு வர நலமாகும். வலிமை பெறும்."},{"n":1092,"t":"மாதுளம் பூவை கஷாயம் செய்து குடிக்க வயிற்றுக் கடுப்பு குணமாகும்."},{"n":1093,"t":"சுரக்காய் வாரம் 2தடவை சாப்பிட்டு வர தொப்பை குறையும்."},{"n":1094,"t":"குழந்தையின் வயிற்றின் மீது சூடுபடுத்திய வெற்றிலையை போட்டு வைத்தால் பொறுமல் வலி குணமாகும்."},{"n":1095,"t":"வயிற்று வலிக்கு கசகசாவுடன் கருப்பட்டு மற்றும் 4கிராம்பு பொடி செய்து மூன்று வேளை சாப்பிட குணம் கிடைக்கும்."},{"n":1096,"t":"மாதுளம் பூ இடித்து தேன் கலந்து சாப்பிட்டு வர மலத்துடன் இரத்தம் வருவது நிற்கும்."},{"n":1097,"t":"வயிற்றுப்பூச்சி ஒழிய பாகற்காயின் விதையை அரைத்து பாலுடன் கலந்து அருந்தி வர வயிற்றுப்பூச்சி புழுக்கள் ஒழியும்."},{"n":1098,"t":"பேதி குணமாக மாங்கொட்டையை பருப்பு பொடி செய்து பசும்பாலுடன் கலந்து சாப்பிட பேதி நிற்கும்."},{"n":1099,"t":"அஜீரணம் சரியாக ஒரு டம்ளர் தண்ணீரில் கருவேப்பிலை, இஞ்சி, சீரகம் இம்மூன்றையும் போட்டு கொதிக்க வைத்து ஆற வைத்து வடிகட்டி குடிக்க நிவர்த்தியாகும்."},{"n":1100,"t":"வாயு தொல்லை நீங்க வெள்ளைப்பூண்டை பசும்பாலில் வேகவைத்துச் சாப்பிட்டு வர விலகும்."},{"n":1101,"t":"விளாம்பழத்தின் கொழுந்து இலைகளை பறித்து கஷாயம் வைத்துச் சாப்பிட வாயு நீங்கி நல்ல பசி எடுக்கும்."},{"n":1102,"t":"வயிற்று நோய் குணமாக சீரகத்தை வறுத்து பொடி செய்து மோரில் சாப்பிட குணமாகும்."},{"n":1103,"t":"தும்மட்டி. காய் சாற்றில் கருஞ்சீரகத்தை அரைத்து விலாவில் பூசினால் குடல் புழுக்கள் வெளியேறி விடும்."},{"n":1104,"t":"ஆமணக்கு துளிரை விளக்கெண்ணையில் வதக்கி தொப்புளில் வைத்து கட்ட சூட்டு வயிற்று வலி தீரும்."},{"n":1105,"t":"நீர்முள்ளி விதையை பொடி செய்து 1கிராம் பாலில் கலந்து சாப்பிட்டு வர மோகம், வயிற்றுப் போக்கு தீரும்."},{"n":1106,"t":"வயிற்றுப்டச்சிகள் ஒழிய வேப்பிலையை நன்றாக அரைத்து சாறு எழுத்து அத்துடன் ஒரு கரண்டி தேன் கலந்து காலை, மாலை 2வேளை சாப்பிட வயிற்றுப்பூச்சிகள் தொந்தரவு தீரும்."},{"n":1107,"t":"குடல் புண் குணமாக மணத்தக்காளி கீரை சாப்பிட்டால் குடல் புண் குணமாகும்."},{"n":1108,"t":"வயிற்றுவலி குணமாக குறிஞ்சி கீரையை சாப்பிட்டு வர தீரும். கீரையை நிழலில் உலர்த்தி பவுடராகவும் சாப்பிடலாம்."},{"n":1109,"t":"வயிற்றுபுண், வாயு, பசியின்மை, மாதருக்கு உதிரப்போக்கு சரியாக நாய்வேளை இலையை சமைத்து உணவுடன் சாப்பிட்டு வர சரியாகும்."},{"n":1110,"t":"ஏலக்காய் பொடி தேனில் ஒரு நாளைக்கு மூன்று வேலை சாப்பிட்டு வர வயிற்றுவலி, வயிற்று பொருமல், அஜீரணம் குணமாகும்."},{"n":1111,"t":"எருக்கம் இலைச்சாறு 3துளியை 10துளி தேனி கலந்து கொடுக்க வயிற்றுப் புழுக்கள் வெளியேறும். (குழந்தைகளுக்கு கூடாது)."},{"n":1112,"t":"வயிறு பெருத்து உடல் சிறிதாக உள்ள குழந்தைகளுக்கு கோரை கிழங்கை தோல் நீக்கி சூப் வைத்து கொடுக்கச் சரியாகும்."},{"n":1113,"t":"அன்னாசிப்பழம் தினம் சாப்பிட வயிற்று பூச்சிகள் ஓழியும்."},{"n":1114,"t":"அவரை இலை சாறை தயிருடன் சாப்பிட பேதி நிற்கும்."},{"n":1115,"t":"தொடர் வயிற்றுப்போக்கு உள்ளவர்கள் பப்பாளிப்பழம் சாப்பிட குணமாகும்."},{"n":1116,"t":"வாழைப்பூவை வாரம் 1நாள் கூட்டாக செய்து சாப்பிட்டு வர வயிற்றுப்புண் ஆறும்."},{"n":1117,"t":"உஷ்ணபேதி குணமாக உலர்ந்த மாம்பூ, சீரகத்தை சேர்த்து தூள் செய்து சர்க்கரை சேர்த்து சாப்பிட குணமாகும்."},{"n":1118,"t":"கழிச்சல் குணமாக மாங்கொட்டை பருப்பு, மாதுளம்பூ, ஓமம் சேர்த்து பொடி செய்து மோரில் சாப்பிட கழிச்சல் குணமாகும்."},{"n":1119,"t":"மாதுளம்பழம் படுக்கைக்குச் செல்லுமுன் சாப்பிட குடல் புழுக்கள் அழியும்."},{"n":1120,"t":"வயிற்றுக்கடுப்பு நீங்க அரச இலை கொழுந்தை மோருடன் அரைத்து மோருடன் கலந்து சாப்பிடலாம்."},{"n":1121,"t":"குடல் புண் குணமாகவும், வயிற்றுப்புழுக்கள் அழியவும் அகத்தி கீரை நல்ல உணவு."},{"n":1122,"t":"வாழைத் தண்டு பொரியல் வைத்து சாப்பிட குடலில் சிக்கியிருக்கும் முடி, நஞ்சு ஆகியவை வெளியேறும்."},{"n":1123,"t":"குடல் புண் குணமாக முட்டைக்கோஸை நறுக்கி சிறிதளவு உப்பு சேர்த்து கொதிக்க வைத்து வடிகட்டி அந்த நீரை பருகி வர குடல் புண் குணமாகும்."},{"n":1124,"t":"விளாம்பழம் கிடைக்கும் காலங்களில் தினசரி ஒன்று சாப்பிட்டு வர பித்தத்தை குறைக்கும்."},{"n":1125,"t":"ஜாதிக்காயை தண்ணீர் விட்டு அரைத்து தொப்புளைச் சுற்றி பற்றப்போட பேதி நிற்கும்."},{"n":1126,"t":"பாகற்காய் கொடி இலையை சாறு பிழிந்து உட்கொள்ள வயிற்று பூச்சி அழியும்."},{"n":1127,"t":"இரவில் கண்விழித்து நெடுநேரம் வேலை செய்பவர்கள் காலையில் இளநீர் தொடர்ந்து சாப்பிட 8 நாட்களில் வயிற்று வலி தீரும்."},{"n":1128,"t":"முள்ளங்கி கிழங்கு சமைத்து உண்டு வர வயிற்றுக் கோளாறுகள் நீங்கும்."},{"n":1129,"t":"கரிசலாங்கன்னி கீரையை சமைத்து உண்டு வர மகோதரம் தீரும்."},{"n":1130,"t":"இரவு சாப்பாட்டை 7மணிக்குள்ளாக முடித்துவிட்டால் ஜீரண மண்டலம் சீர்படும். பசியிருப்பின் பழச்சாறுகள் மட்டும் அருந்தலாம். பொது விளக்கம்"},{"n":1131,"t":"பிரயாணத்தின் போது வாந்தி நிற்க :- தினசரி ஒரு நெல்லிக் காய் என தொடர்ந்து 41நாட்கள் சாப்பிட வாந்தி வராது."},{"n":1132,"t":"நெஞ்சு சளி :- தேங்காய் எண்ணெயில் கற்பூரம் சேர்த்து சுடவைத்து நெஞ்சில் தடவ குணமாகும்."},{"n":1133,"t":"ஜலதோஷம் :- மாதுளம் பழம் சாப்பிட ஜலதோஷம் குணமாகும்."},{"n":1134,"t":"வாந்தி நிறுத்த :- வேப்பம்பூவை வறுத்து 'பொடி செய்து பருப்பு ரசத்துடன் கலந்து சாப்பிட வாந்தி நிற்கும்."},{"n":1135,"t":"தலைப்பாரம் குறைய :- நல்லெண்ணையில் தும்பை பூவை போட்டு காய்ச்சி தலையில் தேய்த்து குளித்து வர தலைபாரம் குறையும்."},{"n":1136,"t":"தும்மல் நிற்க :- தூதுவளை பொடியில் மிளகு பொடி கலந்து தேனில் அல்லது பாலில் சாப்பிட தும்மல் நிற்கும்."},{"n":1137,"t":"இருமல் நிற்க :- முற்றிய வெண்டைக்காயை சூப் செய்து குடித்து வந்தால் இருமல் உடனே நிற்கும்."},{"n":1138,"t":"தலைவலி குணமாக :- குப்பைமேனி சாறு தடவ குணமாகும்."},{"n":1139,"t":"தலைச் சுற்றல். குணமாக :- கீழாநெல்லி தைலத்தை பூசி குளித்து வந்தால் தலைசுற்றல் நிற்கும்."},{"n":1140,"t":"சளித்தொல்லை நீங்க :- தூதுவளை செடியில் ரசம் வைத்து சாப்பிட ஜலதோஷம் நிற்கும்."},{"n":1141,"t":"கண்பிரகாசம் அடைய :- தூதுவளைகாய் ஊறுகாய் செய்து சாப்பிட கண் ஒளி பெறும்."},{"n":1142,"t":"ஆஸ்துமா குணமாக : - சங்கு இலையை துவையலாக சாப்பிட குணமாகும்."},{"n":1143,"t":"சளித்தொல்லை நீங்க :- அருகம்புல் சாறு பருகி வர சளிதொல்லை நீங்கும்."},{"n":1144,"t":"கண்நோய் :- முருங்கை கீரை சாப்பிட கண் நோய் தீரும்."},{"n":1145,"t":"கண்நோய் நீங்க அன்னாசிப்பழம் சாப்பிட கண் நோய் குணமாகும்."},{"n":1146,"t":"காது அடைப்பு நீங்க :- தூதுவளை இரண்டு சொட்டு காதில் இட்டு வர காது அடைப்பு நீங்கும்."},{"n":1147,"t":"விக்கல் குணமாக :- நெல்லிக்காய் இடித்து சாறு பிழிந்து தேன் சேர்த்து சாப்பிட்டால் விக்கல் தீரும்."},{"n":1148,"t":"வாய்ப்புண் குணமாக :- அருகம்புல், சுண்ணாம்பு கலந்து பூசி வர குணமாகும்."},{"n":1149,"t":"பல்வலி குணமாக :- கோவைப்பழம் சாப்பிட குணமாகும்."},{"n":1150,"t":"பசி உண்டாக :- பிரண்டையை நெய்விட்டு வதக்கி துவையல் செய்து சாப்பிட்டு வர பசி உண்டாகும்."},{"n":1151,"t":"குடல் புழுக்கள் அழிய :- மாதுளம் பழம் சாப்பிட குடல் புழுக்கள் அழியும்."},{"n":1152,"t":"அல்சர் குணமாக தினமும் ஒரு டம்ளர் திராட்சை பழச்சாறு குடித்து வர குணமாகும்."},{"n":1153,"t":"சீதபேதி குணமாக :- நுங்கை தோல் உறிக்காமல் சாப்பிட்டு வர சீதபேதி குணமாகும்."},{"n":1154,"t":"மூட்டு வலி குணமாக :- அத்தி பாலை பற்றுபோட குணமாகும்."},{"n":1155,"t":"பித்த வெடிப்பு :- வேப்ப எண்ணையை மஞ்சள் சேர்த்து போட குணமாகும்."},{"n":1156,"t":"கழுத்துவலி குணமாக :- ஆடாதோட இலையை தேங்காய் எண்ணெய் விட்டு வதக்கி ஒத்தடம் கொடுக்க குணமாகும்."},{"n":1157,"t":"ஊறல் அரிப்பு குணமாக :- சரக்கொன்றை இலையை அரைத்து பற்று போட குணமாகும்."},{"n":1158,"t":"கால் அரிப்பு நீங்க :- இலுப்பை பூவை கஷாயம் செய்து புண்களின் மீது தடவி வர குணமாகும்."},{"n":1159,"t":"முள் வெளிவேற :- அம்மன் பச்சரிசி பாலை தடவ வேண்டும்."},{"n":1160,"t":"காய்ச்சல் குணமாக :- நார்த்தங்காய் செடி இலையை கஷாயம் செய்து குடிக்க காய்ச்சல் குணமாகும்."},{"n":1161,"t":"மூலம் :- பப்பாளி பழம் சாப்பிட்டு வர மலச்சிக்கல் நீங்கி மூலத்தை குணமாகும்."},{"n":1162,"t":"மார்பு வலி குணமாக :- வெந்தயத்தை வேகவைத்து தேன்விட்டு கடைந்து உட்கொள்ள மார்புவலி குணமாகும்."},{"n":1163,"t":"இதய படபடப்பு நீங்க :- தினசரி 1பேரிக்காய் சாப்பிட சரியாகும்."},{"n":1164,"t":"இடுப்பு வலி குணமாக :- வெள்ளைப்பூண்டு, கருப்பட்டி, சேர்த்து சாப்பிட்டு வர குணமாகும்."},{"n":1165,"t":"குழந்தைகளுக்கு மூச்சு திணறல் குணமாக :- வெற்றிலை சாறுடன் கோரோஷனை இழைத்து அரைசங்கு புகட்ட குணமாகும்."},{"n":1166,"t":"நினைவாற்றல் :- வல்லாரை மூலிகை நிறைவாற்றலை அதிகரிக்கும்."},{"n":1167,"t":"பரு :- ஜாதிக்காய், சந்தனம், மிளகு, சேர்த்து. அரைத்து தடவ குணமாகும்."},{"n":1168,"t":"உதட்டில் வெடிப்பு அத்திகாயை உட்கொண்டால் வெடிப்பு குணமாகும்."},{"n":1169,"t":"உடலின் எடை அதிகரிக்க - பாலில் ஒரு ஸ்பூன் தேன் கலந்து குடித்தால் உடலின் எடை கூடும்."},{"n":1170,"t":"உடல் மெலிவு பெற :- பப்பாளிக்காயைச் சமைத்து உண்டு வர தடித்த உடம்பு குறையும்."},{"n":1171,"t":"உடல் பலம் பெற அத்திப்பழம் தொடர்ந்து 40நாள் சாப்பிடவும்."},{"n":1172,"t":"அரளிப்பூ :- தலையில் வைத்துக் கொண்டால் பேன் ஒழயும்."},{"n":1173,"t":"ரோஜாப்பூ :- ரோஜா இதழ்களை அப்படியே சாப்பிட்டால் வாய்ப்புண் குணமாகும்."},{"n":1174,"t":"சிறுநீர் எரிச்சல் குணமாக :- அன்னாசிபழசாறு சாப்பிட சிறுநீர் எரிச்சல் குணமாகும்."},{"n":1175,"t":"கொத்தமல்லி கீரை :- மூளை, மூக்கு சம்பந்தமான சகல வியாதிகளும் குணமாகும்."},{"n":1176,"t":"செவ்வாழைப்பழம் :- கல்லீரல் வீக்கம், மூத்திரவியாதியை குணமாக்கும்."},{"n":1177,"t":"பச்சை வாழைப்பழம் :- குளிர்ச்சியைக் கொடுக்கும்."},{"n":1178,"t":"ரஸ்தாளி -:- கண்ணிற்கும், உடல் வலுவிற்கு நல்லது."},{"n":1179,"t":"பேயன் வாழைப்பழம் :- வெப்பத்தைக் குறைக்கும்."},{"n":1180,"t":"கற்பூர வாழை :- கண்ணிற்குக் குளிர்ச்சி."},{"n":1181,"t":"நாவல்பழம் :- நீரிழிவை நீக்கும், புண்ணை நீக்கும்."},{"n":1182,"t":"நேந்திரம் பழம் :- இரும்புச் சத்தினை உடலுக்குக் கொடுக்கும்."},{"n":1183,"t":"கொய்யா :- சர்க்கரை வியாதியுள்ளவர்களுக்கு நல்லது."},{"n":1184,"t":"பப்பாளி :- மூல வியாதிகாரர்களுக்கு நல்லது."},{"n":1185,"t":"மாம்பழம் :- ரத்த அழுத்தம் சீராகும்."},{"n":1186,"t":"ஆப்பிள் :- மலச்சிக்கலை போக்கும். 1187.திராட்சை :- இரத்த அழுத்தத்திற்கு நல்லது."},{"n":1188,"t":"எலுமிச்சை :- மலச்சிக்கலை போக்கும்."},{"n":1189,"t":"செர்ரி :- கருப்பை வியாதிகளுக்கு நல்லது."},{"n":1190,"t":"மாதுளம்பழச்சாற்றில் பால் சேர்த்து சாப்பிட இரும்புசத்து கிடைக்கும்."},{"n":1191,"t":"கேழ்வரகு :- கேழ்வரகு கூழ் செய்து பருகினால் பித்தம் தணியும்."},{"n":1192,"t":"இஞ்சியை மென்று தின்றால் குரல் கம்மல் சரியாகி விடும்."},{"n":1193,"t":"வெந்தயம் கல்லீரல் வீக்கம், இருமல், வயிற்றுவலிக்கு சிறந்தது."},{"n":1194,"t":"வெங்காயம் :- பசுவெண்ணையுடன் கலந்து சாப்பிட மூல வியாதி குணமாகும்."},{"n":1195,"t":"பூண்டு - பூண்டை சுட்டு சாப்பிட்டு நீர் குடித்தால் இருதய நோய்க்கு நல்லது."},{"n":1196,"t":"வாழைப்பூ - விந்துவை அதிகரிக்கச் செய்யும்."},{"n":1197,"t":"நெல்லிக்கனி :- உடல் அசதியைப் போக்கி உடலுக்கு புத்துணர்ச்சி அளிக்கும்."},{"n":1198,"t":"மிளகு :- பூச்சிகடிகளுக்கு மிளகு சாப்பிடுவதால் உடலில் உள்ள நஞ்சு அழிந்து விடும்."},{"n":1199,"t":"நெய்யை வெண்கலப் பாத்திரத்தில் வைத்து உபயோகிக்கக் கூடாது."},{"n":1200,"t":"கமலாப்பழம் உடல் உஷ்ணத்தை பித்தக் கோளாறுகளை நீக்கும்."},{"n":1201,"t":"அரைக்கீரை :- நரம்பு தளர்ச்சியை போக்கும்."},{"n":1202,"t":"வல்லாரை :- நினைவாற்றலை பெருக்கும்."},{"n":1203,"t":"அகத்திக்கீரை :- மலச்சிக்கலைப் போக்கும்."},{"n":1204,"t":"முளைக்கீரை :- பல் சம்பந்தமான வியாதிகளை குணமாக்கும்."},{"n":1205,"t":"பொன்னாங்கன்னி கீரை :- இரத்தம் விருத்தியாகும்."},{"n":1206,"t":"எலுமிச்சை :- மலச்சிக்கலை போக்கும்."},{"n":1207,"t":"செர்ரி :- கருப்பை வியாதிகளுக்கு நல்லது."},{"n":1208,"t":"மாதுளம்பழம் - இரும்புச்சத்து கிடைக்கும்."},{"n":1209,"t":"நாவல் பழம் :- நீரிழிவைக் கட்டுப்படுத்தும்."},{"n":1210,"t":"சாத்துக்குடி - இரத்த அழுத்தத்திற்கு நல்லது."},{"n":1211,"t":"அரசம்பட்டை - வாயில் ஏற்படும் புண்களை குணமாக்கும்."},{"n":1212,"t":"வெண்கடுகு - முடக்குவாதத்தை குணமாக்கும்."},{"n":1213,"t":"குங்குமப்பூ - ரத்தத்தைத் தூய்மைப்படுத்தும்."},{"n":1214,"t":"முள்ளங்கி - கபநோய், இருமல் ஆகியவை தீரும்."},{"n":1215,"t":"வெந்தயம் - இரவில் ஊறவைத்து காலையில் உண்டால் உடல் பருக்கும்."},{"n":1216,"t":"மீன், கருவாடு சாப்பிட்ட உடன் பால் அருந்தக்கூடாது."},{"n":1217,"t":"கோதுமையை நல்லெண்ணையுடன் சமைத்து உண்ணக்கூடாது."},{"n":1218,"t":"உடல் மெலிந்தவர்கள் புழுங்கல் அரிசி சாதம் சாப்பிடுவது நல்லது."},{"n":1219,"t":"இரத்தசோகை :- கொய்யாப்பழம் சாப்பிடுவதால் குணமாகும்."},{"n":1220,"t":"முசுமுசுக்கை இலையை பொடியாக நறுக்கி மாதம் 2தடவை சாப்பிட்டால் நுரையீரல் புற்று நோய் வராது."},{"n":1221,"t":"எலுமிச்சை சாறுடன் தேன் கலந்து சாப்பிட்டு வந்தால் மலேரியா குணமாகும்."},{"n":1222,"t":"கொய்யாபழம் சாப்பிட்டால் கல்லீரல் பலப்படும். 1223.சர்க்கரை நோய் நீங்க பாகற்காய் சாப்பிட குணமாகும்."},{"n":1224,"t":"வேப்பஇலை, அருகம்புல் சாறு சாப்பிட்டு வர புற்றுநோய் குணமாகும்."},{"n":1225,"t":"வாழைப்பூ :- சீதபேதி, ரத்த மூலம் கட்டுப்படுத்தும்."},{"n":1226,"t":"தும்பை இலைச்சாறு தேள், பாம்புகடி விஷம் முறியும்."},{"n":1227,"t":"சுறுசுறுப்பாக இருக்க ரோஜா இதழ்களை சாப்பிட வேண்டும்."},{"n":1228,"t":"தினசரி ஆட்டுப்பால் சாப்பிட வலிப்புநோய் குணமாகும்."},{"n":1229,"t":"வல்லாரை கீரை சாப்பிட்டு வந்தால் யானைக்கால் நோய் குணமாகும். 1230.டீ அல்லது காப்பியில் சிறிதளவு எலுமிச்சைசாறு கலந்து குடித்தால் தலைவலி குறையும்."},{"n":1231,"t":"திராட்சை பழம் சாப்பிட்டு வந்தால் ஈரல் சம்பந்தமான நோய் குணமாகும்."},{"n":1232,"t":"அத்திபழம் சாப்பிட்டு வர நரம்பு தளர்ச்சி குணமாகும்."},{"n":1233,"t":"தர்ப்பைப் புல் கஷாயம் பருகினால் இரத்தம் சுத்தமாகும். 1234.கொத்த. மல்லி. பசியைத் தூண்டும். 1235.பிஞ்சு அவரைக்காய் நீரிழிவு நோயை குறைக்கும்."},{"n":1236,"t":"வெந்தயம் அரைத்து தலையில் தேய்த்து குளித்தால் முடி உதிராது."},{"n":1237,"t":"மஞ்சளை இரவில் பூசி காலையில் கழுவி வர தேவையில்லாத முடி நீங்கும்"},{"n":1238,"t":"தாய்ப்பால் சுரப்பை நிறுத்த அரைக்கீரை சாப்பிடுவதால் நிறுத்தலாம். 1239.வெந்தயக் கஞ்சி சாப்பிட பெண்களுக்கு தாய்ப்பால் பெருகும்."},{"n":1240,"t":"வெங்காயத்தை உப்பில் தொட்டு தின்று வர இரத்த வாந்தி நிற்கும்."},{"n":1241,"t":"மஞ்சளைச் சுட்டு புகையை நுகர நீர்கோவை தீரும்."},{"n":1242,"t":"துளசி சாறு இதய நோய்க்கு சிறந்த மருந்து. 1243.இஞ்சி முரப்பா சாப்பிட்டால் புளி ஏப்பம், பொருமல் தீரும்."},{"n":1244,"t":"சந்தனத்துடன் எலுமிச்சை சாறு தடவ வேர்குரு மறையும்."},{"n":1245,"t":"வெந்தயம் மூத்திர உறுப்புகளைச் சுத்தப்படுத்தும்."},{"n":1246,"t":"திராட்சை மஞ்சள் காமாலையைப் போக்கும்."},{"n":1247,"t":"குப்பை மேனி சாறு தடவ தலைவலி குணமாகும்."},{"n":1248,"t":"நெல்லிக்காய் சாறுடன் தேன் கலந்து சாப்பிட்டால் விக்கல் நிற்கும்."},{"n":1249,"t":"தூதுவளை உண்பதால் மூச்சு வாங்குதல் குணமாகும்."},{"n":1250,"t":"குங்குமப்பூவுடன் தேன் கலந்து சாப்பிட சுவாசப் குழாய் அலர்ஜி குணமாகும்."},{"n":1251,"t":"சங்கு இலையை துவையல் த செய்து சாப்பிட ஆஸ்துமா குணமாகும்."},{"n":1252,"t":"நாயுறுவிசாறு இரண்டு சொட்டு காதில் விட சீழ் வடிதல் நிற்கும்."},{"n":1253,"t":"மஞ்சள், அருகம்புல், சுண்ணாம்பு கலந்து பூசினால் நகச் சுற்று குணமாகும்."},{"n":1254,"t":"புளி, உப்பு சமஅளவு எடுத்து மைய அரைத்து நாக்கில் தடவ டான்சில் நோய் குணமாகும்."},{"n":1255,"t":"பொன்னாவரை கீரை விதை அடிக்கடி சமைத்து சாப்பிட உடல் பருமன் குறையும்."},{"n":1256,"t":"சுரக்காய் சாப்பிட்டு வர தொப்பை குறையும்."},{"n":1257,"t":"தினமும் 1துண்டு பப்பாளிப்பழம் சாப்பிட செரிக்கும் திறன் பெருகும். 1258.மலைவாழைபழத்தை நல்லெண்ணையுடன் சாப்பிட சீதபேதி குணமாகும்."},{"n":1259,"t":"சுண்டைக்காய் சமைத்து உண்ண மூலக்கடுப்பு தீரும்."},{"n":1260,"t":"கொய்யா கொழுந்து இலையை மென்று தின்ன குடல் வாயு தீரும்."},{"n":1261,"t":"கொய்யா வேரை கொதிக்க வைத்து காலையில் குடிக்க பேதி நிற்கும்."},{"n":1262,"t":"நந்தியாவட்டை பூவால் ஒத்தடம் கொடுக்க கண் எரிச்சல் தீரும்."},{"n":1263,"t":"நந்தியாவட்டை வேரை மென்று துப்ப பல்வலி நீங்கும்."},{"n":1264,"t":"நித்தியகல்யாணி வேர் பொடி 1சிட்டிகை வெந்நீரில் 3 முறை கொடுக்க சிறுநீர் சர்க்கரை குறையும்."},{"n":1265,"t":"நிலவேம்பு வேர், கண்டங்கத்திரி வேர் கஷாயம் 3முறை குடிக்க மலேரியா குணமாகும்."},{"n":1266,"t":"தழுதாழை இலைசாறு மூக்கில் உறிஞ்சி வர மண்டை குடைச்சல் தீரும்."},{"n":1267,"t":"நில ஆவரைகியாழத்தை தடவிவர சொறி, சிரங்கு படை ஆறும்."},{"n":1268,"t":"கோவை காய் 2தினமும் தின்று வர மதுமேகம் தீரும். 1269.கோவை கிழங்கு சாறு 10மி.லி. குடித்து வர மார்புசளி தீரும்."},{"n":1270,"t":"சிறுகுறிஞ்சாவேர் பொடி திரிகடுகபொடி வெந்நீரில் சாப்பிட ஆஸ்துமா தீரும்."},{"n":1271,"t":"இளம் தென்னங்காய் மட்டையை இடித்து பிழிந்து நீரை குடித்து வர வயிற்று கடுப்பு, மூலரணம் தீரும்."},{"n":1272,"t":"துத்தி பூ பொடி சர்க்கரை பால் சேர்த்து சாப்பிட இரத்த வாந்தி தீரும்."},{"n":1273,"t":"சிலந்திநாயம் இலைசாறு 50மி.லி. குடிக்க பாம்பு நஞ்சு நீங்கும்."},{"n":1274,"t":"தென்னம்பூ மென்று தின்ன மேகநோய் வெள்ளை தீரும்."},{"n":1275,"t":"பீச்சங்கு இலை சாறு 10மி.லி. குடித்து வர இரத்த கெடுதால் ஏற்படும் மேனநோய் தீரும்."},{"n":1276,"t":"நாயுறுவி இலை சாறை தடவி வர தேமல் படை குணமாகும். 1277.சிறு குறிஞ்சா வேர் பொடி கஷாயம் சாப்பிட காய்ச்சல் தீரும்."},{"n":1278,"t":"நாயுறுவி இலையை கசக்கி தேய்க்க தேள்விஷம் இறங்கும்."},{"n":1279,"t":"நாயுறுவி விதை பொடி, துத்தி கீரையுடன் சேர்த்து சமைத்து உண்ண மூலம் அனைத்தும் தீரும்."},{"n":1280,"t":"நாயுறுவி விதையை சோறுபோல் சமைத்து உண்ணலாம், பசி இராமல் 1வாரம் ஆகாரம் இல்லாமல் இருக்கலாம்."},{"n":1281,"t":"திருநீற்றுப் பச்சிலை மெல்லுவதால் வாய் வேக்காடு தீரும்."},{"n":1282,"t":"பாதாளமூலி வேரை பொடி செய்து 5கிராம் சாப்பிட விஷகடிகள் முறியும் . 1283.பாதாளமூலி பழச்சாறில் செய்த மணப்பாகு சாப்பிட்டு வர வெப்ப நோய் தீரும்."},{"n":1284,"t":"மகிழம்பட்டை கஷாயம் வாய் கொப்பளிக்க வாய்புண் ஆறும்."},{"n":1285,"t":"நத்தைசூரி விதையை வறுத்து பொடித்து காய்ச்சி கற்கண்டு சேர்த்து சாப்பிட்டுவர கல்லடைப்பு தீரும்."},{"n":1286,"t":"திருநீற்றுப் பச்சிலை விதை கொதிநீரில் ஊறவைத்து சாப்பிட இரத்த கழிசல் தீரும்."},{"n":1287,"t":"நத்தைசூரி வேரை பசும்பாலில் காய்ச்சி குடிக்க தாய்பால் பெருகும்."},{"n":1288,"t":"நத்தைசூரி இலை சாறை 15மி.லி. காலை மாலை சாப்பிட சளி தீரும்."},{"n":1289,"t":"துளசியை அவித்து சாறு பிழிந்து குடிக்க சளியை அகற்றும்."},{"n":1290,"t":"துளசிஇலை, இஞ்சி கஷாயம் காய்ச்சி குடிக்க சீதளக் காய்ச்சல் குணமாகும் ."},{"n":1291,"t":"கருந்துளசி இலை, செம்பருத்திபூ கஷாயம் 10நாட்கள் சாப்பிட இதயத்தில் குத்தும் வலி குணமாகும்."},{"n":1292,"t":"கருந்துளசி இலை, மருதம்பட்டை கஷாயம் சாப்பிட சீரற்ற இதய துடிப்பு சரியாகும். 1293.துளசி இலை, இஞ்சி தாமரைவேர் அரைத்து கொதிக்க வைத்து பற்றிட விலாவலி தீரும்."},{"n":1294,"t":"துளி இலைசாறு, கரிசாலை சாறு கலந்து காதில் விட காதுவலி சீழ்வடிதல் குணமாகும்."},{"n":1295,"t":"துளசி விதை பொடி தாம்பூலத்துடன் மெல்ல தாது கட்டும்."},{"n":1296,"t":"தும்பை இலைசாறு பாம்பு தீண்டியவர்களுக்கு கொடுக்க பேதியாகும். 3நாள் தூங்காமல் உப்பில்லாமல் சாப்பிடவேண்டும்."},{"n":1297,"t":"பப்பாளி பாலை விளக்கெண்ணையில் குடிக்க வயிற்றுப் பூச்சிகள் நீங்கும்."},{"n":1298,"t":"பாகல் இலை சாறு தடவ உள்ளங்கால் எரிச்சல் தீரும்."},{"n":1299,"t":"பாகற்காய் வற்றல் வறுத்து உண்டுவர காமாலை கல்லீரல் குறைபாடு நீங்கும்."},{"n":1300,"t":"மகிழ இல்லை கசாயத்தில் வாய் கொப்பளிக்க பல்நோய் அனைத்தும் நீங்கும்."},{"n":1301,"t":"மகிழம்காயை மென்று அடக்கி வைத்திருந்து பல் ஆட்டம் நீங்கி பல் உறுதிப்படும்."},{"n":1302,"t":"நுணாஇலை அரைத்து தடவ புண் சிரங்கு ஆறும். 1303.நுணா வேரை கஷாயமிட்டு குடிக்க சுகபேதியாகும்."},{"n":1304,"t":"நன்னாரி வேர் கஷாயம் செய்து சாப்பிட்ட வர வாதம் தீரும்."},{"n":1305,"t":"நெல்லி வற்றல், பச்சைபயறு கஷாயம் காலை, மாலை சாப்பிட தலை சுற்றல் இரத்த கொதிப்பு தீரும். 1306.தூதுவளை பூ 10பாலில் சர்க்கரை சேர்த்து காய்ச்சி 48நாட்கள் குடித்து வர முகவசீகரம் அழகு பெறலாம்."},{"n":1307,"t":"தூதுவளை கண்டங்கத்திரி, பற்பாடகம் விஷ்ணுகிராந்தி கஷாயம் காய்ச்சி 10மி.லி வேளை குடித்து வர சன்னிசுரம், டைபாய்டு குணமாகும். 1308.நீர் முள்ளி விதை பொடி 1கிராம் பாலில் சாப்பிட்டு வர ரத்தம் சுத்தமாகி விந்து ஊறும். 1309.நன்னாரிவர் கஷாயம் சாப்பிட்டு வர செரியாமை, தோல் நோய்கள் தீரும்."},{"n":1310,"t":"நொச்சி இலைசாறு, மிளகுதூள் நெய் சேர்த்து சாப்பிட மூட்டுவலி தீரும்."},{"n":1311,"t":"மருதோன்றி பூ 2இரவு சாப்பிட நல்ல தூக்கம் வரும்."},{"n":1312,"t":"தேங்காய் பூவை வதக்கி மார்பில் கட்டி வர பால் சுரப்பு நிற்கும்."},{"n":1313,"t":"தேங்காய் பாலை கொப்பளித்து குடித்து வர நாக்கு புண் குணமாகும்."},{"n":1314,"t":"நன்னாரிவேர் பொடி வெண்ணெயில் சாப்பிட குஷ்டம் தீரும்."},{"n":1315,"t":"மருதம்பட்டை செம்பருத்தி பூ கஷாயம் 48நாட்கள் சாப்பிட்டு வர இதய நோய் குணமாகும்."},{"n":1316,"t":"மருதம்பட்டை, நாவல்பட்டை, ஆலம் விழுது கஷாயம் 48நாட்கள் சாப்பிட மதுமேகம் தீரும்."},{"n":1317,"t":"மருதம்பட்டை, கரிசலாங்கன்னி தூள் 1கிராம் தேனில் சாப்பிட்டு வர கல்லீரல் வீக்கம் குறையும்."},{"n":1318,"t":"பற்பாடகம் இலையை பாலில் அரைத்து பூசி குளிக்க உடல் நாற்றம் நீங்கும்."},{"n":1319,"t":"பற்பாடகம், நிலவேம்பு, சுக்கு, சீரகம் அதிமதுரம் கஷாயம் குடித்து வர நச்சுகாய்ச்சல போகும்."},{"n":1320,"t":"பரங்கிவிதை, வெள்ளரிலிதை, பூனைக்காலிவிதை கஷாயம் குடித்து வர சிறுநீரக கோளாறு நீங்கும்."},{"n":1321,"t":"பறங்கி விதை உலர்த்தி பொடி செய்து சீரகம் வெல்லம் சேர்த்து உண்டு வர இரத்தவாந்தி நிற்கும்."},{"n":1322,"t":"பால்பெருக்கிஇலையை அரைத்து துவையல் செய்து சாப்பிட மலச்சிக்கல் தீரும்."},{"n":1323,"t":"பிரமதண்டு இலைசாறு 10மி.லி. வெறும் வயிற்றில் 1மாதம் குடிக்க சொறி சிரங்கு தீரும்."},{"n":1324,"t":"பிரமதண்டு சமூல சாம்பல் 3அரிசி எடை தேனில் சாப்பிட ஆஸ்துமா இரப்பிருமல் நுரையீரல் நோய் தீரும்."},{"n":1325,"t":"பிரமதண்டு வேர் பொடி வெர்நீர்ல் குடிக்க மலப்புழுக்கள் வெளிவேறும்."},{"n":1326,"t":"புங்கமர பூவை உலர்த்தி நெய்யில் வறுத்து பொடி செய்து"},{"n":1,"t":"சிட்டிகை தேனில் சாப்பிட்டு வர மதுமேகரணங்கள் தீரும்."},{"n":1327,"t":"மருதோன்றி வேர் பட்டையை அரைத்து கட்ட கால் ஆணி குணமாகும்."},{"n":1328,"t":"மருதம்பட்டை ஆடாதொடை பொடி வெள்ளாட்டுப்பாலில் கலந்து குடித்து வர நுரையீரல் புண் ஆறும்."},{"n":1329,"t":"மருதம் இலை அரைத்து 1கிராம் காலை சாப்பிட்டு வர வயிற்றுவலி பித்தவெடிப்பு தீரும்."},{"n":1330,"t":"நன்னாரிவேர் பொடி தேனில் கலந்து சாப்பிட காமாலை, பாண்டு தீரும்."},{"n":1331,"t":"புன்னைபூவை அரைத்து சிரங்கிற்கு தடவ குணமாகும். 1332.புன்னை இலையை ஊறவைத்த நீரில் குளித்து வர மேகரணம் தீரும். 1333.புன்னை பூவை உலர்த்தி பொடி செய்து 1சிட்டிகை காலை, மாலை கொடுக்க டைப்பாய்டு குணமாகும்."},{"n":1334,"t":"புன்னை மரப்பட்டை கஷாயத்தினால் புண் கழுவலாம்."},{"n":1335,"t":"புன்னை எண்ணெய் பூசி வர கிருமி ரணம், குஷ்டரோக புண்கள் ஆறும்."},{"n":1336,"t":"மகிழவித்து பருப்பை பொடி செய்து 5கிராம் பாலில் சாப்பிட்டு வர மலக்கட்டு, நஞ்சு தீரும்."},{"n":1337,"t":"மஞ்சள், வசம்பு சிறிதளவு கற்பூரம், மருதோன்றி இலை அரைத்து கட்டி வர கால் ஆணி வலி தீரும்."},{"n":1338,"t":"மஞ்சள் பொடி, நெல்லிக்காய் நீரில் காய்ச்சி காலை மாலை சாப்பிட்டு வர மதுமேகம் குணமாகும்."},{"n":1339,"t":"மல்லிகை பூவை வைத்து கட்ட விரைவீக்கம் குறையும்."},{"n":1340,"t":"மல்லிகை பூவை மார்பகத்தில் வைத்து கட்ட பால் சுரப்பை 3நாளில் நிறுத்தி விடும்."},{"n":1341,"t":"பூவரசு இலைகளை நல்லெண்ணையில் வதக்கி கட்ட வீக்கம் குறையும்."},{"n":1342,"t":"பூவரசு காயின் சாறை தடவி வர படர்தாமரை குணமடையும்."},{"n":1343,"t":"பூசனி தொடர்ந்து 3மாதம் சாப்பிட இளைத்த உடம்பு பெருக்கும்."},{"n":1344,"t":"பொன்னாவரைவிதை, இலை அரைத்து வெந்நீரில் குடிக்க சுகபேதியாகும்."},{"n":1345,"t":"புளியம்பூவை அரைத்து கண்ணை சுற்றி பற்று போட கண்வலி சிகப்பு மாறும். 1346.பொடுதலை சீரகம் சேர்த்து அரைத்து 1கிராம் தயிரில் கொடுக்க வெட்டை சூடு, வெள்ளை தீரும்."},{"n":1347,"t":"பொடுதலை, இஞ்சி, புதினா, கொத்தமல்லி, கருவேப்பிலை துவையல் சுடுசோறு நெய்யில் உண்ண மார்பு சளி தீரும்."},{"n":1348,"t":"பூசணி சாறு செம்பருத்தி பூவுடன் சாப்பிட்டு வர சொட்டு மூத்திரம் குணமாகும்."},{"n":1349,"t":"பேய்மிரட்டி இலை கொதிக்க வைத்து வேது பிடிக்க விடாத வாத சுரம் தீரும்."},{"n":1350,"t":"மருதாணி வேர் பட்டை சிதைத்து காய்ச்சி சாப்பிட கல்லடைப்பு நீங்கும்."},{"n":1351,"t":"மாந்தளிர் பொடி 1கிராம் கஷாயம் செய்து குடிக்க குரல் கம்மல் தீரும்."},{"n":1352,"t":"நெய்யிட்டு வறுத்த மாம்பருப்பு பொடி அரை கிராம் மோரில் குடிக்க இரத்தபேதி, ஆசன எரிவு தீரும்."},{"n":1353,"t":"மாதுளை பூ சாறு, கற்கண்டு சேர்த்து 15மி.லி. பருக இரத்த மூலம் குணமாகும்."},{"n":1354,"t":"மிளகரணை காய் வேர்பட்டை இடித்து நல்லெண்ணையில் காய்ச்சி தேய்த்து வர வீக்கம், பிடிப்பு வலி குணமாகும்."},{"n":1355,"t":"மிளகரணை காய் வேர்பட்டை கஷாயம் 2வேளை சாப்பிட்டு வர தேகபலம் கூடும்."},{"n":1356,"t":"வில்வ இலை கொழுந்து 1கிராம் அளவு சாப்பிட பெரும்பாடு தீரும்."},{"n":1357,"t":"பேய்மிரட்டி இலை கஷாயம் குடிக்க வாத சுரம், மலகழிச்சல் தீரும்."},{"n":1358,"t":"மிளகாய்வற்றல் அரைத்து அடிபட்ட காயம் மீது கட்ட சீழ் பிடிக்காமல் ஆறும். 1359.மிளகாய் வற்றல், மிளகு நல்லெண்ணையில் காய்ச்சி வாரம் 1நாள் தலை முழுகி வர எவ்வித தலைவலியும் தீரும்."},{"n":1360,"t":"வில்வ இலை, சுக்கு, மிளகு, சீரகம் கஷாயம் குடிக்க எவ்வித காய்ச்சலும் குணமாகும்."},{"n":1361,"t":"வில்வஇிலை பொடி அரை கரண்டி தேனில் சாப்பிட மண்டை குடைச்சல் குணமாகும்."},{"n":1362,"t":"வில்வஇிலை பொடி அரை கரண்டி வெண்ணெய் சாப்பிட நீர்தாரை எரிச்சல் குணமாகும்."},{"n":1363,"t":"வில்வ இலை பொடி கரிசலாங்கன்னி சாறு கலந்து 1கரண்டி கொடுக்க மஞ்சள் காமாலை குணமாகும்."},{"n":1364,"t":"முதிர்ந்த மருதாணி வேர் பட்டை கஷாயம் சாப்பிட்டு வர சதையடைப்பு குணமாகும்."},{"n":1365,"t":"மாதுளம்பூ சாறு 15மி.லி. கற்கண்டு சேர்த்து வேளை சாப்பிட அடிக்கடி மலம் கழிக்கும் உணர்ச்சி நீங்கும்."},{"n":1366,"t":"மாதுளம் பூ சாறு, அருகம்புல் சாறு 15மி.லி. 3வேளை குடித்து வர மூக்கில் இரத்தம் வடிதல் நிற்கும்."},{"n":1367,"t":"மாதுளம் பூ உலர்த்தி பட்டை காய்ச்சி வாய்கொப்பளிக்க தொண்டை ரணம் தீரும்."},{"n":1368,"t":"மாதுளம் பழசாரை புழுவெட்டு உள்ள இடத்தில் தேய்க்க அரிப்பு மாறும்."},{"n":1369,"t":"மாவிலங்கபட்டை கஷாயம் காலை மாலை சாப்பிட்டு வர கல்லடைப்பு நீங்கும்."},{"n":1370,"t":"மிளகாய் பூண்டு இலை கஷாயம் 3வேளை குடித்து வர கைகால் இடுக்குகளில் நெறிகட்டிய சுரம் தீரும்."},{"n":1371,"t":"மிளகாய் பூண்டு வேரை கஷாயம் செய்து 2வேளை குடித்து வர வாதநோய், வாதவீக்கம் குணமாகும்."},{"n":1372,"t":"விஷ்ணுகிராந்தி சமூலம், பற்பாடகம், கண்டாங்கத்திரி வேர் தூதுவளை கசாயம் 25 மி.லி. குடிக்க விடாத காய்ச்சல் தீரும்."},{"n":1373,"t":". தாளிகீரை பருப்புடன் சமைத்து சாப்பிட்டு வர தாதுபலப்படும்."},{"n":1374,"t":"தாளிகீரை இலைகளை கொதிநீரில் போட்டு எடுத்து பிழிந்து சாப்பிட பால் சுரப்பு உண்டாகும்."},{"n":1375,"t":"மிளகாய் பூண்டு இலையை கீரை போல் வதக்கி சோற்றில் பிசைந்து சாப்பிட மலச்சிக்கல் தீரும்."},{"n":1376,"t":"மிளகாய்ப்பூண்டு இலை கஷாயம் 3வேளை குடித்து வர கட்டிகள் கரையும்."},{"n":1377,"t":"முடக்கத்தான் இலையை அரிசிமாவுடன் அரைத்து அடை செய்து சாப்பிட உடம்பு வலி தீரும்."},{"n":1378,"t":"முடக்கத்தான் இலை விளக்கெண்ணையில் வதக்கி கட்டி வர வாதபரிடிப்பு வீக்கம் தீரும்."},{"n":1379,"t":"முடக்கத்தான் இலையை வாட்டி பிழிந்து சாறு 2துளிவிட்டு வர காது வலி தீரும். 1380.முருங்கை இலை விளக்கெண்ணையில் வதக்கி கட்டி வர அரையாப்பு கட்டி கரையும்."},{"n":1381,"t":"முருங்கை இலை பொறியலில் நெய்யுடன் 48நாட்கள் சாப்பிட தாது விருத்தியாகும்."},{"n":1382,"t":"முருங்கை ஈர்க்கு கஷாயம் சாப்பிட உடல்வலி அசதி தீரும்."},{"n":1383,"t":"முருங்கை பூவை பருப்புடன் சமைத்து உண்ண கண் எரிச்சல் தீரும்."},{"n":1384,"t":"வெங்காயம் பச்சையாக சாப்பிட நீர் கடுப்பு, நீர் எரிச்சல் தீரும்."},{"n":1385,"t":"மாதுளம்பழ தோல் பொடி, சுக்கு, மிளகு, சீரகம் நெய்யில் சாப்பிட காய்ச்சல் தீரும்."},{"n":1386,"t":"மாதுளம்பழ சாறு கற்கண்டு கலந்து பருகிவர உடல் வெப்பம் தணிந்து குளிர்ச்சி உண்டாகும்."},{"n":1387,"t":"மாவிலங்கபட்டை கஷாயம் காலை மாலை சாப்பிட்டு வர அரையாப்பு கட்டி கரையும்."},{"n":1388,"t":"முள்ளங்கி சாறு 30மி.லி. காலை மாலை சாப்பிட சிறுநீரக கோளாறு நீங்கும்."},{"n":1389,"t":"வில்வ இலை ண்டி அரை கரண்டி தேனில் சாப்பிட்டு வர தொண்டைகட்டு குணமாகும்."},{"n":1390,"t":"வெங்காயத்தை உப்பை தொட்டு தின்ன இரத்த வாந்தி வயிற்று வவி குணமாகும்."},{"n":1391,"t":"வெள்ளருகு சாறு 25 மி.லி. குடிக்க கொடுக்க பாம்பு கடி நஞ்சு தீரும் 1392.வெள்ளருகு சமூலம் அரைத்து வெந்நீரில் கலந்து பூசி 1மணி நேரம் கழித்து குளிக்க சிரங்கு, ஊறல் குணமாகும்."},{"n":1393,"t":"முருங்கை பூவை பருப்புடன் சமைத்து உண்ண வாய்கசப்பு மாறும்."},{"n":1394,"t":"முருங்கை பட்டை அவித்து சாறு எடுத்து ரசமாக்கி சாப்பிட குளிர்காய்ச்சல் குணமாகும்."},{"n":1395,"t":"மாவிலங்கபட்டை கஷாயம் காலை மாலை சாப்பிட்டு வர கண்ட மாலை புண் குணமாகும்."},{"n":1396,"t":"ரோஜாப்பூ கற்கண்டு தேன் கலந்து வெயிலில் வைத்து 1 கிராம் சாப்பிட்டு வர சிறுநீரகம் பலமாகும்."},{"n":1397,"t":"வல்லாரை இலை பொடி காலை மாலை நெய்யில் சாப்பிட்டு வர மூளை பலத்தை தரும்."},{"n":1398,"t":"மூக்கிரட்டை வர், அருகம்புல், கீழாநெல்லி மிளகு கஷாயம் 2வேளை சாப்பிட்டு வர காமாலை தீரும்."},{"n":1399,"t":"விழுதி இலைசாறு நல்லெண்ணையில் கலந்து காய்ச்சி 2துளி தொடர்ந்து சாப்பிட்டு வர வெண்மேகம் தீரும்."},{"n":1400,"t":"விழுதி இலைசாறு நல்லெண்ணெய் கலந்து 25மி.லி. சாப்பிட பேதியாகும்."},{"n":1401,"t":"விளாமர கொழுந்து அரைத்து பாலில் 1 கிராம் சாப்பிட இளைப்பு தீரும்."},{"n":1402,"t":"மாதவிடாய் முதல் 3நாட்கள் வெள்ளறுகு சமூலத்தை அரைத்து 2கிராம் அளவு சாப்பிட கர்ப்பப்பை புழு நீங்கும்."},{"n":1403,"t":"பிரமிய வழுக்கை செடியை அரைத்து 1கிராம் பாலில் சாப்பிட்டு வர புண்கள் ஆறும்."},{"n":1404,"t":"பிரமிய வழுக்கை இலைசாறு நெய் கலந்து காய்ச்சி காலை மாலை 1கரண்டி சாப்பிட்டு வர சித்தபிரமை குணமாகும்."},{"n":1405,"t":"வல்லாரை இலை பொடி காலை மாலை நெய்யில் சாப்பிட்டு வர சுறுசுறுப்பை தரும்."},{"n":1406,"t":"வல்லாரை பொடி, தூதுவளை பொடி பாலில் கலந்து குடித்து வர சுவாச உறுப்புகளில் சளிதேக்கம் நீங்கும்."},{"n":1407,"t":"வல்லாரை இலையை விளக்கெண்ணையில் வதக்கி கட்டிவர யானைக்கால் வியாதி குணமாகும்."},{"n":1408,"t":"மாவிலங்கபட்டை கஷாயம் காலை மாலை சாப்பிட்டு வர விஷகடி தீரும்."},{"n":1409,"t":"முள்ளங்கி சாறு 30மி.லி.. காலை மாலை சாப்பிட்டு வர நீர்தாரை வியாதிகள் குணமாகும்."},{"n":1410,"t":"முள்ளங்கி இசைசாறு 5மி.லி. 3 வேளை சாப்பிட்டு வர சாப்பிட்டு வர மலக்கட்டு நீங்கும்."},{"n":1411,"t":"ரோஜா பூ கஷாயம் செய்து கொப்பளிக்க வாய்புண் ஆறும்."},{"n":1412,"t":"ரோஜா பூவை கஷாயம் செய்து ரணங்களை கழுவ சதை வளர்ந்து ஆறும்."},{"n":1413,"t":"ரோஜாப்பூ கஷாயம் பால் சர்க்கரை கூட்டி சாப்பிட பித்தநீர் மலத்துடன் வெளியேறும்."},{"n":1414,"t":"ரோஜா பூ கற்கண்டு தேன் கலந்து வெயிலில் வைத்து 1கிராம் சாப்பிட்டு வர இதயம் பலமாகும்."},{"n":1415,"t":"முருங்கைபட்டை அவித்து சாறு எடுத்து ரசமாக்கி சாப்பிட்டு வர காக்காவலிப்பு குணமாகும்."},{"n":1416,"t":"முருங்கைபட்டை, கடுகு சேர்த்து அரைத்து பற்றிட கீழ் வாதம் குணமாகும்."},{"n":1417,"t":"முருங்கை பிசினை பொடி செய்து அரை கரண்டி பாலில் காலை மாலை சாப்பிட தாது பலம் உண்டாகும்."},{"n":1418,"t":"வல்லாரை சாறில் ஊறவைத்து உலர்த்திய திப்பிலி சாப்பிட்டு வர மூளை சுறுசுறுப்பாக இருக்கும்."},{"n":1419,"t":"வாத நாராயணன் இலைசாறு 1அவுன்ஸ் குடித்து வர வாதவீக்கம், குடைச்சல் வலி தீரும்."},{"n":1420,"t":"வாதநாரயாணன் இலைபொடி 2கிராம் வெந்நீரில் சாப்பிட்டு வர மேகம், வாயு தீரும்."},{"n":1421,"t":"வாழை குருத்தை பிரித்து தீப்புண்ணில் கட்ட கொப்பளங்கள் இல்லாமல் குணமடையும்."},{"n":1422,"t":"வாழைப்பட்டை சாறு தீக்காயங்கள் மீது பிழியலாம்."},{"n":1423,"t":"வாழை தண்டை சமைத்து உண்ண சிறுநீரக கற்கள் கரையும்."},{"n":1424,"t":"வாழை பூவை பருப்புடன் சமைத்து சாப்பிட கைகால் எரிச்சல் நீங்கும்."},{"n":1425,"t":"வல்லாரை இலை விளக்கெண்ணையில் வதக்கி கட்டி வர நெறிகட்டி தீரும்."},{"n":1426,"t":"முள்ளங்கி விதை பொடி செய்து சாப்பிட்டு வர காமம் பெருகும்."},{"n":1427,"t":"முள்ளங்கி சமைத்து உண்ண அதிமூத்திரம், நீர்தடை, வாதம், வீக்கல் தீரும்."},{"n":1428,"t":"வல்லாரை சாறில் ஊறவைத்து உலர்த்திய திப்பிலி பொடி சாப்பிட்டு வர தொண்டை கரகரப்பு நீங்கும்."},{"n":1429,"t":"வல்லாரை இனல, உத்தாமணி அரைத்து 1கிராம் அளவு 4நாள் வெந்நீரில் சாப்பிட சூதக சிக்கல் குணமாகும்."},{"n":1430,"t":"விளாமர கொழுந்து அரைத்து 1கிராம் பாலி சாப்பிட பசியின்மை தீரும்."},{"n":1431,"t":"விளாமர இலை கஷாயம் சாப்பிட பித்த சுரம் குணமாகும்."},{"n":1432,"t":"விளாமரப்பிசின் தூள் 1சிட்டிகை வெண்ணெயுடன் சாப்பிட்டு வர வெள்ளை நீர் எரிச்சல் குணமாகும்."},{"n":1433,"t":"வேப்ப எண்ணெய் தலை முழுகி வர சன்னி பிடரி இசிவு வாதநோய் குணமாகும்."},{"n":1434,"t":"வேப்ப விதை வெல்லம் சேர்த்து அரைத்து 48நாட்கள் சாப்பிட மூலநோய் குணமாகும்."},{"n":1435,"t":"உத்தாமணி இலையை வேப்ப எண்ணெயில் வதக்கி ஒத்தடம் கொடுக்க நரம் இசிவு சிரங்கு, கண்டமாலை குணமாகும்"},{"n":1436,"t":"சிவானர் வேம்பு இலையை அரைத்து பற்றுபோட கட்டி உடையும் அல்லது அமுங்கி விடும்."},{"n":1437,"t":"சிவனார் வேரால் பல் துலக்க பல்வலி குணமாகும்."},{"n":1438,"t":"அதிமதுரத்தை கஷாயம் செய்து குடிக்க வயிற்றுபுண் ஆறும்."},{"n":1439,"t":"வெள்ளைப் பூண்டை நசுக்கி தொடர்ந்து தேய்க்க எச்சில் தழும்பு குணமாகும்."},{"n":1440,"t":"எட்டி பருப்பை அரைத்து எச்சில் தழும்பு மீது தடவ குணமாகும்."},{"n":1441,"t":"துவரம் பருப்பை ஊறவைத்து பன்னிர்விட்டு அரைத்து 3 நாட்கள் பற்றுபோட தாய்ப்பால் வற்றும்."},{"n":1442,"t":"கசகசா பொடி அரை கரண்டி காலை மாலை உணவுக்கு முன் சாப்பிட அதிமூத்திரம் குறையும்."},{"n":1443,"t":"அமுக்கிராவர் பெருஞ்சீரகம் பாலில் காய்ச்சி குடித்து வர உடல் எடை குறையும்."},{"n":1444,"t":"இருவாட்சி சமூலத்தை பசும்பாலில் அரைத்து 1கிராம் காலையில் சாப்பிட்டு வர கண்ஒளி உண்டாகும்."},{"n":1445,"t":"நிலவாகை சமூலம் நிழலில் உலர்த்தி கொடி செய்து 2கிராம் அளவு பசு நெய்யில் சாப்பிட்டு வர உடல் பூரிக்கும்."},{"n":1446,"t":"கானாவாழை சமூலம் மிளகு சீரகம் கஷாயம் கொடுக்க சுரம் நீங்கும். தாகசுரம் குணமாகும்."},{"n":1447,"t":"வில்வஇலை, சுக்கு, மிளகு, சீரகம் கஷாயம் குடிக்க எவ்வித காய்ச்சலும் நீங்கும். 1448.வெங்காய சாறு அரை அவுன்ஸ் காலை மாலை குடிக்க சுரம் தீரும்."},{"n":1449,"t":"கீழா நெல்லி சமூலம் மிளகு கஷாயம் குடிக்க சுரம் தணியும்."},{"n":1450,"t":"ஓமவல்லி இலை காம்பு கஷாயம் குடிக்க சளிக்காய்ச்சல் குணமாகும்."},{"n":1451,"t":"கண்டங்கத்திரி வேர், சுக்கு. கொத்தமல்லி, சீரகம், கஷாயம் குடிக்க சளிக்காய்ச்சல் குணமாகும்."},{"n":1452,"t":"ஆடாதொடை இலை கஷாயம் தேன் கலந்து சாப்பிட சளி காய்ச்சல் குணமாகும்."},{"n":1453,"t":"நல்ல வேளையிலை, சுக்கு, மிளகு, சீரகம் கஷாயம் குடித்து வர சளிக்காய்ச்சல் குணமாகும்."},{"n":1454,"t":"கொள்ளுக்காய் வேளை செடி வேர், மிளகு சேர்த்து கஷாயம் சாப்பிட்டு வர சிறுநீரகவீக்கம் குணமாகும்."},{"n":1455,"t":"கொள்ளுக்காய் வேளை வேர் கஷாயம் செய்து வாய் கொப்பளித்து வர வாய்புண், பல்வலி தீரும்."},{"n":1456,"t":"சாறுவேளை இலையை வதக்கி வீக்கங்களுக்கு கட்ட வீக்கம் குறையும் வலி தீரும்."},{"n":1457,"t":"சாறுவேளை இலையை கீரை போல் சமைத்து உண்டுவர இதயம், சிறுநீரகம், மண்ணீரல் நன்கு செயல்பட வைக்கும்."},{"n":1458,"t":"கடுக்காய், நெல்லிக்காய், தான்றிக்காய் பொடி கஷாயம் வெறும் வயிற்றில் குடித்து வர உடல் எடை குறையும்."},{"n":1459,"t":"இலந்த மரஇலையை தண்ணீரில் ஊறவைத்து மறுநாள் காலை அந்த தண்ணீரை குடித்து வர உடல் எடைகுறையும்."},{"n":1460,"t":"கொள்ளு ரசம் வைத்து சாப்பிட்டு வர உடல் எடை குறையும்."},{"n":1461,"t":"கொள்ளு முளைகட்டி சாப்பிட்டு வர உடல் எடை குறையும்."},{"n":1462,"t":"வேலிபருத்தி வேர் பொடி 4 சிட்டிகை பாலில் கொடுக்க குழந்தைகளின் வாயு தொல்லை நீங்கும்."},{"n":1463,"t":"எழுத்தாணி பூண்டு இலை நல்லெண்ணையில். காய்ச்சி உடம்பில் பூசி வர சொறி சிரங்கு குணமாகும்."},{"n":1464,"t":"கோபுரம் தாங்கி இலை சாறு நல்லெண்ணையில் காய்ச்சி தலைமுழுகி வர தலைமயிர் உதிராது."},{"n":1465,"t":"சத்திசாரணை இலை சாறு பாலில் சாப்பிட்டு வர வீக்கம், வயிற்று வலி தீரும்."},{"n":1466,"t":"சத்திசாரணை வேர் பொடி அரைகிராம் சாப்பிட்டு வர யானைக்கால் வீக்கம், வாதநோய் குணமாகும்."},{"n":1467,"t":"ஆரஞ்சு பழ தோல்களை தண்ணீரில் கொதிக்க வைத்து கஷாயம் குடித்தால் வாயு தொந்தரவு குறையும்."},{"n":1468,"t":"மாதுளம் பழ சாறுடன் தேன் கலந்து சாப்பிட தலை சுற்றல் குணமாகும்."},{"n":1469,"t":"அறுகீரை நெய் சேர்த்து உண்டு வர நீர்கோவை சளி காய்ச்சல் தீரும்."},{"n":1470,"t":"அறுகீரை நெய் சேர்த்து உண்டு வர உடல் சத்துககளை பெருக்கி வலியும் வளப்பும் உண்டாகும்."},{"n":1471,"t":"வில்வபழம் பொடி செய்து கால்கிராம் சாப்பிட்டு வர குடல் புண்கள் ஆறும்."},{"n":1472,"t":"மூக்கிறட்டை மூவிகை பாலில் அரைத்து சாப்பிட்டு வர நரை திரை மாறும்."},{"n":1473,"t":"வேப்பம் பிண்ணாக்கை சுட்டு மூக்கில் உறிஞ்ச தலைபாரம் நீங்கும்."},{"n":1474,"t":"தேன், துளசி சாறு கலந்து தீப்புண் மீது தடவி வர ஆறும்."},{"n":1475,"t":"வேப்பம்பூ, வேப்பவிதை அரைத்து கட்ட நரம்பு சிலந்தி குணமாகும்."},{"n":1476,"t":"தவிடையும், உப்பையும் வறுத்து குதிகாலில் ஒத்தடம் இட வலி சரியாகும். 1477.மருதோன்றி காய் பொடி செய்து அரை ஸ்பூன் 10நாட்கள் சாப்பிட நகம் முளைக்கும்."},{"n":1478,"t":"சுக்கை அரைத்து பற்றிட தலைவலி குணமாகும்."},{"n":1479,"t":"சிரட்டை தைலம் தோல் வியாதிகளுக்கு அருமையான மருந்து."},{"n":1480,"t":"யானைக்கால் வியாதிக்கு பப்பாளி இலையை அரைத்து பற்று யாட குணமாகும்."},{"n":1481,"t":"தும்பை இலைசாறு பூச பூரான் கடி விஷம் முறியும்."},{"n":1482,"t":"புதினா துவையல் வயிற்றுக் கோளாறுகளுக்கு நல்ல மருந்து."},{"n":1483,"t":"சுத்தமான புனுகை பருக்கள் மீது தடவி வர மறையும்."},{"n":1484,"t":"மாதுளம் பூவை கஷாயம் செய்து குடிக்க வயிற்றுக் கடுப்ப குணமாகும்."},{"n":1485,"t":"சுரக்காய் வாரம் 2 தடவை சாப்பிட்டு வர தொப்பை குறையும்."},{"n":1486,"t":"எலுமிச்சை சாறு தேன் கலந்து பருக வரட்டு இருமல் குறையும்."},{"n":1487,"t":"முள்ளங்கி சாறு சாப்பிட தலைவலி, ஜலதோஷம் இருமல் நீங்கும்."},{"n":1488,"t":"மூச்சு வாங்கும் தொந்தரவு தீர தூதுவளை மாமருந்தாகும்."},{"n":1489,"t":"தினமும் அரைக்கீரை சாப்பிட்டு வர உடல் குளிர்ச்சியடையும்."},{"n":1490,"t":"எந்த வண்டு விஷகடியானாலும் பூண்டு அரைத்து கடிவாயில் கட்ட குணமாகும்."},{"n":1491,"t":"எரிக்கன் பாலை நாய் கடி வாயில் வைக்க விஷம் ஏறாது."},{"n":1492,"t":"அரைக்கீரையை சமைத்து உண்ண தாய்ப்பால் பெருகும். 1493.கொத்தமல்லியைச் சிறிது காடியில் அரைத்துக் கொடுக்க சாராய போதை நீங்கும்."},{"n":1494,"t":"இன்புறா இலைச்சாற்றைத் தடவி வர காய்ச்சலால் உண்டான எரிச்சல் குணமாகும்."},{"n":1495,"t":"ஊமத்தை பிஞ்சை உமிழ்நீரில் அரைத்து தடவ புழுவெட்டு குணமாகும்."},{"n":1496,"t":"கழற்சிக் கொடி விதைகளை அரைத்து தேன் கலந்துசாப்பிட தாது கெட்டிப்படும்."},{"n":1497,"t":"சிறுகீரை அடிக்கடி சேர்த்து வர நீர்கோவை குணமாகும்."},{"n":1498,"t":"நுணா இலையை அரைத்து பற்றிட புண், சிரங்கு குணமாகும்."},{"n":1499,"t":"புதிய ரோஜா மலரை முகர்ந்தால் மூக்கபைப்ப நீங்கும்."},{"n":1500,"t":"கிராம்பை தணலில் வதக்கி வாயிலிட்டு சுவைக்க தொண்டைப் புண் குணமாகும்."},{"n":1501,"t":"தேங்காய் எண்ணெய்யில் கற்பூரம், சேர்த்து சுடவைத்து நெஞ்சில் தடவ நெஞ்சுவலி குணமாகும்."},{"n":1502,"t":"தாருணி செடியை அரைத்துப் பற்றுப்போட கல் போன்ற வீக்கம் குணமாகும்."},{"n":1503,"t":"உதிரமர இலையை அரைத்து பற்றிட எல்லாவித புண் புரைகளும் குணமாகும்."},{"n":1504,"t":"சந்தனக்கட்டையை எலுமிச்சம் பழச்சாற்றில் உரைத்து தடவ முகப்பரு, படர்தாமரை நீங்கும்."},{"n":1505,"t":"சடைச்சி வேரை மையாய் அரைத்துப் பூசி வர சொறி, சிரங்கு குணமாகும்."},{"n":1506,"t":"வெந்தயக்கீரை சமைத்து சாப்பிட்டு வர இருமல் குணமாகும்."},{"n":1507,"t":"மிளகுடன் பொரிகடலை சேர்த்து பொடியாக்கி ஒவ்வொரு ஸ்பூன் மூன்று வேளை உண்ண வரட்டு இருமல் நீங்கும்."},{"n":1508,"t":"மலச்சிக்கலுக்கு மூளைக்கீரை நல்ல உணவு."},{"n":1509,"t":"அவரை இலை சாறை தயிருடன் சாப்பிட பேதி நிற்கும்."},{"n":1510,"t":"தொடர் வயிற்றுப் போக்கு, உள்ளவர்கள் பப்பாளிப்பழம் சாப்பிட்டு வர குணமாகும்."},{"n":1511,"t":"பித்த வாந்திக்கு களாக்காயை சாப்பிட்டால் குணமாகும்."},{"n":1512,"t":"தூதுவளை காய் ஊறுகாய் சாப்பிட்டு வர கண் ஒளி பெருகும்."},{"n":1513,"t":"எள்செடியின் பூவை பறித்து பற்களில் படாமல் விழுங்கி விட கண்வலி குணமாகும்."},{"n":1514,"t":"நெல்லிக்காய் நீரை கண்ணில் போட்டு வர கண்நோய் தீரும்."},{"n":1515,"t":"ஒரு துண்டு சுக்கை வாயில் போட்டு கொள்ள பல்வலி தீரும்."},{"n":1516,"t":"மாவிலையை பொடி செய்து பல்துலக்கி வர பல் ஊறுதி பெறும்."},{"n":1517,"t":"நெல்லிக்காயை மென்று தின்று வர பற்கள் உறுதி பெறும்."},{"n":1518,"t":"குங்குமப்பூவை தினசரி ஒரு சிட்டிகை தேன் கலந்து சாப்பிட்டு வர இரத்தம் சுத்தமாகும்."},{"n":1519,"t":"அத்திபழம் தொடர்ந்து சாப்பிட்டு வர இதயம் பலமடையும்."},{"n":1520,"t":"மூட்டுவலிக்கு அத்திபாலை பற்று போட்டு வர குணமாகும்."},{"n":1521,"t":"தினசரி 1 மாம்பழம் சாப்பிட்டு வர நரம்பு தளர்ச்சி குணமாகும்."},{"n":1522,"t":"இஞ்சி சாறுடன் தேன் கலந்து சாப்பிட ரத்தம் குணமாகும். 1523.கால் பித்த வெடிப்பிற்கு அரதமரத்து பாலை தடவி வர சரியாகும்."},{"n":1524,"t":"துளசி சாறு, கல்கண்டு சேர்த்து சாப்பிட வாந்தி நிற்கும்."},{"n":1525,"t":"கோவைப்பழம் தினசரி 1சாப்பிட்டு வர சர்க்கரை நோய் கட்டுப்படும்."},{"n":1526,"t":"விளாம்பழம் தினசரி 1சாப்பிட்டு வந்தால் பித்தம் சரியாகும்."},{"n":1527,"t":"தினசரி 1 கொய்யாப்பழம் சாப்பிட்டு வர கல்லீரல் பலப்படும்."},{"n":1528,"t":"இலந்தை பழம் சாப்பிட்டு வர நெஞ்சுவலி குணமாகும்."},{"n":1529,"t":"தினமும் நெல்லிக்கனி சாப்பிட்டு வர ஊல் பலமும் நோய் எதிர்ப்பு சக்தியும் பெருகும். 1530.மாலுண்ணி நீங்க சுண்ணாம்பு, நவச்சாரம் இரண்டையும் குழப்பி தடவினால் குணமாகும்."},{"n":1531,"t":"வெள்ளை அருகு அரைத்து வைத்து கட்ட கால் ஆணி தீரும்."},{"n":1532,"t":"மிளகு, சீரகம் சேர்த்து சாப்பிட்டு வர மலேரியா காய்ச்சல் தீரும். 1533.அகத்தி இலை அவித்த தண்ணீரை பருக வாய்ப்புண் ஆறும்."},{"n":1534,"t":"அத்திபழம் தினந்தோறும் 5சாப்பிட நரம்புதளர்ச்சி சரியாகும்."},{"n":1535,"t":"கொன்றைவேர் கஷாயம் குடித்து வர சொறிசிரங்கு நீங்கும்."},{"n":1536,"t":"சிறுநீர் புறவழி புண் ஆற 5ஆவாரம்பூ சாப்பிட குணமாகும்."},{"n":1537,"t":"தினசரி 5ஆவாரம் பூ சாப்பிட சர்க்கரை நோய் கட்டுப்படும்."},{"n":1538,"t":"தவசி கீரை, முருங்கை கீரை சாப்பிட ஆண்மை பெருகும். 1539.புரையோடிய புண், காயம் ஆற அத்திபால் தடவலாம்."},{"n":1540,"t":"பப்பாளி பழம் தினமும் சாப்பிட உடல் பலம் பெறும்."},{"n":1541,"t":"இரவு படுக்கும்முன் பேரீச்சம்பழம் சாப்பிட்டு பால் குடிக்க உடல் புஷ்டியாகும்."},{"n":1542,"t":"முளைக்கீரை வாரம் ஒருநாள் தொடர்ந்து சாப்பிட நரை மாறும்."},{"n":1543,"t":"சீரகத்தை வறுத்து பொடி செய்து வாழைப்பழத்துடன் சாப்பிட சுகமான நித்திரை வரும்."},{"n":1544,"t":"நெருஞ்சில் இலை சாறை காய்ச்சி வாய் கொப்பளிக்க வாய்ப்புண் குணமாகும்."},{"n":1545,"t":"ஆவாரம் பூ, கருவேப்பிலை, நெல்லி சேர்த்து பருக நீரழிவு நீங்கும்."},{"n":1546,"t":"முள் குத்திய இடத்தில் அம்மன் பச்சரிசிப் பாலை தடவ முள் வெளியேறிவிடும்."},{"n":1547,"t":"தினசரி ஒரு பேரிக்காய் சாப்பிட இதயபடபடப்பு நீங்கும்."},{"n":1548,"t":"ரோஜாப்பூ சாறெடுத்து சர்க்கரை சேர்த்து பருகிவர மூலச் சூடு தணியும்."},{"n":1549,"t":"நூல்கோல் கிழங்கு அடிக்கடி சாப்பிட நரம்பு தளர்ச்சி நீங்கும்."},{"n":1550,"t":"முலாம்பழம் சாப்பிட்டு வர சிறுநீர் கோளாறு நீங்கும்."},{"n":1551,"t":"நாய்கடி வாயில் எருக்கன் பால் இரண்டு சொட்டு விட விஷம் நீங்கும்."},{"n":1552,"t":"தினசரி ஆட்டுப்பால் சாப்பிட்டு வர வலிப்பு நோய் குணமாகும்."},{"n":1553,"t":"ஆரஞ்சுபழம் தினந்தோறும் சாப்பிட்டு வர ஈரல் சம்பந்தமான வலி குணமாகும்."},{"n":1554,"t":"சிறுநீரக வீக்கம் குறைய கீழாநெல்லி சாறுடன் தேன் கலந்து பருக குறையும்."},{"n":1555,"t":"சோயா பீன்ஸ் தினசரி உணவுடன் சாப்பிட்டு வர சோகை தீரும்."},{"n":1556,"t":"மலைவேம்பு இலையை அரைத்து தலையில் பூச பேன் ஒழியும்."},{"n":1557,"t":"வசம்புதூளை காயத்தின் மீது தடவி வர வெட்டுகாயம் ஆறும்."},{"n":1558,"t":"துரியன் பழம் சாப்பிட்டு வர தாது உற்பத்தி அதிகரிக்கும்."},{"n":1559,"t":"குமட்டல் நீங்க வெற்றிலைக்காம்பை வாயில் அதக்கினால் நீங்கும்."},{"n":1560,"t":"கோரை கிழங்கு கஷாயம் குடித்தால் எப்படிப்பட்ட காய்ச்சலும் குணமாகும்."},{"n":1561,"t":"பாலும் தேனும் கலந்து சாப்பிட்டு, உடலுறவு கொள்ள நிறைவான இன்பம் கிடைக்கும்."},{"n":1562,"t":"கருவேலம் கொழுந்தை அரைத்து புண்மீது வைத்து கட்டி வர புண்குணமாகும்."},{"n":1563,"t":"அடிபட்ட வீக்கத்திற்கு நாமகட்டியை உமிழ்நீரில் குழைத்து தடவி வர வீக்கம் குறையும்."},{"n":1564,"t":"வாழைப்பழம், ஏலக்காய் பொடி சேர்த்து பிசைந்து சாப்பிட பெரும்பாடு கட்டுப்படும்."},{"n":1565,"t":"பாகற்காய் அல்லது சிறுகுறிஞ்சான் இலை பொடி சாப்பிட்டுவர சர்க்கரை நோய் கட்டுப்படும்."},{"n":1566,"t":"பருத்தி இலைச்சாறு பசும்பாலில் கலந்து பருக பெண்களுக்கு ஏற்படும் பெரும்பாடு குணமாகும்."},{"n":1567,"t":"வல்லாரை 150கிராம், வசம்பு 15கிராம் பவுடராக்கி தேன் கலந்து சாப்பிட ஞாபக சக்தி பெருகும்."},{"n":1568,"t":"வில்வ இலையை தினமும் காலையில் சாப்பிட்டு வர வாய் திக்கல் குணமாகும்."},{"n":1569,"t":"நவரசத்தை தேனில் கலந்து தடவ புழுவெட்டு முடி உதிர்தல் நிற்கும்."},{"n":1570,"t":"கேழ்வரகு மாவு, எள்ளு, சிறிது வெல்லம் சேர்த்து இடித்து அடை செய்து சாப்பிட்டு வந்தால் உடல் ஆரோக்கியம் பெறும்."},{"n":1571,"t":"தாழம்பூ சர்பத் செய்து மாதம் இருமுறை சாப்பிட்டு வர அம்மை நோய் வராது."},{"n":1572,"t":"செத்தை நகம் சரியாக நொச்சி இலை 50கிராம், மருதாணி இலை, எருக்கம்பூ 2 சேர்த்து கட்டினால் சரியாகும்."},{"n":1573,"t":"கீழாநெல்லி இலைகளை அரைத்து உடம்பில் தேய்த்து குளித்து வர அரிப்பு சிறுபுண்கள் ஆறும்."},{"n":1574,"t":"திப்பிலி பொடியை நெய்யுடன் கலந்து சாப்பிட ஆண்மை பெருகும்."},{"n":1575,"t":"வாலிப வயோதிக குறைபாடு நீங்க ஓரிதழ் தாமரைப்பூ கீழாநெல்லி இலை சேர்த்து சாப்பிடலாம்."},{"n":1576,"t":"வெண்மசணி சாறு 100. மி.லி. விதம் தினமும் சாப்பிட்டுவர புற்று நோய் குணமாகும்."},{"n":1577,"t":"கோதுமை கஞ்சி மாதவிடாய் காலங்களில் சாப்பிட அக்காலங்களில் ஏற்படும் உடற்சோர்வு நீங்கிபலம் பெறும்."},{"n":1578,"t":"காலையில் வெறும் வயிற்றில் இளநீர் சாப்பிட்டு வர குடல் புண் ஆறி உடல் சூடு தணியும் (சளி இருந்தால் தவிர்க்கவும்)."},{"n":1579,"t":"ஈருள்ளியை பாலில் வேகவைத்து அரைத்து பருக்களின் மீது தடவ மறையும்."},{"n":1580,"t":"பப்பாளிப் பாலை வாய், நாக்கு புண்ணிற்கு தடவ குணமாகும்."},{"n":1581,"t":"பால் பெருக்கி இலையை அரைத்து உணவுடன் சாப்பிட்டு வர பால் அதிகமாக சுரக்கும்."},{"n":1582,"t":"புளியம் பூவை அரைத்து கண்ணைச் சுற்றி பற்றிட கண்வலி, கண் சிவப்பு மாறும்."},{"n":1583,"t":"சிறிது உளுந்து மாவுடன் எலுமிச்சைபழம் சாறு கலந்து பிசைந்து சேற்றுப்புண் மீது தடவ குணமாகும்."},{"n":1584,"t":"குஷ்டரோகம் மட்டுப்பட கோணி கிழங்கை காய வைத்து இடித்து தூள் செய்து பசும்பாலுடன் சாப்பிட குணமாகும்."},{"n":1585,"t":"வேப்ப எண்ணெய்யில் தலைமுழுகி வரச் சன்னி, பிடரி வலி, வாதநோய்கள் கட்டுப்படும்."},{"n":1586,"t":"வெங்காயத்தை வதக்கி ஆசனவாயில் கட்ட வெளிமூலம் குணமாகும்."},{"n":1587,"t":"பப்பாளிப் பாலை வாய், நாக்கு புண்ணிற்கு தடவ குணமாகும்."},{"n":1588,"t":"புளியம் பூவை அரைத்து கண்ணைச் சுற்றி பற்றிட கண்வலி, கண் சிவப்பு மாறும்."},{"n":1589,"t":"இரத்த அழுத்தம் உள்ளவர்கள் மீன் சாப்பிட்டு வர குணமாகும்."},{"n":1590,"t":"மந்தாரை வேரை நீர்விட்டு பாதியாக காய்ச்சி தொடர்ந்து அருந்தி வர பருத்த உடல் மெலியும்."},{"n":1591,"t":"மாமரத்து பிசினை பித்த வெடிப்பில் தடவி வர குணமாகும்."},{"n":1592,"t":"நெருச்சி கஷாயம் செய்து அருந்தி வர இரத்த கொதிப்பு குணமாகும்."},{"n":1593,"t":"சீரக நீரை குடிநீராக பயன்படுத்த அகஉறுப்புகள் சீராகும்."},{"n":1594,"t":"எதை கண்டாலும் விரக்தி, வெறுப்பு உணர்வு உள்ளவர்கள் பில்லோ மலர் மருந்து சாப்பிட்டு வர குணமாகும்."},{"n":1595,"t":"வாய் துர்நாற்றத்தை போக்க தினமும் கோதுமை புல்லை மென்று துப்பிவிடவும்."},{"n":1596,"t":"அளவுக்கு அதிகமாக சிறுநீர் பிரிந்தால் ஆரைக்கீரை சாப்பிடலாம்."},{"n":1597,"t":"தினமும் அன்னாச்சி பழம் சாப்பிட்டு வர வெள்ளையடுதல் நீங்கும்."},{"n":1598,"t":"காசநோய் உள்ளவர்கள் தினமும் அரிநெல்விக்காய் சாப்பிடலாம்."},{"n":1599,"t":"கமலாப்பழம் உடல் உஷ்ணத்தை தணித்து பித்தக்கோளாறு நீங்கும்."},{"n":1600,"t":"கருங்குருவை அரிசி, சமைத்து சாப்பிட்டு வர உடல் நஞ்சு அகலும்."},{"n":1601,"t":"கற்கண்டு அடிக்கடி பயன்படுத்தி வர பல்லரணை குணமாகும்."},{"n":1602,"t":"சர்க்கரை
