சேர்க்காத கடுங்காப்பி ஜலதோஷத்தை விலக்கும். 1603.பனங்கிழங்கு பித்தத்தை நீக்கி உடல் பலத்தை அதிகரிக்கும்."},{"n":1604,"t":"பீட்ரூட் கிழங்கு சாப்பிட்டு வர புதிய இரத்தத்தை உருவாக்கும்."},{"n":1605,"t":"தக்காளிக்காய் சாப்பிட உடல் வீக்கம், தோல்நோய் குணமாகும்."},{"n":1606,"t":"தமரத்தம் பழம் சாப்பிட நல்ல ஜீரண சக்தி உண்டாகும்."},{"n":1607,"t":"பசுந்தயிர் காசநோயைக் குணப்படுத்தும் வல்லமை உடையது."},{"n":1608,"t":"நார்த்தங்காய் ஊறுகாய் மலச்சிக்கலைப் போக்கி நல்ல ஜீரண சக்தி தரும்."},{"n":1609,"t":"நோய் எதிர்ப்பு சக்தி அதிகரிக்க பப்பாளி பழம் அடிக்கடி சாப்பிடவும்."},{"n":1610,"t":"உடல் அசதி, கை கால் வலி நீங்க முருங்கை ஈர்க்கு ரசம் சாப்பிடலாம்."},{"n":1611,"t":"பிரயான் பாலைத் தடவி வர பல்ஆட்டம், பல்வலி, ஈறு வீக்கம் குணமாகும்."},{"n":1612,"t":"நொச்சி இலையை தலையணையாக பயன்படுத்த மண்டை குடைச்சல் குணமாகும்."},{"n":1613,"t":"பித்த காய்ச்சல் தீர சீதேவி செங்கழுநீர் கமூலமாகக் குடிநீர் செய்து சாப்பிட குணமாகும்."},{"n":1614,"t":"தென்னம் பூவை மென்று தின்று வர உள் ரணம் ஆறும்."},{"n":1615,"t":"ஜாதிக்காய் அரைத்து கரும்படை மீது சில நாட்கள் தடவி வர நீங்கும்."},{"n":1616,"t":"குஷ்டம் குணமாக வேப்பமரத்தின் பிசினை எடுத்து அதை தண்ணீருடன் கலந்து குடித்து வர குஷ்டநோய் குணமாகும்."},{"n":1617,"t":"ஈரல் வீக்கம் குணமாக நொச்சி இலையை மைய அரைத்து உள்ளுக்கு 10மி.லி. குடிக்க குணமாகும்."},{"n":1618,"t":"சிறுநீர் கோளாறு நீங்க முலாம்பழம் சாப்பிட்டு வர சிறுநீர் கோளாறு நீங்கும்."},{"n":1619,"t":"அகத்தி இலை அவித்த தண்ணீர் பருகினால் வாய்ப்புண் ஆறும்."},{"n":1620,"t":"ஓதியம் பட்டையை ஊறவைத்த நீரால் வாய் கொப்பளித்து வர வாய்ப்புண் ஆறும்."},{"n":1621,"t":"புதினா கீரை துவையல் சாப்பிட்டு வர மசக்கை மயக்கம் வாந்தி சரியாகும்."},{"n":1622,"t":"பிரண்டைத் துவையல் பசியைத் தூண்டும்."},{"n":1623,"t":"பிரண்டை, உப்பு 20 மி.கி. பாலில் 3வேளை கொடுக்க வாந்தி நிற்கும்."},{"n":1624,"t":"முளைக்கீரை சாப்பிட்டு வர மலச்சிக்கல் நீங்கும்."},{"n":1625,"t":"மஞ்சள் பொடி கலந்த சுடுநீரில் ஆசன வாய்படும்படி அமர்ந்திருந்து வர மூலப்புண் ஆறும். மூல வலி குறையும்."},{"n":1626,"t":"அருகம்புல் தைலம் தேய்த்து குளித்து வர சொறி, சிரங்கு குணமாகும்."},{"n":1627,"t":"முருங்கைப் பூவைப் பாலில் காய்ச்சி சாப்பிட ஆண்மை பெருகும்."},{"n":1628,"t":"சேப்பங்கிழங்கு நரம்புகளை பலப்படுத்தும்."},{"n":1629,"t":"தர்ப்பைப் புல் கஷாயம் பருகினால் இரத்தம் சுத்தமாகும். 1630.வெந்தயக் கஞ்சி சாப்பிட பெண்களுக்கு தாய்ப்பால் பெருகும்."},{"n":1631,"t":"வாழைப்பழத்துடன் ஏலக்காய் பொடி சேர்த்து சாப்பிட பெரும்பாடு கட்டுப்படும். 1632.மருந்து சாப்பிட்டு வரும் காலங்களில் - அவரைக்காய், நார்த்தங்காய் ஊறுகாய் சாப்பிட நோய் விரைந்து குணமாகும்."},{"n":1633,"t":"எய்ட்ஸ் திருமணத்திற்கு முன் உடலுறவை தவிர்த்து, பாதுகாப்பாக துணைவியுடன் மட்டும் உடலுறவு கொண்டால் எய்ட்ஸ் பயம் எதற்கு?"},{"n":1634,"t":"பழங்களின் பலன் - அந்தந்த காலங்களில் கிடைக்கும் பழவகைகள் தவறாது எடுத்துக் கொள்ள வேண்டும்."},{"n":1635,"t":"வைட்டமின் இ குறைவினால் வரும் நோய்கள் - முழு தானியம், பச்சைக் காய்கறி, பழங்கள் மூலம் தீர்க்கலாம்."},{"n":1636,"t":"பார்ப்பது - எதிர் அமராமல் ஓரங்களில் அமருவது நல்லது."},{"n":1637,"t":"நீர், உணவு - பெளர்ணமி, அமாவாசை நாட்களில் தவிர்க்கவும். 1638.ஈஸ்ணோபிலியா தொல்லை குறைய - மஞ்சள் தூள் 1ஸ்பூன், தேன் ஒரு ஸ்பூன் கலந்து தினமும் 3வேளை உண்டு வரலாம்."},{"n":1639,"t":"உணவின் பலன் - உணவின் ஒவ்வொரு கவளத்தையும் ரசித்து ருசித்து உணர்ந்து உண்ண வேண்டும். அது ஆயுளை கூட்டும். உற்சாகம் தரும்."},{"n":1640,"t":"சில்லரைபூச்சிகள் :- நொச்சி இலைகளை வீட்டில் போட்டு வைக்க வராது."},{"n":1641,"t":"சிந்தனை :- ஒரு குறிப்பிட்ட விஷயத்தில் நிலையான சிந்தனையை வைத்தல் “தாரணா” எனும் யோகம் என்பதால் அமைதி வாழ்வு வாழலாம்."},{"n":1642,"t":"உணவு :- 40வயதை தாண்டிவிட்டால் அதிக உணவைத் தவிர்த்து சத்துள்ள உணவுகளை குறைந்த அளவும், பழச்சாறுபருக நோய் நம்மை நெருங்காது."},{"n":1643,"t":"முட்டை - 6வயது சிறார் முதல் 90வயது முதியோர் வரை தினம் ஒரு முட்டை (நாட்டுக்கோழி) வேக வைத்து சாப்பிடலாம்."},{"n":1644,"t":"உணவுடன் போதுமான மோர், தயிர் சேர்த்துக் கொள்ள வேண்டும்."},{"n":1645,"t":"பயிற்சி - உடலுக்குப் பயிற்சி கொடுப்பது போல் மனத்திற்கும் சிறுசிறு நல்ல பயிற்சிகள் கொடுத்து வலிமையாக்கலாம். மனோதிடம் பெருகும்."},{"n":1646,"t":"இசை :- பிலஹரி ராகம் புத்துயிர் உண்டாக்கும். உற்சாகம் தரும். காலையில் வேளையில் கேட்பது நன்று."},{"n":1647,"t":"சாப்பாடு - வெது வெதுப்பாகவோ, சூடாகவோ சாப்பிட வேண்டும்."},{"n":1648,"t":"முக்தி :- நீர், நிலம், நெருப்பு, காற்று, விண் இவற்றில் எந்த மூன்றை இழந்தாலும் முக்தி உறுதி."},{"n":1649,"t":"குழந்தை :- ஆண், பெண் குழந்தை என்பது ஆணினால் தான் நிர்ணயம் செய்யப்படுகிறது."},{"n":1650,"t":"கற்பனை பயங்கள், தாழ்வு மனப்பான்மை, தலைவலி அறவே நீங்க :- தன்வயம் ஆக்கிக் கொள்ள வேண்டும்."},{"n":1651,"t":"புத்துணர்ச்சி பெற :- துளசி இலைகளை செம்பு பாத்திரத்தில் இரவு ஊறவைத்து காலையில் அந்த தண்ணீர் பருகி வரலாம்."},{"n":1652,"t":"விலா வலி தீர :- துளசி இலை, இஞ்சி, தாமரை வேர் அரைத்து கொதிக்க வைத்து பற்று போடவும்."},{"n":1653,"t":"உடல் குளிர்ச்சி பெற :- உசில இலைப் பொடியை எண்ணெய் முழுக்கின் போது சிகைக்காய்க்குப் பதில் பயன்படுத்தலாம்."},{"n":1654,"t":"மாந்த இழுப்பு :- வேலிபருத்தி இலை சாறில் மிளகை ஊறவைத்து உலர்த்தி காயவைத்து தூள் பருப்பு எடை தேனில் எடுக்கலாம்."},{"n":1655,"t":"உடல் வெப்பம் குறைந்து வியர்வை தீர - காக்கிரட்டான் இலைச்சாறு, இஞ்சிச்சாறு சமஅளவு கலந்து அரைகரண்டி சாப்பிடலாம்."},{"n":1656,"t":"மூச்சு திணறல் தீர :- சிறுகுறிஞ்சா வேர் பொடி, திரிகடுகு பொடி வெந்நீரில் சாப்பிடலாம்."},{"n":1657,"t":"உடல் வெப்பம் தணிந்து குளிர்ச்சி உண்டாக - மாதுளம் பழச்சாறு கற்கண்டு கலந்து பருகி வரவும்."},{"n":1658,"t":"சுறுசுறுப்பாக இருக்க :- ரோஜாப்பூ இதழ்களை சாப்பிடலாம்."},{"n":1659,"t":"சரராய போதை நீங்க :- கொத்தமல்லியைச் சிறிது காடியில் அரைத்துக் கொடுக்கலாம். 1660.பக்கசூலை தீர - மிளகாய் பூண்டு விதை எண்ணி 2துளி சர்க்கரையில் காலை, மாலை. சாப்பிட்டு வரலாம்."},{"n":1661,"t":"உடல் உஷ்ணத்தை குறைக்க :- வெந்தயத்தை ஒரு நாள் விட்டு ஒரு நாள் சாப்பிட்டு வர உஷ்ணம் உடைந்து விடும்."},{"n":1662,"t":"உடல் வெப்பம் தணிய :- அஸ்வகந்தி இலையை பச்சையாகவோ, துவையல் செய்தோ சாப்பிட்டு வர வெப்பம் தணியும். 1663.இலந்தை இலை சாறு அருந்திவர பாடகர்களின் சாரீரம் சீர்படும்."},{"n":1664,"t":"உதட்டு வெடிப்பு ரணம் குணமாக :- வில் காய் ஒட்டை தாய்பாலில் உரைத்து உதட்டில் தடவ உதட்டு வெடிப்பு ரணம் குணமாகும்."},{"n":1665,"t":"உதட்டு ரணம், வெண்குஷ்டம் குணமாக :- அவுரிஇலை சாறில் இன்றி மணி பருப்பை உரைத்து இரவில் தடவிவர குணமாகும்."},{"n":1666,"t":"மலக்குடலில் கட்டிபட்டு போன மலம் அழுத்துவதினாலும் விந்து வெளியேறலாம். (ஆலோசனை தபால் எழுதவும்)."},{"n":1667,"t":"சிறுநீர் அதிகநேரம் அடக்குவதினாலும் விந்து வெளியேறலாம்."},{"n":1668,"t":"உடல் வலிமை பெற :- வேப்பம் பூ கஷாயம் குடித்து வரலாம்."},{"n":1669,"t":"மாரடைப்பை தடுக்க :- இதய நோயாளிகள். காலையில் அருகம்புல் சாறு சாப்பிட்டு வர மாரடைப்பை தடுக்கலாம்."},{"n":1670,"t":"கருஞ்சீரகம் கலந்த சந்தனாதி எண்ணை ஆண்குறியில் தடவிவர ஆண்குறி வருக்கும்."},{"n":1671,"t":"உடல் சூடு, கண் எரிச்சல் நீங்க :- வில்வ காயை பால்விட்டு அரைத்து நல்லெண்ணையுடன் சேர்த்து காய்ச்சி தலை முழுகி வர உடல் சூடு கண் எரிச்சல் நீங்கும்."},{"n":1672,"t":"பேறு கால வலி குறைய :- முருங்கை இலை 10கிராம், கொத்தமல்லி 10கிராம் வேகவைத்து அந்த நீரை குடித்து வந்தால் குறையும்."},{"n":1673,"t":"கருப்பை கோளாறு நீங்க - வெள்ளெருக்கு சமூலம் மிளகு, சுக்கு, சீரகம், கசாயம் 3 நாட்கள் சாப்பிட கருப்பை கோளாறு நீங்கும்."},{"n":1674,"t":"மலடு நீங்கி கர்ப்பம் தரிக்க - வேப்பங்கொழுந்து, வசம்புபூண்டு, மிளகு சமஅளவு மாதவிலக்கு ஆன நாட்களில் சாப்பிட வேண்டும். 3மாதம் சாப்பிட மலடு நீங்கி கர்ப்பம் தரிக்கும்."},{"n":1675,"t":"கருப்பை குற்றங்கள் நீங்கி குழந்தை பேறு உண்டாக - இலந்தை இலை, மிளகு, 6பூண்டு 4அரைத்து. 3நாட்கள் சாப்பிட குழந்தை பேறு உண்டாகும்."},{"n":1676,"t":"ஆசனவாய் வெடிப்பு புண் ஆற :- மாசிக்காய் நீரில் உரசி ஆசனவாயில் தடவிவர ஆசனவாய் வெடிப்பு புண் ஆறும். 1677.நரம்பு சுறுசுறுப்புடைய - இலந்தை வேரை. கஷாயம் செய்து தொடர்ந்து 48நாட்கள் 50மி.லி. குடித்துவர நரம்பு சுறுசுறுப்படையும்."},{"n":1678,"t":"தீப்புண் ஆற :- தேன் துளசிசாறு கலந்து தீப்புண் மீது தடவ குணமாகும்."},{"n":1679,"t":"சதைபிழற்சி, அடிபட்ட வீக்கம் தீர :- பிரண்டை சாறில் புளி, உப்பு கலந்து காய்ச்சி. பற்று போட தீரும்."},{"n":1680,"t":"முறிந்த எலும்பு ஒன்று கூட - பிரண்டை வேரை உலர்த்தி பொடி செய்து 1 கிராம் காலை குடித்து வர முறிந்த எலும்பு ஒன்று கூடும்."},{"n":1681,"t":"எலும்பை பற்றிய புண் ஆற :- வெள்ளை குங்கிலியம் சாப்பிட்டு வர ஆறும்."},{"n":1682,"t":"புற்று நோய் தீர பீச்சங்கு இலை வேர் பொடி, சிவகரந்தை, லவங்கம் கலந்து அரை ஸ்பூன் தேனில் கலந்து சாப்பிட்டு வர புற்று நோய் தீரும்."},{"n":1683,"t":"முகம் அழகாக நிறமாற - நன்னாரி வேர், ஆலம்பட்டை, ஆவாரம்பூ மூன்றையும் 2கிராம் அளவு 100மி.லி. பாலில் கொதிக்க வைத்து 2வேளை குடிக்க வேண்டும். டீ காபிக்கு பதிலாக குடிக்கலாம் தொடர்ந்து 1 வருஷம் குடிக்க முகம் அழகு கூடும்."},{"n":1684,"t":"வேப்பம்பூ சாறு, நெல்லிக்காய் சாறு கலந்து சாப்பிட எந்த நோயும் அணுகாது."},{"n":1685,"t":"அசோகமரபட்டை அரைத்து எலும்பு முறிவுக்கு கட்டிவர எலும்பு கூடும்."},{"n":1686,"t":"நோய் சீக்கிரம் குணமாக :- செவ்வாழைப்பழம் தினம் ஒன்று சாப்பிடுங்கள்."},{"n":1687,"t":"கல்லபைப்டு நீங்க : - அசோக் மர விதை பொடி அரை கிராம் உணவுக்கு முன் சாப்பிட்டு வர கல்லடைப்பு நீங்கும்."},{"n":1688,"t":"சர்க்கரை நோய் உள்ளவர்களுக்கு :- கேழ்வரகு கூழ் 1 வேளை சாப்பிட வேண்டும்."},{"n":1689,"t":"ஆண்மை பெருக - புளியங்கொட்டை பொடி, ஓமம் சேர்த்து சாப்பிட்டு வர ஆண்மை பெருகும்."},{"n":1690,"t":"குரல் வளம் உண்டாக :- வெற்றிலைவேரை வாயில் போட்டு மென்று வர குரல் வளம், உண்டாகும்."},{"n":1691,"t":"உடம்பிலுள்ள முடி அகற்ற - வேப்பங்கொழுந்து, விரலி மஞ்சள், தாளகம் மூன்றையும் அரைத்து 2மணி நேரம் கழித்து கழுவ வேண்டும். 5தடவை செய்ய முடி நீங்கி விடும்."},{"n":1692,"t":"தொண்டை கரகரப்பு நீங்க - மருதாணி இலை ஊற வைத்து வாய் கொப்பளிக்க கரகரப்பு நீங்கும்."},{"n":1693,"t":"கட்டி கடைய :- கருவேளை கொழுந்து அரைத்து கட்டி மீது தடவ கட்டி உடையும்."},{"n":1694,"t":"மூளை சக்தி அதிகரிக்க - பசலை கீரை வாரம் 1நாள் சாப்பிட மூளை சக்தி அதிகரிக்கும்."},{"n":1695,"t":"ஒல்லியாக உள்ளவர்கள் - முருங்கை கீரை, பசலை கீரை, ஆரஞ்சுபழம் சாப்பிட வேண்டும்."},{"n":1696,"t":"மலச்சிக்கல் சரியாக - வல்லாரைபொடி அரை ஸ்பூன் இரவில் சாப்பிட்டு வெந்நீர் குடிக்க மலச்சிக்கல் சரியாகும்."},{"n":1697,"t":"தீப்புண் ஆற :- வெந்தயபொடி தீப்புண் மீது தடவ புண் விரைவில் ஆறும்."},{"n":1698,"t":"முடி செழித்து வளர :- வேப்பமுத்து, மிளகு, கருஞ்சீரகம், மூன்றையும் அரைத்து நல்லெண்ணையில் காய்ச்சி தலையில் தேய்த்து குளித்து வர முடி செழித்து வளரும்."},{"n":1699,"t":"நோய்கள் முறிய - வேப்ப இலையை பசும்பாலில் அரைத்து குடிக்க நோய்கள் முறியும்."},{"n":1700,"t":"உணவு குழாயில் சிக்கிய கோழி எலும்பு வெளியேற 100 கிராம் முட்டைகோஸ் பச்சையாக 5 நாட்கள் சாப்பிட மலத்துடன் வெளியேறும்."},{"n":1701,"t":"பூச்சி வராமல் தடுக்க - ஆரஞ்சு பழதோல் வெயிலில் காய வைத்து சிறுதுண்டுகளாக துணிவைக்கும் பீரோவில் போட்டு வைக்க பூச்சி வராது."},{"n":1702,"t":"பிரயாணத்தின் போது வாந்தி நிறுத்த - தினசரி ஒரு நெல்லிக்காய் என தொடர்ந்து 41நாட்கள் சாப்பிட வாந்தி வராது."},{"n":1703,"t":"நெஞ்சு சளி :- தேங்காய் எண்ணெயில் கற்பூரம் சேர்த்து சுடவைத்து நெஞ்சில் தடவ குணமாகும்."},{"n":1704,"t":"ஜலதோஷம் :- மாதுளம் பழம் சாப்பிட ஜலதோஷம் குணமாகும்."},{"n":1705,"t":"தலைச்சுற்றல் குணமாக :- கீழாநெல்லி தைலத்தை பூசி குளித்து வந்தால் தலைசுற்றல் நிற்கும்."},{"n":1706,"t":"பசி உண்டாக :- பிரண்டையை நெய்விட்டு வதக்கி துவையல் செய்து சாப்பிட்டு வர பசி உண்டாகும்."},{"n":1707,"t":"கண்நோய் - முருங்கை கீரை சாப்பிட கண்நோய் தீரும்."},{"n":1708,"t":"மூட்டுவலி குணமாக - கணை பூண்டு இலையை வேப்ப எண்ணை விட்டு வதக்கி கட்டி வர குணமாகும்."},{"n":1709,"t":"வாய்ப்புண் ஆற :- தேங்காய் பாலுடன் தேன் கலந்து குடித்தால் குணமாகும்."},{"n":1710,"t":"மூலம் :- பப்பாளி பழம் சாப்பிட்டு வர மலச்சிக்கல் நீங்கி மூலத்தை குணமாகும்."},{"n":1711,"t":"பரு: - ஜாதிக்காய், சந்தனம் மிளகு சேர்த்து அரைத்து தடவ குணமாகும்."},{"n":1712,"t":"நரை நீங்க :- முளைகீரை வாரம் 1நாள் தொடர்ந்து சாப்பிடவும்."},{"n":1713,"t":"செர்ரி - கருப்பை வியாதிகளுக்கு நல்லது."},{"n":1714,"t":"நெல்லிக்கனி - உடல் அசதியைப் போக்கி உடலுக்கு புத்துணர்ச்சி அளிக்கும்."},{"n":1715,"t":"ஆப்பிள் :- மலச்சிக்கலை போக்கும்."},{"n":1716,"t":"இரத்த சோகை - கொய்யாப்பழம் சாப்பிடுவதால் குணமாகும்."},{"n":1717,"t":"நீர்கோவை தீர :- மஞ்சளைச் சுட்டு புகையை நுகர நீர்கோவை தீரும்."},{"n":1718,"t":"விந்துவை அதிகரிக்க - வாழைப்பூ விந்துவை அதிகரிக்கும்."},{"n":1719,"t":"கபம் நீங்க - சுண்டைக்காய் சமைத்து உண்ண கபம் நீங்கும்."},{"n":1720,"t":"கண் எரிச்சல் -நந்தியாவட்டை பூவால் ஒத்தடம் கொடுக்க கண் எரிச்சல் தீரும்."},{"n":1721,"t":"தேமல் படை குணமாக :- நாயுறுவி இலைசாறை தடவி வர குணமாகும்."},{"n":1722,"t":"சளியை அகற்ற :- துளசியை அவித்து சாறு பிழிந்து குடிக்க சளியை அகற்றும்."},{"n":1723,"t":"உள்ளங்கால் எரிச்சல் தீர :- பாகல் இலைசாறு. தடவ உள்ளங்கால் எரிச்சல் தீரும்."},{"n":1724,"t":"பல்நோய் குணமாக - மகிழ இலை கசாயத்தில் வாய் கொப்பளிக்க பல்நோய் அனைத்தும் நீங்கும்."},{"n":1725,"t":"தமரத்தம் பழம் சாப்பிட நல்ல ஜீரண சக்தி உண்டாகும்."},{"n":1726,"t":"நல்ல தூக்கம் வர :- மருதோன்றி பூ 2இரவு சாப்பிட நல்ல தூக்கம் வரும்."},{"n":1727,"t":"உடல் நாற்றம் நீங்க - பற்பாடகம் இலையை பாலில் அரைத்து பூசி குளிக்க உடல் நாற்றம் நீங்கும்."},{"n":1728,"t":"சர்க்கரை சேர்க்காத கடுங்காப்பி ஜலதோஷத்தை விலக்கும்."},{"n":1729,"t":"பீட்ரூட் கிழங்கு சாப்பிட்டு வர புதிய இரத்தத்தை உருவாக்கும்."},{"n":1730,"t":"தவசி கீரை, முருங்கை கீரை சாப்பிட ஆண்மை பெருகும்."},{"n":1731,"t":"தினமும் அரைக்கீரை சாப்பிட்டு வர உடல் குளிர்ச்சியடையும். கண் எரிச்சல் நீங்கும்."},{"n":1732,"t":"தாமரை இதழ்களை காய்ச்சி வடிகட்டி சர்க்கரை அல்லது தேன் கலந்து உண்டு வர கண் குளிர்ச்சியடையும். உட்சூடு தணியும். 1733.பொன்னாங்கண்ணி இலையை காலையில் மென்று தின்று பால் பருகி வர கண்பார்வை தெளிவு பெறும்."},{"n":1734,"t":"கண் எரிச்சல் குணமாக நந்தியா வட்டை பூவால் ஒத்தடம் கொடுக்கலாம்."},{"n":1735,"t":"நெல்லிக்காயை சாறு பிழிந்து ஒவ்வொரு ஸ்பூன் இருவேளை குழந்தைகளுக்கு கொடுத்துவர கண் சூடு தணியும்."},{"n":1736,"t":"எள் செடியின் பூவை பறித்து பற்களில் படாமல் விழுங்கி விட கண்வலி வராது."},{"n":1737,"t":"தான்றிக்காய் தோலை உறித்து பொடி செய்து கால்கரண்டி தேனில் குழைத்து காலையில் சாப்பிட்டு வர கண்கூர்மை ஆகும்."},{"n":1738,"t":"தூதுவளை காய் ஊறுகாய் செய்து சாப்பிட கண் ஒளி பெருகும்."},{"n":1739,"t":"பிரமதண்டு இலைச்சாறு பால் 1துளி கண்ணில் விடுவது கண்ணில் சதை வளருவதை தடுக்கும்."},{"n":1740,"t":"சித்திரை, வைகாசி மாதங்களில் தொடர்ந்து 60நாட்கள் பொன்னாங்கன்னி கீரை சாப்பிட்டால் கண்மார்வை கூர்மையாகும்."},{"n":1741,"t":"கண்எரிச்சல், நீர்வடிதல் நிற்க நாவற்பழத்தை ஒருநாள் விட்டு ஒருநாள் சாப்பிட்டு வர குணமாகும்."},{"n":1742,"t":"புளிய இலை கொழுந்தை இரு கண்களின் மேல் வைத்து கட்டி ஒரு மணி நேரம் கழித்து எடுத்தால் கண் சிவப்பு மாறும்."},{"n":1743,"t":"வெங்காயச் சாறு ஒரு துளி கண்ணில் பட்டால் போதும். சிறிது எரிச்சலுக்கு பின் ஓய்வுடன் நல்ல தூக்கம் வரும்."},{"n":1744,"t":"அரைக்கீரை வாரம் இருமுறை உணவில் சேர்த்து வந்தால் கண்கள் குளிர்ச்சி அடையும்."},{"n":1745,"t":"மாலைக்கண் நோயின் அறிகுறி தென்பட ஆரம்பிக்கும் போதே பப்பாளி பழம் சாப்பிட ஆரம்பித்து விட்டால் மாலைக்கண் நோயை வர விடாமல் தடுத்து விடலாம்."},{"n":1746,"t":"விஷ்ணுகிராந்தி சமூலம் 48நாட்கள் கொள்ள கண்டமாலை தீரும்."},{"n":1747,"t":"வில்வம் தளிரை வதக்கி இளஞ்சூட்டில் ஒத்தடம் கொடுக்க கண்வலி, கண்சிவப்பு, அரிப்பு நீங்கும்."},{"n":1748,"t":"பாதாளமூலி பழச்சாற்றில் செய்த மணப்பாகு சாப்பிட்டுவர கோடை கால வெப்ப நோய்கள் தீரும்."},{"n":1749,"t":"புளியம் பூவை அரைத்து கண்ணைச்சுற்றி பற்றிட கண்வலி, கண் சிவப்பு மாறும்."},{"n":1750,"t":"கண்ணில் நீர் வடிதல் குணமாக பீதரோகினி வேரை அரைத்து வடிகட்டி ஓரிரு துளிகள் கண்களில் விட குணமாகும்."},{"n":1751,"t":"பசுநெய் மற்றும் பசு வெண்ணெய் கண்ணுக்கு குளிச்சி தரும் உடல் பொலிவு பெறும்."},{"n":1752,"t":"சூரிய உதயத்திற்கு முன்பாக எழுந்து கொள்ள கண்கள் ஒளி பெறும்."},{"n":1753,"t":"தென்னம்பூவை வதக்கி மார்பில் கட்டி வர பால் சுரப்பு நிற்கும்."},{"n":1754,"t":"வெற்றிலை சாறு ஓரிரு துளிகள் காதில் விட்டால் காதுவலி குணமாகும்."},{"n":1755,"t":"ஊமத்தன் பூவை பிழிந்து சாறு எடுத்து இரு துளிகள் காதில் விட காதுவலி குணமாகும்."},{"n":1756,"t":"வாழைப்பட்டையை தீயில் சூடேற்றிப் பிழிந்து ஓரிரு துளிகள் விட காதுவலி குணமாகும்."},{"n":1757,"t":"எருக்கன் கொட்டையை கசக்கி இரண்டு சொட்டு காதில் விட காதுவலி குணமாகும்."},{"n":1758,"t":"எலுமிச்சை பழச்சாறு இரண்டு மூன்று சொட்டு காதில்விட காது குடைச்சல் சரியாகும்."},{"n":1759,"t":"எருக்கம் மொட்டை கசக்கி சில சொட்டுகள் காதில் விட காதுவலி குணமாகும்."},{"n":1760,"t":"பூவரசன் வேர், பட்டை கஷாயம் செய்து வாய் கொப்பளித்து வர தொண்டை தொடர்பான பிரச்சனைகள் தீரும்."},{"n":1761,"t":"தொண்டைப்புண்ணுக்கு சுக்கு, வால்மிளகு, திப்லி, ஏலரிசி இவைகளை வறுத்து தூளாக்கி ஒரு சிட்டிகை பால் அல்லது தேனில் குழைத்து சாப்பிட குணமாகும்."},{"n":1762,"t":"நல்லவேளை இலைச்சாறு ஓரிரு துளிகள் காதில் விட சீழ்வடிதல் குணமாகும்."},{"n":1763,"t":"கிராம்பை தணலில் வதக்கி வாயிலிட்டு சுவைக்க தொண்டைப்புண் ஆறும்."},{"n":1764,"t":"தொண்டை வலி, காதுவலி மற்றும் தொண்டை எரிச்சலுக்கு கிருஷ்ண துளசி எடுத்து வர குணமாகும்."},{"n":1765,"t":"நாயுருவி செடி இலை சாறு 2சொட்டு காதில் விட சீழ்வடிதல் நிற்கும்."},{"n":1766,"t":"நெல்லி, மா இலைச்சாறு நீரில் இட்டு காய்ச்சி வாய் கொப்பளிக்க வாய்ப்புண் தீரும்."},{"n":1767,"t":"பப்பாளிப் பாலை வாய், நாக்கு புண்ணிற்கு தடவ குணமாகும்."},{"n":1768,"t":"குரல் கம்மல் மாற மாவிலையை கொதிக்க வைத்த நீரைப் பருகி வர குணமாகும்."},{"n":1769,"t":"தினந்தோறும் பிராணயாமம் செய்து வர சுவாசக் கோளாறுகள் நீங்கும்."},{"n":1770,"t":"சீதபேதி குணமாக கசகசாவை சர்க்கரை சேர்த்து சாப்பிட்டால் மூன்று நாட்களில் குணம் பெறலாம்."},{"n":1771,"t":"அவரை இலை சாறு 25 மில்லி, 50 மில்லி பசுந்தயிர் சேர்த்து வெறும் வயிற்றில் சாப்பிட்டு வர சீதபேதி குணமாகும்."},{"n":1772,"t":"சீதபேதி குணமாக நுங்கை தோல் உரிக்காமல் சாப்பிட்டு வர குணம் காணலாம்."},{"n":1773,"t":"சீதபேதி குணமாக வெந்தயத்தை வறுத்து இடித்து வெல்லம் சேர்த்து பிசைந்து 4முறை சாப்பிட்டால் நலம் பெறலாம்."},{"n":1774,"t":"மலைவாழைப்பழத்தை நல்லெண்ணையில் சேர்த்து சாப்பிட சீதபேதி குணமாகும்."},{"n":1775,"t":"கசகசாவை வறுத்து தூள் செய்து நாட்டு சர்க்கரை சேர்த்து காலை, மாலை சாப்பிட சீதபேதி குணமாகும்."},{"n":1776,"t":"சீதயேதிக்கு நாட்டுச்சர்க்கரையுடன் பசுவெண்ணெய் சேர்த்து மூன்று வேளை சாப்பிட குணமாகும்."},{"n":1777,"t":"இஞ்சிச் சாறுடன் சமஅளவு வெங்காயச்சாறு கலந்து பருகி வர வாந்தி உடனே நிற்கும்."},{"n":1778,"t":"நுங்கை மேல் தோல் உரிக்காமல் சாப்பிட்டு வர சீதபேதி குணமாகும்."},{"n":1779,"t":"துளசி சாறு, இஞ்சி சாறு சமஅளவு கலந்து குடிக்க ஜலதோஷம் நீங்கும்."},{"n":1780,"t":"கடுக்காய் பொடி, நெல்லிக்காய் பொடி கலந்து தேனில் சாப்பிட மூக்கடைப்பு சளி குணமாகும்."},{"n":1781,"t":"ஓமவல்லி இலை மூன்றினை காலையில் மென்று தின்று 1டம்ளர் சுடுநீர் குடிக்க இதய வலியும், மாலையில் கீரையாக உண்ண சளித்தொல்லை நீங்கும்."},{"n":1782,"t":"முள்ளங்கி சாறு சாப்பிட தலைவலி, ஜலதோஷம் இருமல் குணமாகும்."},{"n":1783,"t":"மாதுளம் பழச்சாறு, எலுமிச்சை பழசாறு கலந்து குடித்து வந்தால் சளித்தொல்லை குணமாகும்."},{"n":1784,"t":"மூச்சு வாங்கும் தொந்தரவு தீர தூதுவளை மாமருந்தாம்."},{"n":1785,"t":"வன்னி மரப்பட்டையை தூளாக்கி காய்ச்சி வடிகட்டி 3வேளை குடித்து வர சுவாச நோய் குணமாகும் (அளவுடன் மட்டும்)"},{"n":1786,"t":"இன்புறா இலைச்சாற்றைத் தடவி வர காய்ச்சலால் உண்டான எரிச்சல் தீரும். 1787.மணலிக்கீரையை பருப்புடன் சேர்த்து கடைந்து உணவுடன் சாப்பிட்டு வர மார்புச் சளி நுண்புழு விலகும்."},{"n":1788,"t":"சிறுகீரை அடிக்கடி சேர்த்து வர நீர்கோவை குணமாகும்."},{"n":1789,"t":"காய்ச்சல் தாகம் தீர பேராமுட்டி வேரை நீரில் காய்ச்சி இருவேளை கொடுக்க குறையும்."},{"n":1790,"t":"அறகீரையை நெய்விட்டு சமைத்து உண்டு வர சளிக்காய்ச்சல், டைபாய்டு குணமாகும்."},{"n":1791,"t":"ஏலப்பொடியை நெய்யில் கலந்து காலை, மாலை வெறும் வயிற்றில் சாப்பிட மார்பு சளி குணமாகும்."},{"n":1792,"t":"குங்குமப்பூவுடன் சமஅளவு தேன் கலந்து 3 நாட்கள் தினசரி 2வேளை உட்கொள்ள சுவாச குழாய் அலர்ஜி குணமாகும்."},{"n":1793,"t":"அருகம்புல் சாறு பருகி வர சளித்தொல்லை தீரும்."},{"n":1794,"t":"ஆஸ்துமா குணமாக வில்வ இலைபொடி தினமும் ஒரு ஸ்பூன் சாப்பிட்டு வர குணம் பெறலாம்."},{"n":1795,"t":"புதிய ரோஜா மலரை முகர்ந்தால் மூக்கடைப்பு நிற்கும்."},{"n":1796,"t":"அமுக்கிராங் கிழங்கைப் பொடி செய்து தினமும் இரவில் பாலுடன் சேர்த்து சாப்பிட்டு வர கபம் வெளியேறும். 1797.சீரகத்தை பொன் வருவலாக வறுத்து பொடி செய்து கல்கண்டு சேர்த்துச் சாப்பிட இருமல் குணமாகும்."},{"n":1798,"t":"கக்குவான் இருமல் வேகம் குறைய சோடா உப்பை தண்ணீரில் கலந்து குடிக்க குறையும்."},{"n":1799,"t":"துளசி ரசம், இஞ்சி ரசம் கலந்து பருக ஜலதோஷம் நீங்கும்."},{"n":1800,"t":". வெந்தயக்கீரை சமைத்து சாப்பிட்டு வர இருமல் உடன் குணமாகும்."},{"n":1801,"t":"வெள்ளை பூண்டு, வசம்பு, ஓமம் சமஅளவு எடுத்து அரைத்து மூன்று நாட்கள் சாப்பிட ஜன்னி குணமாகும்."},{"n":1802,"t":"நார்த்தங்காய் செடி இலைகளை கஷாயம் செய்து குடிக்க காய்ச்சல் சரியாகும். 1803.மிளகு, திப்பிவி, சுக்கு சம அளவு பொடி தேனில் சாப்பிட காய்ச்சல் குணமாகும்."},{"n":1804,"t":"எலுமிச்சம்பழம்சாறு தேன் கலந்து 100மி.லி சாப்பிட்டு வர மலேரியா காய்ச்சல், குணமாகும்."},{"n":1805,"t":"கோரைக்கிழங்கு கஷாயம் குடித்தால் எப்படிப்பட்ட காய்ச்சலும் குணமாகும்."},{"n":1806,"t":"கோரை கிழங்கை கழுவி சுத்தமாக்கி நீர்விட்டுக் காய்ச்சிக் குடிக்க கடுங்காய்ச்சல் குணமாகும்."},{"n":1807,"t":"சர்க்கரை சேர்க்காத கடுங்காப்பி ஜலதோஷத்தை விலக்கும்."},{"n":1808,"t":"எலும்புக் காய்ச்சல் தீர நெல்லிக்காய் லேகியம் சிறு உருண்டை காலை மாலை சாப்பிட்டு வரத்தணியும்."},{"n":1809,"t":"சளிக்காய்ச்சலுக்கு ஓமவல்லி இலைக்காம்புகளை குடிநீராக்கி கொடுக்க குணமாகும்."},{"n":1810,"t":"நெறி கட்டியதால் வந்த சுரம் தீர மிளகாய் இலையில் காய்ச்சிய குடிநீரை 4வேளை ஒரு மடக்குடிக்க குணமாகும்."},{"n":1811,"t":"பித்த சுரம் தீர சீதேவி செங்கழுநீர் சமூலமாகக் குடிநீர் செய்து சாப்பிட தீரும்."},{"n":1812,"t":"ஊமத்தை இலையை நல்லெண்ணெயில் வதக்கிக் கட்ட அகண்ட வாயு குணமாகும்."},{"n":1813,"t":"இரைப்புக்கு துத்திப் பூச்சுரணம் சர்க்கரை கலந்து அரைக் கரண்டி காலை மாலை பாலில் சாப்பிட குணமாகும்."},{"n":1814,"t":"வறுத்த திப்பிலி பொடியை அரை கிராம் காலை, மாலை தேனில் குழைத்து உண்டு வர இருமல் குணமாகும்."},{"n":1815,"t":"வல்லாரை இலையுடன், தூதுவளை சேர்த்தரைத்து பாலில் சாப்பிட்டு வர நுரையீரலில் உள்ள சளி கட்டு நீங்கும்."},{"n":1816,"t":"தாளிச்ச பத்திரியுடன் அதிமதுரம் சேர்த்து வாயில் ஒதுக்க வறட்டு இருமல் சரியாகும்."},{"n":1817,"t":"வெள்ளைப்பூண்டு சாறு வெற்றிலை சாறு கலந்து தடவி வர எச்சில் புண் குணமாகும்."},{"n":1818,"t":"அகத்தி இலை அவித்த தண்ணீர் பருகினால் வாய்ப்புண் ஆறும்."},{"n":1819,"t":"கோடசாலை இலையை கஷாயமாக்கி வாய்கொப்பளிக்க நாக்கு புண், வாய், உதட்டுப்புண்கள் 1வாரத்தில் குணமாகும்."},{"n":1820,"t":"தேங்காய் பாலுடன் தேன் கலந்து குடித்தால் வாய்ப்புண் குணமாகும்."},{"n":1821,"t":"கரும்பு தோகையை எரித்து சாம்பலாக்கி வெண்ணெய்யுடன் கலந்து உதட்டு வெடிப்புக்குப் போட்டால் குணமாகும்."},{"n":1822,"t":"ஒதியம் பட்டையை ஊறவைத்த நீரால் வாய் கொப்பளித்து வர வாய்ப்புண் ஆறும்."},{"n":1823,"t":"பிரமத்தண்டு எரித்த சாம்பலால் பல் துலக்கி வர பல்கரை பல் சொத்தை குணமாகும்."},{"n":1824,"t":"இஞ்சி சாறுடன், தேன் கலந்து கொப்பளித்து குடித்துவர சொத்தைப்பல் குணமாகும்."},{"n":1825,"t":"படிகாரத்தையும், கடுக்காயையும் பொடி செய்து நீரில் கலந்து வாய் கொப்பளித்து வர ஈரில் உள்ள புண்கள் ஆறும்."},{"n":1826,"t":"கண்டங்கத்திரி பழத்தை உலர்த்தி நெருப்பிட்டு வாயில் புகை இழுக்க பல்வலி, ஈறுவலி குணமாகும்."},{"n":1827,"t":"ஒரு துண்டு சுக்கை வாயில் போட்டு அடக்கிக் கொள்ள பல்வலி குறையும்."},{"n":1828,"t":"செவ்வாழைப்பழத்தை இரவு சாப்பிட்டு வந்தால் பல்வலி, ஈறுவீக்கம், பல்லில் ரத்த கசிவு, பல் சொத்தை வராது."},{"n":1829,"t":"துத்தி இலை வேர் கஷாயம் செய்து வாய் கொப்பளித்து வந்தால் பல்வலி, கூச்சம், பல்ஆட்டம் குணமாகும்."},{"n":1830,"t":"மாவிலையை பொடி செய்து பற்களைத் துலக்கி வந்தால் பல் உறுதி பெறும்."},{"n":1831,"t":"மகிழம் இலை கஷாயம் செய்து வாய் கொப்பளித்து வர பல் நோய் எதுவும் அணுகாது."},{"n":1832,"t":"ஒரு நாள் விட்டு ஒரு நாள் அதிகாலை வெறும் வயிற்றில் மாதுளம் பழம் சாப்பிட்டு வர பற்கள், எலும்பு உறுதியாகும்."},{"n":1833,"t":"பூந்தி கொட்டை, உப்பு சேர்த்து வறுத்து பல்பொடியில் சேர்த்து பல் தேய்க்க பல் நோய் வராது."},{"n":1834,"t":"கோவைப்பழம் சாப்பிட பல்வலி நிவாரணம் பெறலாம்."},{"n":1835,"t":"நெல்லிக்காயை பற்களினால் நன்கு மென்று தின்று வர பற்கள் உறுதி பெறும்."},{"n":1836,"t":"கருவேலம்பட்டை பொடி செய்து பல் துலக்கி வந்தால் பல் சம்பந்தமான நோய்கள் நெருங்காது."},{"n":1837,"t":"நெல்லி முள்ளி, தான்றிக்காய், கடுக்காய் மூன்றையும் குடிநீரில் ஊறவைத்து வாய் கொப்பளித்து வர துர்நாற்றம் தீரும்."},{"n":1838,"t":"விக்கல் தீர முற்றிய மாவிலையை பொடியாக்கி தணலில் போட்டு சுவாசிக்கத் தீரும். 1839.விக்கல் குணமாக விரலி மஞ்சள் ஒரு துண்டை சுட்டு கரியாக்கி உண்ணலாம்."},{"n":1840,"t":"சித்திரப்பாலாடை கீரையை பருப்புடன் சேர்த்து உணவுடன் உண்டு வர வாய்ப்புண், உதடு வெடிப்பு குணமாகும்."},{"n":1841,"t":"வாய்ப்புண், பல்வவி குணமாக கொள்ளுக்காய் வேளை வேரை கொதிக்க வைத்து வாய் கொப்பளிக்க சரியாகும்."},{"n":1842,"t":"வாய்ப்புண் குணமாக அகத்திக்கீரை மற்றும் மணத்தக்காளி கீரை சமைத்து சாப்பிட்டால் இரண்டு நாளில் குணமாகும்."},{"n":1843,"t":"அகத்தி இலை அடிக்கடி உண்ண உதட்டுப் புண், வாய்ப்புண் குணமாகும்."},{"n":1844,"t":"மாதுளம்பழம் அடிக்கடி சாப்பிட்டு வந்தால் ஞாபகசக்தி, எலும்பு உறுதி, பற்கள் உறுதிப்படும்."},{"n":1845,"t":"வாய் வீச்சத்தை போக்கி விட தினமும் கோதுமை புல்லை மென்று துப்பிவிட துர்நாற்றம் விலகும்."},{"n":1846,"t":"பிரயான் பாலைத் தடவி வர பல் ஆட்டம், பல்வலி, ஈறுவீக்கம் குணமாகும்."},{"n":1847,"t":"முன்னைக்கீரையை பருப்புடன் சேர்த்து சமைத்து சாப்பிட பசி மந்தம், மயக்கம் தீரும்."},{"n":1848,"t":"புளியாரை கீரை உணவுடன் சேர்த்து வர மூல வாயு, பித்தம், சுவையின்மை, மயக்கம் தீரும்."},{"n":1849,"t":"முள்ளிக்கீரையை அடிக்கடி உணவுடன் சேர்த்து உண்டுவர பசியின்மை மாறி நன்கு பசி உண்டாகும்."},{"n":1850,"t":"ஆதொண்டை இலையை நெய்யில் வதக்கி துவையலாக்கி உணவுடன் உட்கொள்ள சுவையின்மை, பசியின்மை நீங்கும்."},{"n":1851,"t":"சீரகத்தை வறுத்து பொடி செய்து வாழைப்பழத்துடன் சாப்பிட்டால் சுகமான நித்திரை வரும்."},{"n":1852,"t":"நெல்லிக்காய் சாறு 1அவுன்ஸ் குடித்தால் எப்படிப்பட்ட கிறுகிறுப்பும் குணமாகும்."},{"n":1853,"t":"வேப்பம் பூவை வறுத்து பொடி செய்து பருப்பு ரசத்துடன் கலந்து சாப்பிட வாந்தி நிற்கும்."},{"n":1854,"t":"கர்ப்ப கால வாந்திக்கு லவங்க பொடியை நீரில் கலந்து 1/2 மணி நேரம் ஊற வைத்து வடிகட்டி பருகினால் வாந்தி நிற்கும்."},{"n":1855,"t":"குமட்டல் நீங்க வெற்றிலைக் காம்பை வாயில் அதக்கினால் சரியாகும்."},{"n":1856,"t":"புதினா கீரை துவையல் சாப்பிட்டு வர மசக்கை மயக்கம் வாந்தி சரியாகும்."},{"n":1857,"t":"பிரண்டைத் துவையல் பசியைத் தூண்டும்."},{"n":1858,"t":"களாக்காய் ஊறுகாய் சாப்பிட்டு வர ஜீரண சக்தி பெருகும்."},{"n":1859,"t":"தென்னம்பூவை மென்னு தின்று வர உள் ரணம் ஆறும்."},{"n":1860,"t":"பிரண்டை துவையல் செரியாமையைப் போக்கி பசியைத் தூண்டும்."},{"n":1861,"t":"தாகம்... தாகம்.. என்று மிக தாகமாக இருப்பவர்கள் அரச இலையை ஊற வைத்து நீரைப் பருகி வர தீரும்."},{"n":1862,"t":"பசியை தூண்டி தாதுக்களின் தன்மையைத் துவளச்செய்யும் தன்மை முள்ளிக் கீரைக்கு உண்டு."},{"n":1863,"t":"மூட்டுவலி, சதைவீக்கம், நரம்புபிசகு ஆகிய நோய்களுக்கு நொச்சி சாற்றைப் பூசி குணம் பெறலாம்."},{"n":1864,"t":"ஓமத்தை நீர்விட்டு அரைத்துக் களிபோல் கிளறி இளஞ்சூட்டில் வீக்கம், வலியுள்ள இடங்களில் பற்று போட குணமாகும்."},{"n":1865,"t":"துளசிச்சாறு, கரிசாலைச் சாறு இரண்டும் கலந்து காதில்விட்டு வர காதுவவி, சீழ்வடிதல் குணமாகும்."},{"n":1866,"t":"வெங்காயம் சாறை கடுகு எண்ணெய்யில் கலந்து வலி உள்ள இடத்தில் தடவி வர வாத மூட்டு வலி குணமாகும்."},{"n":1867,"t":"சரக்கொன்றை மரவிதையை அரைத்து பற்றுப் போட மூட்டுவலி, மூட்டு பிடிப்பு குணமாகும்."},{"n":1868,"t":"பச்சை கற்பூரத்துடன், புதினா இலை சாறை கலந்து மூட்டு வலி உள்ள இடத்தில் தடவ மூட்டுவலி நிற்கும்."},{"n":1869,"t":"சுக்கை நீர்விட்டு நன்றாக அரைத்து அதை கொதிக்க வைத்து சூட்டுடன் மூட்டுகளில் பூசி வந்தால் மூட்டு வீக்கம் குறையும்."},{"n":1870,"t":"கிராந்தி நாயகம் இலையை அரைத்து நகச்சுற்றுக்கு கட்ட குணமாகும்."},{"n":1871,"t":"அதிமதுரத்தை ஒரு சிறு துண்டு வாயில் போட்டு அததக்கிக் கொண்டால் நெஞ்சுக் கமறல் நீங்கும்."},{"n":1872,"t":"கிராணி, குன்மம், கப நோய்கள் தீர அழிஞ்சல் இலையை அரைத்து 1கிராம் காலை, மாலை கொடுக்கலாம்."},{"n":1873,"t":"சீந்தில் கொடிச்சாறுடன் தேன் கலந்து தினமும் காலையில் சாப்பிட்டு வர சர்க்கரை நோய் குணமாகும்."},{"n":1874,"t":"கொன்றை மர பூவை மைய அரைத்து மோரில் கலந்து கொடுத்து வர சர்க்கரை வியாதி குணமாகும்."},{"n":1875,"t":"கோவைப்பழம் தினசரி 1சாப்பிட்டு வர சர்க்கரை நோய் கட்டுப்படும்."},{"n":1876,"t":"தினசரி 5 ஆவரமபூ மென்று சாப்பிட்டு வர சர்க்கரை நாய் கட்டுப்படும்."},{"n":1877,"t":"சிறியா நங்கை கசபிட்டுவர நீரழிவு பாதிப்புகள் தடுக்கப்படும்."},{"n":1878,"t":"ஆவராம்பூ, கருவேப்பிலை, நெல்லி சேர்த்து பருக நீரழிவு கட்டுப்படும்."},{"n":1879,"t":"பாகற்காய் சாப்பிட்டு வந்தாலும் சிறு குறிஞ்சான் இலை பொடி சாப்பிட்டாலும் சர்க்கரை நோய் கட்டுப்படும்."},{"n":1880,"t":"ரோஜாபூவை ஊறவைத்து கசக்கி பிழிந்து சர்க்கரை சேர்த்து குடித்து வர மூலச்சூடு தணியும்."},{"n":1881,"t":"சர்க்கரை நோய் உள்ளவர்கள் உளுந்தால் செய்த உணவு வகைகள் ஆவியில் வேக வைத்து சாப்பிடலாம்."},{"n":1882,"t":"நீரழிவு நோயாளிகளுக்கு ஏற்படும் தாகத்திற்கு நீர்மோரும், நெல்லிக்காயும் நல்ல பலன் தரும்."},{"n":1883,"t":"நாவல்பழம், பாவக்காய், அவரைப்பிஞ்சு இவைகளை அடிக்கடி உணவுடன் சேர்த்துக் கொள்வது சர்க்கரை நோயாளிகளுக்கு நனறு."},{"n":1884,"t":"பாகல் இலைச்சாறு வாரம் தோறும் தவறாமல் சாப்பிட்டு வர சர்க்கரை கட்டுப்பாட்டில் இருக்கும்."},{"n":1885,"t":"தாமரை இதழ் தினமும் ஒன்று சாப்பிட்டு வர பேசும் திறன் கூடும்."},{"n":1886,"t":"மலச்சிக்கல் குணமாக சுரக்கொன்றை மரபூவை தேனில் ஊற வைத்து சாப்பிட்டு பால் சாப்பிட மலச்சிக்கல் வராது."},{"n":1887,"t":"மாதுளம்பூ இடித்து தேன் கலந்து சாப்பிட்டு வர மலத்துடன் இரத்தம் வருவது நிற்கும்."},{"n":1888,"t":"காட்டாமணக்கு இலையை நீர்விட்டு மைய அரைத்து ஆசன வாயில் தடவ மூலம் சில நாட்களில் குணமாகும்."},{"n":1889,"t":"அந்தரத் தாமரை இலையை கொதிக்க வைத்து அந்த ஆவியை 10நிமிடம் ஆசனவாயில் கட்டி வர மூலம் அகலும். 1890, அருகம்புல் 30கிராம் அரைத்து பாலில் கலந்து பருகி வர இரத்த மூலம் குணமாகும்."},{"n":1891,"t":"கருணைக்கிழங்கு தொடர்ந்து வாரம் இருமுறைஉணவுடன் சாப்பிட்டு வர மூலம் கட்டுப்படும். நாளடைவில் குணமாகும்."},{"n":1892,"t":"மலச்சிக்கலுக்கு முளைக்கீரை நல்ல உணவு."},{"n":1893,"t":"பப்பாளிப்பழம், மாம்பழம் இரண்டையும் தேனில் ஊற வைத்து சாப்பிட்டால் மூல நோய் குணமாகும்."},{"n":1894,"t":"முசுமுசுக்கை இலைச் சூரணம், தூதுவேளைச் சூரணம் கலந்து 2கிராம் சாப்பிட்டு வர என்புருக்கி நீங்கும்."},{"n":1895,"t":"மலச்சிக்கல் தீர இரவில் மாம்பழம் சாப்பிடலாம்."},{"n":1896,"t":"பப்பாளிப்பழம் தினந்தோறும் சாப்பிட்டு வர மலச்சிக்கல் நீங்கி எதிர்ப்பு சக்தி கூடும்."},{"n":1897,"t":"கருணைகிழங்கு சிறு துண்டுகளாக நறுக்கி துவரம் பருப்புடன் சேர்த்து சாம்பார் செய்து சாப்பிட்டு வர மூலம் குணமாகும்."},{"n":1898,"t":"இரத்த மூலத்திற்கு அருகம்புல் வேர் அரைத்து பசும்பாலில் சாப்பிட்டு வர குணமாகும். மூலக்கடுப்பு விலகும்."},{"n":1899,"t":"வாழைபூ சாறு, கடுக்காய் பொடி சேர்த்து சாப்பிட்டு வர மூல நோய் குணமாகும்."},{"n":1900,"t":"மாதுளம்பழத் தோலை நீரில் ஊற வைத்து அந்த நீரை மலம் கழித்த பின்பு கால் கழுவி வர மூலம் மற்றும் புண் குணமாகும்."},{"n":1901,"t":"வெங்காயத்தை வதக்கி ஆசனவாயில் காட்ட வெளிமூலம் தொந்தரவு தீரும்."},{"n":1902,"t":"முடக்கத்தான் இலையை அவித்து சாறு எடுத்து ரசமாக்கி உண்டுவர மலச்சிக்கல், வாயு தீரும். 1903.சூரிய நமஸ்காரம் செய்து வருவதால் (முறையான மந்திரங்களுடன்) உடல் குளிர்ச்சியாக மூலம் விடுபடும்."},{"n":1904,"t":"திராட்சை பழம் சுரத்தை தணித்து மலச்சிக்கலைப் போக்கும். இரத்தம் சுத்தமடையச் செய்யும்."},{"n":1905,"t":"நார்த்தங்காய் ஊறுகாய் மலச்சிக்கலை போக்கி ஜீரண சக்தியைக் கொடுக்கும்."},{"n":1906,"t":"கருவேலம் இலையை அரைத்து இரவில் ஆசனவாயில் கட்டி வர மூலம் குணமாகும்."},{"n":1907,"t":"வெங்காயத்தை வதக்கி ஆசன வாயில் கட்ட வெளிமூலம் நாளடைவில் குணமாகும்."},{"n":1908,"t":"முட்டி வலி, மலச்சிக்கல், மூட்டு வாதம் உள்ளவர்கள் உருளைகிழங்கு தக்காளி தவிர்க்க வேண்டும்."},{"n":1909,"t":"மஞ்சள் பொடி கலந்த சூடுநீரில் ஆசன வாய்படும்படி அமர்ந்திருந்த வர மூலப்புண் ஆறும். மூல வலி குறையும்."},{"n":1910,"t":"சுக்கை அரைத்து பற்றிட தலைவலி குணமாகும்."},{"n":1911,"t":"ஊமத்தை பிஞ்சை உமிழ்நீரில் அரைத்து தடவ பழவெட்டு தீரும்."},{"n":1912,"t":"ஓமவல்லி இலைச்சாற்றுடன், நல்லெண்ணெய் கலந்து பற்று போட்டால் தலைவலி நீங்கி சூட்டைத் தணிக்கும்."},{"n":1913,"t":"குப்பை மேனி சாறு தடல தலைவலி குறையும்."},{"n":1914,"t":"அகத்தி இலை சாறு எடுத்து நெற்றியில் தடவ தலைவலி குணமாகும்."},{"n":1915,"t":"மருதாணி இலையுடன் தாய்மால் விட்டு அரைத்து தலைவலிக்கு பற்று போட தலைவலி குறையும்."},{"n":1916,"t":"குங்குமப்பூவை தாய்ப்பால் விட்டு அரைத்து நெற்றியில் பற்று போட தலைவலி நீங்கும்."},{"n":1917,"t":"நொச்சி இலையை உப்பு போட்டு வதக்கி இளஞ்சூட்டுடன் நெற்றியில் பற்றுபோட தலைபாரம் நீங்கும்."},{"n":1918,"t":"சுத்தமான தேன் தலைவலி வரும் போது 1/2 மணி நேரத்திற்கு 1ஸ்பூன் அருந்த தலைவலி மறையும்."},{"n":1919,"t":"திருநீற்றுப் பச்சிலையை அடிக்கடி முகர்ந்தால் தலைபாரம் நீங்கும்."},{"n":1920,"t":"நொச்சி இலையை தலையணையாக பயன்படுத்த மண்டை குடைச்சல் தீரும்."},{"n":1921,"t":"நொச்சி தைலம் வெந்நீரில் குளிக்க (வாரம் இருமுறை) கழுத்து வலி, மண்டைவலி, பொட்டு வலி தீரும்."},{"n":1922,"t":"பிரண்டை எண்ணெய் தேய்த்து வர தலைவலி குணமாகும். வெட்டுக்காயம் சீக்கிரம் ஆறும்."},{"n":1923,"t":"அவுரி இலையுடன் தேங்காய் எண்ணெய் சேர்த்து நசுக்கி வடிகட்டி தலைக்கு தேய்க்க, தலைவலி குறையும்."},{"n":1924,"t":"காய்ச்சிய வேப்ப எண்ணெய்யை தடவி வர சேற்றுபுண் குணமாகும்."},{"n":1925,"t":"கால் பித்த வெடிப்பிற்கு அரசமரத்து பாலை தடவி வர குணமாகும்."},{"n":1926,"t":"வேப்ப எண்ணையை மஞ்சள் சேர்த்து போட பித்த வெடிப்பு குணமாகும்."},{"n":1927,"t":"கோவை இலை சாறு தேங்காய் எண்ணெயுடன் கலந்து தடவ சொறி சிரங்கு குணமாகும்."},{"n":1928,"t":"கண்டங்கத்திரி இலையுடன் தேங்காய் எண்ணெய் ஊற்றி சாறு பிழிந்து கைகால் வெடிப்புக்கு தடவினால் வலி இராது."},{"n":1929,"t":"கீழா நெல்லி செடி முழுவதும் அரைத்து மோரில் காலை, மாலை குடித்து வர மஞ்சள் காமாலை குணமாகும்."},{"n":1930,"t":"வன்னிமரத்து இலையை பசும்பாலில் விட்டு அரைத்து தினசரி 1அவுன்ஸ் வீதம் சாப்பிட்டு வந்தால் உடல் அரிப்பு நீங்கும்."},{"n":1931,"t":"ஊறல் அரிப்பு குணமாக சரக்கொன்றை இலையை அரைத்து தடவி வர நலம் பெறலாம். 1932.குப்பை மேனி சாறு, தேங்காய் எண்ணையுடன் கலந்து பூசி வர சொறி சிரங்கு குணமாகும்."},{"n":1933,"t":"கணை, பூண்டு இவைகளை வேப்பஎண்ணெய் விட்டு வதக்கி கட்டிவர குணமாகும்."},{"n":1934,"t":"மருதாணியை எலுமிச்சை சாறுடன் கலந்து அரைத்து பாதங்களில் தடவி வர பாத எரிச்சல் குணமாகும்."},{"n":1935,"t":"இரவில் படுக்க போகும் முன் தேன், குங்குமப்பூ, மஞ்சள் சேர்த்து சாப்பிட்டு வர உடல் மினுமினுப்பு ஆகும்."},{"n":1936,"t":"சப்பாத்தி கள்ளி பூக்கள், இலையை நசுக்கி கட்டியின் மீது கட்டுப் போட கட்டிகள் உடைந்து குணமாகும்."},{"n":1937,"t":"பெருங்காயத்துடன் வேப்பிலையை மைய அரைத்து காயத்தின் மீது தடவி வர காயங்கள் ஆறும். 1938.பொன்னாவரை இலையுடன் மஞ்சள் சேர்த்து அரைத்து உடம்பில் பூசி குளித்து வர சொறி சிரங்கு மறையும்."},{"n":1939,"t":"புண்ணை இலையை ஊற வைத்த நீரில் குளித்து வர மேகரணம், சொறி சிரங்கு யாவும் மறையும்."},{"n":1940,"t":"அவரைக்காய் சாற்றினை தொடர்ந்து சொறி சிரங்கின் மீது பூசி வர குணமாகும்."},{"n":1941,"t":"கொத்த மல்லி உணவில் அடிக்கடி பயன்படுத்தி வர உள்ரணம் குணமாகும்."},{"n":1942,"t":"சாணக்கீரை ஆறாத புண்களை ஆற்றும் வல்லமை உடையது. 1943.தென்னம்பூவை மென்று தின்று வர உள்ரணம் ஆறும்."},{"n":1944,"t":"நெறி கட்டு விலக வல்லாரைச் சூரணம் நெய்யில் சாப்பிடலாம்."},{"n":1945,"t":"அறுகம்புல் தைலம் தேய்த்து குளித்து வர சொறி சிரங்கு குணமாகும்."},{"n":1946,"t":"தேங்காய்த் துவையலில் கசகசாவை சேர்த்து அரைத்து உணவுடன் நெய் சேர்த்து உண்ண தாதுபலம் மிகும்."},{"n":1947,"t":"ஆவாரை விதையை அரைத்து 1கிராம் தினமும் தேனில் சாப்பிட்டு வர காமம் பெருகும்."},{"n":1948,"t":"கழற்சிக் கொடி விதைகளை அரைத்து தேன் கலந்து உண்டு வர தாது கெட்டிபடும்."},{"n":1949,"t":"இரைப்பை வலிமை வற, தாது பலப்பட காரை இலையை வேக வைத்து கடைந்து சாப்பிட குணம் காணலாம்."},{"n":1950,"t":"குமரி வேரை அலசி பாலில் அவித்து உலர்த்தி பொடித்து 1தேக்கரண்டி பாலுடன் கொடுக்க ஆண்மை பெருகும்."},{"n":1951,"t":"தினசரி இரவு ஒரு செவ்வாழைப்பழம் சாப்பிட்டு வர இரத்தம் சுத்தமாகும்."},{"n":1952,"t":"இரவு உணவாக வாழைப்பழம் 2தேங்காய் சில் சாப்பிட்டு வர உடல் சக்தி பெருகும்."},{"n":1953,"t":"முருங்கைப் பூவை பாலில் காய்ச்சி சாப்பிட மோகம் அதிகமாகும்."},{"n":1954,"t":"அத்திப்பழம் முறையாக 41நாட்கள் தொடர்ந்து சாப்பிட்டு வர ஆண்மை பெருகும்."},{"n":1955,"t":"சீரகப்பொடி, வில்வபட்டை இரண்டையும் பொடியாக்கி நெய்யில் குழப்பி சாப்பிட்டு வந்தால் தாது வீரியம் உண்டாகும்."},{"n":1956,"t":"தவசி கீரை, முருங்கை கீரை சாப்பிட்டு வர ஆண்மை பெருகும்."},{"n":1957,"t":"மாதுளம்பழம் இரவு தினந்தோறும் சாப்பிட்டு வர ஆண்மை குறைவு நீங்கும்."},{"n":1958,"t":"அரச விதையை பாலில் கலந்து குடித்து வர விந்து எண்ணிக்கை அதிகரிக்கும்."},{"n":1959,"t":"தேங்காய் எண்ணெய், தேன் மெழுகு சேர்த்து தேனும் கலந்து தடவி வர விரை வீக்கம் குணமாகும்."},{"n":1960,"t":"முள்ளங்கி விதையை தூள் செய்து கல்கண்டு சேர்த்து தினசரி 2வேலை 48நாட்கள் சாப்பிட்டு வர தாது பலப்படும்."},{"n":1961,"t":"பசும்பாலில் கருஞ்சீரகத்தை அரைத்து தடவினால் ஆண்குறி வீக்கம் குணமாகும்."},{"n":1962,"t":"துரியன் பழம் சாப்பிட்டு வர தாது உற்பத்தி பிரமாண்டமாக அதிகரிக்கும்."},{"n":1963,"t":"அரசம்பழம் சேகரித்து உலர்த்தி இடித்து தூளாக்கி தினமும் 1ஸ்பூன் பாலுடன் சாப்பிட்டு வர தாதுபலம் பெரும்."},{"n":1964,"t":"அமுக்கிராங் கிழங்கு பொடியுடன் தேன் கலந்து சாப்பிட்டு வர ஆண்மை குறைவு நீங்கும்."},{"n":1965,"t":"நாவல்பழம் தினந்தோறும் சாப்பிட்டு வந்தால் விந்து கெட்டிப்பட்டு கட்டுப்படும்."},{"n":1966,"t":"பேரிச்சம்பழத்தை ஆட்டுப்பாலில் ஊறவைத்து மறுநாள் காலையில் ஏலக்காய் சேர்த்து சாப்பிட ஆண்மை பெருகும்."},{"n":1967,"t":"அத்தி பழம் தினந்தோறும் 5 சாப்பிட்டு வர நரம்புத் தளர்ச்சி சரியாகும்."},{"n":1968,"t":"தேங்காய் பால் அடிக்கடி சாப்பிட்டு வர ஆண்மை பெருகும். தாது விருத்தியாகும்."},{"n":1969,"t":"சக்கர வள்ளிகிழங்கை காயவைத்து இடித்து துளாக்கி பசும்பாலுடன் சாப்பிட்டு வர ஆண் உறுப்பு உறுதிப்படும்."},{"n":1970,"t":"மல்லிகைபூ வைத்து கட்டி வர விதை வீக்கம் சரியாகும்."},{"n":1971,"t":"கருஞ்சீரகம் எண்ணெய்யை வெற்றிலையில் பூசி உண்டு வர ஆண்மை பெருகும்."},{"n":1972,"t":"திப்பிளி பாடியை நெய்யுடன் கலந்து சாப்பிட ஆண்மை பெருகும்."},{"n":1973,"t":"முருங்கை பூவைப் பாலில் காய்ச்சி சாப்பிட ஆண்மை பெருகும்."},{"n":1974,"t":"எள்ளுப்பூவை பசும்பாலில் காய்ச்சி உண்டு வர ஆண்மை பெருகும்."},{"n":1975,"t":"இலுப்பை பூவை விரை வீக்கத்திற்கு தினமும் கட்டிவர விரைவில் குணமாகும்."},{"n":1976,"t":"வாதுமை பருப்பு நான்கினை பாலுடன் சாப்பிட்டு வர உடல் பலமும் தாது விருத்தியும் உண்டாகும். 1977.ஆண் மலட்டுத்தன்மைக்கு அரச விதைத்தூள் பாலில் சாப்பிட்டு வரச் சரியாகும்."},{"n":1978,"t":"தேங்காய் துவையலில் கசகசா சேர்த்தரைத்து உணவுடன் சாப்பிட்டு வர தாது வலுப்பெறும்."},{"n":1979,"t":"கடுக்காயை கல்லில் உரசி புண் மீது தடவி வர இடுப்புப்புண் (பெண்கள்) குணமாகும்."},{"n":1980,"t":"இலந்தை மரத்தின் இலையை மைய அரைத்து காயத்தின் மீது போட்டு வர வெட்டு காயம் குணமாகும்."},{"n":1981,"t":"புங்கன் இலையை அரைத்து வெட்டு காயத்தின் மீது கட்டினால் வெட்டுக்காயம் சீக்கிரம் ஆறும்."},{"n":1982,"t":"வசம்பு தூளை காயத்தின் மீது தூவி வர வெட்டுக்காயம் குணமாகும்."},{"n":1983,"t":"நம் எச்சிலுக்கு மருத்துவகுணம் உண்டு. சிராய்ப்பு புண் மீது எச்சிலைத் தடவி வந்தால் புண் ஆறும்."},{"n":1984,"t":"தினசரி கொய்யாபழம் சாப்பிட்டு வந்தால் இரத்தச் சோகை அகலும்."},{"n":1985,"t":"ஒரு டம்ளர் மோரில் எலுமிச்சம்பழச்சாறு பிழிந்து சாப்பிட இரத்த அழுத்தம் சீர்படும்."},{"n":1986,"t":"வாழைப்பழத்தோலை கண்ணாடி குத்திய இடத்தில் வைத்து கட்டினால் ரத்தப்போக்கு நின்று விரைவில் குணமாகும்."},{"n":1987,"t":"அகத்தி கீரையை வாரம் 2முறை சாப்பிட்டு வர இரத்த கொதிப்பு ஏற்படாது."},{"n":1988,"t":"விளாம்பழம் அடிக்கடி சாப்பிட்டு வர இரத்தத்தில் உள்ள கிருமிகளை ஒழிக்கலாம்."},{"n":1989,"t":"சோயா பீன்ஸ் தினசரி உணவுடன் எடுத்து வந்தால் சோகை நோய் குணமாகும்."},{"n":1990,"t":"காரட், காலிப்ளவர் சாப்பிட இரத்தம் விருத்தியாகும்."},{"n":1991,"t":"இரத்த அழுத்தம் உள்ளவர்கள் மீன் சாப்பிடலாம்."},{"n":1992,"t":"நெருச்சி கசாயம் செய்து அருந்தி வர இரத்த கொதிப்பு தீரும். 1993.அகத்தி கீரை, சுண்டவத்தல் போன்ற கசப்பு உணவுகள் இரத்த அழுத்தத்தை குறைக்கும்."},{"n":1994,"t":"புளிச்சக்கீரை உடலில் உள்ள வீக்கத்தை கட்டுப்படுத்தும். இரத்தத்தை சுத்தம் செய்வதில் இதற்கு ஈடு வேறு இல்லை."},{"n":1995,"t":"கொடிபசலைக் கீரை வாரம் இருமுறை உணவுடன் சாப்பிட்டு வர இரத்தம் விருத்தியடையும்."},{"n":1996,"t":"புதிய இரத்தம் உருவாக்குவதில் பீட்ரூட் கிழங்கு வலிமையானது."},{"n":1997,"t":"வெண்டைக்காய் உணவுடன் அடிக்கடி சேர்த்து வர மூளை பலமடையும். கண்களுக்கு குளிர்ச்சி தரும்."},{"n":1998,"t":"இரத்தக் கோளாறுகள் நீங்க நன்னாரி வேரை இடித்து சாறு எடுத்து பாலில் கலந்து சாப்பிட்டு வர குணமாகும்."},{"n":1999,"t":"காசினிக் கீரையை பயத்தம் பருப்புடன் சேர்த்து சமையல் செய்து சாப்பிட்டு வர இரத்தம் சுத்தமாகும். புத்துணர்ச்சிகிட்டும்."},{"n":2000,"t":"அதிமதுரம் பொடியுடன் சந்தனதூள் சமமாக கலந்து 1கிராம் அளவு பாலில் கொடுத்து வர இரத்த வாந்தி நிற்கும்."},{"n":2001,"t":"வசம்பு : வசம்பை கரித்து பொடியாக்கி 100 மி. தாய்பாலில் கலக்கி குழந்தைகளுக்கு கொடுக்க வயிற்றுவலி குணமாகும்."},{"n":2002,"t":"ஈஸ்வர மூலி வேரை தேனில் அரைத்து 1கிராம் உள்ளுக்கு சாப்பிட்டு வர வெண்குஷ்டம், சோகை தீரும்."},{"n":2003,"t":"பீர்க்கன்காய் வேர் கஷாயம் சாப்பிட்டு வர இரத்த சோகை நீங்கும்."},{"n":2004,"t":"இஞ்சி சாறுடன் தேன் கலந்து சாப்பிட இரத்தம் சுத்தம் ஆகும்."},{"n":2005,"t":"இரத்தம் உறைதல் குணமாக நெல்லிக்காய் சாப்பிடலாம்."},{"n":2006,"t":"மஞ்சள், அருகம்புல், சுண்ணாம்பு கலந்து நகச்சுற்றுக்கு பூசி வர குணமாகும்."},{"n":2007,"t":"கை கால் வீக்கம் இருப்பின் வேலி பருத்தி சாறு சுண்ணாம்பையும் கலந்து பூசி வர வீக்கம் குறையும்."},{"n":2008,"t":"தலையில் அடிபட்ட காயம் குணமாக காய்ந்த மஞ்சள் நல்லெண்ணெய் அல்லது தேங்காய் எண்ணெயில் காய்ச்சி தலைக்கு தடவி வர உட்காயம் குணமாகும்."},{"n":2009,"t":"அடிபட்ட வீக்கத்திற்கு நாமகட்டியை உமிழ்நீரில் குழைத்து தடவி வர வீக்கம் குறையும்."},{"n":2010,"t":"மாவிலங்கம் இலையை அரைத்து பற்றுப்போட அனைத்து வகையான வீக்கமும் சரியாகும்."},{"n":2011,"t":"புளிய இலையை அவித்து சூட்டோடு சூட்டாக சுளுக்கு உள்ள இடத்தில் ஒத்தடம் தந்து கட்ட சுளுக்கு விலகும்."},{"n":2012,"t":"கண்டங்கத்திரி இலையை தண்ணீரில் விட்டு அரைத்து பற்றுப்போட்டால் கை கால் வீக்கம் குறையும்."},{"n":2013,"t":"மஞ்சள், உப்பு, சுண்ணாம்பு இம்மூன்றையும் வெந்நீர் விட்டு அரைத்து அதை சூடு செய்து சுளுக்கின் மீது பற்று போட குணமாகும்."},{"n":2014,"t":"உடலுறவு கொண்டபின் எள், பப்பாளிபழம் சாப்பிட்டு வர கருத்தரிப்பை தவிர்க்கலாம்."},{"n":2015,"t":"வேப்பம் பூவுடன் மிளகு சேர்த்து பவுடராக்கி சாப்பிட்டு வந்தால் கர்பப்பை கோளாறுகள் நீங்கும்."},{"n":2016,"t":"முருங்கைப் பூவை பக்குவம் செய்து உண்ண மேக நோய் குணமாகும்."},{"n":2017,"t":"செம்பருத்தி பூவை வெறும் வயிற்றில் சாப்பிட்டு வர இரத்தம் விருத்தியாகும்."},{"n":2018,"t":"பருத்தி இலைச்சாறு பசும்பாலில் கலந்து பருக பெண்களுக்கு ஏற்படும் பெரும்பாடு குணமாகும்."},{"n":2019,"t":"அன்னாச்சி பழம், கருஞ்சீரகம், வெல்லம் கலந்த கலவை கற்பத்தடைக்கு உதவும்."},{"n":2020,"t":"நெய்யுடன் செம்பருத்தி பூவை சேர்த்து வதக்கி சாப்பிட்டு வர இரத்த போக்கு உடனே நிற்கும்."},{"n":2021,"t":"பால் பருத்தி இலையை அரைத்து உணவுடன் சாப்பிட்டு வர பால் அதிகம் சுரக்கும்."},{"n":2022,"t":"தினமும் அன்னாச்சி பழம் சாப்பிட்டு வர வெள்ளைபடுதல் குணமாகும். 2023.கர்ப்பப்பை பலமடைய ரோஜா குல்கந்து காலை, மாலை இரண்டு தேக்கரண்டி சாப்பிட்டு வரலாம்."},{"n":2024,"t":"கல்யாண முருங்கை இலைச்சாற்றை 50 மி.லி. கொடுக்க மாதவிடாய் காலங்களில் உண்டாகும் வலி நீங்கும்."},{"n":2025,"t":"கோவை காய்கள் 2ஐ தினமும் பச்சையாக சாப்பிட்டு வர மதுபேகம் தடுக்கலாம்."},{"n":2026,"t":"தாளிக்கீரையை பருப்புடன் சேர்த்து நெய்யுடன் சாப்பிட்டு வர உள் உறுப்புகளில் உள்ள புண்கள் ஆறும்."},{"n":2027,"t":"நாவல் கொட்டை சூரணம் 2கிராம் நீரில் கலந்து காலை மாலை குடித்து வர மதுமேகம், அதிமூத்திரம் கட்டுப்படும்."},{"n":2028,"t":"வாழைப்பழம் ஏலக்காய் பொடி செய்து பிசைந்து சாப்பிட பெரும்பாடு நோய் கட்டுப்படும்."},{"n":2029,"t":"பழம்புளி, மஞ்சள், கரிசலாங்கன்னி சேர்த்தரைத்து சிறு உருண்டை 12நாட்கள் சாப்பிட கருப்பை இறக்கம் குணமாகும்."},{"n":2030,"t":"கொள்ளு எனும் காணம் வேக வைத்த நீரை இருவேளை சிறிதளவு குடிக்க மாதவிடாய் கோளாறு வலி குறையும்."},{"n":2031,"t":"புதினா துவையல் வயிற்றுக் கோளாறுகளுக்கு நல்லமருந்து."},{"n":2032,"t":"சுத்தமான புனுகை பருவின் மீது தடவி வர மறையும்."},{"n":2033,"t":"சீரகத்தை பொன் வறுவலாக வறுத்து பொடி செய்து சூரணமாக பனைவெல்லம் சேர்த்து சாப்பிட நன்கு பசி எடுக்கும்."},{"n":2034,"t":"வயிற்று வலிக்கு கசகசாவுடன் கருப்பட்டி மற்றும் 4கிராம்பு பொடி செய்து மூன்று வேளை சாப்பிட குணம் கிடைக்கும்."},{"n":2035,"t":"மலச்சிக்கல் குணமாக சுரக்கொன்றை மரபூவை தேனில் ஊற வைத்து சாப்பிட்டு பால் சாப்பிட மலச்சிக்கல் வராது."},{"n":2036,"t":"குடல் வலிமை பெற வில்வ மர பூக்களை புளி சேர்க்காமல் ரசம் வைத்து சாப்பிட்டு வர நலமாகும். வலிமை பெறும்."},{"n":2037,"t":"மாதுளம்பூவை கஷாயம் செய்து குடிக்க வயிற்றுக் கடுப்பு குணமாகும்."},{"n":2038,"t":"குழந்தையின் வயிற்றின் மீது சூடுபடுத்திய வெற்றிலையை போட்டு வைத்தால் பொருமல் வலி குணமாகும்."},{"n":2039,"t":"மாதுளம்பூ இடித்து தேன் கலந்து சாப்பிட்டு வர மலத்துடன் இரத்தம் வருவது நிற்கும்."},{"n":2040,"t":"வயிற்றுப்டபூச்சி ஒழிய பாகற்காயின் விதையை அரைத்து பாலுடன் கலந்து அருந்தி வர வயிற்றுப்பூச்சி புழுக்கள் ஒழியும்."},{"n":2041,"t":"பேதி குணமாக மாங்கொட்டையை பருப்பு பொடி செய்து பசும்பாலுடன் கலந்து சாப்பிட பேதி நிற்கும்."},{"n":2042,"t":"வாயு தொல்லை நீங்க வெள்ளைப் பூண்டை பசும்பாலில் வேகவைத்துச் சாப்பிட்டு வர விலகும்."},{"n":2043,"t":"விளாம்பழத்தின் கொழுந்து இலைகளை பறித்து கஷாயம் வைத்துச் சாப்பிட வாயு நீங்கி நல்ல பசி எடுக்கும்."},{"n":2044,"t":"வயிற்று நோய் குணமாக சீரகத்தை வறுத்து பொடி செய்து மோரில் சாப்பிட குணமாகும்."},{"n":2045,"t":"தும்மட்டி காய் சாற்றில் கருஞ்சீரகத்தை அரைத்து விலாவில் பூசினால் குடல் புழுக்கள் வெளியேறி விடும்."},{"n":2046,"t":"ஆமணக்கு துளிரை விளக்கெண்ணையில் வதக்கி தொப்புளில் வைத்து கட்ட சூட்டு வயிற்றுவலி தீரும்."},{"n":2047,"t":"நீர் முள்ளி விதையை பொடி செய்து 1கிராம் பாலில் கலந்து சாப்பிட்டு வர மோகம், வயிற்றுப் போக்கு தீரும்."},{"n":2048,"t":"வயிற்று வலி குணமாக குறிஞ்சி கீரையை சாப்பிட்டு வர தீரும். கீரையை நிழலில் உலர்த்தி பவுடராகவும் சாப்பிடலாம்."},{"n":2049,"t":"குடல் புண் குணமாக மணத்தக்காளி கீரை சாப்பிட்டால் குடல் புண் குணமாகும்."},{"n":2050,"t":"வயிற்றுக்கடுப்பு நீங்க அரச இலை கொழுந்தை மோருடன் அரைத்து மோருடன் கலந்து சாப்பிடலாம்."},{"n":2051,"t":"குடல் புண் குணமாகவும், வயிற்றுப்புழுக்கள் அழியவும் அகத்தி கீரை நல்ல உணவு."},{"n":2052,"t":"வாழைத் தண்டு பொரியல் வைத்து சாப்பிட குடலில் சிக்கியிருக்கும் முடி, நஞ்சு ஆகியவை வெளியேறும்."},{"n":2053,"t":"மாதுளம் பழம் படுக்கைக்குச் செல்லும் முன் சாப்பிட குடல் புழுக்கள் அழியும்."},{"n":2054,"t":"உஷ்ணபேதி குணமாக உலர்ந்த மாம்பூ, சீரகத்தை சேர்த்து தூள் செய்து சர்க்கரை சேர்த்து சாப்பிட குணமாகும்."},{"n":2055,"t":"கழிச்சல் குணமாக மாங்கொட்டை பருப்பு, மாதுளம்பூ, ஓமம் சேர்த்து பொடி செய்து மோரில் சாப்பிட கழிச்சல் குணமாகும்."},{"n":2056,"t":"வாழைப்பூவை வாரம் 1நாள் கூட்டாக செய்து சாப்பிட்டு வர வயிற்றுப்புண் ஆறும்."},{"n":2057,"t":"அவரை இலை சாறை தயிருடன் சாப்பிட பேதி நிற்கும்."},{"n":2058,"t":"தொடர் வயிற்றுப்போக்கு உள்ளவர்கள் பப்பாளிபழம் சாப்பிட குணமாகும்."},{"n":2059,"t":"அன்னாசிபழம் தினம் சாப்பிட வயிற்றப் பூச்சிகள் ஒழியும்."},{"n":2060,"t":"வில்வ மரத்தின் பூக்களை புளி சேர்த்து ரசம் வைத்துச் சாப்பிட்டு வர குடல் வலிமை பெறும்."},{"n":2061,"t":"தொட்டாற்சிணுங்கி இலையை வெண்ணெய் போல் அரைத்து தயிருடன் கலந்து குடித்தால் வயிற்றுக் கடுப்பு நீங்கும்."},{"n":2062,"t":"வயிற்றுக் கடுப்பு குணமாக காலையில் எழுந்ததும் வெந்தயத்தை வாயில் போட்டு தயிரைக் குடிக்க குணமாகும்."},{"n":2063,"t":"சீதபேதி அஜீரணம் உள்ளவர்கள் ஆளிவிதைகளை அரைத்து சாப்பிடச் சரியாகும்."},{"n":2064,"t":"விளாம்பழம் கிடைக்கும் காலங்களில் தினசரி ஒன்று சாப்பிட்டு வர பித்தத்தை குறைக்கும்."},{"n":2065,"t":"அத்திபழம் தேனில் ஊறவைத்து சாப்பிட பெரும்பாடு மற்றும் மாதவிடாய் வயிற்றுவலி நீங்கும்."},{"n":2066,"t":"ஜாதிக்காயை தண்ணீர் விட்டு அரைத்து தொப்புளைச் சுற்றி பற்று போட பேதி நிற்கும்."},{"n":2067,"t":"துவரம்பருப்பு வேகவைத்து தண்ணீரில் அரை டம்ளர் எடுத்து அத்துடன் சிறிது வெல்லம் சேர்த்து 7நாள் காலையில் வெறும் வயிற்றில் கொடுக்க பூச்சிகள் வெளி வந்து விடும்."},{"n":2068,"t":"பாகற்காய் கொடி இலையை சாறு பிழிந்து உட்கொள்ள வயிற்று பூச்சி அழியும்."},{"n":2069,"t":"முள்ளங்கி கிழங்கு சமைத்து உண்டு வர வயிற்றுக் கோளாறுகள் நீங்கும்."},{"n":2070,"t":"கரிசலாங்கன்னி கீரையை சமைத்து உண்டு வர மகோதரம் தீரும்."},{"n":2071,"t":"அரை கிராம் பொறித்த பெருங்காயத்தை வெல்லத்துடன் சேர்த்து சாப்பிட வயிற்றுவலி, பொருமல் குணமாகும்."},{"n":2072,"t":"வாழைக்காய் சமைத்து உண்பதால் இரத்தம் பெருகும். அதிகம் உண்டால் வாயு தொந்தரவு ஏற்படும்."},{"n":2073,"t":"தினமும் நெல்லிக்கனி சாப்பிட்டு வர உடல் பலமும், நோய் எதிர்ப்பு சக்தியும் பெருகும்."},{"n":2074,"t":"வெண்ணீரில் தேன் கலந்து தினமும் காலையில் சாப்பிட்டு வர ஞாபக சக்தி பெருகும்."},{"n":2075,"t":"துளசி இலைகளை செப்பு பாத்திரத்தில் இரவில் நீரில் ஊர வைத்து காலையில் பருக புத்துணர்ச்சி உண்டாக்கும்."},{"n":2076,"t":"அருகம்புல் சாறு 14அவுன்ஸ் தினந்தோறும் சாப்பிட்டு வர நோய் எதிர்ப்பு சக்தி கூடும்."},{"n":2077,"t":"உடல் வலிமை வர அத்திபழம் தொடர்ந்து சாப்பிட்டு வரலாம்."},{"n":2078,"t":"வல்லாரை இலைகளை சாப்பிட்டு வர நினைவாற்றல் பெருகும்."},{"n":2079,"t":"முடக்கத்தான் இலை சீரகம் சேர்த்து கஷாயம் செய்து குடிக்க உடல்வலி தீரும்."},{"n":2080,"t":"ரோஜா இதழ்களை இடித்து சீயக்காயுடன் சேர்த்து தலைக்கு தேய்த்து வந்தால் உடல் குளிர்ச்சி பெறும்."},{"n":2081,"t":"பப்பாளி பழம் தினமும் சாப்பிட உடல் பலம் பெறும்."},{"n":2082,"t":"இரவு படுக்கும்முன் பேரீச்சம்பழம் மென்று சாப்பிட்டு பால் சாப்பிட்டு வர உடல் புஷ்டியாகும்."},{"n":2083,"t":"சுக்கு பொடி அஸ்மாட்டில் கலந்து உண்டு வந்தால் உடம்பு சுறுசுறுப்பாக இருக்கும்."},{"n":2084,"t":"முடக்கத்தான் இலையை சீரகம் சேர்த்து கஷாயம் செய்து குடிக்க உடல் வலி நீங்கும்."},{"n":2085,"t":"எதை கண்டாலும் விரக்தி வெறுப்பு உணர்வு உள்ளவர்கள் வில்லோ மலர் மருந்து சாப்பிட்டு குணம் பெறலாம்."},{"n":2086,"t":"வைட்டமின் A குறைவினால் வரும் நோய்களை பால், வெண்ணெய், பாலேடுக்கட்டி, முட்டையின் மஞ்சள் கரு, சர்க்கரை வள்ளி கிழங்கு, காரட்டு இலைகளை உணவோடு சேர்த்து உண்டு வர குணம் பெறலாம்."},{"n":2087,"t":"வைட்டமின் B குறைவினால் வரும் நோய்களை முழுத் தானியங்கள், பால், மோர், பச்சைப் பட்டானி, பருப்பு, அவரைக்காய், தேன், பச்சைக்காய்கறிகள் உண்டு வர குணம் பெறலாம்."},{"n":2088,"t":"வைட்டமின் C குறைவினால் வரும் நோய்களை ஆரஞ்சு, எலுமிச்சை, தக்காளி, கொய்யா, மாம்பழம், முளைவிட்ட பருப்பு, முட்டைக்கோஸ், பால் இவைகளை உணவுடன் சேர்த்து வர குணம் பெறலாம்."},{"n":2089,"t":"வைட்டமின் D குறைவினால் வரும் நோய்களை சூரிய ஒளி உடலில் படும்படி தினமும் விட்டு வைத்து முட்டை கரு, பால், மீன் எண்ணெய் பயன்படுத்தி வர குணமாகும்."},{"n":2090,"t":"வைட்டமின் E குறைவினால் வரும் நோய்களை முழு தானியம், பச்சைக் காய்கறி, பழங்கள் மூலம் நீக்கலாம்."},{"n":2091,"t":"பாதாம் பருப்பு வறுத்து அடிக்கடி உண்டு வர கண்பார்வை தெளிவு, ஆண்மை பெருக்கம் உண்டாகும்."},{"n":2092,"t":"பெருங்காயம் வாயுவை நீக்கும் உடலில் உள்ள நச்சை முறிக்க வல்லது."},{"n":2093,"t":"உணவுடன் முந்திரிப்பருப்பு சேர்த்து சாப்பிட்டு வர தாது விருத்தியாகும்."},{"n":2094,"t":"உடல் அசதி, கை கால் வலி நீங்க முருங்கை ஈர்க்கு ரசம் சாப்பிடலாம்."},{"n":2095,"t":"விளாக்கொழுந்து புண்ணெய்க் காய் அளவு அரைத்து பால், கற்கண்டு கலந்து சாப்பிட பித்த கணச்சூடு தணியும்."},{"n":2096,"t":"நூல் கோல் கிழங்கு அடிக்கடி சாப்பிட்டு வர நரம்பு தளர்ச்சி நீங்கும்."},{"n":2097,"t":"வாலிப வயோதிக குறைபாடு நீங்க ஓரிதழ் தாமரை பூ, கீழா நெல்லி இலை சேர்த்து சாப்பிடலாம்."},{"n":2098,"t":"வெங்காய சாறை வியர்குரு மீது தடவ மறையும். உடல் குளிர்ச்சி பெறும்."},{"n":2099,"t":"பாதாம் பருப்பு, வெண்டைக்காய், உருளைக்கிழங்கு தக்காளி இலைகளை தினமும் சாப்பிட ஞாபக சக்தி பெருகும்."},{"n":2100,"t":"நெய்யில் வெள்ளை வெங்காயத்தை வதக்கி சாப்பிட்டு நரம்பு தளர்ச்சி குணமாகும்."},{"n":2101,"t":"கோதுமை கஞ்சி மாதவிடாய் காலங்களில் சாப்பிட அக்காலங்களில் ஏற்படும் உடல் சோர்வு நீங்கி பலம் பெறும்."},{"n":2102,"t":"மெலிந்த உடல் பெருக்கமடைய கடலை நேந்திரம் வாழைப்பழம் பசும்பால் தினமும் சாப்பிட்டு வர பயன்கிட்டும்."},{"n":2103,"t":"பீட்ரூட் கிழங்கை அடிக்கடி சேர்த்து வர உடல் வளர்ச்சி நன்கிருக்கும். நரம்பு தளர்ச்சி நாளடைவில் சரியாகும்."},{"n":2104,"t":"துளசி விதைகளை தூள் செய்து சாப்பிட்டு வந்தால் நரம்புகளில் ஏற்படும் வலி குணமாகும்."},{"n":2105,"t":"வல்லாரை குடிநீர் ஞாபக சக்தியை தூண்டும்."},{"n":2106,"t":"பிரம்மபத்திரம் கோரக்கர் மூலிகை இரண்டும் நீர் சிறிது பருக மாதம் ஒரு முறை உடல் கட்டும் ஆயுள் நீடிப்பும் உண்டாகும்."},{"n":2107,"t":"உடல் உஷ்ணத்தை தணிக்க தினமும் ஆட்டுப்பால் சாப்பிட்டு வர குளிர்ச்சி பெறும்."},{"n":2108,"t":"உடல் உறுதி பெற அவலுடன் நெய் சேர்த்து சாப்பிட்டு வர உடற் சோர்வு நீங்கி உறுதிபடும்."},{"n":2109,"t":"உளுத்தம் பருப்பு உணவுகளை சேர்த்து வருவதால் இடுப்பு பகுதி நரம்புகள் பலம் பெறும்."},{"n":2110,"t":"எலுமிச்சை சாதம் வாரத்தில் மூன்று நாள் காலையில் சாப்பிட பித்தத்தைத் தணிக்கும்."},{"n":2111,"t":"கருங்குருவை அரிசி சமைத்து சாப்பிட்டு வர உடல் நஞ்சு நீங்கும்."},{"n":2112,"t":"கேழ்வரகு கூழ் அடிக்கடி சாப்பிட்டு வர உடல் உறுதி பெறும்."},{"n":2113,"t":"சிறு பசலைக்கீரை உண்டு வர சிற்றின்ப வேட்கை அதிகமாகும். 2114, சேப்பக்கிழங்கு நரம்புகளை பலப்படுத்தும்."},{"n":2115,"t":"தக்காளிக்காய் சாப்பிட்டு வர உடல் வீக்கம் குறையும். தோல் நோய் குணமாகும்."},{"n":2116,"t":"தயிர் சாதம் காலை வேலையில் சாப்பிட்டு வர உடல் சூட்டை தணித்து உற்சாகத்தை கொடுக்கும்."},{"n":2117,"t":"நோய் எதிர்ப்பு சக்தி அதிகம் தரவல்ல பப்பாளி பழம் அடிக்கடி உண்ணுதல் நலம்."},{"n":2118,"t":"உளுந்து தைலம் உடல் முழுக்கக் தடவி அழுத்திப் பிடித்து விட நரம்பு தளர்ச்சி சரியாகும்."},{"n":2119,"t":"உலர் திராட்சையும், கல்கண்டும் சேர்த்து தினமும் சிறிதளவு சாப்பிட்டு வர மூளை கட்டி, புற்றுநோய், இதய நோய் சீர்படும் குணமாகும்."},{"n":2120,"t":"எலுமிச்சை சாறு பிழிந்து ஆவியை முகத்தில் மூன்று நாட்கள் ப /* ---- Tamil normalization ----
   Treat confusable letters as the same, ignore spaces, so spelling
   variants and space differences still match. */
function normalize(s){
  if(!s) return "";
  s = s.normalize ? s.normalize("NFC") : s;
  // remove spaces, punctuation, zero-width
  s = s.replace(/[\s‌‍]/g,"");
  s = s.replace(/[.,:;!?'"()\-–—\[\]{}\/\\|]/g,"");
  // letter groups -> pick one representative
  const groups = [
    ["ர","ற"],
    ["ல","ள","ழ"],
    ["ந","ன","ண"],
    ["ச","ஸ","ஜ","ஷ"]
  ];
  for(const g of groups){
    const rep = g[0];
    for(let i=1;i<g.length;i++){
      s = s.split(g[i]).join(rep);
    }
  }
  return s;
}

// Precompute normalized text for every tip
const NORM = TIPS.map(t => normalize(t.t));

const q = document.getElementById("q");
const clearBtn = document.getElementById("clear");
const results = document.getElementById("results");
const countEl = document.getElementById("count");

function escapeHtml(str){
  return str.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

/* Highlight: we normalized away spaces/variants, so we can't map back to exact
   original spans easily. Instead we highlight any original run of characters
   whose normalized form contains the query — done per grapheme window. */
function highlight(original, queryNorm){
  if(!queryNorm) return escapeHtml(original);
  const chars = Array.from(original);
  // normalized form of each char (may be "" for spaces/punct)
  const nmap = chars.map(c => normalize(c));
  // Build normalized string + index map to original char positions
  let norm = "";
  const pos = []; // pos[k] = original char index for normalized char k
  for(let i=0;i<chars.length;i++){
    const n = nmap[i];
    for(let j=0;j<n.length;j++){ norm += n[j]; pos.push(i); }
  }
  const marks = new Array(chars.length).fill(false);
  let from = 0, idx;
  while((idx = norm.indexOf(queryNorm, from)) !== -1){
    const startChar = pos[idx];
    const endChar = pos[idx + queryNorm.length - 1];
    for(let c=startChar;c<=endChar;c++) marks[c]=true;
    from = idx + queryNorm.length;
  }
  let out="", open=false;
  for(let i=0;i<chars.length;i++){
    if(marks[i] && !open){ out+="<mark>"; open=true; }
    if(!marks[i] && open){ out+="</mark>"; open=false; }
    out += escapeHtml(chars[i]);
  }
  if(open) out+="</mark>";
  return out;
}

function render(list, queryNorm){
  if(list.length === 0){
    results.innerHTML = '<div class="empty">பொருத்தமான குறிப்பு இல்லை.<br>வேறு வார்த்தையை முயற்சிக்கவும்.</div>';
    return;
  }
  const frag = [];
  for(const t of list){
    frag.push('<div class="tip"><span class="num">'+t.n+'</span><div class="body">'
      + highlight(t.t, queryNorm) + '</div></div>');
  }
  results.innerHTML = frag.join("");
}

function search(){
  const raw = q.value;
  clearBtn.style.display = raw ? "block" : "none";
  const qn = normalize(raw);
  if(!qn){
    countEl.textContent = "";
    results.innerHTML = '<div class="hint">மேலே ஒரு வார்த்தையை தட்டச்சு செய்யவும்.<br><br>'
      + '<b>சிறப்பம்சங்கள்:</b><br>'
      + '• பகுதி வார்த்தை போதும் (வயிறு → வயிற்று, வயிற்றுவலி)<br>'
      + '• இடைவெளி கண்டுகொள்ளாது (வயிற்று வலி = வயிற்றுவலி)<br>'
      + '• எழுத்து வேறுபாடு (ர/ற, ல/ள/ழ, ந/ன/ண, ச/ஸ/ஜ/ஷ)</div>';
    return;
  }
  const matched = [];
  for(let i=0;i<TIPS.length;i++){
    if(NORM[i].indexOf(qn) !== -1) matched.push(TIPS[i]);
  }
  countEl.textContent = matched.length + " குறிப்பு" + (matched.length===1?"":"கள்") + " கிடைத்தது";
  render(matched, qn);
}

let timer=null;
q.addEventListener("input", ()=>{ clearTimeout(timer); timer=setTimeout(search, 90); });
clearBtn.addEventListener("click", ()=>{ q.value=""; q.focus(); search(); });
search();
</script>
